function coTone(key,...args){
  const set=COACH_TONE_COPY[coachTone()]||COACH_TONE_COPY.direct;
  const v=set[key]!==undefined?set[key]:COACH_TONE_COPY.direct[key];
  return typeof v==='function'?v(...args):v;
}
function coStripTags(s){ return (s||'').replace(/<[^>]+>/g,''); }
function coAmounts(s){ return (String(s).match(/€\s?\d{1,3}(?:\.\d{3})*(?:,\d{2})?/g)||[]).map(x=>x.replace(/\s/g,'')); }
function coHi(text,tone){ return text.replace(/€\s?\d{1,3}(?:\.\d{3})*(?:,\d{2})?/g, m=>`<span class="${tone==='gold'?'warn':'hl'}">${m}</span>`); }
async function coachAI(draft){
  if(!SET.aiCoach) return null;
  const url=(SET.psd2Url||'').replace(/\/+$/,''); const tok=SET.psd2Token||'';
  if(!url||!tok||!draft) return null;
  try{
    const r=await fetch(url+'/coach',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({spec:coachVoice(coachTone()),facts:window._coFacts||{},draft,model:SET.aiModel||''})});
    if(!r.ok) return null; const d=await r.json(); const t=((d&&d.text)||'').trim(); if(!t) return null;
    const da=coAmounts(draft); for(const a of coAmounts(t)){ if(!da.includes(a)) return null; }  // geen verzonnen bedrag
    return t;
  }catch(_){ return null; }
}
function coWait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function coReset(){ _coGen++; window._coLive=true; _coT=document.getElementById('coThr'); _coC=document.getElementById('coCh'); if(_coT)_coT.innerHTML=''; if(_coC)_coC.innerHTML=''; }
/* ---------- v138: het gesprek draait in de sheet ----------
   De draad zat in s-act en was daarmee aan dat scherm vastgeklonken. Hij staat nu in de sheet, met
   exact dezelfde twee containers en dezelfde klassen, zodat hij er hetzelfde uitziet en alle
   bouwstenen (coBub/coSay/coChoices) onveranderd blijven werken: die kennen alleen _coT en _coC.
   coStart() is de enige ingang. Andere onderwerpen komen later; de parameter bestaat nu al zodat
   de ingangen die erbij komen hem meteen kunnen meegeven. */
/* Elk onderwerp verklaart zelf of het een maandafspraak mag vastleggen. Een terloops gesprek dat
   bij een cijfer begint hoort dat niet te doen, en een onderwerp dat er later bijkomt moet die
   keuze maken in plaats van hem te erven. Een onbekend onderwerp staat hier niet in en gedraagt
   zich daarom als voorheen. */
const CO_ONDERWERPEN={algemeen:{afspraak:true}, lek:{afspraak:false}, horizon:{afspraak:false}, maand:{afspraak:true}};
function coSheetShell(){ $('#sheet').innerHTML=`<div class="grab"></div><div class="cothr" id="coThr"></div><div id="coCh"></div>`; }
function coStart(onderwerp,m,arg){
  coAfbreken();                                                            // een lopend gesprek eerst netjes af
  window._setSheet=null; window._nfSheet=null; window._budgetSheet=null;   // deze sheet is nu van het gesprek
  if(!CO_ONDERWERPEN[onderwerp]) onderwerp='algemeen';                     // onbekend onderwerp = het gewone gesprek
  window._coOnderwerp=onderwerp;
  m=m||curMonth||months()[months().length-1];
  coSheetShell(); showSheetBg();
  if(onderwerp==='lek'){ coReset(); return coTopicLek(m); }
  if(onderwerp==='horizon'){ coReset(); return coTopicHorizon(m); }
  if(onderwerp==='maand'){ coReset(); return coTopicMaand(m,arg); }
  return coOpen(m);                                                        // coOpen() doet zelf coReset()
}
/* v139: 'lek' is een terloops gesprek dat vanaf Inzichten begint, niet het maandgesprek. Het mag
   de maandafspraak daarom nooit raken: coachThisMonthAfspraak() laat er één per maand toe en
   coAfspraakOpen() wist de bestaande vóór hij een nieuwe schrijft. De regel staat op het gesprek
   en niet in elk pad afzonderlijk, zodat een pad dat er later bijkomt hem niet kan omzeilen.
   Gecontroleerd op de drie plekken die een afspraak schrijven of wissen: coachLogAdd (de enige
   schrijfroute), coAfspraakOpen en coShowAction (de twee die eerst wissen). */
function coMagAfspraak(){ const o=CO_ONDERWERPEN[window._coOnderwerp]; return !(window._coLive && o && o.afspraak===false); }
/* Afbreken doet precies wat coEnd() doet, plus _coGen omhoog zodat een nog lopende await niets
   meer in een weggehaalde draad schrijft. Er wordt hier nooit iets vastgelegd en nooit iets uit
   SET.coachLog gehaald: een afgebroken gesprek laat je afspraken ongemoeid. */
function coAfbreken(){
  if(!window._coLive && !window._coPark) return;
  _coGen++; coEnd();
  window._coOnderwerp=null;   // v140: hier wel loslaten, in coEnd() niet (dat ontwapent de guard)
  window._coPark=null; window._coTextCb=null;
  _coT=null; _coC=null;
}
/* coTextSheet() gebruikt dezelfde sheet als het gesprek. In plaats van de draad te overschrijven
   halen we de twee nodes er even uit en hangen we ze daarna terug. Het blijven dezelfde elementen,
   dus _coT en _coC blijven geldig en de draad overleeft het invoerscherm. */
function coParkeerDraad(){
  if(!window._coLive || !_coT || !_coC) return false;
  window._coPark=[_coT,_coC];
  try{ _coT.remove(); _coC.remove(); }catch(_){}
  return true;
}
function coHerstelDraad(){
  const p=window._coPark; window._coPark=null;
  if(!p) return false;
  const sh=$('#sheet'); sh.innerHTML='<div class="grab"></div>';
  sh.appendChild(p[0]); sh.appendChild(p[1]);
  _coT=p[0]; _coC=p[1];
  showSheetBg();
  return true;
}
function coBub(cls,txt,o){ if(!_coT)return; o=o||{};
  const set=(el)=>{ if(o.html) el.innerHTML=txt; else el.textContent=txt; };
  if(cls==='co'){ const row=document.createElement('div'); row.className='corow'; const av=document.createElement('div'); av.className='coav'; av.innerHTML=coachAvatar(); const d=document.createElement('div'); d.className='cbub co'+(o.accent?' acc':''); set(d); row.appendChild(av); row.appendChild(d); _coT.appendChild(row); }
  else { const d=document.createElement('div'); d.className='cbub '+cls; set(d); _coT.appendChild(d); }
  try{window.scrollTo(0,document.body.scrollHeight);}catch(_){}}
function coFx(txt){ if(!_coT)return; const d=document.createElement('div'); d.className='cfx'; d.innerHTML=ICON('check')+' '+txt; _coT.appendChild(d); }
async function coSay(txt,o){ o=o||{}; if(!_coT)return; const _g=_coGen;
  const row=document.createElement('div'); row.className='corow'; const av=document.createElement('div'); av.className='coav'; av.innerHTML=coachAvatar(); const e=document.createElement('div'); e.className='cbub co cdots'; e.innerHTML='<span></span><span></span><span></span>'; row.appendChild(av); row.appendChild(e); _coT.appendChild(row);
  let out=txt, html=o.html;
  if(o.ai && SET.aiCoach){ const ai=await coachAI(coStripTags(typeof txt==='string'?txt:'')); if(ai!=null){ out=coHi(esc(ai),(o.ai&&o.ai.tone)||'teal'); html=true; } else { await coWait(280); } }

function coDoelEffect(save){
  const D=coachDoel(); if(!D||!(save>0)) return '';
  const per=D.per||0; if(!(per>0)||!(D.bedrag>0)) return '';
  let gespaard=0; try{ const P=allocatePlan().find(x=>x.id===D.id); gespaard=P?P.gespaard:0; }catch(_){}
  const rest=Math.max(D.bedrag-gespaard,0); if(rest<=0) return '';
  const eerder=Math.max(Math.ceil(rest/per)-Math.ceil(rest/(per+save)),0);
  return eerder>=1?` ≈ ${eerder} ${eerder===1?'maand':'maanden'} eerder bij ${D.naam}`:'';
}

/* ---- Temporal discounting: de parkeer-lus sluiten. Volgt MECHANISM_SPEC.temporalDiscounting ----
 * Parkeren is alleen een belofte als de app hem nakomt. Bij terugkeer presenteert de coach
 * dezelfde keuze opnieuw in koude staat: nu doen / nog even parkeren / laten gaan.
 * parkN telt hoe vaak hetzelfde item geparkeerd is; na herhaalParkeerSignaal keer wordt
 * het patroon zacht teruggespiegeld, zonder een beslissing af te dwingen. */
const PARK_RETURN_MS = 18*36e5;  // beloofde terugkeer (~na 'morgen'); gelijk aan de notificatie-drempel
const PARK_SIGNAL_N  = (MECHANISM_SPEC.temporalDiscounting.condities.herhaalParkeerSignaal)||4;
// oudste nog-openstaande geparkeerde beslissing die toe is aan terugkeer (log is nieuw→oud)
function coParkDue(){ const log=SET.coachLog||[]; const now=Date.now();
  for(let i=log.length-1;i>=0;i--){ const l=log[i];
    if(l && l.type==='beslis' && l.uitkomst==='geparkeerd' && !l.resolved

async function buyFlow(cat,amt,item){
  coReset(); if(!_coT)return;
  const cn=potName(cat);
  coBub('me',`Ik wil ${item?esc(item)+' ':''}voor ${euro0(amt)} (${cn}).`);
  await coWait(180);
  const m=curMonth||months()[months().length-1]; const B=SET.budgets||{}; const has=+B[cat]>0;
  const rest=has?Math.round(+B[cat]-(catSpendMap(m)[cat]||0)):0;
  const planned=has && amt<=rest;   // geplande aankoop uit een gevuld potje = succes, geen loss-frame (MECHANISM_SPEC.lossAversion)
  // stakes (dagen tot buffer) alleen tonen als het géén schone geplande aankoop is
  if(!planned){ try{ const _S=savingsModel(); const _pd=_S.monthlySaving>0?_S.monthlySaving/30:0; if(_pd>0){ const _d=Math.round(amt/_pd); await coSay(`In doel-termen: <span class="hl">~${_d} ${_d===1?'dag':'dagen'}</span> langer tot je buffer.`,{html:true}); } }catch(_){ } }
  // frequentie-reactie: heeft de categorie een 'aantal keer'-potje, benoem de telling
  const fmeta=(SET.potMeta||{})[cat];
  if(fmeta && fmeta.type==='freq'){ const did=potjeKeer(m,cat); const nextN=did+1; await coSay(`Dit wordt je ${nextN}e keer ${cn} deze maand${nextN>fmeta.n?`. Je plande er ${fmeta.n}.`:` van je ${fmeta.n} geplande.`}`); }
  // 2) binaire check, groene weg, geen wrijving
  if(has && amt<=rest){
    await coSay(`Past binnen ${cn}, nog ${euro0(rest-amt)} over daarna. Ga je gang, dit hoort bij je plan.`);
    coBuyLog(item,amt,cat,'gepland','n.v.t.'); coFx('vastgelegd · gepland'); coEnd(); return;
  }
  if(!has) await coSay(`${CATS[cat].name} heeft nog geen potje. Geen budget, geen aankoop.`);
  else await coSay(`Hier is geen budget meer voor. ${CATS[cat].name} staat op ${euro0(Math.max(rest,0))}.`);
  await coSay(`Wil je dit echt, of wil je het nú?`);
  // 3) vertakking, regie bij gebruiker, nooit een verbod
  const opts=[
    {l:`Ik wil het écht`,act:async()=>{ await coSay(`Hoe regelen we het?`); coChoices([
      {l:`Plan voor volgende maand`,act:async()=>{ coBuyLog(item,amt,cat,'ingepland','echt'); coFx('vastgelegd · ingepland'); await coSay(`Staat klaar voor volgende maand. Dan koop je 't met budget.`); coEnd(); }},
      {l:`Haal uit ander potje`,act:()=>coBuyShift(item,amt,cat)},
      {l:`Toch niet`,act:async()=>{ coBuyLog(item,amt,cat,'geannuleerd','echt'); coFx('vastgelegd · geannuleerd'); await coSay(`Helder. Niks mis mee.`); coEnd(); }}
    ]); }},
    {l:`Ik wil het nú`,act:async()=>{ await coSay(`Eén ademhaling. Wat doe je?`); coChoices([
      {l:`Even wachten tot morgen`,act:async()=>{ coBuyLog(item,amt,cat,'geparkeerd','nu'); coFx('vastgelegd, geparkeerd'); await coSay(`Goed. Staat 't morgen nog, dan plannen we 't echt.`); coEnd(); }},
      {l:`Haal uit ander potje`,act:()=>coBuyShift(item,amt,cat)},
      {l:`Toch doen, ik weet wat het kost`,act:async()=>{ coBuyLog(item,amt,cat,'doorgezet','nu'); coFx('vastgelegd, doorgezet'); await coSay(`Doorgezet. Jij houdt de regie, ik leg 't vast. Geen oordeel.`); coEnd(); }}
    ]); }}
  ];
  // 4-koppeling: geen potje? bied meteen aan er één te maken, en check daarna opnieuw
  if(!has) opts.unshift({l:`Maak eerst een ${cn}-potje`,act:()=>{ window._potAfter=()=>buyFlow(cat,amt,item); openPotje(cat); }});
  coChoices(opts);
}

function savePotje(k,del){
  const exists = +(SET.budgets||{})[k] > 0;          // bestaat dit potje al deze maand?
  const vanaf = ymFull(nextYM(SET.budgetMonth||thisYM()));
  let msg;
  if(del){
    if(exists){ // bestaand potje weghalen = grens loslaten → pas volgende maand
      SET.budgetsNext=SET.budgetsNext||{}; SET.budgetsNext[k]=0;
      SET.potMetaNext=SET.potMetaNext||{}; SET.potMetaNext[k]=null; save();
      msg=`${CATS[k].name}-potje stopt vanaf ${vanaf}`;
    } else { // alleen een geplande wijziging of nieuw concept → meteen weg
      if(SET.budgetsNext) delete SET.budgetsNext[k];
      if(SET.potMetaNext) delete SET.potMetaNext[k];
      if(SET.budgets) delete SET.budgets[k]; if(SET.potMeta) delete SET.potMeta[k]; save();
      msg=`${CATS[k].name}-potje verwijderd`;
    }
  } else {
    const d=window._potDraft||{type:'vast'}; const total=potDraftTotal();
    let meta=null;
    if(d.type==='freq' && +d.n>0 && +d.per>0) meta={type:'freq',n:Math.round(+d.n),per:Math.round(+d.per)};
    else if(d.type==='week' && +d.per>0) meta={type:'week',per:Math.round(+d.per)};
    if(exists){ // wijziging aan bestaand potje → de meetlat blijft deze maand staan, geldt vanaf volgende maand
      SET.budgetsNext=SET.budgetsNext||{}; SET.budgetsNext[k]= total>0?total:0;
      SET.potMetaNext=SET.potMetaNext||{}; SET.potMetaNext[k]= meta; save();
      msg=`${CATS[k].name}-potje: ${euro0(total)}/mnd vanaf ${vanaf}`;
    } else { // nieuw potje → meteen actief (er is nog geen grens om te verschuiven)
      SET.budgets=SET.budgets||{}; if(total>0) SET.budgets[k]=total; else delete SET.budgets[k];
      SET.potMeta=SET.potMeta||{}; if(meta) SET.potMeta[k]=meta; else delete SET.potMeta[k]; save();
      msg=`${CATS[k].name}-potje gezet`;
    }
  }
  closeSheet();
  const after=window._potAfter; window._potAfter=null;
  if(after){ try{ after(); }catch(_){ renderActions(); } } else { renderActions(); }
  toast(`${ICON('check')} ${msg}`);
}
// concrete, gekwantificeerde gedragsregels per signaal, elke regel draagt z'n eigen maand-besparing (cut) voor de forecast
function coachRules(m,sig){
  const k=sig.catKey; const over=Math.round(sig.over||0); const r=(label,cut,heavy)=>({label,cut:Math.max(Math.round(cut||0),0),heavy:!!heavy});
  if(sig.scale==='week' && k){
    const b=(effectiveBudgets(m).out[k]||0); const wk=Math.max(Math.floor((b/4)/5)*5,5);
    if(k==='vervoer'){ const s=vervoerSplit(m);
      if(s.lease>0 && s.lease>=s.fuel && s.lease>=s.park){ const L=Math.round(s.lease);
        return [ r('Lease herfinancieren (€75 p/m lager)',75),
                 r('Kleiner of korter contract (€120 p/m lager)',120),
                 r(`Lease afkopen (+${euro0(L)} p/m cashflow)`,L,true) ]; }
      if(s.park>0 && s.park>=s.fuel){ const P=Math.round(s.park);
        return [ r(`P+R in plaats van centrum (${euro0(P*0.5)} p/m lager)`,P*0.5),
                 r(`Parkeren vooraf boeken (${euro0(P*0.3)} p/m lager)`,P*0.3),
                 r(`Vaker met het OV (${euro0(P*0.4)} p/m lager)`,P*0.4) ]; }
      const F=Math.round(s.fuel); const fw=Math.max(Math.floor((F/4)/5)*5,5);
      return [ r(`Tank max ${euro0(fw)} per week (${euro0(F*0.2)} p/m lager)`,F*0.2),
               r(`Onbemand tanken (${euro0(F*0.06)} p/m lager)`,F*0.06),
               r(`Korte ritten op de fiets (${euro0(F*0.15)} p/m lager)`,F*0.15) ];
    }
    if(k==='uiteten') return [ r('Max 1× uit eten per week',over), r('Deze week thuis koken',over), r(`Max ${euro0(wk)} per week`,over) ];
    if(k==='boodschappen') return [ r('1 grote weekboodschap',over), r(`Max ${euro0(wk)} per week`,over), r('Geen losse ritjes',over) ];
    if(k==='shopping') return [ r('Eerst 24 uur wachten',over), r('Niks op afbetaling',over), r(`Max ${euro0(wk)} per week`,over) ];
    if(k==='vices') return [ r(`Max ${euro0(wk)} contant per week`,over), r('Niet pinnen',over), r('2 dagen per week overslaan',over) ];
    return [ r(`Max ${euro0(wk)} per week`,over), r('1 vaste dag per week',over), r('Geen impulsaankopen',over) ];
  }
  if(sig.scale==='maand' && sig.tone!=='good') return [ r('Een abonnement opzeggen (€15 p/m)',15), r('Automatisch €100 per maand sparen',0), r('Een vaste last verlagen (€50 p/m)',50) ];
  return [ r('Naar mijn buffer',0), r('Extra aflossen',0), r('Laten staan',0) ];
}

// Welke maanden vallen in de gekozen periode? 'month' volgt curMonth (de maand die je elders koos).
function txMonthsForPeriod(){
  const ms=months(); if(!ms.length) return [];
  const cm=(curMonth&&ms.includes(curMonth))?curMonth:ms[ms.length-1];
  // een gekozen maand die na een import niet meer bestaat valt netjes terug op deze maand
  if(/^\d{4}-\d{2}$/.test(txPeriod)){ if(ms.includes(txPeriod)) return [txPeriod]; txPeriod='month'; }
  if(txPeriod==='all') return ms.slice();
  if(txPeriod==='ytd') return ms.filter(m=>m.slice(0,4)===cm.slice(0,4)&&m<=cm);
  if(txPeriod==='3m'){ const i=ms.indexOf(cm); return ms.slice(Math.max(0,i-2),i+1); }
  return [cm];
}
function txForPeriod(){ const set=new Set(txMonthsForPeriod()); return TX.filter(t=>set.has(t.date.slice(0,7))); }
function txPeriodLabel(){
  if(/^\d{4}-\d{2}$/.test(txPeriod)) return monthLabel(txPeriod);
  if(txPeriod==='all') return 'Alles';
  if(txPeriod==='ytd') return 'Dit jaar';
  if(txPeriod==='3m') return '3 maanden';
  const ms=txMonthsForPeriod(), n=new Date(), nowYM=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  return (!ms.length||ms[0]===nowYM)?'Deze maand':monthLabel(ms[0]);
}

function dayHeader(ds,withMonth){
  const d=new Date(ds); d.setHours(0,0,0,0);
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((today-d)/86400000);
  // bij een meer-maands-periode draagt de maandband erboven het jaartal; de dagkop houdt de maand
  const lang=`${['Zo','Ma','Di','Wo','Do','Vr','Za'][d.getDay()]} ${d.getDate()} ${MFULL[d.getMonth()]}`;
  if(diff===0) return withMonth?`Vandaag · ${lang}`:'Vandaag';
  if(diff===1) return withMonth?`Gisteren · ${lang}`:'Gisteren';
  return lang;
}

/* Eigen historie per winkel (laatste 12 maanden), op dezelfde sleutel als de terugkerend-detectie
   (recurKey), zodat elke lease-/huurtermijn als één winkel telt. Licht gememoïseerd op _dataGen. */
let _merchStats=null,_merchStatsGen=-1;
function merchHistory(){
  if(_merchStatsGen===_dataGen && _merchStats) return _merchStats;
  const win=new Set(months().slice(-12)); const by={};
  for(const t of TX){ if(t.pending||!(t.amount<0)) continue;
    if(!win.has(t.date.slice(0,7))) continue;
    const k=catOf(t); if(!CATS[k]||CATS[k].type!=='expense') continue;
    const mk=recurKey(t); if(!mk) continue;
    (by[mk]=by[mk]||[]).push(-t.amount);
  }
  const out={};
  for(const mk in by){ const s=by[mk].sort((a,b)=>a-b), n=s.length; out[mk]={n, med:n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2}; }
  _merchStats=out; _merchStatsGen=_dataGen; return out;
}
/* "Ongewoon" = afwijkend van wat jij normaal doet. Twee temperingen op de oude categorie-toets:
   een herkende vaste last is per definitie niet ongewoon, en wie eigen historie bij dezelfde winkel
   heeft wordt daartegen gemeten — een maandelijkse lease valt dan niet meer op tussen kleine ritjes. */
function txOutlier(t,catAvg){
  const c=CATS[catOf(t)]; if(!(t.amount<0&&c.type==='expense')) return false;
  const bedrag=-t.amount; if(bedrag<40) return false;
  if(isFixed(t)) return false;                                    // herkende herhaling (incasso/periodieke overboeking)
  const m=merchHistory()[recurKey(t)];
  if(m && m.n>=3 && m.med>0) return bedrag>Math.max(m.med*1.8,60);  // eigen mediaan van deze winkel
  const a=catAvg[catOf(t)];                                        // te weinig eigen historie: categorie-toets zoals voorheen
  return !!a && bedrag>Math.max(a*2.2,60);
}

// statische inline-insight (budget vs werkelijk + status), geen navigatie
function steerSpendUpTo(m, day){ // stuurbare (variabele) uitgaven per categorie in maand m t/m dag 'day' (99 = hele maand)
  const by={};
  for(const t of txOfMonth(m)){ const c=catOf(t); if(!CATS[c]||CATS[c].type!=='expense'||isFixedCat(c)) continue; const d=+t.date.slice(8,10); if(d>day) continue; by[c]=(by[c]||0)+(-t.amount); }   // positieven netto meegerekend: terugstorting verlaagt de categorie
  return by;
}
function monthVsPrevInner(m){
  const ms=months(); const idx=ms.indexOf(m); if(idx<1) return {has:false,drivers:new Set()};
  const prev=ms[idx-1];
  const now=new Date(); const todayYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const partial=(m===todayYM);
  const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const day=partial?Math.min(now.getDate(),dim):99;
  const sum=o=>Math.round(Object.values(o).reduce((s,v)=>s+v,0));
  const a=steerSpendUpTo(m,day), b=steerSpendUpTo(prev,day);
  const tThis=sum(a), tPrev=sum(b);
  if(tPrev<=0 && tThis<=0) return {has:false,drivers:new Set()};
  const delta=tThis-tPrev;
  const keys=new Set([...Object.keys(a),...Object.keys(b)]);
  const diffs=[...keys].map(k=>({k,d:Math.round((a[k]||0)-(b[k]||0))})).filter(x=>Math.abs(x.d)>=5 && CATS[x.k]);
  const downs=diffs.filter(x=>x.d<0).sort((x,y)=>x.d-y.d).slice(0,3);
  const ups=diffs.filter(x=>x.d>0).sort((x,y)=>y.d-x.d).slice(0,2);
  const drivers=new Set([...downs,...ups].map(x=>x.k));
  /* whatStandsOutLine() leest alleen drivers. De opgemaakte .html die hier stond werd elke render
     gebouwd en weggegooid; de streak-lus erin liep steerSpendUpTo() over elke maand opnieuw en komt
     niet terug. delta en partial blijven wel staan: dat is een aftrekking van twee waarden die er
     toch al zijn, en daarmee is het kopgetal een eenregelaar:
       `${euro0(Math.abs(delta))} ${delta<0?'minder':'meer'} dan vorige maand${partial?', tot nu toe':''}`
     met var(--green) bij minder en var(--red) bij meer. */
  return {has:true,drivers,delta,partial};
}

// v174: pctWord() ging in v165 mee als dode code. De piekdag-zin gebruikte hem; hier staat het
// percentage zelf, zodat de zin verder woordelijk blijft zoals hij geschreven was.
const pctWoord=p=>`Ongeveer ${p}%`;
function insSignals(m,exclude){
  exclude=exclude||new Set();
  const ms=months(); const idx=ms.indexOf(m); if(idx<0) return [];
  const out=[]; const cur=_catSpendOf(m); const curTot=Object.values(cur).reduce((a,b)=>a+b,0);
  const dn=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];
  // 1) categorie stijgt 3 maanden op rij
  if(idx>=2){
    let best=null;
    for(const k of Object.keys(cur)){
      const a=_catSpendOf(ms[idx-2])[k]||0, b=_catSpendOf(ms[idx-1])[k]||0, c=cur[k]||0;
      if(exclude.has(k)) continue;
      if(c>b && b>a && a>0 && (c-a)>=15 && (!best||(c-a)>best.d)) best={k,a,c,d:c-a};
    }
    if(best) out.push({pri:9,act:`openCategory('${best.k}')`,
      kpiLabel:CATS[best.k].name, kpiVal:euro0(best.c), kpiSub:`was ${euro0(best.a)}`,
      hyp:`${CATS[best.k].name} loopt al drie maanden op.`,
      imp:`Kijk of dit blijvend is; zo ja, zet er een grens op.`});
  }
  // 2) bovengemiddeld aandeel t.o.v. eigen historie
  if(idx>=1 && curTot>0){
    const hist=ms.slice(Math.max(0,idx-3),idx); let best=null;
    for(const k of Object.keys(cur)){
      const share=cur[k]/curTot; let hs=0,hc=0,as=0,ac=0;
      for(const mm of hist){ const sp=_catSpendOf(mm); const tot=Object.values(sp).reduce((a,b)=>a+b,0); if(tot>0){ hs+=(sp[k]||0)/tot; hc++; } if((sp[k]||0)>0){ as+=sp[k]; ac++; } }
      const avg=hc?hs/hc:0, avgAmt=ac?as/ac:0;
      if(exclude.has(k)) continue;
      if(share>=0.12 && (share-avg)>=0.05 && (!best||share>best.share)) best={k,share,avg,amt:cur[k],avgAmt};
    }
    if(best){ const mult=best.avgAmt>0?best.amt/best.avgAmt:0;
      out.push({pri:7,act:`openCategory('${best.k}')`,
        kpiLabel:CATS[best.k].name, kpiVal:euro0(best.amt), kpiSub:best.avgAmt>0?`jouw gemiddelde ${euro0(best.avgAmt)}`:'bovengemiddeld',
        hyp:`Aan ${CATS[best.k].name.toLowerCase()} ben je dit keer veel meer kwijt dan je gewend bent.`,
        imp:`Check of het eenmalig was; anders een grens op ${CATS[best.k].name.toLowerCase()}.`}); }
  }
  // 3) piekdag (variabele uitgaven) \u2014 netto per dag: telpoort op afschrijvingen, dag-sommen incl. terugstortingen
  const vis=txOfMonth(m).filter(x=>x.amount<0 && CATS[catOf(x)] && CATS[catOf(x)].type==='expense' && !isFixed(x));
  const visAll=txOfMonth(m).filter(x=>CATS[catOf(x)] && CATS[catOf(x)].type==='expense' && !isFixed(x));
  if(vis.length>=6){
    const sumd=[0,0,0,0,0,0,0]; for(const x of visAll){ sumd[(new Date(x.date).getDay()+6)%7]+=-x.amount; }
    const tot=sumd.reduce((a,b)=>a+b,0), peak=sumd.indexOf(Math.max(...sumd));
    const share=tot>0?Math.round(sumd[peak]/tot*100):0;
    /* Geen tik: er is geen weergave per weekdag in de app, en een tik naar iets anders zou een
       gevolg suggereren dat er niet is. spiegel:true zegt dat met zoveel woorden (v174). */
    if(share>=24) out.push({pri:5,act:'',spiegel:true,
      kpiLabel:'Piekdag', kpiVal:dn[peak], kpiSub:`${share}% van je losse geld`,
      hyp:`${pctWoord(share)} van je losse geld gaat op ${dn[peak]}.`,
      imp:`Zo'n vaste piek is gewoonte; een bewuste ${dn[peak]} levert de meeste winst.`});
  }
  // 4) grootste netto uitgave per winkel (terugstorting verrekend) i.p.v. \u00e9\u00e9n losse transactie
  if(vis.length>=5){
    const byM={}; for(const x of visAll){ const nm=cleanMerch(x.name)||x.name||'onbekend'; byM[nm]=(byM[nm]||0)+(-x.amount); }
    const arr=Object.entries(byM).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const vals=arr.map(e=>e[1]).sort((a,b)=>a-b); const med=vals[Math.floor(vals.length/2)]||0;
    if(arr.length && med>0 && arr[0][1]>=med*4 && arr[0][1]>=40)
      out.push({pri:6,act:`openMerchant('${esc(String(arr[0][0]).toUpperCase().replace(/'/g,"\\'"))}')`,
        kpiLabel:'Grootste uitgave', kpiVal:euro0(arr[0][1]), kpiSub:esc(arr[0][0]),
        hyp:`Een winkel domineert je losse uitgaven.`,
        imp:`Reken je deze maand niet rijk of arm aan dit ene bedrag.`});
  }
  return out;
}

function miniSpark(values, opts){
  opts=opts||{};
  const vals=(values||[]).map(v=>(v==null||isNaN(v))?null:+v);
  if(vals.filter(v=>v!=null).length<2) return '';
  const max=Math.max(...vals.map(v=>Math.max(v||0,0)),1);
  const hi=opts.highlight!=null?opts.highlight:vals.length-1;
  const bars=vals.map((v,i)=>{
    if(v==null) return `<div class="b" style="height:3%;background:var(--card2)"></div>`;
    const h=Math.max(Math.max(v,0)/max*100,3);
    const col=opts.colorAt?opts.colorAt(v,i):(i===hi?'var(--teal)':'var(--bar)');
    return `<div class="b" style="height:${h}%;background:${col}${i===hi&&opts.dashLast?';opacity:.55':''}">`
      +`${opts.showVals?`<span class="val">${opts.fmt?opts.fmt(v):v}</span>`:''}`
      +`${opts.labels?`<span class="lab">${opts.labels[i]||''}</span>`:''}</div>`;
  }).join('');
  return `<div class="spark" style="height:${opts.height||30}px;gap:${opts.gap||6}px;margin:${opts.margin||'6px 0 0'}">${bars}</div>`;
}

// Kleur is een spiegel, geen rapportcijfer: in Rustig geen alarmrood en een gedempt midden.

const _pct0=n=>Math.round(n)+'%';
const _sign=n=>(n<0?'−':'+')+euro0(Math.abs(n));   // echte min-tekens, zoals elders in de app

// Wat elke KPI betekent en waartegen hij zich meet. Een kaal getal zonder band zegt niets,
// dus band + oordeel + uitleg horen bij de definitie, niet bij de opmaak.
const KPI_META={
  // v108: heette "Bespaarquote", maar meet je restsaldo — wat je overhoudt, niet wat je opzij
  // zette. Geld dat op je betaalrekening blijft staan telt hier volledig mee. De naam suggereerde
  // het tegendeel en botste met de referentie-verdeling, die "sparen" wél als instroom op je
  // spaarrekening leest (healthSplitOver). Eén term per begrip (v91): dit is het restsaldo.
  inleg: {label:'Spaarquote',         bandTxt:'doel 20% of meer', band:20,  dir:'up',   sign:1,  base:0,
    uitleg:'Welk deel van je inkomen er écht opzij ging: wat er naar je spaarrekening en je reserveringen stroomde plus je beleggingsinleg, gedeeld door je inkomen. Geld dat op je betaalrekening blijft staan telt hier niet mee. Een overboeking tussen je eigen potten telt één keer. Wat er niet in zit: een aflossing op een schuld en een inleg in een doel dat je zelf bijhoudt — die zijn niet uit je boekingen af te leiden. Zonder gemarkeerde spaarrekening valt dit terug op je spaar-categorie.'},
  budget:{label:'Budgetnaleving',     bandTxt:'doel 100% of minder', band:100, dir:'down', sign:1, base:0,
    uitleg:'Welk deel van je maandbudget je hebt uitgegeven: uitgaven ÷ budget. Je budget is de som van je potjes; heb je die niet, dan je inkomen-limiet.'},
  vari:  {label:'Variabele-lasten-druk', bandTxt:'doel onder 30%', band:30, dir:'down', sign:1, base:0,
    uitleg:'Welk deel van je inkomen naar variabele (niet-vaste) uitgaven gaat: variabele uitgaven ÷ inkomen. Er hoort geen doel bij: dit cijfer laat je verloop zien, niet of je een norm haalt.'},
  vast:  {label:'Vaste-lasten-druk',  bandTxt:'doel onder 50%', band:50, dir:'down', sign:1, base:0,
    uitleg:'Welk deel van je inkomen naar herkende terugkerende lasten gaat: vaste lasten ÷ inkomen. Er hoort geen doel bij: dit cijfer laat je verloop zien, niet of je een norm haalt.'}
};
// Drie van de vier banden volgen je gekozen referentie-verdeling (default 50/30/20 → precies de
// oude 20%, 30% en 50%), zodat vast/variabel/sparen samen het hele ijkpunt spiegelen.
// Alleen budgetnaleving meet tegen je eigen potjes.
/* v161: 50/30/20 stuurt de kerncijfers niet meer. Die norm gaat over iemand met een rekening en
   geen structuur; posten als een reserveringsinleg of een leasetermijn passen in geen van de drie
   hokjes, en dan komt er een percentage uit dat niets zegt. De norm blijft bestaan waar hij wel
   over gaat (ruleOfThumbCard en zijn instellingenpaneel), maar niet meer als band hieronder.
   Budgetnaleving houdt zijn band van 100%: die meet tegen je eigen potjes, niet tegen een extern
   ijkpunt. De rest heeft geen eigen voorwaarde en krijgt dus geen doel, want een cijfer zonder norm
   is bruikbaar en een cijfer met de verkeerde norm is misleidend. */
function kpiBand(key){
  if(key==='budget') return KPI_META.budget.band;
  return null;
}
function kpiBandTxt(key){
  if(key==='budget') return KPI_META.budget.bandTxt;
  if(key==='inleg')  return 'wat je opzij zette en belegde';
  if(key==='vast')   return 'geen doel, alleen je verloop';
  if(key==='vari')   return 'geen doel, alleen je verloop';
  return KPI_META[key].bandTxt;
}
const KPI_WOORD={good:'goed',mid:'krap',bad:'let op'};
/* Hoe ver sta je van je doel? (v103) De tegel toonde het cijfer en de band als losse teksten,
   dus de vergelijking moest je zelf maken. Dit zet ze in verhouding: het verschil in procent-
   punten én vertaald naar euro's, want daar denk je in. Bewust GEEN eigen sommen: `t` en `sf`
   zijn dezelfde totals(m)/splitFixedVar(m) waar het percentage uit komt, zodat bedrag en
   percentage nooit uit elkaar kunnen lopen. null = we weten het niet (v59/v73). */
/* v161: de noemer van een cijfer staat los van zijn band. Sinds de norm 50/30/20 de kerncijfers
   niet meer stuurt heeft alleen budgetnaleving nog een doel, maar de noemer bestaat voor alle vier
   - kpiBijdrage() leunt erop en zou anders met drie cijfers niets meer kunnen. Eén bron. */
function kpiBasis(key,t){ return (key==='budget')?(+t.budget||0):(+t.income||0); }
function kpiAfstand(key,v,t,sf){
  if(v==null) return null;
  const B=kpiBand(key); if(!(B>0)) return null;
  const dir=(KPI_META[key]||{}).dir||'down';
  const pt=(dir==='up')?(v-B):(B-v);                      // >0 = aan de goede kant van je doel
  const basis=kpiBasis(key,t);
  const bedrag=basis>0?Math.round(Math.abs(pt)/100*basis):null;
  return {pt:Math.round(pt*10)/10, bedrag, basis, goed:pt>=0};
}
// Eén formulering per kerncijfer; "meer" is bij sparen goed en bij een druk-metriek juist niet,
// dus de woorden volgen de betekenis, niet het teken.
function kpiAfstandTxt(key,A,kort){
  if(!A||A.bedrag==null) return '';
  const e=euro0(A.bedrag);
  if(Math.abs(A.pt)<0.05) return kort?'op je doel':'precies op je doel';
  if(key==='inleg')  return A.goed?`${e} meer opzij dan je doel`:`${e} minder opzij dan je doel`;
  if(key==='budget') return A.goed?`${e} onder je budget`:`${e} over je budget`;
  return A.goed?`${e} onder je doel`:`${e} boven je doel`;
}
function kpiState(key,v,ref){
  if(v==null) return 'n';
  /* v161: zonder band is er geen oordeel. Zonder deze guard rekende elke tak door met null:
     `v<null` is `v<0`, dus elk vast- en variabel-cijfer kwam stilzwijgend op 'bad' uit. */
  if(kpiBand(key)==null) return 'n';
  if(key==='budget') return v<=100?'good':(v<=110?'mid':'bad');
  if(key==='vast'){  const B=kpiBand('vast');  return v<B?'good':(v<=B*1.3?'mid':'bad'); }
  if(key==='vari'){  const B=kpiBand('vari');  return v<B?'good':(v<=B*1.3?'mid':'bad'); }   // drukmetriek: lager is gezonder
  return 'n';
}
// reeksen per maand, in één pass over months(); n=0 -> volledige historie
function insKpiSeries(n){
  const all=months(); const ms=(n===0)?all:all.slice(-(n||12));
  const S={ms,inleg:[],budget:[],vari:[],vast:[]};
  for(const mm of ms){
    const t=totals(mm), sf=splitFixedVar(mm);
    const _vi=vermogensInleg(mm).totaal;   // dezelfde teller als de tegel, anders liegt de lijn
    S.inleg.push((t.income>0&&_vi!=null)?_vi/t.income*100:null);
    S.budget.push(t.budget>0?t.spend/t.budget*100:null);
    S.vari.push(t.income>0?sf.vari/t.income*100:null);
    S.vast.push(t.income>0?sf.fixed/t.income*100:null);
  }
  return S;
}
// Vier KPI's voor maand m, elk met waarde, band, oordeel én historische reeks.
// Onbekend = '—' i.p.v. een verzonnen getal; een lopende maand krijgt geen oordeel:
// een halve maand is per definitie "zuinig" en dat is geen verdienste.
/* ===== Vermogensopbouw per maand (v161) =====
 * De spaarquote telde alleen wat naar een gemarkeerde spaarrekening ging. In dit systeem is
 * vermogensopbouw breder: de reserveringenpot en de beleggingsinleg horen er ook bij.
 *
 * Drie van de vijf stromen zijn betrouwbaar te onderscheiden en tellen mee. Twee niet, en die
 * blijven er bewust buiten in plaats van geschat te worden:
 *  - het aankoopdoel heeft geen rekening en geen transacties; de voortgang is het handmatige veld
 *    'Al gespaard' (v99). Wordt het doel vanaf je spaarrekening gevoed, dan zit dat geld al in de
 *    eerste stroom en zou meetellen dubbel zijn.
 *  - aflossing: de app kan de maandtermijn wel aan een schuld koppelen, maar niet het
 *    aflossingsdeel. Rente en aflossing splitsen vraagt een amortisatieberekening, en v100 legt
 *    vast dat de restschuld handmatig is en nergens meebeweegt met betalingen.
 * De uitleg-sheet noemt beide, zodat zichtbaar is wat er buiten valt.
 *
 * resThisMonth() spiegelt savedThisMonth() exact: dezelfde vorm, dezelfde klem op nul, dezelfde
 * afronding, alleen op SET.resAcc. Dubbeltelling is structureel uitgesloten doordat die rekening
 * uitdrukkelijk niet als spaarrekening telt (v128), dus savedThisMonth() ziet hem nooit. */
function resThisMonth(ym){
  const a=resAccId(); if(!a) return 0;
  let net=0; for(const t of txOfMonth(ym)){ if(t.acc===a) net+=t.amount; }
  return Math.max(Math.round(net),0);
}
/* Beleggingsinleg: uitgaande boekingen in de categorie sparen waarvan de tegenrekening niet van
   jou is. Die tegenrekening-toets is nodig, anders telt een overboeking naar je eigen spaarrekening
   twee keer: als uitgaande boeking hier en als instroom in savedNet(). */
/* De potten die we zelf als vermogen tellen: je spaarrekeningen plus je reserveringspot. Een
   bijschrijving daarop is al geteld door savedNet() of resThisMonth(). */
function vermogensPotten(){
  let sav=new Set(); try{ sav=new Set(n26SavingsAccounts()); }catch(_){}
  let ra=null; try{ ra=resAccId(); }catch(_){}
  if(ra) sav.add(ra);
  return sav;
}
/* Een overboeking naar je eigen spaarpot heeft twee kanten. savedNet() telt de bijschrijving en
   deze laag zou de afschrijving als inleg bij een derde partij tellen: dezelfde euro twee keer, en
   dus een spaarquote die verdubbelt. Herkent je bank de tegenrekening, dan vangt de refNums-toets
   dat af (v128); levert hij die niet, dan is de spiegelboeking het enige bewijs dat er is. Zelfde
   maand, zelfde bedrag, op een pot die we al meetellen. Elke spiegel wordt hooguit één keer
   gebruikt, anders zou één bijschrijving twee afschrijvingen wegstrepen. */
function inlegSpiegels(ym){
  const potten=vermogensPotten(); if(!potten.size) return [];
  return txOfMonth(ym).filter(t=>potten.has(t.acc)&&t.amount>0).map(t=>Math.round(t.amount));
}
/* Wat er deze maand naar een belegging buiten je eigen rekeningen ging. Eén bron voor het bedrag
   en voor de lijst erachter, zodat die twee niet uiteen kunnen lopen (v104). */
function beleggingsTx(ym){
  let eigen=new Set(); try{ eigen=new Set(OWN); }catch(_){}
  let al=new Set(); try{ al=new Set(savedTx(ym).map(t=>t.id)); }catch(_){}
  const potten=vermogensPotten();
  const spiegels=inlegSpiegels(ym); const uit=[];
  for(const t of txOfMonth(ym)){
    if(!(t.amount<0)) continue;
    if(catOf(t)!=='sparen') continue;
    if(al.has(t.id)) continue;                              // telt al als instroom op je spaarrekening
    if(potten.has(t.acc)) continue;                         // en een opname uit die pot al helemaal niet
    if((t.refNums||[]).some(n=>eigen.has(n))) continue;
    const i=spiegels.indexOf(Math.round(-t.amount));
    if(i>=0){ spiegels.splice(i,1); continue; }             // de andere kant van je eigen overboeking
    uit.push(t);
  }
  return uit;
}
function beleggingsInleg(ym){
  return Math.max(Math.round(beleggingsTx(ym).reduce((s,t)=>s-t.amount,0)),0);
}
/* De teller van de spaarquote, met zijn opbouw erbij. null per deel = die stroom is niet bekend;
   totaal is null zodra geen enkele stroom bekend is. */
function vermogensInleg(ym){
  let sp=null; try{ sp=savedNet(ym); }catch(_){}
  const heeftRes=!!resAccId();
  const delen=[
    {key:'spaar', naam:'Naar je spaarrekening', bedrag: sp==null?null:Math.round(sp)},
    {key:'res',   naam:'Naar je reserveringen', bedrag: heeftRes?resThisMonth(ym):null},
    /* Geen enkele beleggingsboeking is niet hetzelfde als nul ingelegd: zonder spaarrekening en
       zonder zo'n boeking weten we niets, en dan hoort het cijfer onbekend te blijven (v59/v73). */
    {key:'bel',   naam:'Beleggingsinleg',       bedrag: beleggingsTx(ym).length?beleggingsInleg(ym):null},
  ];
  const bekend=delen.some(d=>d.bedrag!=null);
  return {totaal: bekend?delen.reduce((a,d)=>a+(d.bedrag||0),0):null, delen};
}
function insKpis(m,n){
  const t=totals(m), S=insKpiSeries(n);
  const now=new Date(); const nowYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const partial=(m===nowYM);
  const i=S.ms.indexOf(m); const upto=a=>i>=0?a.slice(0,i+1):a.slice();
  const labels=upto(S.ms).map(x=>MNAMES[+x.slice(5,7)-1]);
  const maanden=upto(S.ms);
  const sf=splitFixedVar(m);
  /* v161: de restsaldo-quote is vervallen. Die mat wat er op je betaalrekening bleef staan, en dat
     is bij een automatische verdeling per definitie hoog: een artefact van je eigen structuur.
     De spaarquote telt nu de hele vermogensopbouw, niet alleen de spaarrekening. */
  const V=vermogensInleg(m);
  const waarde={
    inleg:  (t.income>0&&V.totaal!=null)?V.totaal/t.income*100:null,
    budget: t.budget>0?t.spend/t.budget*100:null,
    vari:   t.income>0?sf.vari/t.income*100:null,
    vast:   t.income>0?sf.fixed/t.income*100:null
  };
  /* Het grondtal per cijfer: de teller waar het percentage uit komt. Is die te klein, dan zegt het
     percentage niets - een terugstorting in een categorie met nauwelijks kosten gaf zo een vaste-
     lastendruk van -1%. Dan tonen we het bedrag zelf. Drempel in MAAND_DREMPEL, niet inline. */
  const grondtal={inleg:V.totaal, budget:Math.round(t.spend), vari:Math.round(sf.vari), vast:Math.round(sf.fixed)};
  const mk=key=>{
    const M=KPI_META[key], v=waarde[key], ref=null;
    const fmt=_pct0;
    let st=kpiState(key,v,ref);
    /* v161 trekt de bijstelling uit v117 in. De spaarquote meet hoeveel er opzij ging; of dat uit
       lopend inkomen kwam of uit een pot is een andere vraag, en die beantwoordt het maandscherm
       met de drie voorwaarden. Twee vragen in één getal maakt het onleesbaar. Een herkomsttoets zou
       bovendien blind zijn voor rekeningen zonder eigen IBAN (v128), dus juist voor het geval
       waarvoor hij zou bestaan. spaarDekking() blijft bestaan waar het wél iets zegt. */
    let band=kpiBandTxt(key);
    if(key==='budget') band=`${kpiBandTxt(key)} · ${t.potTotal>0?'je potjes':'je inkomen-limiet'}`;
    if(v==null) band=(key==='budget')?'nog geen budget':(key==='inleg'&&t.income>0)?'geen spaarrekening bekend':'inkomen onbekend';
    const afst=kpiAfstand(key,v,t,sf);
    const g=grondtal[key];
    const klein=(v!=null && g!=null && Math.abs(g)<MAAND_DREMPEL.kpiMinBedrag);
    if(klein) band=`grondtal ${euro0(g)} · te klein voor een percentage`;
    return {key, label:M.label, raw:v, ref, val:klein?euro0(g):(v==null?'—':fmt(v)), band, uitleg:M.uitleg, fmt, partial, afst,
            grondtal:g, klein,
            oordeel: (v==null||klein)?'':(partial?'loopt nog':(KPI_WOORD[st]||'')),
            state: (v==null||partial||klein)?'n':st,      // kleur van het cijfer
            trendState: st,                         // oordeel los van de lopende maand
            src: key==='budget'?(t.potTotal>0?'potjes':'limiet'):undefined,
            budgetBedrag: key==='budget'?Math.round(t.budget):undefined,
            series: upto(S[key]), labels, maanden};
  };
  // v161: vier cijfers, verdeeld over twee schermen. Structureel (spaarquote, vaste-lastendruk)
  // hoort bij de maand; operationeel (budgetnaleving, variabele-lastendruk) bij Inzichten.
  const items=['inleg','budget','vari','vast'].map(mk);
  const by={}; for(const k of items) by[k.key]=k;
  return Object.assign({m,partial,items},by);
}

// staafkleur per maand = binnen of buiten je band; zo draagt de trend zelf het oordeel
function kpiBarColor(k){ return (v,idx)=>{
  if(k.partial&&idx===k.series.length-1) return 'var(--teal)';        // de lopende maand is de highlight
  const st=kpiState(k.key,v,k.ref);
  return st==='bad'?kpiCol('bad'):'var(--bar)';                       // alleen écht buiten de band kleurt; amber blijft spaarzaam
}; }

/* Richting A: één rustige datataal in de Kerncijfer-tegels. Eén lijn in de neutrale datakleur,
   de lopende maand als open teal punt, en waar er een doel is een hele zachte gestreepte lijn.
   De status staat in het label ernaast, nooit in de kleur van de lijn. */
function miniSparkLine(values, opts){
  opts=opts||{};
  const vals=(values||[]).map(v=>(v==null||isNaN(v))?null:+v);
  const pts=vals.map((v,i)=>({v,i})).filter(p=>p.v!=null);
  if(pts.length<2) return '';
  // breedte ~ de echte tegelbreedte op mobiel, zodat het eindpunt rond blijft i.p.v. uitgerekt
  const W=150, H=26, P=3;
  let doel=(opts.target!=null && isFinite(opts.target))?+opts.target:null;
  // Een doel ver buiten je eigen bereik drukt de lijn plat. Eerder lieten we de referentie dan
  // weg, maar juist wie ver van zijn doel staat verloor 'm zo uit beeld (v103). Nu blijft de
  // schaal van je eigen cijfers en tekenen we de doellijn op de rand: de trend blijft leesbaar
  // en je ziet aan welke kant je doel ligt.
  let doelBuiten=false;
  if(doel!=null){
    const dl=Math.min(...pts.map(p=>p.v)), dh=Math.max(...pts.map(p=>p.v)), dr=(dh-dl)||Math.abs(dh)||1;
    if(doel<dl-1.2*dr || doel>dh+1.2*dr) doelBuiten=true;
  }
  const alles=pts.map(p=>p.v).concat((doel!=null&&!doelBuiten)?[doel]:[]);
  const lo=Math.min(...alles), hi=Math.max(...alles), span=(hi-lo)||1;
  const x=i=>P+(W-2*P)*(vals.length<2?0:i/(vals.length-1));
  const y=v=>H-P-((v-lo)/span)*(H-2*P);
  const pad=pts.map((p,k)=>`${k?'L':'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const laatste=pts[pts.length-1];
  const dy=doel!=null?Math.min(Math.max(y(doel),P),H-P):null;   // buiten bereik -> op de rand
  const lijn=doel!=null?`<line x1="${P}" x2="${W-P}" y1="${dy.toFixed(1)}" y2="${dy.toFixed(1)}" stroke="var(--mut2)" stroke-width="1" stroke-dasharray="${doelBuiten?'2 4':'3 3'}" opacity="${doelBuiten?'.32':'.45'}" vector-effect="non-scaling-stroke"/>`:'';
  const px=(x(laatste.i)/W*100).toFixed(2), py=(y(laatste.v)/H*100).toFixed(2);
  const punt=`<i class="${opts.running?'spk-nu':'spk-eind'}" style="left:${px}%;top:${py}%"></i>`;
  return `<div class="spk-in"><svg class="spk" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;overflow:visible">
    ${lijn}<path d="${pad}" fill="none" stroke="var(--bar)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>${punt}</div>`;
}
/* v161: de tegels zijn gedeeld, want de kerncijfers staan nu op twee schermen. Eén renderer, zodat
   Inzichten en het maandscherm niet uiteen kunnen lopen in opmaak of oordeel. */
function kpiTegels(items){
  return items.map(k=>{
    const col=kpiCol(k.state);
    const doel=kpiBand(k.key)!=null?kpiBand(k.key):null;
    const sl=miniSparkLine(k.series,{target:doel, running:k.partial});
    const spark=sl?`<div class="spk-wrap">${sl}</div>`:'';
    return `<div class="wvo-tile" style="cursor:pointer" onclick="openKpiDetail('${k.key}')" data-kpi="${k.key}">
      <div class="wvo-tl">${k.label}</div>
      <div class="wvo-tv" style="color:${col}">${k.val}</div>
      <div class="wvo-ts">${k.band}${k.oordeel?` · <b style="color:${col}">${k.oordeel}</b>`:''}</div>
      ${(()=>{ const e=(!k.partial?kpiAfstandTxt(k.key,k.afst,true):'');
        return e?`<div class="wvo-ts kpi-afst" style="color:var(--mut2)">${e}</div>`:''; })()}
      ${spark||''}${''/* v173: de mededeling dat je nog moet wachten stond per tegel en nog eens
        onder de maandgrafiek: drie keer hetzelfde op één scherm. De grafiek zegt het nu als enige. */}
    </div>`;
  }).join('');
}
/* Operationeel, binnen de maand: hoe sta ik ervoor tegenover mijn eigen plan. */
function insKpiStrip(m){
  const K=insKpis(m);
  const keys=['budget','vari'];
  const rustig=isMode('rustig'), alles=!rustig||!!SET.kpiAll;
  const items=K.items.filter(k=>keys.includes(k.key)).slice(0, alles?9:1);
  const meer=rustig?`<button class="snz" id="kpiMeer" onclick="toggleExpand('kpiAll')">${alles?'minder ▲':'toon beide kerncijfers ▾'}</button>`:'';
  const tiles=kpiTegels(items);
  return `<div class="card" id="insKpiStrip">
    <div class="row" style="margin-bottom:2px"><span class="hlabel" style="margin:0;flex:1">${ICON('chart')} Kerncijfers</span></div>
    <div class="small muted" style="margin:0 0 4px">Hoe je deze maand tegenover je eigen plan staat. Wat structureel is, staat op je maandscherm.</div>
    <div class="wvo-tiles" style="grid-template-columns:repeat(2,1fr)">${tiles}</div>${meer}
    <div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:10px">${K.partial?'Deze maand loopt nog: het cijfer gaat over de dagen tot nu toe, dus nog zonder oordeel. ':''}Tik een cijfer voor de uitleg en je volledige historie.</div>
  </div>`;
}
/* Structureel, tussen de maanden: bouw ik vermogen op, en hoe zwaar wegen mijn vaste lasten.
   Dezelfde tegels en dezelfde 'loopt nog'-behandeling als op Inzichten; alleen de plek verschilt. */
function maandKpiBlok(m){
  let K=null; try{ K=insKpis(m); }catch(_){ return ''; }
  if(!K) return '';
  const keys=['inleg','vast'];
  const rustig=isMode('rustig'), alles=!rustig||!!SET.kpiAllMaand;
  const items=K.items.filter(k=>keys.includes(k.key)).slice(0, alles?9:1);
  if(!items.length) return '';
  const meer=rustig?`<button class="snz" onclick="toggleExpand('kpiAllMaand')">${alles?'minder ▲':'toon beide kerncijfers ▾'}</button>`:'';
  return `<div class="card" id="maandKpiBlok">
    <div class="row" style="margin-bottom:2px"><span class="hlabel" style="margin:0;flex:1">${ICON('chart')} Kerncijfers</span></div>
    <div class="small muted" style="margin:0 0 4px">Wat er structureel gebeurt, van maand op maand.</div>
    <div class="wvo-tiles" style="grid-template-columns:repeat(2,1fr)">${kpiTegels(items)}</div>${meer}
    <div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:10px">${K.partial?'Deze maand loopt nog: het cijfer gaat over de dagen tot nu toe, dus nog zonder oordeel.':''}</div>
  </div>`;
}

/* ---- Gedeelde bouwstenen voor de staafgrafieken: as met waarden, labels boven de staven
       en een tik-uitlezing. Puur weergave; de reeksen zelf blijven zoals ze zijn. ---- */
const CHART_GEO={W:320,H:172,L:34,R:6,TOP:16,BASE:126,XLAB:142};   // L = gutter voor de y-labels
const chartK=v=>euroK(v);   // één compacte notatie in de hele app (euroK)
// welke staven een vast label krijgen: bij weinig maanden alle, anders eerste/laatste/hoogste/laagste
function chartLabelIdx(vals){
  const idx=vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0);
  if(!idx.length) return new Set();
  if(idx.length<=6) return new Set(idx);
  let hi=idx[0], lo=idx[0];
  for(const i of idx){ if(vals[i]>vals[hi]) hi=i; if(vals[i]<vals[lo]) lo=i; }
  return new Set([idx[0], idx[idx.length-1], hi, lo]);
}
function chartYAxis(niceTop, fmt){
  const G=CHART_GEO; const out=[];
  for(const f of [1,0.5]){
    const v=niceTop*f, yy=G.BASE-f*(G.BASE-G.TOP);
    out.push(`<text x="${G.L-5}" y="${(yy+3).toFixed(1)}" font-size="8.5" fill="var(--lab)" text-anchor="end">${fmt(v)}</text>`);
  }
  out.push(`<text x="${G.L-5}" y="${G.BASE+3}" font-size="8.5" fill="var(--lab)" text-anchor="end">0</text>`);
  return out.join('');
}
// tik-uitlezing: vult een regel onder de grafiek, zonder re-render
function chartRead(id,txt){ const el=document.getElementById(id); if(el) el.innerHTML=txt; }
// label voor een referentielijn, rechts uitgelijnd, met een dekkend plaatje eronder zodat het
// leesbaar blijft als er staven achter langs lopen
function chartTagRight(xr,yy,txt,col){
  const w=txt.length*4.7+8;
  return `<rect x="${(xr-w).toFixed(1)}" y="${(yy-8.5).toFixed(1)}" width="${w.toFixed(1)}" height="11.5" rx="3" fill="var(--card2)" fill-opacity=".95"/>`
    +`<text x="${(xr-4).toFixed(1)}" y="${yy.toFixed(1)}" font-size="8.5" font-weight="700" fill="${col}" text-anchor="end">${txt}</text>`;
}

// volledige historie van één KPI: staven met waarde, maandlabels, y-as en je band als gelabelde lijn
function kpiHistChart(k){
  const vals=k.series, labs=k.labels, ms=k.maanden;
  if(vals.filter(v=>v!=null).length<2) return `<div class="small muted" style="margin:14px 0 4px">Na twee maanden zie je hier je verloop.</div>`;
  const band=kpiBand(k.key)!=null?kpiBand(k.key):(k.ref||0);
  const G=CHART_GEO, {W,R,L,TOP,BASE,XLAB,H}=G;
  const ruw=Math.max(...vals.map(v=>Math.max(v||0,0)),band||0,1);
  const niceTop=Math.max(Math.ceil(ruw*1.08/10)*10,10);
  const slot=(W-L-R)/vals.length, bw=Math.min(slot*0.62,34);
  const y=v=>BASE-Math.max(v,0)/niceTop*(BASE-TOP);
  const col=kpiBarColor(k);
  const every=Math.ceil(vals.length/12);
  const toon=chartLabelIdx(vals);
  const kort=v=>k.fmt(v);
  const bars=vals.map((v,i)=>{
    const cx=L+slot*i+slot/2, x=cx-bw/2, nu=(k.partial&&i===vals.length-1);
    if(v==null) return `<text x="${cx.toFixed(1)}" y="${XLAB}" font-size="9" fill="var(--lab)" text-anchor="middle">${labs[i]}</text>`;
    const yy=y(v);
    const bar=`<rect class="cbar" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(BASE-yy,1.5).toFixed(1)}" rx="3" fill="${col(v,i)}"${nu?' fill-opacity=".45" stroke="'+col(v,i)+'" stroke-width="1" stroke-dasharray="3 2"':''}/>`;
    const val=toon.has(i)?`<text x="${cx.toFixed(1)}" y="${Math.max(yy-4,TOP-4).toFixed(1)}" font-size="8.5" font-weight="700" fill="var(--txt)" text-anchor="middle">${kort(v)}</text>`:'';
    const lab=(i%every===0||i===vals.length-1)?`<text x="${cx.toFixed(1)}" y="${XLAB}" font-size="9" fill="var(--lab)" text-anchor="middle">${labs[i]}${nu?'*':''}</text>`:'';
    const hit=`<rect x="${(L+slot*i).toFixed(1)}" y="${TOP}" width="${slot.toFixed(1)}" height="${(BASE-TOP+18).toFixed(1)}" fill="transparent" style="cursor:pointer" onclick="chartRead('kpiRead','&lt;b&gt;${esc(monthLabel(ms[i]))}&lt;/b&gt; · ${k.fmt(v)}${nu?' · tot nu toe':''}')"><title>${labs[i]} · ${k.fmt(v)}</title></rect>`;
    return bar+val+lab+hit;
  }).join('');
  const bandTxt=kpiBandTxt(k.key);
  const bandLine=band>0&&band<=niceTop?`<line x1="${L}" x2="${W-R}" y1="${y(band).toFixed(1)}" y2="${y(band).toFixed(1)}" stroke="var(--ref)" stroke-width="1.4" stroke-dasharray="4 3"/>`
    +chartTagRight(W-R, y(band)-4, bandTxt, 'var(--ref)'):'';
  return `<svg id="kpiHist" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block;margin-top:12px">
      ${chartYAxis(niceTop, kort)}
      <line x1="${L}" x2="${W-R}" y1="${BASE}" y2="${BASE}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      ${bars}${bandLine}
    </svg>
    <div id="kpiRead" class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:2px;min-height:15px">Tik een staaf voor de exacte waarde.${k.partial?' De maand met * loopt nog.':''}</div>
    <div class="gc-leg"><span><i class="d"></i>${kpiBandTxt(k.key)}</span><span><i style="background:var(--bar)"></i>binnen</span><span><i style="background:${kpiCol('bad')}"></i>erbuiten</span></div>`;
}
/* Welke transacties maken dit kerncijfer? (v104) Elk cijfer heeft een scherp afgebakende
   verzameling, en die gebruiken we hier letterlijk: dezelfde predicaten als totals() en
   splitFixedVar(). Zo telt de lijst per definitie op tot het getal erboven. Een lijst die iets
   anders zegt dan het cijfer zou een nieuw vertrouwensprobleem zijn in plaats van een opgelost. */
/* De boekingen achter de spaarquote (v161). vermogensInleg() telt drie stromen op, dus de lijst

  const uit=new Map();

  if(ra) for(const t of txOfMonth(ym)){ if(t.acc===ra) uit.set(t.id,t); }
  for(const t of beleggingsTx(ym)) uit.set(t.id,t);

function kpiTx(key,m){
  const list=txOfMonth(m);
  if(key==='vast')   return list.filter(x=>isExpenseTx(x)&&isFixed(x));
  if(key==='vari')   return list.filter(x=>isExpenseTx(x)&&!isFixed(x));
  if(key==='budget') return list.filter(isExpenseTx);

  return [];

/* Het inkomen in de restsaldo-quote komt uit totals() en dat is lang niet altijd de som van je

const kpiPt=v=>{ const a=Math.abs(v); if(a<0.05) return '0 pt';

/* Op een eigen vermogenspot is de bijschrijving de inleg; een beleggingsinleg verlaat je rekeningen

function inlegWaarde(t){
  let sav=new Set(); try{ sav=new Set(n26SavingsAccounts()); }catch(_){}

function kpiSom(key,items){ return items.reduce((s,t)=>s+kpiTxWaarde(key,t),0); }

  // "de zwaarste eerst" het antwoord; de datum staat er per regel toch bij.
  const items=kpiTx(key,m).slice().map(x=>({t:x,pt:kpiBijdrage(key,x,basis)}))
    .sort((a,b)=>(Math.abs(b.pt||0)-Math.abs(a.pt||0))||b.t.date.localeCompare(a.t.date));

    ? `${euro0(uit)} naar je spaarrekening, van ${euro0(t.income)} inkomen`
    : (key==='budget')
    ? `${euro0(uit)} uitgegeven van ${euro0(t.budget)} budget`
    : `${euro0(uit)} aan ${key==='vast'?'vaste lasten':'variabele uitgaven'}`;

    return `<div class="tx" style="cursor:default"><div class="ava" style="background:var(--card2)">${c.icon}</div>
      <div class="info"><div class="nm">${esc(t2.name)}</div><div class="cat">${new Date(t2.date).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} · ${c.name}</div></div>
      <div style="text-align:right"><div class="amt ${t2.amount>0?'pos':'neg'}">${t2.amount>0?'+':''}${euro(t2.amount)}</div>
        ${pt!=null?`<div class="kpi-pt small" style="color:var(--mut2);font-size:var(--fs-xs)">${kpiPt(pt)}</div>`:''}</div></div>`;}).join('')

  const ptUitleg=(basis>0&&items.length)
    ? `<div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin:2px 0 6px">Achter elk bedrag staat wat die transactie aan dit cijfer deed, in ${jrg('procentpunt','procentpunten')}. ${key==='inleg'?'Elke storting duwt dit cijfer omhoog.':'Een uitgave duwt dit cijfer omhoog.'}</div>`

    <summary class="small" style="color:var(--teal);cursor:pointer">Welke transacties zitten hierin? · ${items.length}</summary>
    <div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin:8px 0 2px">${kop}</div>

/* Wat veranderde er sinds vorige maand, en wat verklaart dat? (v106)
   Elk kerncijfer is teken × X/B: X is wat je uitgaf, B je inkomen (of je potjes bij
   budgetnaleving). De verschuiving splitst dan exact in twee delen:
     teller-effect  (X1 − X0)/B1        — wat je anders uitgaf
     noemer-effect  X0·(1/B1 − 1/B0)    — wat je inkomen of budget deed
   Samen zijn ze de hele verandering, en alleen het teller-effect splitst per categorie. Zonder
   die tweedeling zou een gedaald inkomen als "je gaf meer uit" lezen, en dat is niet waar. */
function kpiXB(key,m){
  const t=totals(m);

}
function kpiCatSom(key,m){                     // niet clampen: een netto-negatieve categorie telt gewoon mee
  const by={};

    // alle spaarboekingen dragen dezelfde categorie, dus groeperen we op rekening
    for(const t of kpiTx(key,m)){ const k='acc:'+t.acc; by[k]=(by[k]||0)+(sav.size?t.amount:-t.amount); }
    return by; }

// label van een driver: een categorie, of bij de spaarquote een rekening
function kpiDriverNaam(k){
  if(String(k).slice(0,4)==='acc:'){ const a=String(k).slice(4); return 'Naar '+(accShort(a)||'je spaarrekening'); }
  return CATS[k]?CATS[k].name:k;
}
function kpiDelta(key,m){
  const ms=months(), i=ms.indexOf(m); if(i<1) return null;

  if(!(a.B>0)||!(b.B>0)) return null;                     // zonder basis geen vergelijking (v59/v73)

    .map(c=>({cat:c, euro:(c1[c]||0)-(c0[c]||0), pt:teken*((c1[c]||0)-(c0[c]||0))/a.B*100}))

function kpiDeltaBlok(key,m,partial){

      <span class="small" style="font-weight:600">Ten opzichte van ${esc(monthLabel(D.vorige))}</span>
      <span class="small" style="font-weight:700">${_pct0(D.was)} → ${_pct0(D.nu)} · ${kpiPt(D.dpt)}</span></div>

/* De stand tegen het doel in één beeld (v103). Neutrale datakleur; amber alleen als je er echt

function kpiDoelBalk(k){

/* De opbouw van de spaarquote (v161). Toont per stroom wat er meetelt, en noemt uitdrukkelijk wat

// Kolomgrafiek uitgaven per maand met je maandbudget als gestreepte referentie.

function spendVsBudgetChart(){

  // In Rustig start deze twaalf-maands grafiek ingeklapt: één tik en hij staat er, maar hij

  if(ms.length<2) return `<div class="card">${head}${open?'<div class="small muted">Na twee maanden zie je hier je verloop.</div>':''}</div>`;
  if(!open) return `<div class="card" id="insSpendCard">${head}<div class="small" style="color:var(--mut2);margin-top:6px">Je uitgaven per maand naast je budget · tik om te bekijken</div></div>`;
  const last=ms.slice(-12);
  const now=new Date(); const nowYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const rows=last.map(mm=>{ const t=totals(mm); return {m:mm, spend:Math.max(t.spend,0), budget:Math.max(t.budget,0), now:mm===nowYM}; });
  const G=CHART_GEO, {W,H,L,R,TOP,BASE,XLAB}=G;
  const niceTop=reisNiceCeil(Math.max(...rows.map(r=>Math.max(r.spend,r.budget)),1)*1.08);
