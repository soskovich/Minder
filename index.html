function catDriver(m,k){
  const all=txOfMonth(m).filter(x=>catOf(x)===k);              // incl. terugstortingen (netto via netSpend/groupMerch)
  const n=all.filter(t=>t.amount<0).length;                    // telling op afschrijvingen
  const sum=netSpend(all);                                     // netto categorie-uitgave
  const pm=months().filter(mm=>mm<m).slice(-3);
  const priorN=pm.length?pm.reduce((s,mm)=>s+txOfMonth(mm).filter(x=>catOf(x)===k&&x.amount<0).length,0)/pm.length:n;
  const priorSum=pm.length?pm.reduce((s,mm)=>s+(catSpendMap(mm)[k]||0),0)/pm.length:sum;
  const merch=groupMerch(all)[0];                              // grootste netto winkel (Optie A, geen losse transactie)
  return {n,sum,priorN,priorSum,avg:sum/(n||1),priorAvg:priorSum/(priorN||1),merch};
}

function baselineSpend(){
  const now=new Date(); const nowYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const recent=months().filter(m=>m<nowYM).slice(-6);
  const sp=recent.map(m=>netSpend(txOfMonth(m))).filter(v=>v>0).sort((a,b)=>a-b);   // netto maand-uitgave
  if(!sp.length) return 0;
  const lower=sp.slice(0,Math.ceil(sp.length/2));
  return Math.round(lower[Math.floor(lower.length/2)]);
}
// inkomen-limiet (SET.limit% van inkomen, of cap/baseline/damper). ROL sinds potjes leidend zijn: dit is
// niet meer het maandtotaal, maar de REFERENTIE voor de spiegel én de basis voor sparen/liquiditeit.
function monthBudget(inc){
  inc=+inc||0; const pctBud=inc*SET.limit/100; const mode=SET.limitMode||'pct';
  if(mode==='cap'){ const cap=+SET.spendCap||0; return cap>0?cap:pctBud; }
  if(mode==='baseline'){ const bl=baselineSpend(); return bl>0?Math.min(bl, pctBud||bl):pctBud; }
  if(mode==='damper'){ const base=baseIncome()||inc; const a=Math.min(Math.max(+SET.damperPct||30,0),100)/100; return Math.round(base*SET.limit/100 + Math.max(inc-base,0)*a); }
  return pctBud;
}
function totals(m){
  const list=txOfMonth(m);
  let income=0, spend=0, internal=0;
  const byCat={};
  for(const t of list){
    const c=catOf(t), meta=CATS[c];
    byCat[c]=(byCat[c]||0)+t.amount;
    if(meta.type==='income') income+=Math.max(t.amount,0);
    else if(meta.type==='expense') spend+=-t.amount;   // netto: een terugstorting binnen een uitgavencategorie verlaagt de uitgave
    else if(meta.type==='internal') internal+=t.amount;
  }
  let inc, basis;
  if(SET.autoIncome){
    if(income>0){ inc=income; basis='gedetecteerd'; }
    else { inc=baseIncome(); basis = inc>0?'basisnorm':'onbekend'; }
  } else { inc=SET.income||0; basis='handmatig'; }
  const limit = monthBudget(inc);      // inkomen-limiet: sinds potjes leidend zijn is dit de REFERENTIE voor de spiegel, niet meer het plafond
  const pot = totalBudget();           // som van je potjes = leidend maandtotaal
  const budget = pot>0 ? pot : limit;  // geen potjes? val terug op de inkomen-limiet, zodat de app niet zonder budget valt
  return {list,income:inc,detectedIncome:income,spend,internal,byCat,budget,limit,potTotal:pot,incomeBasis:basis};
}
// basis-inkomen = conservatieve norm over je RECENTE maanden (laatste 6): mediaan van de ONDERSTE helft.
// Recent venster → een salarisverhoging telt meteen mee en oudere/lagere maanden wegen niet meer mee.
// Onderste helft → incidentele pieken (vakantiegeld, dividend, onkosten) blazen je norm niet op.
function baseIncome(){
  if(!SET.autoIncome) return +SET.income||0;
  let recent=months().filter(m=>m<nowYMstr()).slice(-6);   // laatste 6 AFGERONDE maanden; de lopende maand vervuilt de schatting
  if(!recent.length) recent=months().slice(-6);            // brand-new gebruiker: val terug op wat er is
  const vals=recent.map(m=>{let s=0;for(const t of txOfMonth(m)){if(CATS[catOf(t)].type==='income')s+=Math.max(t.amount,0);}return s;}).filter(v=>v>0).sort((a,b)=>a-b);
  if(!vals.length) return 0;
  const lower=vals.slice(0,Math.ceil(vals.length/2));
  return Math.round(lower[Math.floor(lower.length/2)]);
}
// vaste/variabele splitsing over een maand
function splitFixedVar(m){ let fixed=0,vari=0;
  for(const x of txOfMonth(m)){ if(CATS[catOf(x)].type==='expense'){ if(isFixed(x)) fixed+=-x.amount; else vari+=-x.amount; } }   // netto: terugstorting verlaagt vast/variabel
  return {fixed,vari};
}
/* ===== Tempo-projectie (v177) =====
 * Een tempo veronderstelt dat een uitgave gelijkmatig over de maand valt, en een incasso doet dat
 * per definitie niet. Huur op dag 2 laat je tempo op dag 5 exploderen, en dat gebeurt elke maand
 * bij iedereen in de eerste week: dan levert de kalender het oordeel in plaats van je gedrag.
 * Daarom wordt alleen het VARIABELE deel geextrapoleerd. Vaste lasten tellen als waarneming mee:
 * wat er al is afgeschreven, plus wat er deze maand nog komt (monthLiquidity().fixDue). De
 * scheiding komt uit splitFixedVar(), die dat onderscheid al maakt (v55).
 * Eén bron: vier plekken rekenden hier hun eigen tempo, drie daarvan met vaste lasten erin. */
function tempoProjectie(m){
  m=m||(typeof kijkMaand==='function'?kijkMaand():m);
  let de={dim:30,elapsed:0}; try{ de=daysElapsed(m); }catch(_){}
  const el=Math.max(de.elapsed,1);
  const lopend=(m===thisYM());
  /* Eén pass met dezelfde partitie als splitFixedVar (isFixed, v55), maar ook gesplitst op datum:
     een boeking die verderop in deze maand valt is al ingepland en hoort niet in een tempo dat over
     de verstreken dagen rekent. Anders telt een geplande afschrijving als gedrag van vandaag. */
  let vastTot=0, variTot=0, variLater=0;
  try{ for(const x of txOfMonth(m)){
    const c=CATS[catOf(x)]; if(!c||c.type!=='expense') continue;
    const bedrag=-x.amount;
    if(isFixed(x)){ vastTot+=bedrag; continue; }
    if(lopend && (+x.date.slice(8,10))>de.elapsed) variLater+=bedrag;
    else variTot+=bedrag;
  } }catch(_){}
  let fixDue=0; try{ if(lopend) fixDue=Math.round(monthLiquidity().fixDue||0); }catch(_){}
  const vast=Math.round(vastTot)+fixDue;
  const variTempo=lopend?Math.round(variTot/el*de.dim):Math.round(variTot);
  return {dim:de.dim, elapsed:de.elapsed, lopend, vast,
    variTot:Math.round(variTot), variLater:Math.round(variLater),
    vari:Math.round(variTot+variLater), variTempo,
    proj: vast+Math.round(variLater)+variTempo};
}
/* De variabele helft van je potjes: dezelfde partitie die varPlanRemaining() gebruikt, dus geen
   tweede definitie van "welke categorieen zijn variabel". Nodig om een variabel tempo tegen een
   variabel budget te kunnen zetten in plaats van tegen je hele budget. */
function varBudget(){
  const B=SET.budgets||{}; let rc=new Set(); try{ rc=recurringCats(); }catch(_){}
  let v=0; for(const k in B){ const b=+B[k]||0; if(b>0 && !rc.has(k)) v+=b; }
  return Math.round(v);
}
// ===== PROGNOSE (lichtgewicht AI: gemiddelden + trend) =====
function monthAgg(m){ let income=0; for(const t of txOfMonth(m)) if(CATS[catOf(t)].type==='income') income+=Math.max(t.amount,0);
  const s=splitFixedVar(m); return {m,income,fixed:s.fixed,vari:s.vari,spend:s.fixed+s.vari,net:income-s.fixed-s.vari}; }
function regSlope(arr){ const n=arr.length; if(n<2) return 0; const xm=(n-1)/2; const ym=arr.reduce((a,b)=>a+b,0)/n; let num=0,den=0;
  for(let i=0;i<n;i++){ num+=(i-xm)*(arr[i]-ym); den+=(i-xm)**2; } return den?num/den:0; }
function nextMonths(m,k){ const out=[]; let [y,mo]=m.split('-').map(Number); for(let i=0;i<k;i++){ mo++; if(mo>12){mo=1;y++;} out.push({y,mo,label:MNAMES[mo-1],full:MFULL[mo-1]+' '+y}); } return out; }
function forecastModel(){
  const ms=months(); if(ms.length<2) return null;
  const agg=ms.map(monthAgg).filter(a=>a.spend>0||a.income>0);   // (nog) lege maanden tellen niet mee in de statistiek
  if(agg.length<2) return null;
  const last=agg.slice(-3); const avg=k=>last.reduce((s,a)=>s+a[k],0)/last.length;
  const vSlope=regSlope(agg.map(a=>a.vari)), sSlope=regSlope(agg.map(a=>a.spend));
  const fInc=baseIncome()||avg('income'), fFixed=avg('fixed'), fVar=Math.max(avg('vari')+vSlope,0);
  return {agg, fInc, fFixed, fVar, fNet:fInc-fFixed-fVar, vSlope, sSlope, next:nextMonths(ms[ms.length-1],13)};

// ===== SALDO & LIQUIDITEIT =====
function accBalance(acc){ const mb=(SET.manualBal||{})[acc]; if(mb!=null && mb!=='') return +mb; const a=ACCMETA[acc]; return a&&a.balance!=null?a.balance:null; }
// known = rekeningen mét een bekend saldo. Nul bekende saldi (bv. direct na een CSV-import) betekent onbekend, niet €0.
function totalBalance(){ let sum=0, missing=0, known=0; for(const acc of OWN){ const b=accBalance(acc); if(b==null) missing++; else { sum+=b; known++; } } return {sum,missing,known}; }
function setBal(acc,val){ SET.manualBal=SET.manualBal||{}; if(val===''||val==null) delete SET.manualBal[acc]; else SET.manualBal[acc]=+val; save(); renderDash(); } // settings niet herrenderen (focus behouden)

// N26-spaarpotjes: alle N26-Spaces behalve de betaalrekening (Main) en het potje eindigend op 4840
// rekening matchen op laatste cijfers (PSD2-acc = IBAN-cijfers, of via opgeslagen IBAN)
function acctEndsWith(a, ends){
  const pm=(SET.psd2Accounts||{})[a]; const iban=((pm&&pm.iban)||'').replace(/\s/g,'');
  const id=(a||'').replace(/\s/g,'');
  return ends.some(e=> id.endsWith(e) || (iban && iban.endsWith(e)));
}
/* Welke rekeningen zijn spaarrekeningen? (v119)
   Dit hing aan `SET.savingsEnds`: een lijstje laatste-vier-cijfers, getoetst met `id.endsWith(...)`.
   Dat werkt voor een PSD2-rekening, waarvan de id de IBAN-cijfers zijn, maar niet voor een
   CSV-rekening als 'N26 Buffer Rust' - die eindigt op "Rust". De schakelaar in de rekeningenlijst
   schreef daar `acctLast4()` weg, en dat is voor élk N26-CSV-potje '26' (uit "N26"), waar geen
   enkele id op eindigt. De schakelaar deed dus niets en sprong terug, en de stortingen naar die
   potjes telden nergens mee - ook niet in savedThisMonth/savedNet, en dus niet in je spaarquote.
   Nu per rekening-id, drietraps zoals de inklap-vlaggen (v20/v90): geen keuze = de oude standaard
   beslist, een eigen keuze wint altijd. Zo verandert er niets voor wie nooit iets omzette, en

const SAV_DEFAULT_ENDS=['4323','1123'];   // standaard: Spaarpot + Buffer rust; 4840/Zakgeld niet
function allAccounts(){ return [...new Set([...OWN, ...Object.keys(SET.psd2Accounts||{})])]; }
function isSavingsAcc(a){
  const m=SET.savingsAcc||{};
  if(Object.prototype.hasOwnProperty.call(m,a)) return !!m[a];   // eigen keuze wint
  return acctEndsWith(a, SAV_DEFAULT_ENDS);
}
function n26SavingsAccounts(){ return allAccounts().filter(isSavingsAcc); }
/* Eenmalige migratie van savingsEnds naar keuzes per rekening. Alleen waar jouw lijstje iets
   anders zei dan de standaard wordt een expliciete keuze weggeschreven; de rest blijft aan de
   default hangen. savingsEnds blijft staan, ongebruikt, zodat er niets onherstelbaar verdwijnt. */
/* v172: het noodfonds ging van gemeten naar toegewezen. Zonder deze eenmalige overzetting staat
   het na de update op nul terwijl er buffer is. Alleen bij een bekend spaarsaldo: is dat onbekend,
   dan blijft de vlag uit en migreren we zodra het wel bekend is. Daarna loopt het cijfer stil - dat
   bijsturen doe je met de regel "staat nog niet toegewezen" op je plan. */
function migrateNfToegewezen(){
  if(SET.nfToegewezenMigrated) return;

  if(!S || S.missing) return;
  let doel=0; try{ doel=Math.round(noodfondsModel().doel||0); }catch(_){}
  const saved=Math.max(Math.round(S.cur||0),0);
  SET.nfToegewezen = doel>0 ? Math.min(saved,doel) : saved;
  SET.nfToegewezenMigrated=1; save();
}
function migrateSavingsAcc(){
  if(SET.savingsAccMigrated) return;
  const ends=Array.isArray(SET.savingsEnds)?SET.savingsEnds:null;
  if(ends){ const m=SET.savingsAcc||{};
    for(const a of allAccounts()){
      const oud=acctEndsWith(a,ends), std=acctEndsWith(a,SAV_DEFAULT_ENDS);
      if(oud!==std && !Object.prototype.hasOwnProperty.call(m,a)) m[a]=oud;
    }
    SET.savingsAcc=m;
  }
  SET.savingsAccMigrated=1; save();
}
function totalSaved(){ let sum=0,n=0,missing=0; for(const a of n26SavingsAccounts()){ const b=accBalance(a); if(b==null) missing++; else {sum+=b;n++;} } return {sum:Math.round(sum),n,missing}; }
// hoeveel ging deze maand netto naar je spaarrekening(en) — afgeleid uit de bijschrijvingen op die rekening, niet uit een categorie
function savedThisMonth(ym){
  const sav=new Set(n26SavingsAccounts()); if(!sav.size) return 0;
  let net=0; for(const t of txOfMonth(ym)){ if(sav.has(t.acc)) net+=t.amount; }
  return Math.max(Math.round(net),0);
}
/* Wat ging er deze maand netto naar je spaarrekening? (v109) savedThisMonth() clampt op >= 0:
   goed voor de referentie-verdeling, maar een kerncijfer moet ook kunnen zeggen dat je hebt

   Terugval als er geen spaarrekening gemarkeerd is: de categorie 'sparen', precies zoals
   healthSplitOver() dat doet — dus alleen de afschrijvingen, want zonder gemarkeerde rekening
   kunnen beide kanten van dezelfde overboeking in TX staan en zouden ze elkaar opheffen.
   null = we weten het niet (v59/v73): geen spaarrekening én geen spaarboeking in beeld. */
function savedNet(ym){
  const sav=new Set(n26SavingsAccounts());
  if(sav.size){ let net=0; for(const t of txOfMonth(ym)) if(sav.has(t.acc)) net+=t.amount; return Math.round(net); }
  const cat=txOfMonth(ym).filter(t=>catOf(t)==='sparen');
  if(!cat.length) return null;
  let net=0; for(const t of cat) if(t.amount<0) net+=-t.amount;
  return Math.round(net);
}
// De transacties achter dat getal: de bijschrijvingen op je spaarrekening, of bij terugval de

function savedTx(ym){
  const sav=new Set(n26SavingsAccounts());

  return txOfMonth(ym).filter(t=>catOf(t)==='sparen'&&t.amount<0);
}
/* Waar kwam je spaarinleg vandaan? (v117) De spaarquote meet wat er naar je spaarrekening ging,
   niet waar dat geld vandaan kwam. Stort je meer dan je die maand overhield, dan kwam het verschil
   uit je buffer: je zette wel geld opzij, maar je vermogen groeide er niet mee - en dan kan de
   spaarquote op groen staan terwijl je over je bestedingslimiet ging. Eén bron voor het oordeel,
   de tegel en de brug-zin, zodat die elkaar niet kunnen tegenspreken. null = onbekend (v59/v73). */
function spaarDekking(m){
  const g=savedNet(m); if(g==null) return null;
  const t=totals(m); if(!(t.income>0)) return null;
  const over=Math.round(t.income-t.spend), gestort=Math.round(g);
  return {over, gestort, uitBuffer:Math.max(gestort-over,0), gedekt:Math.min(gestort,over)};
}

// groeperingssleutel voor terugkerende posten (zelfde logica als recurringSchedule)
function recurKey(t){ return (t.name||'').toUpperCase().replace(/[0-9]/g,'').replace(/\s+/g,' ').trim().slice(0,20); }
function shiftWeekendToMonday(d){ const x=new Date(d); const w=x.getDay(); if(w===6) x.setDate(x.getDate()+2); else if(w===0) x.setDate(x.getDate()+1); return x; }
function recurringSchedule(){
  const map={};
  for(const t of TX){ if(t.pending) continue; const c=catOf(t), meta=CATS[c]; let type=null;
    if(meta.type==='income' && t.amount>0) type='income';
    else if(meta.type==='expense' && t.amount<0 && (isIncasso(t) || isPeriodicTransfer(t))) type='fixed'; else continue;   // vaste last = herkende terugkerende betaling (incasso OF periodieke overboeking), niet de betaalvorm
    const key=recurKey(t); if(!key) continue;
    const m=(map[key]=map[key]||{name:t.name,cat:c,type,occ:[],inc:0,per:0,tot:0});
    m.occ.push({date:t.date, amt:Math.abs(t.amount), ym:t.date.slice(0,7), acc:t.acc});
    m.tot++; if(isIncasso(t)) m.inc++; if(isPeriodicTransfer(t)) m.per++; }
  const now=new Date(); now.setHours(0,0,0,0); const today=now.getTime();
  const ym0=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const out=[];
  for(const k in map){ const r=map[k];
    const byYm={}; for(const o of r.occ){ if(!byYm[o.ym]||o.amt>byYm[o.ym].amt) byYm[o.ym]=o; }
    const occ=Object.values(byYm).sort((a,b)=>a.date.localeCompare(b.date));
    if(occ.length<2) continue;
    const gaps=[]; for(let i=1;i<occ.length;i++) gaps.push((new Date(occ[i].date)-new Date(occ[i-1].date))/86400000);
    gaps.sort((a,b)=>a-b); const medGap=gaps[Math.floor(gaps.length/2)]||30;
    const intervalM = medGap<=45?1 : medGap<=135?3 : medGap<=225?6 : 12;
    const last=occ[occ.length-1]; const lastD=new Date(last.date); lastD.setHours(0,0,0,0);
    if((today-lastD.getTime())/86400000 > intervalM*30*1.6 + 7) continue;
    const dom=lastD.getDate(); const chargedThisMonth=occ.some(o=>o.ym===ym0);
    let nx;
    if(intervalM===1 && !chargedThisMonth){
      const dim=new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      const cand=new Date(now.getFullYear(), now.getMonth(), Math.min(dom,dim)); cand.setHours(0,0,0,0);
      nx = cand.getTime()<today ? new Date(now) : cand;        // dag al voorbij maar nog niet afgeschreven -> imminent (deze maand), niet doorrollen
    } else {
      nx=new Date(lastD); let g=0; do{ nx.setMonth(nx.getMonth()+intervalM); g++; }while(nx.getTime()<=today && g<60);
    }
    nx=shiftWeekendToMonday(nx);                                // incasso in het weekend -> maandag erna
    out.push({key:k,name:r.name,cat:r.cat,type:r.type,amount:last.amt,day:lastD.getDate(),intervalM,nextDate:new Date(nx),lastDate:last.date,count:r.occ.length,monthlyEq:Math.round(last.amt/intervalM),acc:last.acc,incasso:(r.tot>0 && r.inc/r.tot>=0.5),periodic:(r.tot>0 && r.per/r.tot>=0.5)});
  }
  return out.sort((a,b)=>a.nextDate-b.nextDate);
}
// Herkende herhaling: sleutels van de gedetecteerde terugkerende vaste betalingen (incasso/periodieke overboeking, >=2x, regelmatig).
// Bron van waarheid voor isFixed. Licht gememoïseerd op _dataGen (recurringSchedule loopt over alle TX; roept isFixed NIET aan -> geen circulariteit).
let _recurKeys=null, _recurKeysGen=-1;
function recurringKeys(){
  if(_recurKeysGen===_dataGen && _recurKeys) return _recurKeys;
  const s=new Set(); try{ for(const r of recurringSchedule()){ if(r.type==='fixed') s.add(r.key); } }catch(_){}
  _recurKeys=s; _recurKeysGen=_dataGen; return s;
}
// Categorieën met een herkende terugkerende vaste betaling. Hun potjes lopen via fixDue (vast); overige potjes = variabel plan.
// Gebruikt door safeToSpend/varPlanRemaining/effectiveBudgets om dubbeltelling met fixDue te vermijden.
let _recurCats=null, _recurCatsGen=-1;
function recurringCats(){
  if(_recurCatsGen===_dataGen && _recurCats) return _recurCats;
  const s=new Set(); try{ for(const r of recurringSchedule()){ if(r.type==='fixed' && r.cat) s.add(r.cat); } }catch(_){}
  _recurCats=s; _recurCatsGen=_dataGen; return s;
}
// per-rekening saldo-check: dekt het huidige saldo de aankomende incasso's tot het volgende inkomen op DIE rekening?
// alleen rekeningen met een bekend saldo; venster = tot je volgende verwachte inkomen op die rekening (anders 35 dagen).
function accountShortfalls(){
  if(OWN.length<1) return [];
  const sched=recurringSchedule();
  const t0=new Date(); t0.setHours(0,0,0,0); const today=t0.getTime();
  const MAXH=35*86400000;
  const out=[];
  for(const acc of OWN){
    const bal=accBalance(acc); if(bal==null) continue;
    let incT=null;
    for(const r of sched){ if(r.type==='income' && r.acc===acc){ const d=new Date(r.nextDate).setHours(0,0,0,0); if(d>today && (incT==null||d<incT)) incT=d; } }
    const horizon = incT!=null ? incT : today+MAXH;
    const debits=sched.filter(r=>r.type==='fixed' && r.acc===acc && r.amount>0 && !(SET.fixDueExcl||{})[r.key])
      .map(r=>({name:r.name,amt:r.amount,t:new Date(r.nextDate).setHours(0,0,0,0),cat:r.cat}))
      .filter(e=>e.t>=today && e.t<horizon).sort((a,b)=>a.t-b.t);
    if(!debits.length) continue;
    let run=bal;
    for(const e of debits){ run-=e.amt; if(run<0){ out.push({acc,name:e.name,amt:e.amt,t:e.t,balance:Math.round(bal),shortfall:Math.round(-run),cat:e.cat}); break; } }
  }
  return out.sort((a,b)=>a.t-b.t);
}
// dag-voor-dag liquiditeitscurve: vaste lasten/inkomen op hun datum + variabele burn
function liquidityDaily(days){
  const sched=recurringSchedule(), f=forecastModel();
  const start=new Date(); start.setHours(0,0,0,0);
  const end=new Date(start); end.setDate(start.getDate()+days);
  const {sum}=totalBalance();
  const events=[];
  for(const s of sched){ if(s.type==='fixed' && (!s.incasso || (SET.fixDueExcl||{})[s.key])) continue;   // alleen automatische incasso's; door de gebruiker uitgesloten vaste lasten tellen niet mee
    let d=new Date(s.nextDate); d.setHours(0,0,0,0); let g=0;
    while(d.getTime()<end.getTime() && g<60){
      if(d.getTime()>=start.getTime()){ const ed=shiftWeekendToMonday(d); events.push({date:new Date(ed),name:s.name,amt:s.type==='income'?s.amount:-s.amount,type:s.type,cat:s.cat}); }
      d.setMonth(d.getMonth()+s.intervalM); g++; } }
  events.sort((a,b)=>a.date-b.date);
  const dailyVar=f?f.fVar/30:0; let b=sum; const dates=[],bal=[];
  for(let i=0;i<days;i++){ const d=new Date(start); d.setDate(start.getDate()+i);
    for(const e of events){ if(e.date.getFullYear()===d.getFullYear()&&e.date.getMonth()===d.getMonth()&&e.date.getDate()===d.getDate()) b+=e.amt; }
    b-=dailyVar; dates.push(new Date(d)); bal.push(b); }
  let ti=0; for(let i=1;i<bal.length;i++) if(bal[i]<bal[ti]) ti=i;
  return {dates,bal,events,trough:{date:dates[ti],bal:bal[ti],i:ti}, net:f?f.fNet:0};
}

function daysElapsed(m){ const [y,mo]=m.split('-').map(Number); const dim=new Date(y,mo,0).getDate();
  const now=new Date(); const todayYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  return {dim, elapsed: m===todayYM?Math.min(now.getDate(),dim):dim, today: m===todayYM?now.getDate():0}; }

// maand-liquiditeit: wat is deze maand NOG niet ontvangen/betaald?
// "Due" = terugkerende post die deze kalendermaand nog niet in je transacties voorkomt
// (niet op basis van de typische dag, die kan al gepasseerd zijn terwijl het bedrag nog moet komen).
/* Wat heeft dit potje de rest van de maand nog nodig? (v111)
   Zolang er ruimte is: het onbestede deel. Maar een OVERSCHREDEN potje reserveerde nul, en
   daardoor werd "veilig te besteden" juist ruimer naarmate je verder over je budget ging -
   terwijl het uitgeven natuurlijk gewoon doorloopt. Voor de resterende dagen rekenen we dan met
   het geplande dagtempo van dat potje: je eigen plan als maat. Bewust niet het tempo van déze
   maand; na één grote aankoop is dat onbruikbaar hoog (700 in 6 dagen zou 2.800 projecteren).
   Aan het eind van de maand is daysLeft 0, dus dan reserveert een leeg potje weer niets. */
function potjeRest(bud, uitgegeven, dim, daysLeft){
  bud=+bud||0; uitgegeven=+uitgegeven||0;
  if(uitgegeven<=bud) return bud-uitgegeven;
  return Math.round(bud/Math.max(dim,1)*Math.max(daysLeft,0));
}
// Onbestede variabele potjes deze maand (potjes = je plan; gedeeld door de liquiditeitskaart en safeToSpend).
function varPlanRemaining(ym){
  const sp=catSpendMap(ym), B=SET.budgets||{}; let v=0;
  const rc=recurringCats(); const d=daysElapsed(ym), daysLeft=Math.max(d.dim-d.elapsed,0);
  for(const k in B){ const bud=+B[k]||0; if(bud<=0||rc.has(k)) continue; v+=potjeRest(bud, sp[k]||0, d.dim, daysLeft); }   // potjes van niet-recurring categorieën = variabel plan; recurring loopt via fixDue (geen dubbeltelling)
  return Math.round(v);
}
// Spiegel (Optie B): je variabele plan (potjes) vs je verwachte tempo (prognose). Leeg als het gat niet materieel is.
// kind 'safe' = amber (op de Veilig-te-besteden-opbouw), anders teal (op de liquiditeitskaart). Geen blokkade, alleen spiegel.
function varTempoMirror(plan, tempo, kind){
  plan=Math.round(plan||0); tempo=Math.round(tempo||0);
  if(!(tempo-plan >= Math.max(50, tempo*0.2))) return '';
  const gap=tempo-plan;
  if(kind==='safe') return `<div style="font-size:11.5px;line-height:1.45;color:#e8c372;background:rgba(232,195,114,.08);border:1px solid rgba(232,195,114,.28);border-radius:9px;padding:8px 10px;margin:8px 0 2px">Je variabele potjes hebben nog ${euro0(plan)}; op je tempo geef je deze maand naar verwachting ~${euro0(tempo)} uit (${euro0(gap)} meer).</div>`;
  return `<div style="font-size:11.5px;line-height:1.45;color:var(--teal);background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:9px;padding:8px 10px;margin-top:8px">Je plan (variabele potjes) reserveert hiervan ${euro0(plan)}; het verschil van ${euro0(gap)} is je tempo boven je plan.</div>`;
}

// Veilig te besteden = saldo - nog-niet-betaalde vaste lasten deze maand - nog gereserveerde potjes (budget minus al uitgegeven)
function safeToSpend(){
  const tb=totalBalance(); const L=monthLiquidity();
  const now=new Date(); const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const sp=catSpendMap(ym); const B=SET.budgets||{};
  // Potjes van niet-recurring categorieën = variabel plan; recurring categorieën lopen via fixDue (geen dubbeltelling).
  // Vast = uitsluitend de herkende terugkerende incasso/periodieke overboeking (L.fixDue). Het budget-vangnet + v54-cap vervallen.
  const reservedVar=varPlanRemaining(ym);   // v169: één bron voor "wat blijft er over deze maand"
  let potOver=0; const _rc=recurringCats();
  for(const k in B){ const bud=+B[k]||0; if(bud<=0||_rc.has(k)) continue;
    potOver+=Math.max((sp[k]||0)-bud,0);                       // hoeveel je al over je potjes ging
  }
  const fixedStillToGo=Math.round(L.fixDue||0);
  // wat al op je spaarrekening(en) staat valt buiten 'veilig te besteden': geen vrij besteedbaar geld
  let savedBal=0; try{ savedBal=totalSaved().sum||0; }catch(_){}
  /* v129: wat er in je reserveringspot staat is al vergeven aan posten die nog moeten komen
     (aanslagen, premies, tandarts), dus het is geen vrij besteedbaar geld. Drie klemmen:
     staat de pot ook als spaarrekening aangemerkt, dan zit hij al in savedBal en trekken we hem
     niet twee keer af; een onbekend saldo zit sowieso niet in tb.sum; en een negatief saldo
     klemmen we op nul - je kunt geen negatief bedrag reserveren, en de roodstand zelf blijft
     gewoon als negatief saldo in tb.sum staan. */
  let resBal=0; try{ const ra=resAccId();
    if(ra && !((typeof isSavingsAcc==='function') && isSavingsAcc(ra))){ const rb=resSaldo(); if(rb!=null) resBal=Math.max(rb,0); }
  }catch(_){}
  const spendSaldo = tb.sum - savedBal - resBal;
  // verwacht inkomen dat deze maand nog binnenkomt telt MEE (consistent met de maandlasten die we aftrekken)
  const incDue=Math.round(L.incDue||0);
  // nog te sparen deze maand = maandbedrag min wat je DEZE MAAND al hebt weggezet (niet je totale spaarsaldo)
  let saveTarget=0, savedThisMonth=0;

    else { for(const t of txOfMonth(ym)){ if(t.amount<0 && catOf(t)==='sparen') savedThisMonth+=-t.amount; } }
    savedThisMonth=Math.round(savedThisMonth);
  }catch(_){}
  const saveRemaining=Math.max(saveTarget-savedThisMonth,0);
  const safe=Math.round(spendSaldo + incDue - fixedStillToGo - reservedVar - saveRemaining);

    incDue, fixDue:fixedStillToGo, fixDueRecurring:Math.round(L.fixDue||0), fixDueBudgetExtra:Math.max(fixedStillToGo-Math.round(L.fixDue||0),0), reserved:Math.round(reservedVar), potOver:Math.round(potOver), varForecast:Math.round(L.varDue||0), saveReserved:saveRemaining, saveTarget, savedThisMonth, safe};
}
/* ===== Vrij besteedbaar per dag (v158) =====
 * Het dagbedrag voor variabele uitgaven was een uitkomst, geen stuurgetal: totale variabele kosten
 * gedeeld door dagen, achteraf, terwijl die kosten al via potjes lopen. Wat wel stuurt is wat er
 * per dag overblijft na vaste lasten, potjes, reserveringen en spaarinleg.
 *
 * Dat bedrag wordt hier NIET opnieuw afgeleid: de ruimte komt uit safeToSpend(), die dat al doet.
 * Er is bewust geen instelling voor een vrij besteedbaar maandbedrag; dat zou een tweede waarheid
 * zijn die na twee maanden uiteenloopt met de eerste.
 *
 * Geen norm, dus geen kleur, geen doel per dag, geen melding en geen streak. Dit is een stand, geen
 * budget dat je haalt of niet haalt. Het beweegt vanzelf mee: geef je vandaag niets uit, dan is er
 * morgen meer per dag.

 * dagenResterend klemt op 1, zodat de laatste dag van de maand geen deling door nul geeft.
 * volledig is false zodra safeToSpend() onvolledig is; bij een ontbrekend saldo tonen we niets in
 * plaats van een benadering (v59/v73). Bewust strenger dan de hero, die al een getal toont zodra
 * er een enkel saldo bekend is. */
function vrijPerDag(){
  let S=null; try{ S=safeToSpend(); }catch(_){}
  const now=new Date();
  const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  let de={dim:30,elapsed:0}; try{ de=daysElapsed(ym); }catch(_){}
  const dagenResterend=Math.max(de.dim-de.elapsed,1);
  if(!S) return {perDag:0, ruimte:0, dagenResterend, volledig:false};
  const ruimte=Math.round(S.safe);
  return {perDag: ruimte>0?Math.round(ruimte/dagenResterend):0, ruimte, dagenResterend,

  let titel, subtitel, groot, lijst, voet, noot, uitleg;
  if(next){
    titel=`Potjes vanaf ${vanaf}`; subtitel='wat er klaarstaat voor volgende maand'; groot=totP;
    const sub=k=>{ const nu=+B[k]||0, pl=+P[k]||0;
      if(!nu) return `<span style="color:var(--teal)">nieuw potje</span>`;
      if(pl!==nu) return `nu ${euro0(nu)} · <span style="color:var(--teal)">${pl>nu?'+':''}${euro0(pl-nu)}</span>`;
      return 'ongewijzigd'; };
    lijst = kp.map(k=>rij(k,+P[k],sub(k))).join('')
          + gestopt.map(k=>rij(k,0,`nu ${euro0(+B[k])} · <span style="color:var(--amber)">stopt</span>`)).join('');
    if(!kp.length && !gestopt.length) lijst=`<div class="muted small center" style="padding:16px">Nog geen potjes.</div>`;
    noot = anders ? '' : `<div class="small muted" style="margin-top:14px">Er staat niets klaar voor ${vanaf}: dit is dezelfde verdeling als deze maand.</div>`;
    voet = link('Terug naar deze maand', `openPotjesVerdeling('${m}')`);
    uitleg = `Dit is wat er klaarstaat, nog niet je huidige budget — deze maand blijft staan zoals hij staat. Tik een potje om de wijziging aan te passen.`;
  } else {
    titel='Maandbudget'; subtitel=`${esc(monthLabel(m))} · zo staat je plan verdeeld`; groot=tot;
    const rc=recurringCats();
    const som=a=>a.reduce((x,k)=>x+(+B[k]||0),0);
    const sub=k=>{ const d=[], lab=potAssumptionLabel(k); if(lab) d.push(lab);
      if(tot>0) d.push(`${Math.round(+B[k]/tot*100)}% van je potjes`);
      const pl=+P[k]||0; if(isNow && pl!==+B[k]) d.push(`<span style="color:var(--teal)">vanaf ${vanaf} ${pl>0?euro0(pl):'gestopt'}</span>`);
      return d.join(' · '); };
    const vast=ks.filter(k=>rc.has(k)), vari=ks.filter(k=>!rc.has(k));
    lijst = !ks.length
      ? `<div class="muted small center" style="padding:16px">Nog geen potjes. Geef je categorieën een maandbedrag, dan zie je hier de verdeling.</div>`
      : (vast.length && vari.length)
        ? kop('Vast', som(vast))+vast.map(k=>rij(k,+B[k],sub(k))).join('')+kop('Variabel', som(vari))+vari.map(k=>rij(k,+B[k],sub(k))).join('')
        : ks.map(k=>rij(k,+B[k],sub(k))).join('');
    // potjes zijn een instelling van nu, geen momentopname per maand (v59/v73: niet beweren wat we niet weten)
    noot = isNow ? '' : `<div class="small muted" style="margin-top:14px">Je potjes zijn een instelling van nu, geen momentopname van ${esc(monthLabel(m))}.</div>`;
    voet = (isNow && anders) ? link(`Bekijk je potjes vanaf ${vanaf} · ${euro0(totP)}`, `openPotjesVerdeling('${m}','next')`) : '';
    uitleg = `Dit is je plan, niet je besteding. Hoe je ervoor staat deze maand zie je via de ring op Inzichten. Tik een potje om het te wijzigen — dat geldt dan vanaf ${vanaf}.`;
  }

  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="center" style="margin-bottom:8px"><div style="font-size:var(--fs-xl)">${ICON('target')}</div><div style="font-weight:800;font-size:var(--fs-lg)">${titel}</div>
      <div class="muted small">${subtitel}</div>
      <div style="font-size:var(--fs-xl);font-weight:800;margin:5px 0;color:var(--teal)">${euro0(groot)}</div></div>
    ${lijst}${noot}

    ${voet}${link('Potjes en limiet instellen', `openBudgetEditor('${m}')`)}`;
  showSheetBg();
}
// ===== SPAREN & BUFFER (30%-spaardeel → buffer van Nx maanduitgave) =====
// beoogde maandelijkse spaarinleg, instelbaar: automatisch (inkomen − bestedingsruimte), vast bedrag, of %
function monthlySavingTarget(){
  const inc = SET.autoIncome ? baseIncome() : (+SET.income||0);
  const mode = SET.savingMode||'auto';
  if(mode==='amount') return +SET.savingAmount||0;
  if(mode==='percent') return inc*(+SET.savingPercent||0)/100;
  return Math.max(inc - monthBudget(inc), 0);
}
// Wat er "gespaard" staat richting je buffer: je spaarrekening(en) + handmatig extra spaargeld.
// Is er geen spaarrekening gemarkeerd, dan val je terug op je totale saldo — je betaalrekening
// bevat dan immers ook je buffer. Eén bron voor de hero (savingsModel) én het noodfonds-plan-item,
// die anders twee bedragen voor hetzelfde doel toonden.
function spaarSaldo(){
  const extra=+SET.extraSavings||0;
  try{ const ts=totalSaved();
    if(ts.n>0) return {cur:ts.sum+extra, missing:ts.missing>0, bron:'spaarrekening'};
  }catch(_){}
  /* v168: hier stond een terugval op je totale banksaldo. Dat is je betaalrekening en geen buffer,
     en het cijfer voedde de bufferregel op Maand en daarmee beleggenKlaar(). Een verzonnen zekerheid
     op precies dat getal is de duurste die deze app kan hebben, dus zonder aangewezen spaarrekening
     is het onbekend. Geen tweede schatting: 'Extra spaargeld' is jouw eigen invoer voor potjes die
     de app niet ziet, dus dat telt wel, net als een handmatig saldo. */
  if(extra>0) return {cur:extra, missing:false, bron:'extra'};
  return {cur:0, missing:true, bron:'geen'};
}
function savingsModel(){
  const inc = SET.autoIncome ? baseIncome() : (+SET.income||0);
  const room = monthBudget(inc);
  const monthlySaving = monthlySavingTarget();
  const ms=months(); const med=a=>{const s=a.filter(v=>v>0).sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0;};
  const avgSpend=med(ms.map(m=>totals(m).spend));
  const avgFixed=med(ms.map(m=>splitFixedVar(m).fixed));
  const avgVar=med(ms.map(m=>splitFixedVar(m).vari));
  // flexibel bufferdoel
  const basis=SET.bufferBasis||'spend';
  const mult=+SET.bufferMonths||6;
  let baseVal, baseLabel;
  if(basis==='income'){ baseVal=inc; baseLabel='inkomen'; }
  else if(basis==='fixed'){ baseVal=avgFixed; baseLabel='vaste lasten'; }
  else if(basis==='variable'){ baseVal=avgVar; baseLabel='variabele lasten'; }
  else { baseVal=avgSpend; baseLabel='maanduitgave'; }
  // Richting A: het buffer-doel volgt de crisis-noodfonds (één bron). Oude formule alleen nog als terugval bij lege data.
  let nfDoel=0; try{ nfDoel=Math.round(noodfondsModel().doel||0); }catch(_){}
  const goal = nfDoel>0 ? nfDoel : (basis==='amount' ? (+SET.bufferAmount||0) : baseVal*mult);
  // Het spaardoel meet wat er op je spaarrekening(en) staat (+ handmatig spaargeld), niet je hele saldo:
  // je betaalrekening bevat immers geld voor nog te betalen lasten en is geen buffer.
  const {cur,missing}=spaarSaldo();
  // prioriteit-laag: het #1-item uit Mijn plan bepaalt het doel. Staat het noodfonds bovenaan
  // (de standaard), dan blijven alle cijfers hierboven precies zoals ze waren.
  let plan1=null, planAlloc=0;
  // bereikte of gepauzeerde items schuiven door: de hero toont waar je spaarruimte nú heen gaat
  try{ const P=allocatePlan(); plan1=P.find(x=>x.status!=='bereikt'&&x.status!=='gepauzeerd')||P[0]||null; if(plan1) planAlloc=plan1.alloc; }catch(_){}
  let goal2=goal, cur2=cur, missing2=missing, src=(nfDoel>0?'nood':'formule');
  if(plan1 && plan1.type!=='noodfonds'){
    goal2=Math.max(Math.round(plan1.doel),0); cur2=Math.max(Math.round(plan1.gespaard),0); missing2=false; src='plan';
  }
  const rate=planAlloc>0?planAlloc:monthlySaving;
  const pct=goal2>0?Math.min(cur2/goal2*100,100):0;
  const toGo=Math.max(goal2-cur2,0);
  const monthsLeft= src==='plan' ? (rate>0? toGo/rate : 0) : (monthlySaving>0? toGo/monthlySaving : 0);
  return {inc,room,monthlySaving,avgSpend,avgFixed,avgVar,basis,mult,baseVal,baseLabel,goal:goal2,goalSrc:src,cur:cur2,missing:missing2,pct,toGo,monthsLeft,
          planItem:plan1,planAlloc:rate,planNaam:plan1?plan1.naam:''};
}

/* ---- Fresh start (MECHANISM_SPEC.freshStart): één rustig vooruitblik-moment bij een nieuwe maand.
 * Kijkt vooruit, nooit terug. Eén keer per maand, makkelijk weg te tikken, "niet nu" zonder gevolg. ---- */
function nowYMstr(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
function freshStartDue(){
  const ym=nowYMstr();
  if(SET.freshStartSeen===ym) return false;            // deze maand al begroet of weggetikt
  if(SET.demoMechanismen) return true;                 // demo: tonen tot je 'm wegtikt
  if(!TX.length) return false;                         // niet voor een lege app
  if(new Date().getDate()>7) return false;             // alleen het frisse-start-venster (eerste week)
  return months().filter(m=>m<ym).length>0;            // alleen als er een vorige maand met data was
}
function freshStartCard(){
  const now=new Date(); const mn=MFULL[now.getMonth()]; const cap=mn.charAt(0).toUpperCase()+mn.slice(1);
  let nood=''; try{ const M=noodfondsModel(); if(M&&M.spaar!=null) nood=` Je noodfonds staat op ${euro0(M.spaar)}.`; }catch(_){}
  /* v174: "Je speelruimte staat weer vol" stond boven een negatieve Veilig te besteden, en bij een
     leeg noodfonds boven "Je noodfonds staat op €0". De kaart kent de stand nu en constateert in
     beide richtingen even neutraal: geen aanmoediging bij een tekort, geen alarm bij een goede
     stand. Geen nieuwe berekening; safeToSpend() is dezelfde bron als de hero eronder. */
  let S=null; try{ S=safeToSpend(); }catch(_){}
  const bekend=!!(S && S.known>0);
  const krap=bekend && S.safe<0;
  const opening = !bekend ? `${cap} is begonnen.`

  const catOpts=Object.keys(CATS).filter(k=>CATS[k].type==='expense').map(k=>`<option value="${k}">${esc(CATS[k].name)}</option>`).join('');
  return `<div class="card" style="border-left:3px solid var(--teal);border-radius:0 16px 16px 0;padding:16px 15px">
    <div style="font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--teal);font-weight:600">Nieuwe maand</div>
    <div style="font-size:var(--fs-lg);font-weight:700;line-height:1.35;margin:9px 0 4px">${opening}${nood}</div>
    <div class="small muted" style="line-height:1.5">Wat wil je deze maand anders doen? Eén voornemen is genoeg.</div>
    <input id="freshVoornemen" placeholder="Bijv. minder vaak bestellen bij uit eten" style="width:100%;margin-top:12px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font:inherit;font-size:13px;box-sizing:border-box" />
    <span id="freshCoupleLink" onclick="freshToggleCouple()" style="color:var(--teal);font-size:var(--fs-sm);font-weight:600;cursor:pointer;margin-top:10px;display:inline-block">+ Koppel aan een bedrag &amp; categorie (optioneel)</span>
    <div id="freshCouple" style="display:none;margin-top:8px">
      <div style="font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:6px 0 5px">Onder bedrag (€)</div>
      <input id="freshBedrag" type="number" inputmode="numeric" placeholder="150" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font:inherit;font-size:13px;box-sizing:border-box" />
      <div style="font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:10px 0 5px">Bij categorie</div>
      <select id="freshCat" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font:inherit;font-size:13px;box-sizing:border-box">${catOpts}</select>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button style="flex:1;background:var(--teal-d);color:#fff;border:none;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer" onclick="freshStartSave()">Zet mijn voornemen</button>
      <button style="width:92px;background:transparent;border:none;color:var(--mut);font:inherit;font-weight:600;cursor:pointer" onclick="freshStartDismiss()">Niet nu</button>
    </div>
  </div>`;
}

function freshStartDismiss(){ SET.freshStartSeen=nowYMstr(); const v=SET.maandVoornemen; if(v && v.ym<nowYMstr()) SET.voornemenReflectedFor=v.ym; save(); renderDash(); }

function voornemenCarry(){ const v=SET.maandVoornemen; const ym=nowYMstr(); if(v&&!v.__demo){ SET.maandVoornemen={ym,text:v.text,cat:v.cat,bedrag:v.bedrag}; SET.voornemenReflectedFor=ym; } SET.freshStartSeen=ym; save(); renderDash(); toast(`${ICON('check')} Meegenomen naar ${capMonth(ym)}`); }

// ===== HOME (N26-stijl): één kerngetal, platte stats, één coachregel + CTA, recente transacties =====
function renderDash(){
  // ---- HERO: het saldo, groot, zonder kader ----
  const S2=safeToSpend(); const sWarn=S2.missing>0;
  // Geen bekend saldo (bv. vlak na een pure bestand-import): dan is het saldo onbekend, geen stellige \u20ac0,00.
  const balKnown=S2.known>0;
  // Rustig-modus: een tekort blijft zichtbaar, maar niet als groot alarmrood getal. Spiegel, gevolg, keuze.
  const krapRustig=isMode('rustig') && S2.safe<0;
  const safeCol=krapRustig?'var(--amber)':(S2.safe<0?'var(--red)':'var(--teal)');
  /* v174: de volgende stap stond alleen in Rustig, dus Begeleid en Expert kregen het rode getal
     zonder uitweg - precies omgekeerd aan wat die modusnamen beloven. Zelfde zin, zelfde route,
     alleen de aanhef verschilt: Rustig dempt het getal en zegt er iets bij, de andere modi tonen
     het getal en krijgen dezelfde stap. */
  const krapNote=(S2.safe<0 && balKnown)
    ? `<div style="font-size:var(--fs-sm);color:var(--mut);margin-top:8px">${krapRustig?'Je zit deze maand krap. ':''}E\u00e9n potje geeft je grip op waar het heen gaat. <span style="color:var(--teal);cursor:pointer;font-weight:600;white-space:nowrap" onclick="openPotjePick()">Maak potje \u203a</span></div>`
    : '';
  // Zonder \u00e9\u00e9n bekend saldo rekent safeToSpend met 0. Dat getal dan groot tonen is even onwaar als "totaal saldo \u20ac0,00":
  // het hoofdgetal gaat mee in de onbekend-staat, met de saldo-invoer als volgende stap. De berekening blijft ongemoeid.
  const hero = balKnown
    ? `<div class="homehero">
    <div class="hh-lbl">${jrg('veiligtebesteden','Veilig te besteden')}</div>
    <div class="hh-big${safeCol==='var(--teal)'?' grad':''}" style="${safeCol==='var(--teal)'?'':`color:${safeCol};`}cursor:pointer" onclick="openSafeToSpend()">${euro0(S2.safe)}</div>
    <div style="font-size:var(--fs-sm);color:var(--mut);margin-top:4px;cursor:pointer;display:inline-block" onclick="openBalances()">totaal saldo ${euro0(S2.saldo)} <span style="color:var(--teal)">\u203a</span></div>
    ${vrijPerDagLine()}
    ${krapNote}
  </div>`
    : `<div class="homehero" style="cursor:default">
    <div class="hh-lbl">${jrg('veiligtebesteden','Veilig te besteden')}</div>
    <div class="hh-big" style="color:var(--mut);font-size:26px;letter-spacing:-.4px">onbekend</div>
    <div style="font-size:var(--fs-sm);color:var(--mut);margin-top:4px;cursor:pointer;display:inline-block" onclick="openSaldoInvoer()">totaal saldo <b style="color:var(--mut)">onbekend</b> <span style="color:var(--teal);font-weight:600">vul je saldo aan \u203a</span></div>
    <div style="font-size:var(--fs-sm);color:var(--mut);margin-top:8px;max-width:34em">Je transacties zijn binnen, je saldo nog niet: een bestand bevat dat niet. Zolang we niet weten wat er op je rekening staat, kunnen we ook niet zeggen wat er vrij is. Je uitgaven en potjes werken gewoon.</div>
  </div>`;
  // ---- recente transacties: kale lijst ----
  const recent=TX.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const txRows=recent.map(x=>{const c=CATS[catOf(x)];const d=new Date(x.date).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
    return `<div class="txl" onclick="openSheet('${x.id}')"><div class="ava" style="background:var(--card2);color:var(--mut)">${c.icon}</div><div class="info"><div class="nm">${esc(x.name)}</div><div class="cat">${d} · ${c.name}</div></div><div class="amt ${x.amount>0?'pos':'neg'}">${x.amount>0?'+':''}${euro(x.amount)}</div></div>`;}).join('');
  const recentBlock = recent.length?`<div class="homelist"><div class="hl-head"><span>Recent</span><span class="hl-all" onclick="go('tx')">Alle transacties ›</span></div>${txRows}</div>`:'';
  let modeTop='', modeBot='';
  try{
    if(isMode('rustig')){ const _ms=months(); const _cur=totals(_ms[_ms.length-1]).spend; const _prev=_ms.length>1?totals(_ms[_ms.length-2]).spend:null; const _t=(_prev!=null&&_cur<_prev)?'Je geeft het rustiger aan dan vorige maand.':'Stap voor stap. Je houdt het overzicht.'; modeTop=`<div class="small muted" style="margin:2px 2px 12px">${_t}</div>`; }
    else if(isMode('expert')){ const _ms=months(); const _tt=totals(_ms[_ms.length-1]); modeBot=`<div class="small muted" style="margin:10px 2px 0">deze maand · uit ${euro0(_tt.spend)} · in ${euro0(_tt.income)}</div>`; }   // saldo stond hierboven al
  }catch(_){ }
  $('#s-dash').innerHTML = renderReminder() + (freshStartDue()?(freshStartReflection()+freshStartCard()):'') + modeTop + hero + vermogenCard() + recentBlock + modeBot;
}
function adjustSaveTarget(d){

function laatsteImport(){
  if(!TX.length) return null;
  const datum=TX.reduce((a,b)=>a.date>b.date?a:b).date;
  return {datum, dagen:Math.floor((Date.now()-new Date(datum))/86400000)};
}
// dezelfde tik als de herinnering: één ingang om je data bij te werken, geen tweede CTA-patroon

function jrg(key,label){ const u=JARGON[key]; if(!u) return label;
  return `<span class="jrg" tabindex="0" role="button" aria-label="Uitleg: ${esc(u)}" onclick="showTip(event,'${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){showTip(event,'${key}')}">${label}</span>`; }
function showTip(e,key){
  const u=JARGON[key]; if(!u) return;
  try{ e.preventDefault(); e.stopPropagation(); }catch(_){}                 // niet de <details> eronder open-/dichtklappen
  let p=document.getElementById('tipPop');
  if(!p){ p=document.createElement('div'); p.id='tipPop'; p.setAttribute('role','tooltip'); document.body.appendChild(p); }
  p.textContent=u; p.className='show'; window._tipTs=Date.now();
  // Een tik zet ook focus, en de browser kan de term dan net in beeld scrollen. Daarom plaatsen we
  // de popover nog een keer in de volgende frame (anders staat hij scheef) en negeert de
  // scroll-sluiter die ene eigen scroll (anders klapt de uitleg meteen weer dicht).
  const el=e.currentTarget||e.target;
  const plaats=()=>{
    const r=el.getBoundingClientRect();
    const w=Math.min(260,window.innerWidth-24); p.style.width=w+'px';
    p.style.left=Math.max(12,Math.min(r.left,window.innerWidth-w-12))+'px';
    const h=p.offsetHeight;
    p.style.top=((r.bottom+8+h>window.innerHeight)?Math.max(12,r.top-h-8):(r.bottom+8))+'px';
  };
  plaats(); try{ requestAnimationFrame(plaats); }catch(_){}
}
function hideTip(){ try{ const p=document.getElementById('tipPop'); if(p) p.className=''; }catch(_){} }

function cleanMerch(s){ return (s||'').replace(/\s+/g,' ')
  .replace(/^\s*(BEA|GEA|ECOM)[, ]*/i,'')
  .replace(/\b(GOOGLE PAY|APPLE PAY|BETAALPAS|CONTACTLOOS|VIA TIKKIE)\b/gi,'')
  .replace(/\bNR[: ].*$/i,'')
  .replace(/\b(B\.?V\.?|N\.?V\.?|PURMEREND|PURME|AMSTERDAM|ZAANDAM|WEERWAL|KOOIMANPLEIN|HOUTEN|DE MEERN)\b/gi,'')
  .replace(/BCK\*|CCV\*|SUMUP ?\*|ZTL\*/gi,'')
  .replace(/[^A-Za-z0-9 &.\-]/g,'').replace(/\s+/g,' ').trim(); }
function titleCase(s){ return s.replace(/\b([A-Z])([A-Z0-9]+)\b/g,(m,a,b)=>a+b.toLowerCase()); }
function groupMerch(items){ const by={}; for(const x of items){ const disp=cleanMerch(x.name)||'Overig'; const key=disp.toUpperCase(); (by[key]=by[key]||{name:titleCase(disp),n:0,s:0}); if(x.amount<0) by[key].n++; by[key].s+=-x.amount; } return Object.values(by).sort((a,b)=>b.s-a.s); }   // n telt afschrijvingen; s is netto (terugstorting verrekend)

/* ---- Loss-aversion dosering: state + helpers (MECHANISM_SPEC.lossAversion) ----
 * Een loss-frame is een discretionair stakes-signaal (potje over, tempo, vices,
 * ongewoon grote uitgave, spaardoel-risico). Liquiditeitsalarmen (lowbal/accshort)
 * en positieve noten vallen hier NADRUKKELIJK buiten: dat is geen loss aversion.
 * Doel: hooguit maxFramesPerDag per dag, nooit gestapeld, zodat de app geen
 * uitgaven-angst traint. lossFrames = {ymd, n, keys} houdt de dagteller bij. */
const LOSS_GROUPS=new Set(['budget','tempo','discr','big','save']);   // 'discr' verving de oude vices-melding
function isLossFrame(key){ return LOSS_GROUPS.has(String(key||'').split('-')[0]); }
function lossFramesToday(){ const d=vandaagYMD(); const lf=SET.lossFrames; return (lf&&lf.ymd===d)?(+lf.n||0):0; }
function noteLossSeen(key){ if(!isLossFrame(key)) return; const d=vandaagYMD(); let lf=SET.lossFrames;
  if(!lf||lf.ymd!==d){ lf=SET.lossFrames={ymd:d,n:0,keys:{}}; } lf.keys=lf.keys||{};
  if(!lf.keys[key]){ lf.keys[key]=1; lf.n=(+lf.n||0)+1; } }
/* ---- Mental accounting: stilstaand surplus boven de heilige buffer vs. dure schuld (MECHANISM_SPEC.mentalAccounting) ----
 * De noodbuffer = SET.buffer (de liquiditeitsondergrens, de rode lijn). Die is HEILIG: alleen het
 * bedrag dat BOVEN de buffer stilstaat telt mee, en de app stelt nooit voor de buffer leeg te halen.
 * Goedkope schuld (lage rente) vuurt niet; alleen wanneer de rente de spaaropbrengst met
 * minRenteVerschil overstijgt en er minstens minBedrag stilstaat boven de buffer. */
function noodbuffer(){ return Math.max(+SET.buffer||0,0); }
function stilstaandSurplus(){ try{ const s=totalSaved(); if(s.missing) return null; return Math.max(Math.round(s.sum - noodbuffer()),0); }catch(_){ return null; } }
function duursteSchuld(){ const ds=(SET.debts||[]).filter(d=>(+d.rest>0)&&(+d.rente>0)); if(!ds.length) return null; ds.sort((a,b)=>(+b.rente)-(+a.rente)); return ds[0]; }
function mentalAccountingSignal(){
  const C=MECHANISM_SPEC.mentalAccounting.condities;
  const surplus=stilstaandSurplus(); if(surplus==null || surplus<(C.minBedrag||50)) return null;   // niets stilstaand boven de buffer
  const d=duursteSchuld(); if(!d) return null;
  const spaarRente=(+SET.spaarRente||0)/100;                                   // standaard 0% (nulrente-potje)
  if(((+d.rente)/100 - spaarRente) < (C.minRenteVerschil||0.05)) return null;   // goedkope schuld: niet vuren
  const inzet=Math.min(surplus, Math.max(+d.rest||0,0));
  const renteJaar=Math.round(inzet*((+d.rente)/100 - spaarRente));
  return {surplus, debt:d, inzet, renteJaar};
}

function projVarEstimate(){
  const now=new Date(); const cm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const vals=months().filter(ym=>ym!==cm).map(ym=>splitFixedVar(ym).vari).filter(v=>v>0).sort((a,b)=>a-b); // partiële huidige maand uitgesloten

// grootste lek, gestructureerd (voor de coach-dialoog): échte impuls vs noodzaak-zonder-potje vs over-budget
function noPotLeak(m){   // grootste NETTO uitgave per winkel zonder potje, gesplitst in impuls vs vaste behoefte (gedeeld door coachLeak/coachSandwich/coachWeekRisk)
  let EB={}; try{ EB=effectiveBudgets(m).out; }catch(_){}
  const byM={};
  for(const x of txOfMonth(m)){
    if(!(isExpenseTx(x) && !isFixed(x))) continue;
    if(+EB[catOf(x)]>0) continue;                        // categorie heeft al een potje → valt onder budget-logica
    const nm=titleCase(cleanMerch(x.name)||x.name||'een aankoop');
    const e=(byM[nm]=byM[nm]||{name:nm,net:0,k:catOf(x),rec:isRecurringMerchant(x.name)});
    e.net+=-x.amount;                                    // netto: terugstorting verrekent per winkel
  }
  let imp=null, need=null;
  for(const nm in byM){ const e=byM[nm]; if(e.net<25) continue;
    if(!isFixedCat(e.k) && !e.rec){ if(!imp||e.net>imp.amt) imp={amt:Math.round(e.net),name:e.name,k:e.k}; }   // echte impuls: discretionair, niet terugkerend, zonder potje
    else { if(!need||e.net>need.amt) need={amt:Math.round(e.net),name:e.name,k:e.k}; }                          // noodzaak / terugkerend zonder potje
  }
  return {imp,need};
}
function coachLeak(m){
  const {imp,need}=noPotLeak(m);
  // grootste lek ZONDER potje (de hele uitgave wijkt af van plan, want er was geen plan)
  let noPot=null;
  if(imp && need) noPot = (imp.amt>=need.amt) ? {kind:'impulse',name:imp.name,amount:imp.amt,cat:imp.k} : {kind:'missing-pot',name:need.name,amount:need.amt,cat:need.k};
  else if(imp) noPot={kind:'impulse',name:imp.name,amount:imp.amt,cat:imp.k};
  else if(need) noPot={kind:'missing-pot',name:need.name,amount:need.amt,cat:need.k};
  // grootste overschrijding MÉT potje (alleen het deel boven budget wijkt af)
  const ov=(typeof budgetOverCat==='function')?budgetOverCat(m):null;
  const over = ov ? {kind:'over-budget',name:CATS[ov.k].name,amount:Math.round(ov.over),cat:ov.k} : null;
  // hybride: het grootste verschil in euro's wint
  if(noPot && over) return over.amount>noPot.amount ? over : noPot;
  return noPot || over || null;
}

  const mode=window._goalMode||'auto';
  const oud=(SET.goals||[]).find(x=>x.id===id)||{};
  const sd=String(v('gDatum')||'').trim();
  const g={id:id||('g'+Date.now().toString(36)), naam, doel, gespaard:Math.round(+v('gNu')||0), allocMode:mode,
    perMaand: mode==='fixed' ? Math.round(+v('gMnd')||0) : (+oud.perMaand||0),      // bewaren, niet wissen bij een moduswissel
    pct:      mode==='pct'   ? Math.max(0,Math.min(100,Math.round(+v('gPct')||0))) : (+oud.pct||0) };
  if(/^\d{4}-(0[1-9]|1[0-2])$/.test(sd)) g.streefdatum=sd;      // leeg of onzin: sleutel blijft weg (v123)
  SET.goals=SET.goals||[]; const i=SET.goals.findIndex(x=>x.id===id);
  if(i>=0) SET.goals[i]=g; else SET.goals.push(g);
  save(); closeSheet(); render(); toast(`${ICON('check')} Doel opgeslagen`);
}
function deleteGoal(id){ SET.goals=(SET.goals||[]).filter(x=>x.id!==id); planForget(id); save(); closeSheet(); render(); }

/* ============================================================
   PLAN-LAAG · prioriteit + waterfall
   Dunne laag over het bestaande noodfonds, SET.goals en SET.debts: SET.planOrder bepaalt de
   volgorde, SET.planPaused wat even stilligt. Geen enkele onderliggende berekening verandert;
   het noodfonds is hier één herordenbaar item i.p.v. het hardgecodeerde hoofddoel.
   ============================================================ */
const PLAN_NF='noodfonds';
const planDebtKey=id=>'af:'+id;
function planOrderList(){ return Array.isArray(SET.planOrder)?SET.planOrder.filter(x=>typeof x==='string'):[]; }
function planPaused(id){ return !!(SET.planPaused||{})[id]; }
function planForget(id){ if(SET.planOrder) SET.planOrder=planOrderList().filter(x=>x!==id); if(SET.planPaused) delete SET.planPaused[id]; }

// alle mogelijke plan-items, genormaliseerd (nog zonder volgorde)
// Verdeelmodus per plan-item. Doelen dragen 'm zelf (g.allocMode/perMaand/pct); noodfonds en
// aflos-items hebben geen eigen record, die staan in SET.planAlloc[id]. Eén genormaliseerde vorm
// {mode, perMaand, pct} zodat de allocatie-engine maar één ding hoeft te kennen.
// Terugval: een bestaand doel met perMaand > 0 en zónder modus blijft 'fixed' — anders zou een
// oud doel na deze update ineens de hele spaarruimte opslokken.
function planAllocOf(o){
  const mode=o&&o.allocMode;
  const per=Math.max(Math.round(+((o||{}).perMaand)||0),0);
  const pct=Math.max(+((o||{}).pct)||0,0);
  if(mode==='fixed'||mode==='pct'||mode==='auto') return {mode,perMaand:per,pct};
  return {mode:per>0?'fixed':'auto', perMaand:per, pct};
}
function planAllocCfg(id){ return ((SET.planAlloc||{})[id])||{}; }
function setPlanAlloc(id,patch){
  SET.planAlloc=SET.planAlloc||{}; SET.planAlloc[id]=Object.assign({},SET.planAlloc[id]||{},patch);
  save(); try{render();}catch(_){}
}
function planMap(){
  const by={};
  let nfDoel=0; try{ nfDoel=Math.round(noodfondsModel().doel||0); }catch(_){}
  /* v172: het noodfonds las hier zijn voortgang uit spaarSaldo(), terwijl een spaardoel zijn
     voortgang uit een handmatig veld haalt. Twee herkomsten in dezelfde kolom, en spaarOver()
     bestond alleen om het verschil te melden dat daaruit ontstond. Nu is elke voortgang in het
     plan een TOEGEWEZEN bedrag, ook die van het noodfonds. De gemeten buffer blijft bestaan waar
     hij thuishoort: bufferMaanden() en de bufferregel op Maand lezen onverkort spaarSaldo(). */
  const nfToe=Math.max(Math.round(+SET.nfToegewezen||0),0);
  /* v173: zonder bekend spaarsaldo heeft migrateNfToegewezen() nooit kunnen draaien, dus die 0 is
     geen toewijzing van jou maar een gat. Een voortgang, een tempo en een einddatum die daarop
     gerekend zijn liegen; de rij zwijgt dan over alle drie. */
  const nfOnbekend=(function(){ if(SET.nfToegewezenMigrated) return false;
    try{ return !!spaarSaldo().missing; }catch(_){ return true; } })();
  by[PLAN_NF]=Object.assign({id:PLAN_NF,type:'noodfonds',naam:'Noodfonds',doel:nfDoel,nfOnbekend,
    gespaard:nfDoel>0?Math.min(nfToe,nfDoel):nfToe}, planAllocOf(planAllocCfg(PLAN_NF)));
  for(const g of (SET.goals||[])) if(g&&g.id)
    by[g.id]=Object.assign({id:g.id,type:'goal',naam:g.naam||'Doel',doel:+g.doel||0,gespaard:+g.gespaard||0,
             streefdatum:g.streefdatum||''}, planAllocOf(g));   // v123: leeg = gedraagt zich als voorheen
  // aflos-items bestaan alleen als ze in de volgorde staan; de schuld zelf blijft onaangeroerd
  for(const key of planOrderList()){
    if(key.slice(0,3)!=='af:') continue;
    const d=(SET.debts||[]).find(x=>String(x.id)===key.slice(3)); if(!d) continue;     // schuld verwijderd -> item vervalt
    const rest=Math.max(+d.rest||0,0), start=Math.max(+d.start||0,0);
    const doel=start>rest?start:rest;
    by[key]=Object.assign({id:key,type:'aflossen',naam:'Aflossen: '+(d.naam||'schuld'),doel,gespaard:Math.max(doel-rest,0),
             debtId:String(d.id),rest,rente:+d.rente||0,debtPer:+d.perMaand||0}, planAllocOf(planAllocCfg(key)));
  }
  return by;
}
/* Terugrekenen vanaf een streefdatum (v123).
   allocatePlan() rekent van bedrag en tempo naar een datum (eta = ceil(rest/alloc)). Dit is de
   andere richting: je geeft een maand op en de app zegt wat je dan per maand nodig hebt en hoeveel
   dat scheelt met wat er nu heen gaat. Puur, zonder state en zonder afronding naar iets
   optimistischers: benodigd rondt naar boven af, want een tekort van een halve euro per maand is
   nog steeds een tekort. null betekent: hier valt niets over te zeggen. */
function doelMaandenTot(ym){
  const m=/^(\d{4})-(\d{2})$/.exec(String(ym||'')); if(!m) return null;
  const mo=+m[2]; if(mo<1||mo>12) return null;
  const nu=new Date();
  return (+m[1]-nu.getFullYear())*12 + (mo-(nu.getMonth()+1));
}
function doelDatumLabel(ym){
  const m=/^(\d{4})-(\d{2})$/.exec(String(ym||'')); if(!m) return '';
  const mo=+m[2]; if(mo<1||mo>12) return '';
  return MFULL[mo-1]+' '+m[1];
}
function doelTempo(goal, alloc){
  const g=goal||{};
  const maandenTot=doelMaandenTot(g.streefdatum);
  if(maandenTot==null || maandenTot<=0) return null;             // geen datum, of verstreken
  const rest=(g.rest!=null)?Math.max(Math.round(+g.rest||0),0)
                           :Math.max(Math.round((+g.doel||0)-(+g.gespaard||0)),0);
  if(rest<=0) return null;                                        // al bereikt: niets terug te rekenen
  const benodigd=Math.ceil(rest/maandenTot);
  const gat=benodigd-Math.max(Math.round(+alloc||0),0);
  return {maandenTot, benodigd, gat, haalbaar:gat<=0};
}
/* De zin eromheen: spiegel (wat je nu doet), gevolg (wat de datum vraagt), keuze (het verschil).
   Geen oordeel, geen aanmoediging. Spreekt eta niet tegen: beide lezen dezelfde rest en alloc,
   dus "haalbaar" betekent per definitie dat eta binnen het aantal maanden past. */
function doelTempoLine(p){
  if(!p || p.type!=='goal' || !p.streefdatum) return '';
  if(p.status==='gepauzeerd') return '';
  const lbl=doelDatumLabel(p.streefdatum); if(!lbl) return '';
  const rest=(p.rest!=null)?p.rest:Math.max(Math.round((+p.doel||0)-(+p.gespaard||0)),0);
  if(rest<=0) return '';                                          // bereikt: geen tempo-regel
  const n=doelMaandenTot(p.streefdatum);
  const wrap=t=>`<div class="doel-tempo small" style="margin-top:6px;color:var(--mut2);line-height:1.45">${t}</div>`;
  if(n<=0) return wrap(`Je streefdatum ${lbl} is verstreken. Er wordt hier niets meer teruggerekend.`);
  const T=doelTempo(p, p.alloc); if(!T) return '';
  const bedrag=(rest===Math.round(+p.doel||0))?euro0(p.doel):`de resterende ${euro0(rest)}`;
  if(!(p.alloc>0)) return wrap(`Er gaat op dit moment niets naar dit doel. Voor ${bedrag} in ${lbl} heb je ${euro0(T.benodigd)} per maand nodig.`);
  if(T.haalbaar){
    const sp=(p.eta!=null)?(T.maandenTot-p.eta):null;
    const staart=(sp!=null&&sp>0)?`, met ${sp} ${sp===1?'maand':'maanden'} speling`:(sp===0?', precies op de datum':'');
    return wrap(`Je huidige inleg haalt de datum${staart}.`);
  }
  return wrap(`Je legt nu ${euro0(p.alloc)} per maand in. Voor ${bedrag} in ${lbl} heb je ${euro0(T.benodigd)} per maand nodig. Je komt ${euro0(T.gat)} per maand tekort.`);
}
/* ---------- MAANDSCHERM (v130) ----------
   Eén scherm dat je één keer per maand opent, met de vijf getallen die samen zeggen of je
   geldsysteem gezond is. De samenhang is het punt: 60% dekking betekent iets anders naast een
   buffer van zes maanden dan naast een buffer van één.
   Dit scherm REKENT NIETS ZELF. Het roept bestaande functies aan, stelt hun uitkomsten samen en
   sorteert ze. Valt een bron weg, dan valt die regel weg - zonder foutmelding en zonder
   placeholder; het scherm werkt met drie van de vijf. */
/* v173: "Er ontbreekt te veel om een oordeel te geven" vuurde bij één onbekende regel van één.
   Een zuiver aandeel kan dat niet oplossen (100% ligt boven elke drempel), dus er hoort een
   ondergrens bij: onder onbekendMin regels zegt een verhouding niets over volledigheid, en dan
   meldt het scherm gewoon de regels die het wél heeft. */
const MAAND_DREMPEL = { bufferKritiek:3, dekkingOk:100, doelOk:0, kpiMinBedrag:100, structureelStatus:'tekort',
  onbekendDeel:0.5, onbekendMin:3 };   // v162: een patroon over maanden vraagt een beslissing, geen aandacht   // kpiMinBedrag: onder dit grondtal zegt een percentage niets (v161)
/* v155: de meevallerdrempel stond als kaal 1.15 op drie plekken. Eén naam, dezelfde waarde, zodat
   de verdeelregel niet zijn eigen drempel krijgt. Geen gedragswijziging. */
const MEEVALLER_FACTOR = 1.15;   // de rest volgt nfMaanden()
const MAAND_PATROON = ['budget-','discr-','tempo'];                    // uitgavenpatronen; geen incasso's, geen saldo-nudges
const MAAND_VOLGORDE = ['dekking','buffer','aansluiting','doel','patroon'];
const MAAND_ERNST = {tekort:0, 'let op':1, ok:2, onbekend:3};

/* De enige nieuwe som op dit scherm, en met opzet niet meer dan een deling van twee bestaande
   uitkomsten: hoeveel maanden essentiële crisis-last dekt je spaargeld? null zodra een van beide
   ontbreekt - nooit een schatting (v59/v73). */
function bufferMaanden(){
  let ess=0, sp=null;
  try{ const M=noodfondsModel(); ess=Math.round(M.essCrisis||0); sp=(M.spaar!=null)?Math.round(M.spaar):null; }catch(_){ return null; }
  if(sp==null||!(ess>0)) return null;
  return sp/ess;
}
// het patroon-signaal met de hoogste score, of null
function maandPatroon(){
  try{ return (scoreNotifs()||[])
    .filter(n=>n&&n.key&&MAAND_PATROON.some(p=>String(n.key).indexOf(p)===0))
    .sort((a,b)=>(b.score||0)-(a.score||0))[0]||null; }catch(_){ return null; }
}
// het eerste doel in het plan met een streefdatum
function maandDoel(){
  try{ const P=allocatePlan();
    const p=P.find(x=>x.type==='goal'&&x.streefdatum&&x.status!=='bereikt'&&x.status!=='gepauzeerd');
    if(!p) return null; const T=doelTempo(p,p.alloc); return T?{p,T}:{p,T:null};
  }catch(_){ return null; }
}
/* Structurele signalen op het maandscherm (v162). Een patroon over meerdere maanden hoort bij het
   maandmoment, niet in een lijst die je dagelijks wegtikt. Ze lopen mee als gewone regel: dezelfde
   vorm, dezelfde statusdot, dezelfde sortering, zodat er één lijst ontstaat en geen tweede blok.
   Ze verdwijnen pas als de situatie is opgelost of als je ze expliciet wegzet. Een lopende snooze
   telt hier bewust niet - die was voor de meldingenlijst bedoeld - maar 'Niet meer tonen' geldt
   onverkort, want dat is een keuze en geen uitstel.
   v168: hier stond een onderdrukking op SET.maandGelezen. Die maakte het scherm onbetrouwbaar: het
   openen zette de vlag, dus de tweede keer binnen dezelfde dag verscheen een ander oordeel zonder
   dat er iets was veranderd. De gelezen-vlag mag bepalen of je een herinnering krijgt om dit scherm
   te openen; hij mag nooit bepalen wat erop staat. Een tweede plek was hij ook niet nodig: deze
   signalen staan per v162 al buiten notifList(), want NOTIF_HORIZON laat alleen direct en correctie
   door. Er viel dus niets te onderdrukken. */
/* v175: MAAND_DREMPEL.structureelStatus duwde elk structureel signaal naar 'tekort', ook de
   info-variant. Daardoor trok een neutrale observatie de oordeelzin naar 'er is iets dat vastloopt';
   dat is het scherm luider maken dan de werkelijkheid. De engine draagt de zwaarte al in n.t, dus
   die wordt nu gelezen in plaats van weggegooid.
   Twee bestemmingen, geen derde: een blokkade landt in 'vraagt een beslissing' (tekort), een
   observatie in 'vraagt aandacht' (let op). Past een signaal in geen van beide, maak er dan geen
   lichtere status voor maar stel de vraag of het signaal nog nodig is - een derde categorie zou
   nergens meer opvallen. structureelStatus blijft de terugval voor een onbekende t. */
const STRUCT_STATUS={bad:'tekort', warn:'tekort', info:'let op'};
function maandStructureel(){
  try{
    return (scoreNotifs({negeerSnooze:true})||[])
      .filter(n=>n && n.h==='structureel')
      .map(n=>({key:n.key, naam:String(n.l1||'').replace(/<[^>]*>/g,'').slice(0,42),
        status:STRUCT_STATUS[n.t]||MAAND_DREMPEL.structureelStatus, waarde:'', eenheid:'',
        gevolg:'',                                   // was dezelfde zin als naam
        act:n.act||"go('ins')", sig:n, structureel:true}));
  }catch(_){ return []; }
}
/* De vijf regels. Elke bron in zijn eigen try: gooit er een, dan valt alleen die regel weg. */
function maandRegels(){
  const uit=[];
  // 1. dekking
  try{ const D=dekking(12);
    if(D && D.aantal>0){
      /* v131: graad kan null zijn zonder dat er iets onbekend is. Bij een eenmalige post, of een
         jaarpost die nog twaalf maanden of verder weg ligt, is benodigdeStand nul en is er dus geen
         percentage te delen - maar er hoeft dan ook niets opgebouwd te zijn. Eerder las dit als
         'onbekend' met status tekort. De vraag van deze regel is "ben ik gedekt", dus het gat weegt
         mee: is er een voorkomen dat niet meer past, dan is het tekort, ook als de opbouw op peil is. */
      const st = !D.volledig ? 'onbekend'
               : (D.gat || (D.graad!=null && D.graad<MAAND_DREMPEL.dekkingOk)) ? 'tekort' : 'ok';
      const komt = D.regels.some(r=>r.soort==='post');   // valt er dit jaar iets binnen de horizon?
      uit.push({key:'dekking', naam:'Dekking reserveringen', status:st,
        // v132: bij een tekort horen het percentage en het bedrag allebei zichtbaar te zijn, met de
        // noemer erbij - anders staat hetzelfde woord voor twee verschillende verhoudingen.
        waarde: !D.volledig ? 'onbekend'
              : D.graad!=null ? (D.graad+'%')
              : (D.gat && D.gat.gedektPct!=null) ? (D.gat.gedektPct+'%')
              : D.gat ? euro0(D.gat.tekort)
              : komt ? 'op peil' : 'geen',
        // v133: de eenheid staat in een smalle kolom, dus kort houden. Het tekortbedrag staat al in
        // de zin ernaast zodra er een gat is; alleen zonder gat noemen we het hier.
        eenheid: !D.volledig ? 'niet te beoordelen'
               : D.graad!=null ? `van wat nu nodig is${D.gat?'':` · ${euro0(D.tekort)} tekort`}`
               : D.gat ? 'van de eerstvolgende post'
               : komt ? 'er hoeft nu nog niets opzij' : 'niets aankomend dit jaar',
        maand: (st==='tekort'&&D.gedektTot)?D.gedektTot:null,
        // de zin komt uit dekkingTekst(): die kent alle takken al, inclusief een pot die de
        // eerstvolgende post nu al niet dekt en een lijst waar dit jaar niets uit valt. Hier een
        // eigen variant schrijven zou een tweede formulering van hetzelfde zijn.
        gevolg: dekkingTekst(D),
        tekortPerMaand: st==='tekort'?Math.max(D.tekort,0):0, act:'openReserveringen()'});
    } }catch(_){}
  // 2. buffer
  try{ const bm=bufferMaanden();
    if(bm!=null){
      const richt=nfMaanden();
      const st = bm<MAAND_DREMPEL.bufferKritiek ? 'tekort' : (bm<richt ? 'let op' : 'ok');
      const n=Math.round(bm*10)/10;
      uit.push({key:'buffer', naam:'Buffer in maanden', status:st,
        waarde:String(n).replace('.',',') , eenheid:`maanden op je rekening · je richt staat op ${richt}`,
        gevolg: st==='ok' ? `Je buffer dekt ${String(n).replace('.',',')} maanden essentiële lasten, op of boven je eigen richtbedrag.`
              : st==='let op' ? `Je buffer dekt ${String(n).replace('.',',')} maanden. Je richt staat op ${richt}.`
              : `Je buffer dekt ${String(n).replace('.',',')} maanden essentiële lasten. Onder de drie maanden vangt hij weinig op.`,
        act:'openNoodfondsPanel()'});
    } }catch(_){}
  // 3. aansluiting
  /* v172: de over-helft is vervallen met spaarOver(). Wat overblijft is de vraag die er altijd al
     toe deed: staat er spaargeld dat aan geen enkel item is toegewezen? Sinds het noodfonds ook een
     toewijzing draagt is dit bovendien het enige mechanisme dat je handmatige cijfers bijstuurt. */
  try{ const V=spaarVrij();
    if(V.saved>0){
      const st=V.vrij>0?'let op':'ok';
      uit.push({key:'aansluiting', naam:'Aansluiting spaargeld', status:st,
        waarde: st==='ok'?'sluit aan':euro0(V.vrij), eenheid: st==='ok'?'alles toegewezen':'staat nog niet toegewezen',
        gevolg: st==='ok' ? 'Al je spaargeld is aan een item in je plan toegewezen.'
                          : `Er staat ${euro0(V.vrij)} op je spaarrekening dat aan geen enkel item is toegewezen.`,
        vrij:V.vrij, act:"go('vooruit')"});
    } }catch(_){}
  // 4. aankoopdoel
  try{ const d=maandDoel();
    if(d){
      const T=d.T;
      const st = !T ? 'onbekend' : (T.gat>MAAND_DREMPEL.doelOk ? 'tekort' : 'ok');
      uit.push({key:'doel', naam:d.p.naam||'Aankoopdoel', status:st,
        waarde: T?euro0(T.benodigd):'onbekend', eenheid: T?`per maand nodig · nu ${euro0(d.p.alloc)}`:'geen streefdatum',
        gevolg: !T ? 'Zonder streefdatum valt er niets terug te rekenen.'
              : st==='ok' ? `Je huidige inleg haalt de datum.`
              : `Je legt nu ${euro0(d.p.alloc)} per maand in en je hebt ${euro0(T.benodigd)} nodig. Je komt ${euro0(T.gat)} per maand tekort.`,
        tekortPerMaand: st==='tekort'?T.gat:0, act:`openGoal('${d.p.id}')`});
    } }catch(_){}
  // 5. patroon - alleen als er boekingen zijn om te beschrijven. Zonder data is "er springt deze
  //    maand geen uitgavenpatroon uit" geen vaststelling maar een lege claim, en hield deze regel
  //    in zijn eentje de hele maandsamenvatting overeind.
  try{ if(TX.length){ const n=maandPatroon();
    uit.push({key:'patroon', naam:'Patroon van de maand', status:n?'let op':'ok',
      waarde: n&&n.bedrag!=null?euro0(n.bedrag):(n?'let op':'rustig'), eenheid: n&&n.boven!=null?`${euro0(n.boven)} boven je normaal`:(n?'gesignaleerd':'geen signaal'),
      gevolg: n?String(n.l1||'').replace(/<[^>]*>/g,''):'Er springt deze maand geen uitgavenpatroon uit.',
      sig:n, act:n&&n.act?n.act:"go('ins')"}); }
  }catch(_){}
  return uit.sort((a,b)=>MAAND_VOLGORDE.indexOf(a.key)-MAAND_VOLGORDE.indexOf(b.key));
}
/* ===== De voorwaarden voor beleggen (v154) =====
 * Beleggen hoort met geld dat je op korte termijn niet nodig hebt, en dat is pas zo als drie dingen
 * kloppen: de buffer staat, de bekende toekomstige kosten zijn gedekt, en de concrete geldbehoefte
 * op korte termijn staat apart. Zolang een van die drie niet klopt bestaat dat geld niet, hoe hoog
 * het saldo ook is.
 *
 * Alle drie staan al als losse regel op dit scherm. Deze laag stelt alleen de SAMENSTELLING vast en
 * rekent zelf niets: hij leest de rijen die maandRegels() al opleverde en roept dekking(),
 * bufferMaanden() en doelTempo() dus geen tweede keer aan. De drempels komen uit MAAND_DREMPEL,
 * dezelfde constante die de vijf statussen bepaalt.
 *
 * Buffer haalt de voorwaarde ook bij status 'let op': die stand betekent boven de drie maanden maar
 * onder je eigen richtbedrag, en de voorwaarde is de drie maanden. Bij dekking en doel is 'ok' de
 * enige stand die haalt.
 *
 * KRITIEK - zwijgen bij onvolledigheid. Ontbreekt een van de drie rijen, of staat er 'onbekend',
 * dan is er GEEN uitspraak: geen 'bijna', geen 'waarschijnlijk nog niet', geen gedeeltelijke
 * uitkomst. Een verkeerd groen licht hier kost geld dat binnen een jaar nodig is. */
const BELEGGEN_VOORWAARDEN=[
  {key:'buffer',  label:'buffer',                drempel:()=>`${MAAND_DREMPEL.bufferKritiek} maanden`},
  {key:'dekking', label:'dekking reserveringen', drempel:()=>`${MAAND_DREMPEL.dekkingOk}%`},
  {key:'doel',    label:'',                      drempel:()=>euro0(MAAND_DREMPEL.doelOk)},
];
function beleggenWaarde(key, r){
  if(key==='buffer') return `${r.waarde} maanden`;
  if(key==='doel')   return (r.tekortPerMaand>0)?`${euro0(r.tekortPerMaand)} tekort`:'geen tekort';
  return String(r.waarde);
}
function beleggenKlaar(R){
  const rijen=Array.isArray(R)?R:[];
  const voorwaarden=[]; let volledig=true;
  for(const v of BELEGGEN_VOORWAARDEN){
    const r=rijen.find(x=>x.key===v.key);
    if(!r || r.status==='onbekend'){
      volledig=false;
      voorwaarden.push({key:v.key, naam:v.label||(r?r.naam:v.key), gehaald:false, ontbreekt:true,
        waarde:'onbekend', drempel:v.drempel(), status:'onbekend', eenheid:r?r.eenheid:''});
      continue;
    }
    const gehaald = v.key==='buffer' ? r.status!=='tekort' : r.status==='ok';
    voorwaarden.push({key:v.key, naam:v.label||r.naam, gehaald, ontbreekt:false,
      waarde:beleggenWaarde(v.key,r), drempel:v.drempel(), status:r.status, eenheid:r.eenheid});
  }
  const blokkade=voorwaarden.find(v=>!v.gehaald)||null;   // vaste volgorde: buffer, dekking, doel
  return {klaar: volledig && voorwaarden.every(v=>v.gehaald), voorwaarden, blokkade, volledig};
}
/* Wie geen enkel spaardoel en geen vermogensinstelling heeft, heeft geen beleggingsambitie en
   hoeft deze regel niet te zien. */
function beleggenZichtbaar(){
  try{ return ((SET.goals||[]).length>0) || ((SET.assets||[]).length>0); }catch(_){ return false; }
}
/* De regel op het maandscherm. Stelt vast, raadt niets aan: geen bedrag, geen product, geen
   percentage, geen aanmoediging bij groen. Bij niet-klaar alleen de EERSTE blokkade, want een ding
   tegelijk. De cijfers van de drie regels worden hier niet herhaald - die staan er al los boven;
   in de sheet mag de opbouw wel volledig staan. */
function maandBeleggenRegel(R){
  if(!beleggenZichtbaar()) return '';
  let B=null; try{ B=beleggenKlaar(R); }catch(_){ return ''; }
  if(!B) return '';
  const kop=`<div class="hlabel" style="margin:0 0 2px">Voorwaarden voor beleggen</div>`;
  if(!B.volledig){
    const mist=B.voorwaarden.filter(v=>v.ontbreekt).map(v=>v.naam).filter(Boolean);
    if(!mist.length) return '';
    return `<div class="card">${kop}
      <div class="row" style="gap:9px;align-items:flex-start;padding:7px 0">
        ${maandDot('onbekend')}
        <div class="small muted" style="flex:1;min-width:0;line-height:1.45">Niet te beoordelen zolang ${esc(mist.join(' en '))} ontbreekt.</div>
      </div></div>`;
  }
  const zin = B.klaar
    ? 'Je drie voorwaarden voor beleggen zijn alle drie gehaald.'
    : `Nog niet aan je voorwaarden voor beleggen: ${B.blokkade.naam} ${B.blokkade.waarde} tegen ${B.blokkade.drempel}.`;
  return `<div class="card" style="cursor:pointer" onclick="openBeleggenVoorwaarden()">${kop}
    <div class="row" style="gap:9px;align-items:flex-start;padding:7px 0">
      ${maandDot(B.klaar?'ok':B.blokkade.status)}
      <div style="flex:1;min-width:0;line-height:1.45">${esc(zin)}</div>
      <span style="color:var(--teal);font-weight:700">›</span>
    </div></div>`;
}
function openBeleggenVoorwaarden(){
  let B=null; try{ B=beleggenKlaar(maandRegels()); }catch(_){}
  if(!B) return;
  const rij=v=>`<div class="row" style="gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)">

    <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(v.naam)}</div>

  $('#sheet').innerHTML=`<div class="grab"></div>
