// "Ruimte boven je spaardoel", projectie-hero (staat bovenaan Inzichten)
function heroProjection(m){
  const now=new Date(); const nowYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const isNow=m===nowYM; const t=totals(m);
  const monthName=MFULL[+m.slice(5,7)-1];
  if(isNow){
    // koers-op-spaardoel-kaart: geen tweede groot besteed-bedrag, maar een doel-voortgangssignaal
    const L=monthLiquidity(); const sv=Math.round(monthlySavingTarget()); const projected=Math.round(L.projected); const free=projected-sv;
    if(sv>0){
      const onTrack=free>=0;
      const barFill=onTrack?100:Math.max(0,Math.min(Math.round(projected/sv*100),100));
      const goalPos=onTrack?Math.max(4,Math.min(Math.round(sv/Math.max(projected,1)*100),100)):100;
      const chip=onTrack
        ? `<span style="display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:20px;padding:4px 11px;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)">Op koers</span>`
        : `<span style="display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:20px;padding:4px 11px;background:rgba(251,191,36,.14);color:var(--amber)">Nog niet op koers</span>`;
      const sentence=onTrack
        ? `Je eindigt deze maand naar verwachting <b style="color:var(--teal)">${euro0(free)} boven</b> je spaardoel.`
        : `Je komt deze maand naar verwachting <b style="color:var(--amber)">${euro0(free)} tekort</b> voor je spaardoel.`;
      return `<div class="card" style="cursor:pointer" onclick="openProjection()">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="font-size:var(--fs-xs);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut2)">Koers op je spaardoel</div>${chip}</div>
        <div style="font-size:13.5px;margin:9px 0 8px">${sentence}</div>
        <div style="height:7px;border-radius:6px;background:var(--card2);overflow:hidden;margin:7px 0 5px;position:relative">
          <div style="height:100%;border-radius:6px;background:${onTrack?'var(--teal)':'var(--amber)'};width:${barFill}%"></div>
          <div style="position:absolute;top:-3px;bottom:-3px;left:${goalPos}%;width:2px;background:var(--txt);opacity:.65"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut2)"><span>Verwacht eindsaldo ${euro0(projected)}${t.incomeEst?' · loon geschat':''}</span><span>spaardoel ${euro0(sv)}</span></div>
        <div style="text-align:right;margin-top:9px"><span style="color:var(--teal);font-weight:700;font-size:var(--fs-sm)">bekijk de opbouw ›</span></div>
      </div>`;
    }
    // geen spaardoel ingesteld: alleen het verwachte eindsaldo, klein gehouden
    return `<div class="card" style="cursor:pointer" onclick="openProjection()">
      <div style="font-size:var(--fs-xs);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut2)">Verwacht eindsaldo deze maand</div>
      <div style="font-size:20px;font-weight:800;color:${projected<0?'var(--red)':'var(--teal)'};margin:4px 0 2px">${euro(projected)}</div>
      <div style="font-size:12px;color:var(--mut)">Stel een spaardoel in om je koers te volgen. ›</div></div>`;
  }
  // andere maanden: budget-over hero (budget = je potjes-som; inkomen-limiet als spiegel)
  const pctRaw=t.budget>0?Math.round(t.spend/t.budget*100):0;
  const overLimit=t.budget>t.limit && t.limit>0;
  const lbl=`${monthName} · over`;
  const col = pctRaw<100?'var(--green)':'var(--red)';
  const big=euro(Math.max(t.budget-t.spend,0));
  const sub=`${euro(t.spend)} uitgegeven van ${euro(t.budget)} budget${overLimit?` · ${euro0(t.budget-t.limit)} boven limiet`:''}`;
  return `<div class="hero2">
    <div class="hlbl">${lbl}${t.incomeEst?' <span class="tag">geschat</span>':''}</div>
    <div class="hbig" style="color:${col}">${big}</div>
    ${t.budget>0?`<div style="height:6px;border-radius:6px;background:var(--card2);max-width:340px;margin:4px 0 6px;overflow:hidden"><div style="height:100%;border-radius:6px;background:${pctRaw<100?'var(--teal)':'var(--red)'};width:${Math.min(pctRaw,100)}%"></div></div>`:''}
    <div class="hsub">${sub}</div>
  </div>`;
}

/* ----- MICRO-UITLEG bij vaktermen -----
   Eén herbruikbaar element: jrg('sleutel','zichtbaar woord') maakt de term onderstippeld en aantikbaar (ook met toetsenbord).
   De uitleg is één zin en verschijnt in een mini-popover; bewust geen alert/confirm, die blokkeren de app en de extensie. */
const JARGON={

  spaarinleg:'Wat je per maand opzij wilt zetten. Dit is het bedrag dat je doelen verdeelt, niet alles wat er aan het eind van de maand overblijft.',
  restsaldo:'Je inkomen min je uitgaven in een maand. Je spaarinleg komt hieruit; wat er daarnaast overblijft kan ergens anders heen.',
  afwijkendbedrag:'Hoger dan je gebruikelijke bedrag bij deze winkel — of, als we die historie nog niet hebben, hoger dan het gemiddelde in deze categorie. Een signaal om even te kijken, geen oordeel.',

  bezuinigingsruimte:'Comfort-uitgaven die je in een crisismaand kunt schrappen, dus het bedrag dat je maandlast tijdelijk lager maakt.',
  crisislast:'Wat je per maand echt kwijt bent om rond te komen als je inkomen wegvalt, zonder comfort-uitgaven.',
  firefactor:'Hoeveel keer je jaaruitgaven je als vermogen aanhoudt; factor 25 hoort bij een onttrekking van 4% per jaar.',
  procentpunt:'Het verschil tussen twee percentages. Gaat je restsaldo-quote van 20% naar 22%, dan is dat 2 procentpunt. Zo zie je wat één transactie aan een kerncijfer heeft gedaan.'
};
function jrg(key,label){ const u=JARGON[key]; if(!u) return label;
  return `<span class="jrg" tabindex="0" role="button" aria-label="Uitleg: ${esc(u)}" onclick="showTip(event,'${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){showTip(event,'${key}')}">${label}</span>`; }
function showTip(e,key){
  const u=JARGON[key]; if(!u) return;
  try{ e.preventDefault(); e.stopPropagation(); }catch(_){}                 // niet de <details> eronder open-/dichtklappen
  let p=document.getElementById('tipPop');
  if(!p){ p=document.createElement('div'); p.id='tipPop'; p.setAttribute('role','tooltip'); document.body.appendChild(p); }
  p.textContent=u; p.className='show'; window._tipTs=Date.now();
  // Een tik zet ook focus, en de browser kan de term dan net in beeld scrollen. Daarom plaatsen we
  // de popover nog een keer in de volgende frame (anders staat hij scheef) en negeert de
  // scroll-sluiter die ene eigen scroll (anders klapt de uitleg meteen weer dicht).
  const el=e.currentTarget||e.target;
  const plaats=()=>{
    const r=el.getBoundingClientRect();
    const w=Math.min(260,window.innerWidth-24); p.style.width=w+'px';
    p.style.left=Math.max(12,Math.min(r.left,window.innerWidth-w-12))+'px';
    const h=p.offsetHeight;
    p.style.top=((r.bottom+8+h>window.innerHeight)?Math.max(12,r.top-h-8):(r.bottom+8))+'px';
  };
  plaats(); try{ requestAnimationFrame(plaats); }catch(_){}
}
function hideTip(){ try{ const p=document.getElementById('tipPop'); if(p) p.className=''; }catch(_){} }

/* ----- ACTIEPLAN: concrete, data-gedreven bespaaracties ----- */
function cleanMerch(s){ return (s||'').replace(/\s+/g,' ')
  .replace(/^\s*(BEA|GEA|ECOM)[, ]*/i,'')
  .replace(/\b(GOOGLE PAY|APPLE PAY|BETAALPAS|CONTACTLOOS|VIA TIKKIE)\b/gi,'')
  .replace(/\bNR[: ].*$/i,'')
  .replace(/\b(B\.?V\.?|N\.?V\.?|PURMEREND|PURME|AMSTERDAM|ZAANDAM|WEERWAL|KOOIMANPLEIN|HOUTEN|DE MEERN)\b/gi,'')
  .replace(/BCK\*|CCV\*|SUMUP ?\*|ZTL\*/gi,'')
  .replace(/[^A-Za-z0-9 &.\-]/g,'').replace(/\s+/g,' ').trim(); }
function titleCase(s){ return s.replace(/\b([A-Z])([A-Z0-9]+)\b/g,(m,a,b)=>a+b.toLowerCase()); }
function groupMerch(items){ const by={}; for(const x of items){ const disp=cleanMerch(x.name)||'Overig'; const key=disp.toUpperCase(); (by[key]=by[key]||{name:titleCase(disp),n:0,s:0}); if(x.amount<0) by[key].n++; by[key].s+=-x.amount; } return Object.values(by).sort((a,b)=>b.s-a.s); }   // n telt afschrijvingen; s is netto (terugstorting verrekend)
function hasRe(items,re){ return items.filter(x=>re.test((x.desc||'')+' '+(x.name||''))); }
function sumNeg(arr){ return arr.reduce((a,b)=>a-b.amount,0); }

function buildAction(k,total,items){
  const M=groupMerch(items), top=M[0], E=v=>euro0(v);
  if(k==='vervoer'){
    const lease=sumNeg(hasRe(items,/HILTERMANN|LEASE/i)), fuel=sumNeg(hasRe(items,/TRAVELCARD|SHELL|ESSO|\bBP |TINQ|TANK/i)), park=hasRe(items,/PARKBEE|PARKEER|PARKING/i), parkS=sumNeg(park), flight=sumNeg(hasRe(items,/KLM|ESKY|TRANSAVIA|RYANAIR|EASYJET/i));
    const steps=[]; let saving=0;
    if(lease>0){ steps.push(`Je leaseauto kost <b>${E(lease)}/mnd</b> (Hiltermann). Dat is veruit je grootste vaste last. Reken bij contractverlenging een kleiner model of budget private-lease door. Dat scheelt al snel €75 tot €150 per maand.`); saving+=Math.round(lease*0.12); }
    if(fuel>0){ steps.push(`Tankpas (Travelcard): <b>${E(fuel)}/mnd</b>. Tank bij onbemande pompen zoals Tinq, TanQyou of Gulf. Dat is een stuk goedkoper.`); saving+=Math.round(fuel*0.08); }
    if(parkS>5){ steps.push(`Parkeren: <b>${E(parkS)}</b> over ${park.length} keer. Gebruik P+R met OV of een parkeervergunning i.p.v. losse ParkBee-sessies.`); saving+=Math.round(parkS*0.5); }
    if(flight>40){ steps.push(`Vluchten/reizen: <b>${E(flight)}</b>. Boek 6–8 weken vooruit en zet prijsalerts aan (Google Flights/Skyscanner).`); }
    return steps.length?{k,headline:lease>0?`lease ${E(lease)}/mnd`:(top?top.name:''),steps,saving}:null;
  }
  if(k==='verzekering'){
    const zorg=sumNeg(hasRe(items,/ZILVEREN KRUIS|ZORGVERZEK/i)), schade=sumNeg(hasRe(items,/ALLIANZ/i)), dela=sumNeg(hasRe(items,/DELA/i));
    const steps=[]; let saving=0;
    if(zorg>0){ steps.push(`Zorgverzekering (Zilveren Kruis): <b>${E(zorg)}/mnd</b>. Stap vóór 31 december over via een vergelijker. Dat scheelt gemiddeld €100 tot €300 per jaar, en vraag ook naar collectiviteitskorting.`); saving+=Math.round(zorg*0.1); }
    if(schade>0){ steps.push(`Schade/zakelijk (Allianz): <b>${E(schade)}/mnd</b>. Vraag een nieuwe offerte of verhoog je eigen risico voor een lagere premie.`); saving+=Math.round(schade*0.12); }
    if(dela>0){ steps.push(`Uitvaartverzekering (DELA): controleer of het verzekerde bedrag nog past. Verlagen of oversluiten kan lonen.`); }
    return steps.length?{k,headline:`${E(total)} aan polissen`,steps,saving}:null;
  }
  if(k==='abonnement'){
    const subs=M.filter(x=>x.s>=1).slice(0,5);
    return {k,headline:`${items.length} afschrijvingen`,saving:Math.round((subs[subs.length-1]||{}).s||total*0.2),steps:[
      `Je hebt ${items.length} abonnementen voor <b>${E(total)}/mnd</b>${subs.length?`: ${subs.map(s=>s.name.toLowerCase()).slice(0,4).join(', ')}`:''}.`,
      `Zeg er deze week minstens één op die je nauwelijks gebruikt, of deel een gezinsabonnement / kies een goedkoper pakket.`]};
  }
  if(k==='uiteten'){ const n=items.length; return {k,headline:`${n}× uit eten/afhalen`,saving:Math.round(total*0.35),steps:[
    `Je gaf <b>${E(total)}</b> uit aan uit eten & afhalen over ${n} keer (gem. ${euro(total/n)}).`,
    `Kook 2 avonden per week extra thuis in plaats van afhalen. Dat scheelt ongeveer ${E(total*0.35)} per maand.`,
    `Geef jezelf een vast “uit eten”-budget en betaal dat vanaf een apart potje.`]}; }
  if(k==='boodschappen'){ const n=items.length; return {k,headline:`${n} trips`,saving:Math.round(total*0.12),steps:[
    `<b>${n} boodschappentrips</b> deze maand (gem. ${euro(total/n)}), vooral bij PLUS, Vomar en Safrana.`,
    `Doe 1 grote weekboodschap met een lijstje in plaats van veel kleine trips. Minder impuls scheelt al gauw ${E(total*0.12)} per maand.`,
    `Kies vaker huismerk: vaak goedkoper voor hetzelfde product.`]}; }
  if(k==='sport'){ return {k,headline:`abonnement ${E(total)}/mnd`,saving:Math.round(total*0.5),steps:[
    `Sportabonnement <b>${E(total)}/mnd</b> (Health Club). Ga je er minder dan 1×/week heen? Een losse 10-rittenkaart is dan goedkoper.`,
    `Anders: vraag of je het in rustige maanden tijdelijk kunt pauzeren.`]}; }
  if(k==='shopping'){ return {k,headline:`${E(total)} winkelen`,saving:Math.round(total*0.25),steps:[
    `<b>${E(total)}</b> aan winkelen${top?` (o.a. ${esc(top.name)})`:''}, grotendeels kleding.`,
    `Stel een maandelijks kledingbudget in en hanteer een 48-uurs wachtregel voor niet-essentiële aankopen.`]}; }
  if(k==='goededoel'){ return {k,headline:`${E(total)} aan giften`,saving:0,steps:[
    `Mooi dat je doneert (${E(total)}/mnd). Hier hoef je niet op te bezuinigen. Tip: leg giften vast als periodieke schenking, dan zijn ze aftrekbaar voor de inkomstenbelasting.`]}; }
  if(k==='vices'){ const E=v=>euro0(v); const top=groupMerch(items)[0]; return {k,headline:`${E(total)} aan vices`,saving:Math.round(total*0.4),steps:[
    `<b>${E(total)}</b> deze maand aan vices${top?` (o.a. ${esc(top.name)})`:''}. Minder hier is dubbele winst, voor je saldo én je gezondheid.`,
    `Zet een vast weekbudget en neem het contant op: wat op is, is op. Elke week onder je grens telt dubbel.`]}; }
  return null;
}
function savingsPlan(m){
  const t=totals(m);
  const cats=Object.entries(t.byCat).filter(([k,v])=>CATS[k].type==='expense'&&v<0).map(([k,v])=>[k,-v]).sort((a,b)=>b[1]-a[1]);
  const plan=[];
  for(const [k,total] of cats){
    if(total<25) continue;
    const items=txOfMonth(m).filter(x=>catOf(x)===k);   // incl. terugstortingen: netto deelposten (total komt al netto uit byCat)
    const a=buildAction(k,total,items);
    if(a){ a.total=total; plan.push(a); }
    if(plan.length>=4) break;
  }
  return plan;
}
// status van een actie ('open' default)
function planStatus(k){ return (PLAN[k]||{}).status || 'open'; }
function markAction(k,status,saving){
  const note=(PLAN[k]||{}).note;
  if(status==='open'){ if(note) PLAN[k]={status:'open',note}; else delete PLAN[k]; }
  else { PLAN[k]={status, saving:status==='done'?(+saving||0):((PLAN[k]||{}).saving||0), note, ts:Date.now()}; }
  save(); render();
}
function editNote(k){
  const cur=(PLAN[k]||{}).note||'';
  const v=prompt('Notitie bij deze actie:',cur);
  if(v===null) return;
  const tx=v.trim();
  const cur2=Object.assign({status:'open'},PLAN[k]||{});
  if(tx) cur2.note=tx; else delete cur2.note;
  if(!cur2.note && (cur2.status==='open')) delete PLAN[k]; else PLAN[k]=cur2;
  save(); render();
}
function toggleSnoozed(){ SET.showSnoozed=!SET.showSnoozed; save(); render(); }

  const savFix=savN>=2?`<div class="coach info" style="margin:8px 0"><div class="ic">${ICON('tag')}</div><div class="tx"><b>${euro0(savMis)} aan 'Rule'-overboekingen staat als uitgave.</b> Dat is je eigen sparen. Het maakt je cijfers slechter dan ze zijn. <span style="color:var(--teal);cursor:pointer;font-weight:700" onclick="fixSavingsRules()">los op met 1 tik ›</span></div></div>`:'';

  const acties=`<div class="small muted" style="font-weight:600;margin:12px 0 6px">${ICON('check')} Je 3 grootste hefbomen</div>
    <div class="coach" style="margin:0 0 6px"><div class="ic">1</div><div class="tx"><b>Sparen eerst.</b> ${euro0(target)}/mnd automatisch weg op je salarisdag, nog vóór je het kunt uitgeven. Dan zijn je gewone maanden niet meer afhankelijk van meevallers.</div></div>

  return `<div class="card">

/* ---- Loss-aversion dosering: state + helpers (MECHANISM_SPEC.lossAversion) ----
 * Een loss-frame is een discretionair stakes-signaal (potje over, tempo, vices,
 * ongewoon grote uitgave, spaardoel-risico). Liquiditeitsalarmen (lowbal/accshort)
 * en positieve noten vallen hier NADRUKKELIJK buiten: dat is geen loss aversion.
 * Doel: hooguit maxFramesPerDag per dag, nooit gestapeld, zodat de app geen
 * uitgaven-angst traint. lossFrames = {ymd, n, keys} houdt de dagteller bij. */
const LOSS_GROUPS=new Set(['budget','tempo','discr','big','save']);   // 'discr' verving de oude vices-melding
function isLossFrame(key){ return LOSS_GROUPS.has(String(key||'').split('-')[0]); }
function lossFramesToday(){ const d=new Date().toISOString().slice(0,10); const lf=SET.lossFrames; return (lf&&lf.ymd===d)?(+lf.n||0):0; }
function noteLossSeen(key){ if(!isLossFrame(key)) return; const d=new Date().toISOString().slice(0,10); let lf=SET.lossFrames;
  if(!lf||lf.ymd!==d){ lf=SET.lossFrames={ymd:d,n:0,keys:{}}; } lf.keys=lf.keys||{};
  if(!lf.keys[key]){ lf.keys[key]=1; lf.n=(+lf.n||0)+1; } }
/* ---- Mental accounting: stilstaand surplus boven de heilige buffer vs. dure schuld (MECHANISM_SPEC.mentalAccounting) ----
 * De noodbuffer = SET.buffer (de liquiditeitsondergrens, de rode lijn). Die is HEILIG: alleen het
 * bedrag dat BOVEN de buffer stilstaat telt mee, en de app stelt nooit voor de buffer leeg te halen.
 * Goedkope schuld (lage rente) vuurt niet; alleen wanneer de rente de spaaropbrengst met
 * minRenteVerschil overstijgt en er minstens minBedrag stilstaat boven de buffer. */
function noodbuffer(){ return Math.max(+SET.buffer||0,0); }
function stilstaandSurplus(){ try{ const s=totalSaved(); if(s.missing) return null; return Math.max(Math.round(s.sum - noodbuffer()),0); }catch(_){ return null; } }
function duursteSchuld(){ const ds=(SET.debts||[]).filter(d=>(+d.rest>0)&&(+d.rente>0)); if(!ds.length) return null; ds.sort((a,b)=>(+b.rente)-(+a.rente)); return ds[0]; }
function mentalAccountingSignal(){
  const C=MECHANISM_SPEC.mentalAccounting.condities;
  const surplus=stilstaandSurplus(); if(surplus==null || surplus<(C.minBedrag||50)) return null;   // niets stilstaand boven de buffer
  const d=duursteSchuld(); if(!d) return null;
  const spaarRente=(+SET.spaarRente||0)/100;                                   // standaard 0% (nulrente-potje)
  if(((+d.rente)/100 - spaarRente) < (C.minRenteVerschil||0.05)) return null;   // goedkope schuld: niet vuren
  const inzet=Math.min(surplus, Math.max(+d.rest||0,0));
  const renteJaar=Math.round(inzet*((+d.rente)/100 - spaarRente));
  return {surplus, debt:d, inzet, renteJaar};
}

// verwacht variabel per projectiemaand = mediaan van de maandelijkse variabele lasten, hoogste 10% (uitschieter-maanden) getrimd
function projVarEstimate(){
  const now=new Date(); const cm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const vals=months().filter(ym=>ym!==cm).map(ym=>splitFixedVar(ym).vari).filter(v=>v>0).sort((a,b)=>a-b); // partiële huidige maand uitgesloten

  const keep=vals.slice(0,Math.max(1,Math.ceil(vals.length*0.9)));   // trim de duurste maand(en): eenmalige pieken

// grootste lek, gestructureerd (voor de coach-dialoog): échte impuls vs noodzaak-zonder-potje vs over-budget
function noPotLeak(m){   // grootste NETTO uitgave per winkel zonder potje, gesplitst in impuls vs vaste behoefte (gedeeld door coachLeak/coachSandwich/coachWeekRisk)
  let EB={}; try{ EB=effectiveBudgets(m).out; }catch(_){}
  const byM={};
  for(const x of txOfMonth(m)){
    if(!(isExpenseTx(x) && !isFixed(x))) continue;
    if(+EB[catOf(x)]>0) continue;                        // categorie heeft al een potje → valt onder budget-logica
    const nm=titleCase(cleanMerch(x.name)||x.name||'een aankoop');
    const e=(byM[nm]=byM[nm]||{name:nm,net:0,k:catOf(x),rec:isRecurringMerchant(x.name)});
    e.net+=-x.amount;                                    // netto: terugstorting verrekent per winkel
  }
  let imp=null, need=null;
  for(const nm in byM){ const e=byM[nm]; if(e.net<25) continue;
    if(!isFixedCat(e.k) && !e.rec){ if(!imp||e.net>imp.amt) imp={amt:Math.round(e.net),name:e.name,k:e.k}; }   // echte impuls: discretionair, niet terugkerend, zonder potje
    else { if(!need||e.net>need.amt) need={amt:Math.round(e.net),name:e.name,k:e.k}; }                          // noodzaak / terugkerend zonder potje
  }

}
function coachLeak(m){
  const {imp,need}=noPotLeak(m);
  // grootste lek ZONDER potje (de hele uitgave wijkt af van plan, want er was geen plan)
  let noPot=null;
  if(imp && need) noPot = (imp.amt>=need.amt) ? {kind:'impulse',name:imp.name,amount:imp.amt,cat:imp.k} : {kind:'missing-pot',name:need.name,amount:need.amt,cat:need.k};
  else if(imp) noPot={kind:'impulse',name:imp.name,amount:imp.amt,cat:imp.k};
  else if(need) noPot={kind:'missing-pot',name:need.name,amount:need.amt,cat:need.k};
  // grootste overschrijding MÉT potje (alleen het deel boven budget wijkt af)
  const ov=(typeof budgetOverCat==='function')?budgetOverCat(m):null;
  const over = ov ? {kind:'over-budget',name:CATS[ov.k].name,amount:Math.round(ov.over),cat:ov.k} : null;
  // hybride: het grootste verschil in euro's wint
  if(noPot && over) return over.amount>noPot.amount ? over : noPot;

}

/* ============================================================
   PLAN-LAAG · prioriteit + waterfall
   Dunne laag over het bestaande noodfonds, SET.goals en SET.debts: SET.planOrder bepaalt de
   volgorde, SET.planPaused wat even stilligt. Geen enkele onderliggende berekening verandert;
   het noodfonds is hier één herordenbaar item i.p.v. het hardgecodeerde hoofddoel.
   ============================================================ */
const PLAN_NF='noodfonds';
const planDebtKey=id=>'af:'+id;
function planOrderList(){ return Array.isArray(SET.planOrder)?SET.planOrder.filter(x=>typeof x==='string'):[]; }
function planPaused(id){ return !!(SET.planPaused||{})[id]; }
function planForget(id){ if(SET.planOrder) SET.planOrder=planOrderList().filter(x=>x!==id); if(SET.planPaused) delete SET.planPaused[id]; }

// alle mogelijke plan-items, genormaliseerd (nog zonder volgorde)
// Verdeelmodus per plan-item. Doelen dragen 'm zelf (g.allocMode/perMaand/pct); noodfonds en
// aflos-items hebben geen eigen record, die staan in SET.planAlloc[id]. Eén genormaliseerde vorm
// {mode, perMaand, pct} zodat de allocatie-engine maar één ding hoeft te kennen.
// Terugval: een bestaand doel met perMaand > 0 en zónder modus blijft 'fixed' — anders zou een
// oud doel na deze update ineens de hele spaarruimte opslokken.
function planAllocOf(o){
  const mode=o&&o.allocMode;
  const per=Math.max(Math.round(+((o||{}).perMaand)||0),0);
  const pct=Math.max(+((o||{}).pct)||0,0);
  if(mode==='fixed'||mode==='pct'||mode==='auto') return {mode,perMaand:per,pct};
  return {mode:per>0?'fixed':'auto', perMaand:per, pct};
}
function planAllocCfg(id){ return ((SET.planAlloc||{})[id])||{}; }
function setPlanAlloc(id,patch){
  SET.planAlloc=SET.planAlloc||{}; SET.planAlloc[id]=Object.assign({},SET.planAlloc[id]||{},patch);
  save(); try{render();}catch(_){}
}
function planMap(){
  const by={};
  let nfDoel=0; try{ nfDoel=Math.round(noodfondsModel().doel||0); }catch(_){}
  let saved=0;  try{ saved=Math.round(spaarSaldo().cur||0); }catch(_){}   // zelfde bron als de hero
  // buffer blijft heilig: de voortgang van het noodfonds meet je spaargeld, geclamd op het doel
  by[PLAN_NF]=Object.assign({id:PLAN_NF,type:'noodfonds',naam:'Noodfonds',doel:nfDoel,gespaard:nfDoel>0?Math.min(saved,nfDoel):saved},
    planAllocOf(planAllocCfg(PLAN_NF)));
  for(const g of (SET.goals||[])) if(g&&g.id)
    by[g.id]=Object.assign({id:g.id,type:'goal',naam:g.naam||'Doel',doel:+g.doel||0,gespaard:+g.gespaard||0}, planAllocOf(g));
  // aflos-items bestaan alleen als ze in de volgorde staan; de schuld zelf blijft onaangeroerd
  for(const key of planOrderList()){
    if(key.slice(0,3)!=='af:') continue;
    const d=(SET.debts||[]).find(x=>String(x.id)===key.slice(3)); if(!d) continue;     // schuld verwijderd -> item vervalt
    const rest=Math.max(+d.rest||0,0), start=Math.max(+d.start||0,0);
    const doel=start>rest?start:rest;
    by[key]=Object.assign({id:key,type:'aflossen',naam:'Aflossen: '+(d.naam||'schuld'),doel,gespaard:Math.max(doel-rest,0),
             debtId:String(d.id),rest,rente:+d.rente||0,debtPer:+d.perMaand||0}, planAllocOf(planAllocCfg(key)));
  }
  return by;
}
// geordende planlijst: SET.planOrder leidt, noodfonds staat standaard bovenaan,
// onbekende ids sluiten achteraan aan en verwijderde ids worden genegeerd.
function planItems(){
  const by=planMap(); const seen=new Set(); const out=[];
  for(const id of planOrderList()) if(by[id]&&!seen.has(id)){ out.push(by[id]); seen.add(id); }
  if(!seen.has(PLAN_NF)){ out.unshift(by[PLAN_NF]); seen.add(PLAN_NF); }
  for(const id in by) if(!seen.has(id)){ out.push(by[id]); seen.add(id); }
  return out;
}
// maandelijkse spaarruimte; zonder spaardoel val terug op je bezuinigingsruimte
function planCapacity(){
  let cap=Math.round(monthlySavingTarget()||0);
  if(!(cap>0)){ try{ cap=Math.round(noodfondsModel().comfortTot||0); }catch(_){} }
  return Math.max(cap,0);
}
// Waterfall in prioriteitsvolgorde, met een verdeelmodus per doel:
//   fixed → min(perMaand, wat er nog is) · pct → min(pct% van de héle capaciteit, wat er nog is)
//   auto  → neemt de rest die op dat moment overblijft
// Nooit meer dan wat het doel nog nodig heeft; wat overblijft zakt door naar het volgende item.
// Ronde 2 (v98): wat na ronde 1 nog over is blijft niet liggen maar zakt top-down door naar het
// eerstvolgende lopende doel, ook voorbij zijn vaste maandbedrag. Per item: base = ronde 1,
// extra = wat er is doorgezakt, alloc = de som (waarop status en eta gerekend worden).
function allocatePlan(){
  const cap=planCapacity(); let left=cap;
  const P=planItems().map(it=>{
    const rest=Math.max(Math.round(it.doel-it.gespaard),0);
    let alloc=0, status='';
    if(planPaused(it.id)) status='gepauzeerd';
    else if(rest<=0) status='bereikt';
    else {
      let wens;
      if(it.mode==='fixed')    wens=Math.min(it.perMaand,rest);
      else if(it.mode==='pct') wens=Math.min(Math.round(cap*it.pct/100),rest);
      else                     wens=rest;                       // auto: pakt wat er nog is
      alloc=Math.max(Math.min(wens,left),0); left-=alloc;
    }
    return Object.assign({},it,{rest,alloc,base:alloc,extra:0,status});
  });
  // ronde 2: het restant vult de lopende doelen bij, in dezelfde prioriteitsvolgorde
  for(const p of P){
    if(left<=0) break;
    if(p.status==='gepauzeerd'||p.rest<=0) continue;            // gepauzeerd en bereikt slaan we over
    const ruimte=p.rest-p.alloc; if(ruimte<=0) continue;        // dit doel heeft al wat het nodig heeft
    const bij=Math.min(ruimte,left); p.alloc+=bij; p.extra+=bij; left-=bij;
  }
  // status + eta op de definitieve toewijzing; en bij "wacht op capaciteit": wie het opmaakt
  let auto1=null;
  for(const p of P){
    if(p.status==='gepauzeerd'||p.status==='bereikt'){ p.eta=null; continue; }
    p.status=p.alloc>0?'':'wacht op capaciteit';
    p.eta=null;
    if(p.alloc>0){
      if(p.type==='aflossen'){ const mm=payoffMonths(p.rest,(p.debtPer||0)+p.alloc,p.rente); p.eta=isFinite(mm)&&mm>0?mm:null; }
      else p.eta=Math.ceil(p.rest/p.alloc);
    }
    // een auto-doel erboven pakt alles wat er nog was — dát is waarom dit item niets krijgt
    if(p.status==='wacht op capaciteit'&&auto1) p.blokkeerder={id:auto1.id,naam:auto1.naam,type:auto1.type};
    if(p.mode==='auto'&&p.alloc>0) auto1=p;
  }
  return P;
}
// wat er ná het bijvullen van alle lopende doelen nog over is (verdwijnt nergens: zie renderPlan)
function planVrij(P){
  P=P||allocatePlan();
  const used=P.reduce((a,x)=>a+(+x.alloc||0),0);
  return Math.max(planCapacity()-used,0);
}
function planMove(id,dir){
  const ids=planItems().map(x=>x.id); const i=ids.indexOf(id); const j=i+dir;
  if(i<0||j<0||j>=ids.length) return;

}

function planRemove(id){ if(id===PLAN_NF) return; planForget(id); save(); render(); }   // noodfonds is niet verwijderbaar

  const dz=(+p.extra>0&&p.mode!=='auto')?` · waarvan ${euro0(p.extra)} doorgezakt`:'';

/* Spaargeld boven je noodfonds-doel (v99).
   Het noodfonds-plan-item klemt zijn voortgang op het doel (planMap), en de voortgang van een
   spaardoel is en blijft het handmatige veld "Al gespaard". Geld dat bóven je buffer op je
   spaarrekening staat viel daardoor tussen wal en schip: het telde nergens mee. Dit maakt het
   zichtbaar en toewijsbaar; het rekent niets automatisch mee. Wat je al bij je doelen hebt
   ingevuld gaat eraf, zodat hetzelfde geld nooit twee keer als "vrij" wordt aangeboden. */
function spaarVrij(){
  let doel=0; try{ doel=Math.round(noodfondsModel().doel||0); }catch(_){}
  let S={cur:0,missing:true}; try{ S=spaarSaldo(); }catch(_){}
  if(S.missing||!(doel>0)) return {vrij:0,saved:0,doel,toegewezen:0};
  const saved=Math.round(S.cur||0);
  const toegewezen=(SET.goals||[]).reduce((a,g)=>a+Math.max(Math.round(+g.gespaard||0),0),0);
  return {vrij:Math.max(saved-doel-toegewezen,0), saved, doel, toegewezen};
}
// bestemming: het bovenste lopende spaardoel — alleen een 'goal' draagt handmatig spaargeld
// (een aflos-item leidt zijn voortgang af uit de restschuld en mag je niet zomaar ophogen)
function spaarVrijDoel(P){
  return (P||allocatePlan()).find(x=>x.type==='goal'&&x.status!=='bereikt'&&x.status!=='gepauzeerd')||null;
}
function spaarVrijLine(p,P){
  if(!p||p.type!=='noodfonds') return '';
  const V=spaarVrij(); if(!(V.vrij>0)) return '';
  const t=spaarVrijDoel(P); const kort=isMode('rustig');
  const txt=kort
    ? `${euro0(V.vrij)} staat boven je noodfonds-doel.`
    : `${euro0(V.vrij)} van je spaargeld staat boven je noodfonds-doel en hoort nog bij geen enkel doel.`;
  const cta=t
    ? `<span style="color:var(--teal);cursor:pointer" onclick="event.stopPropagation();spaarVrijToe('${t.id}')">toewijzen aan ${esc(t.naam)} ›</span>`
    : `<span style="color:var(--teal);cursor:pointer" onclick="event.stopPropagation();openGoal()">voeg een doel toe ›</span>`;
  return `<div class="spaar-vrij small" style="margin-top:6px;color:var(--mut2);line-height:1.45">${txt} ${cta}</div>`;
}
// telt het vrije spaargeld op bij "Al gespaard" van dat doel — nooit meer dan het doel nog nodig
// heeft; de rest blijft staan voor een volgend doel. Omkeerbaar: het veld blijft bewerkbaar.
function spaarVrijToe(id){
  const g=(SET.goals||[]).find(x=>x.id===id); if(!g) return;
  const V=spaarVrij(); if(!(V.vrij>0)) return;
  const rest=Math.max(Math.round((+g.doel||0)-(+g.gespaard||0)),0); if(rest<=0) return;
  const bij=Math.min(V.vrij,rest);
  g.gespaard=Math.round((+g.gespaard||0)+bij);
  save(); render();
  toast(`${ICON('check')} ${euro0(bij)} toegewezen aan ${g.naam||'je doel'}`);
}
/* De keerzijde van spaarVrij (v102). Het noodfonds rekent zijn voortgang elke keer opnieuw uit je
   saldo (planMap: min(saved, doel)), terwijl "Al gespaard" van een spaardoel jouw eigen getal is.
   Verhoog je het noodfonds-doel nadat je vrij spaargeld aan een doel gaf, dan pakt het noodfonds
   dat geld terug zonder dat het bij het doel verdwijnt: dezelfde euro telt dan twee keer.
   spaarVrij() klemt op nul en zweeg daarover. Hier maken we het zichtbaar; verplaatsen doet de
   gebruiker zelf met één tik (MECHANISM_SPEC.defaultEffect: nooit stilletjes geld bewegen). */
function spaarOver(){
  let doel=0; try{ doel=Math.round(noodfondsModel().doel||0); }catch(_){}
  let S={cur:0,missing:true}; try{ S=spaarSaldo(); }catch(_){}
  if(S.missing) return {over:0,saved:0,doel,toegewezen:0,nf:0};
  const saved=Math.round(S.cur||0);
  const nf=doel>0?Math.min(saved,doel):saved;                 // wat het noodfonds nu claimt
  const toegewezen=(SET.goals||[]).reduce((a,g)=>a+Math.max(Math.round(+g.gespaard||0),0),0);
  return {over:Math.max(nf+toegewezen-saved,0), saved, doel, toegewezen, nf};
}
// wie levert in? De laagste prioriteit eerst — spiegelbeeld van spaarVrijToe, dat juist aan het
// bovenste lopende doel geeft. Alleen 'goal'-items dragen handmatig spaargeld.
function spaarOverDoelen(P){
  return (P||allocatePlan()).filter(x=>x.type==='goal'&&(+x.gespaard||0)>0).reverse();
}
function spaarOverLine(p,P){
  if(!p||p.type!=='noodfonds') return '';
  const V=spaarOver(); if(!(V.over>0)) return '';
  const rij=spaarOverDoelen(P); if(!rij.length) return '';
  const kort=isMode('rustig');
  const txt=kort
    ? `Je doelen claimen ${euro0(V.over)} meer dan er staat.`
    : `Je doelen claimen samen ${euro0(V.nf+V.toegewezen)}, terwijl er ${euro0(V.saved)} op je spaarrekening staat. Je noodfonds-doel ging omhoog, dus ${euro0(V.over)} zit nu bij twee doelen tegelijk.`;
  const naam=rij.length===1?esc(rij[0].naam):'je doelen';
  return `<div class="spaar-over small" style="margin-top:6px;color:var(--mut2);line-height:1.45">${txt}
    <span style="color:var(--teal);cursor:pointer" onclick="event.stopPropagation();spaarOverAf()">haal ${euro0(V.over)} weg bij ${naam} ›</span></div>`;
}
// Haalt het teveel van onderaf weg uit "Al gespaard". Nooit onder nul, nooit meer dan het teveel;
// de velden blijven gewoon bewerkbaar, dus je kunt het met de hand anders verdelen.
function spaarOverAf(){
  const V=spaarOver(); if(!(V.over>0)) return;
  let rest=V.over; const namen=[];
  for(const it of spaarOverDoelen()){
    if(rest<=0) break;
    const g=(SET.goals||[]).find(x=>x.id===it.id); if(!g) continue;
    const nu=Math.max(Math.round(+g.gespaard||0),0); const af=Math.min(nu,rest);
    if(af<=0) continue;
    g.gespaard=nu-af; rest-=af; namen.push(g.naam||'doel');
  }
  if(rest===V.over) return;                                   // niets kunnen weghalen
  save(); render();
  toast(`${ICON('check')} ${euro0(V.over-rest)} weggehaald bij ${namen.join(' en ')}`);
}
// waar stel je het maandbedrag/percentage van dít item in?
function planAllocOpen(it){
  if(it.type==='noodfonds') return 'openNoodfondsPanel()';
  if(it.type==='aflossen')  return `openPlanAlloc('${it.id}')`;
  return `openGoal('${it.id}')`;
}
// Aflos-items hebben geen eigen record en dus geen editor voor hun maandbedrag; deze kleine sheet
// geeft ze dezelfde keuze als een spaardoel, zodat de hint hierboven altijd ergens op uitkomt.

    <div class="card"><div class="small" style="font-weight:600">Hoeveel gaat hier maandelijks heen?</div>
      <div id="paModes">${planModeChips(A.mode,'setPlanAllocMode')}</div>${veld}</div>
    <div style="height:8px"></div>`;
}
function setPlanAllocMode(v){ setPlanAlloc(window._planAllocId,{allocMode:v}); renderPlanAllocSheet(); }
function setPlanAllocVeld(veld,v){
  const n=Math.max(0,Math.round(+v||0));
  setPlanAlloc(window._planAllocId, veld==='pct'?{pct:Math.min(n,100)}:{perMaand:n});
  renderPlanAllocSheet();
}
// Zachte spiegel: verdeel je meer dan er is, dan zeggen we dat. Nooit blokkeren.
function planAllocWarning(){
  const cap=planCapacity();
  let vast=0, pct=0;
  for(const it of planItems()){
    if(planPaused(it.id)) continue;
    if(it.mode==='fixed') vast+=Math.max(it.perMaand,0);
    else if(it.mode==='pct') pct+=Math.max(it.pct,0);
  }
  const geclaimd=Math.round(vast+cap*pct/100);
  if(pct>100) return {vast,pct,cap,geclaimd,txt:`Je percentages tellen op tot ${Math.round(pct)}% van je spaarinleg. Wat er niet is kan niet verdeeld worden — de doelen onderaan wachten.`};
  if(cap>0 && geclaimd>cap) return {vast,pct,cap,geclaimd,txt:`Je verdeelt ${euro0(geclaimd)} terwijl er ${euro0(cap)} is. Dat mag; de doelen onderaan wachten dan op capaciteit.`};
  return null;
}
// "Mijn plan": de geordende lijst met op/neer-knoppen (betrouwbaar op mobiel; drag kan later)
function renderPlan(bare){
  const P=allocatePlan(); const cap=planCapacity(); const n=P.length;
  const rows=P.map((p,i)=>{
    const pct=p.doel>0?Math.min(Math.round(p.gespaard/p.doel*100),100):0;
    const col=p.status==='gepauzeerd'?'var(--mut)':(p.status==='bereikt'?'var(--green)':'var(--teal)');
    const up=i>0?`<button class="plan-mv" onclick="planMove('${p.id}',-1)" aria-label="Hoger">▲</button>`:'<span class="plan-mv off">▲</span>';
    const dn=i<n-1?`<button class="plan-mv" onclick="planMove('${p.id}',1)" aria-label="Lager">▼</button>`:'<span class="plan-mv off">▼</span>';
    return `<div class="card plan-item" data-id="${p.id}" style="padding:12px 13px;margin-bottom:8px">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <div style="flex:1;min-width:0;cursor:pointer" onclick="${planOpen(p)}">
          <div class="row"><span style="font-weight:700;font-size:var(--fs-md)">${i===0?'<span class="plan-1">1</span> ':''}${esc(p.naam)}</span><span class="small muted">${euro0(p.gespaard)} / ${euro0(p.doel)}</span></div>
          <div class="bar-track" style="margin:8px 0 0"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
          <div class="small muted" style="margin-top:6px">${planSub(p)}</div>
          ${planWachtHint(p)}${spaarVrijLine(p,P)}${spaarOverLine(p,P)}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">${up}${dn}</div>
      </div>
      <div class="row" style="margin-top:8px;gap:12px">
        <span class="small" style="color:var(--mut2);cursor:pointer" onclick="planTogglePause('${p.id}')">${planPaused(p.id)?'hervatten':'pauzeren'}</span>
        ${p.type==='noodfonds'?`<span class="small" style="color:var(--teal);cursor:pointer" onclick="openNoodfondsPanel()">verfijnen ›</span>`:''}
        ${p.type==='aflossen'?`<span class="small" style="color:var(--mut2);cursor:pointer" onclick="planRemove('${p.id}')">uit plan halen</span>`:''}
      </div>
    </div>`;
  }).join('');
  const head=`<div class="small muted" style="margin:0 2px 8px">Je ${jrg('spaarinleg','spaarinleg')} gaat van boven naar beneden: ${cap>0?`<b>${euro0(cap)}/mnd</b> te verdelen`:'nog geen spaarinleg bekend'}. Zet met ▲▼ wat eerst moet.</div>`;
  const W=planAllocWarning();
  const warn=W?`<div id="planWarn" class="small" style="color:${isMode('rustig')?'var(--mut)':'var(--amber)'};background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);border-radius:10px;padding:9px 11px;margin:0 2px 9px;line-height:1.45">${W.txt}</div>`:'';
  // niets blijft liggen: is er ná het bijvullen van álle lopende doelen nog capaciteit over,
  // dan zeggen we dat rustig i.p.v. het geruisloos te laten verdwijnen
  const vrij=planVrij(P);
  const vrijLine=vrij>0?`<div id="planVrij" class="small muted" style="margin:0 2px 9px;line-height:1.45"><b>${euro0(vrij)}/mnd</b> nog vrij${isMode('rustig')?'':' — al je doelen krijgen wat ze nodig hebben'} · <span style="color:var(--teal);cursor:pointer" onclick="openGoal()">voeg een doel toe ›</span></div>`:'';
  const inner=head+warn+vrijLine+rows+`<button class="cp-add" onclick="openGoal()">+ Doel toevoegen</button>`;
  if(bare) return inner;
  return `<div style="margin-top:18px"><div class="row" style="margin:0 2px 8px"><span class="hlabel" style="margin:0;flex:1">Mijn plan</span></div>${inner}</div>`;
}

/* ---- Deel 2: optioneel dure-schuld-advies bij een nieuw doel (nooit verplicht) ---- */
function duurSchuldNudge(){
  const C=MECHANISM_SPEC.mentalAccounting.condities;
  const d=duursteSchuld(); if(!d) return null;
  const spaarRente=(+SET.spaarRente||0)/100;
  const verschil=(+d.rente)/100-spaarRente;
  if(verschil<(C.minRenteVerschil||0.05)) return null;              // alleen dúre schuld; studieschuld/hypotheek vallen af
  if(planOrderList().includes(planDebtKey(d.id))) return null;      // staat al in je plan
  const n=SET.debtNudge;                                           // niet zeuren: zelfde schuld pas na 3 maanden opnieuw
  if(n && String(n.debtId)===String(d.id) && !((+d.rente)>(+n.rente||0)+0.01)){
    if((Date.now()-(+n.ts||0))/(1000*60*60*24*30.44) < 3) return null;
  }
  return {d, verschil, pct:Math.round(verschil*1000)/10};
}
function debtNudgeCard(){
  const N=duurSchuldNudge(); if(!N) return '';
  const d=N.d, rente=(''+(+d.rente)).replace('.',',');
  const kort=isMode('rustig');
  return `<div class="card" id="debtNudge" style="border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.06);padding:13px 14px;margin-bottom:14px">
    <div class="small" style="font-weight:700;color:var(--amber);letter-spacing:.04em;text-transform:uppercase">${ICON('coins')} Voordat je spaart</div>
    <div style="font-size:13.5px;margin-top:7px;line-height:1.5"><b>${esc(d.naam||'Je schuld')}</b> kost je ${rente}% rente${(+d.rest>0)?` over ${euro0(+d.rest)}`:''}.
      ${kort?'':`Elke €100 die je daar aflost levert ${N.pct.toString().replace('.',',')}% zeker op &mdash; meer dan sparen nu oplevert. `}Je noodbuffer blijft staan.</div>
    <div class="small" style="color:var(--mut2);margin-top:7px">Een suggestie, geen advies &mdash; jij kiest.</div>
    <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
      <button class="btn" style="flex:1 1 150px;width:auto;padding:10px" onclick="planPromoteDebt('${d.id}')">Aflossen als doel #1</button>
      <button class="btn sec" style="flex:1 1 130px;width:auto;padding:10px" onclick="dismissDebtNudge('${d.id}')">Nee, ik wil sparen</button>
    </div></div>`;
}
function planPromoteDebt(debtId){
  const key=planDebtKey(debtId);
  const ids=planItems().map(x=>x.id).filter(x=>x!==key);
  SET.planOrder=[key].concat(ids); save(); closeSheet(); render();
  toast(`${ICON('check')} Aflossen staat nu bovenaan je plan`);
}
function dismissDebtNudge(debtId){
  const d=(SET.debts||[]).find(x=>String(x.id)===String(debtId));
  SET.debtNudge={debtId:String(debtId), rente:d?+d.rente||0:0, ts:Date.now()}; save();
  const el=document.getElementById('debtNudge'); if(el) el.remove();     // formulier blijft staan, inclusief wat je al typte
}
function payoffMonths(rest, per, jr){ if(per<=0||rest<=0) return 0; const r=(+jr||0)/100/12; if(r<=0) return Math.ceil(rest/per); if(per<=rest*r+0.001) return Infinity; return Math.ceil(-Math.log(1-rest*r/per)/Math.log(1+r)); }
// fase B: verwacht netto rendement uit je beleggingen (voor de aflossen-vs-beleggen-afweging)
function expectedReturnPct(){ const gs=(SET.assets||[]).filter(a=>a.grow&&(+a.rend||0)>0); return gs.length?Math.max(...gs.map(a=>+a.rend||0)):null; }
function dTypeChange(){ const t=((document.getElementById('dType')||{}).value)||'lening';
  const sw=document.getElementById('dslotwrap'); if(sw) sw.style.display=(t==='financiallease')?'block':'none';
  const aw=document.getElementById('dautowrap'); if(aw) aw.style.display=(t==='financiallease')?'block':'none';
  const nt=document.getElementById('dtypenote'); if(nt) nt.innerHTML=(t==='studie')?'Studieschuld heeft vaak een lage rente en lange looptijd — versneld aflossen is dan lang niet altijd de slimste zet.':(t==='financiallease')?'Bij financial lease is de auto jouw bezitting en de lease een aflosbare schuld met een slottermijn.':'';
}
function dEstimateDagwaarde(){
  const g=x=>(+((document.getElementById(x)||{}).value)||0);
  const aankoop=g('dAankoop'), bj=g('dBouwjaar'), af=g('dAfschr')||18;
  if(aankoop<=0||bj<=0){ toast('Vul aankoopwaarde en bouwjaar in'); return; }
  const leeftijd=Math.max(new Date().getFullYear()-bj,0);
  const dw=Math.round(aankoop*Math.pow(1-af/100,leeftijd));
  const el=document.getElementById('dDag'); if(el) el.value=dw;
  const pv=document.getElementById('dDagPrev'); if(pv) pv.textContent='Geschat: '+euro0(dw)+' · afschrijving '+af+'%/jr over '+leeftijd+' jaar';
}
// Detecteert of de maandaflossing van een schuld terugkomt in je transacties, en of die in je uitgaven zit
// (isExpenseTx → telt in je restsaldo) of erbuiten loopt (intern / anders). On-the-fly, geen opslag.
function debtInExpenses(d){
  const per=+((d&&d.perMaand)||0); if(per<=0) return {status:'geen'};
  const tol=Math.max(per*0.12,15);
  const win=new Set(months().slice(-6));
  const groups={};
  for(const t of TX){ if(t.pending||!(t.amount<0)) continue;
    if(!win.has(t.date.slice(0,7))) continue;
    const key=recurKey(t); if(!key) continue;
    const g=(groups[key]=groups[key]||{amts:[],yms:new Set(),expense:0,intern:0,other:0,isLease:false});
    g.amts.push(Math.abs(t.amount)); g.yms.add(t.date.slice(0,7));
    if(isExpenseTx(t)) g.expense++; else if(catOf(t)==='intern') g.intern++; else g.other++;
    // op naam+desc, niet op de afgekapte recurKey: "LEASE" kan voorbij de eerste 20 tekens staan
    if(!g.isLease && LEASE_RX.test((t.name||'')+' '+(t.desc||''))) g.isLease=true;
  }
  const dn=recurKey({name:(d&&d.naam)||''});
  const med=a=>{ const s=[...a].sort((x,y)=>x-y),n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0; };
  // Alleen-op-bedrag matchen pakt soms de verkeerde groep: binnen de tolerantie kan een interne
  // overboeking van toevallig hetzelfde bedrag staan, en bij een gelijke stand won de eerst gevonden.
  // Twee voorkeuren maken de keuze betrouwbaar, zonder een status af te dwingen:
  const leaseDebt=!!(d && d.type==='financiallease');
  let best=null;
  for(const k in groups){ const g=groups[k]; if(g.yms.size<2) continue;   // ≥2 maanden = terugkerend
    const m=med(g.amts), amtMatch=Math.abs(m-per)<=tol, nameMatch=!!(dn&&k&&(k.indexOf(dn)>=0||dn.indexOf(k)>=0));
    if(!amtMatch&&!nameMatch) continue;
    const cls=(g.expense>=g.intern&&g.expense>=g.other)?'expense':(g.intern>=g.other?'intern':'other');
    let score=(nameMatch?2:0)+(amtMatch?1:0);
    if(leaseDebt && g.isLease) score+=2;      // (a) een herkende lease-termijn hoort bij een financial-lease-schuld
    if(cls==='expense') score+=0.5;           // (b) een aflossing is eerder een echte betaling dan een interne overboeking
    if(!best||score>best.score) best={cls,score,amtMatch,nameMatch,m};
  }
  if(!best) return {status:'niet-gevonden'};
  const conf=best.nameMatch&&best.amtMatch?'hoog':(best.amtMatch?'waarschijnlijk':'mogelijk');
  const status=best.cls==='expense'?'in-uitgaven':(best.cls==='intern'?'intern':'buiten-uitgaven');
  return {status,conf,bedrag:Math.round(best.m)};
}
/* ----- Terugkerende auto-lease: aanbod om te koppelen aan een financial-lease-schuld -----
 * Puur detectie + aanbod. Categorisering, netWorth en debtInExpenses blijven ongemoeid: zonder
 * koppeling blijft de lease gewoon een vervoer-uitgave. Na koppeling doet het bestaande
 * financial-lease-mechanisme (aflossing + auto als bezitting) zijn werk. */
const LEASE_RX=/HILTERMANN|LEASECONTRACT|PRIVATE ?LEASE|\bLEASE/i;
function leaseLinkOffer(t){
  if(!t || !(t.amount<0) || t.pending) return null;
  if(!LEASE_RX.test((t.name||'')+' '+(t.desc||''))) return null;
  if(!isFixed(t)) return null;                                   // alleen een herkende, terugkerende betaling
  const key=recurKey(t); if(!key) return null;
  if((SET.leaseLinkOff||{})[key]) return null;                   // afgewezen: niet blijven vragen
  for(const d of (SET.debts||[])){                               // al gekoppeld? dan zwijgen we
    if(d.type!=='financiallease') continue;
    const dn=recurKey({name:d.naam||''});

function fvProject(P, PMT, ratePct, years){
  const r=(+ratePct||0)/100/12, n=Math.round((+years||0)*12);
  if(n<=0) return P;
  if(Math.abs(r)<1e-9) return P + PMT*n;
  return P*Math.pow(1+r,n) + PMT*((Math.pow(1+r,n)-1)/r);
}
function assetProjection(a){
  const P0=(+a.waarde||0)+(+a.eenmalig||0), PMT=(+a.per||0), yr=(+a.horizon||0), rend=(+a.rend||0), infl=(+a.infl||0);
  const mid=fvProject(P0,PMT,rend,yr), low=fvProject(P0,PMT,rend-2,yr), high=fvProject(P0,PMT,rend+2,yr);
  const ownIn=P0+PMT*Math.round(yr*12);
  const koop=infl>0? mid/Math.pow(1+infl/100,yr) : mid;
  return {PMT,yr,rend,infl,mid:Math.round(mid),low:Math.round(low),high:Math.round(high),ownIn:Math.round(ownIn),growth:Math.round(mid-ownIn),koop:Math.round(koop)};
}
function projFanChart(a){
  const P0=(+a.waarde||0)+(+a.eenmalig||0), PMT=(+a.per||0), yr=Math.round(+a.horizon||0), rend=(+a.rend||0), infl=(+a.infl||0);
  if(yr<=0) return '';
  const low=[],mid=[],high=[],koop=[],inleg=[];
  for(let y=0;y<=yr;y++){ const m=y*12;
    low.push(fvProject(P0,PMT,rend-2,y)); mid.push(fvProject(P0,PMT,rend,y)); high.push(fvProject(P0,PMT,rend+2,y));
    koop.push(infl>0? fvProject(P0,PMT,rend,y)/Math.pow(1+infl/100,y) : fvProject(P0,PMT,rend,y));
    inleg.push(P0+PMT*m); }
  const W=340,H=158,x0=6,x1=W-58,yT=12,yB=H-20; const maxV=Math.max(high[yr]*1.02,1);
  const X=y=>x0+(y/yr)*(x1-x0), Y=v=>yB-(Math.max(v,0)/maxV)*(yB-yT);
  const pts=arr=>arr.map((v,y)=>X(y).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const band=high.map((v,y)=>X(y).toFixed(1)+','+Y(v).toFixed(1)).concat(low.map((v,y)=>X(y).toFixed(1)+','+Y(v).toFixed(1)).reverse()).join(' ');
  const lbl=(v,txt,col,wt)=>`<text x="${x1+5}" y="${(Y(v)+3).toFixed(1)}" fill="${col}" font-size="9.5"${wt?' font-weight="700"':''}>${txt}</text>`;
  const xt=[0,Math.round(yr/2),yr].filter((v,i,arr)=>arr.indexOf(v)===i && v>=0);
  let s=`<polygon points="${band}" fill="color-mix(in srgb,var(--accent) 16%,transparent)"/>`;
  s+=`<polyline points="${pts(high)}" fill="none" stroke="color-mix(in srgb,var(--accent) 50%,transparent)" stroke-width="1"/><polyline points="${pts(low)}" fill="none" stroke="color-mix(in srgb,var(--accent) 50%,transparent)" stroke-width="1"/>`;
  s+=`<polyline points="${pts(inleg)}" fill="none" stroke="#60a5fa" stroke-width="1.6"/>`;
  if(infl>0) s+=`<polyline points="${pts(koop)}" fill="none" stroke="var(--lab)" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  s+=`<polyline points="${pts(mid)}" fill="none" stroke="var(--accent)" stroke-width="2.6"/>`;
  s+=`<circle cx="${X(yr).toFixed(1)}" cy="${Y(high[yr]).toFixed(1)}" r="2.6" fill="var(--accent)" opacity=".6"/><circle cx="${X(yr).toFixed(1)}" cy="${Y(mid[yr]).toFixed(1)}" r="3.4" fill="var(--accent)"/><circle cx="${X(yr).toFixed(1)}" cy="${Y(low[yr]).toFixed(1)}" r="2.6" fill="var(--accent)" opacity=".6"/>`;
  s+=lbl(high[yr],euro0(Math.round(high[yr])),'var(--accent)',0)+lbl(mid[yr],euro0(Math.round(mid[yr])),'var(--accent)',1)+lbl(low[yr],euro0(Math.round(low[yr])),'var(--lab)',0);
  s+=xt.map(y=>`<text x="${X(y).toFixed(1)}" y="${H-6}" fill="var(--lab)" font-size="8.5" text-anchor="${y===0?'start':'middle'}">${y===0?'nu':'+'+y+'j'}</text>`).join('');

  return `<div style="margin-top:12px"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${s}</svg>${leg}</div>`;
}

function netWorthSeries(){

  const cur=totalBalance().sum; const flow={}; ms.forEach(m=>flow[m]=0);
  for(const t of TX){ const m=t.date.slice(0,7); if(flow[m]!==undefined) flow[m]+=t.amount; }
  const balEnd={}; let runs=cur;
  for(let i=ms.length-1;i>=0;i--){ balEnd[ms[i]]=runs; runs-=flow[ms[i]]; }

function nwChart(series){
  if(series.length<2) return '';

  const zero=mn<0?`<line x1="${L}" y1="${Y(0).toFixed(1)}" x2="${R}" y2="${Y(0).toFixed(1)}" stroke="var(--ref)" stroke-dasharray="3 3"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${zero}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.4"/></svg>`+`<div style="display:flex;justify-content:space-between;margin-top:-14px">${labs?'':''}</div>`;

  let autoAnnualExp=0;
  try{ const nowYM=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
    let rec=months().filter(mm=>mm<nowYM).slice(-3); if(!rec.length) rec=months().slice(-3);
    if(rec.length){ let s=0; for(const mm of rec){ const sf=splitFixedVar(mm); s+=(+sf.fixed||0)+(+sf.vari||0); } autoAnnualExp=Math.round(s/rec.length*12); }
  }catch(_){}

  if(!nfDoel){ try{ nfDoel=Math.round(savingsModel().goal||0); }catch(_){} }
  if(!nfCur){ try{ nfCur=Math.round(savingsModel().cur||0); }catch(_){} }
  const emergencyGoal=nfDoel;   // FIRE-mijlpaal = restsaldo-waterval = Noodfonds-kaart
  let monthlySaving=0; try{ monthlySaving=Math.round(monthlySavingTarget()||0); }catch(_){}   // beoogde maandelijkse spaarinleg — het tempo waarop het noodfonds vult (zelfde bron als Vooruitblik)
  let missBal=false; try{ missBal=((totalBalance().missing||0)>0); }catch(_){}   // eerlijk over onbekende input (C2-noot)
  const debtsEnriched=(SET.debts||[]).map(d=>Object.assign({},d,{inExp:debtInExpenses(d)}));   // detectie: zit de aflossing in je uitgaven?

  else { debtWarn=true;
    const wat=(nConcern===dStat.length&&dStat.length===1)?'je aflossing':`${nConcern} van je ${dStat.length} aflossingen`;

// Spiegel (geen advies): toont dat er ruimte vrijkomt zodra het noodfonds vol is, en wat 'vrij'/mnd doet
// bij twee bestemmingen (aflossen vs beleggen) — puur ter vergelijking, de keuze blijft bij de gebruiker.
function fireFreedBlock(M){
  const R=M.R, f=M.freed||{}; const vrij=+f.vrij||0;
  if(vrij<=0 || !(M.restsaldo && M.restsaldo.nfDoel>0)) return '';
  const nowY=M.nowY, volYear=f.volYear||nowY, future=volYear>nowY;
  // beleggen: 'vrij'/mnd samengesteld van het vol-jaar tot pensioen, tegen je rendement
  const Mmo=Math.max(M.targetYear-volYear,0)*12, rM=R.rend/100/12;
  const belegFV = Mmo>0 ? (rM>0 ? vrij*((Math.pow(1+rM,Mmo)-1)/rM) : vrij*Mmo) : 0;
  // aflossen: 'vrij'/mnd extra op je (gezamenlijke) schuld
  const ds=(M.debtPay||[]).filter(d=>d.rest>0);
  const totRest=ds.reduce((s,d)=>s+d.rest,0), totPer=ds.reduce((s,d)=>s+(+d.per||0),0);
  const blendR = totRest>0 ? ds.reduce((s,d)=>s+d.rest*(+d.rente||0),0)/totRest : 0;
  let aflosTxt='';
  if(totRest>0 && totPer>0){
    const baseMo=payoffMonths(totRest,totPer,blendR), fastMo=payoffMonths(totRest,totPer+vrij,blendR);
    if(isFinite(baseMo)&&isFinite(fastMo)){ const moSaved=Math.max(baseMo-fastMo,0);
      const intSaved=Math.max(Math.round((totPer*baseMo-totRest)-((totPer+vrij)*fastMo-totRest)),0);
      aflosTxt=`~${moSaved} mnd eerder schuldenvrij${intSaved>0?', ~'+euro0(intSaved)+' minder rente':''}`;
    } else aflosTxt='je schuld daalt sneller';
  }
  const rows=[];
  if(aflosTxt) rows.push(`<div class="row" style="justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)"><span class="small" style="font-weight:600">Aflossen</span><span class="small mut2" style="text-align:right">${aflosTxt}</span></div>`);
  if(belegFV>0) rows.push(`<div class="row" style="justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)"><span class="small" style="font-weight:600">Beleggen</span><span class="small mut2" style="text-align:right">tegen ${(''+R.rend).replace('.',',')}% tot ${M.targetYear}: +${euro0(belegFV)}</span></div>`);
  const lead = future
    ? `Rond ${volYear} is je noodfonds vol. Vanaf dan komt <b>${euro0(vrij)}/mnd</b> vrij voor een volgende bestemming.`
    : `Je noodfonds is vol, dus <b>${euro0(vrij)}/mnd</b> is vrij voor een volgende bestemming.`;
  return `<div style="margin-top:12px;padding:11px 12px;background:var(--card2);border-radius:11px">
    <div class="small" style="font-weight:700">${ICON('swap')} Ruimte die vrijkomt</div>
    <div class="small mut2" style="font-size:11.5px;margin-top:3px">${lead}</div>
    ${rows.length?`<div style="margin-top:6px">${rows.join('')}</div><div class="small mut2" style="font-size:10.5px;margin-top:6px">Twee mogelijkheden ter vergelijking, bij benadering. Jij kiest; dit is geen advies.</div>`:''}
  </div>`;
}

function elevatedCat(){

  let best=null;

    const norms=prev.map(mm=>catSpendMap(mm)[k]||0).filter(v=>v>0); if(!norms.length) continue;

  return best;

// COACH-GESPREK (startpunt): persoonlijke groet + constatering + eerlijke vooruitblik
function coachOpening(){
  const m=curMonth||months()[months().length-1];
  const t=totals(m); const L=monthLiquidity();
  const nm=(SET.name||'').trim().split(/\s+/)[0];
  const greet=nm?`Hey ${esc(nm)},`:'Hey,';
  const bud=Math.round(t.budget), spent=Math.round(t.spend);
  // 2) constatering: waar sta je nu t.o.v. je budgetdoel + dagen resterend (feitelijk, toon zit in de vooruitblik)
  let cons;
  if(bud<=0){
    cons=`ik zie nog geen inkomen, dus je budgetdoel kan ik nog niet berekenen. Stel je inkomen in bij Instellingen, dan coach ik je gericht.`;
  } else {
    cons=`ik zie dat je op ${euro0(spent)} van je ${euro0(bud)}-budget zit, met nog ${L.daysLeft} dagen te gaan deze maand.`;
  }
  // 3) eerlijke vooruitblik, toon past zich aan de situatie aan: ruimte (nuchter) / op koers (fragiel) / over (eerlijk, niet straffen)
  let outlook='', outWarn=false;
  if(bud>0){
    // resterende variabele uitgaven: dagtempo, maar afgetopt op wat er van je variabele norm nog over is
    // (anders telt de coach het volledige dag-gemiddelde bij terwijl je je variabele budget deze maand al op had)
    const fm=(typeof forecastModel==='function')?forecastModel():null;
    const fVar=fm?fm.fVar:0;
    const variSpent=splitFixedVar(m).vari;
    const varRemain = fVar>0 ? Math.max(0, Math.min(Math.round((fVar/30)*L.daysLeft), Math.round(fVar-variSpent))) : L.varDue;
    const ONTRACK=(+SET.onTrackFloor||0.8);   // expliciete grens: vanaf dit aandeel van je budget heet het 'op koers'
    const projSpend=spent+L.fixDue+varRemain;
    const overBy=Math.round(projSpend-bud);
    const room=Math.round(bud-projSpend);
    const items=(L.fixDueItems||[]).filter(s=>!s.excl).slice().sort((a,b)=>b.amount-a.amount);
    const names=items.slice(0,2).map(x=>{const nx=titleCase(cleanMerch(x.name)||''); return nx||(CATS[x.cat]?CATS[x.cat].name:'');}).filter(Boolean);
    const naming = names.length? `je ${names.join(' en ')} ${names.length>1?'moeten':'moet'} nog van je rekening` : `je vaste lasten moeten nog van je rekening`;
    if(overBy>0 || spent>bud){
      // SITUATIE 3, (gaat) fors over budget: eerlijk over de ernst, niet straffen
      outWarn=true;
      const lead = spent>bud
        ? `je zit op ${euro0(spent)} van je ${euro0(bud)}-budget en je bent er deze maand overheen`
        : `${naming}, en daarmee ga je deze maand zo'n ${euro0(overBy)} over je budget`;
      outlook=`Ik ga niet om de hete brij heen: ${lead}. Geen ramp, wél een signaal, hieronder zie je precies waar het lekt en wat de stap is.`;
    } else if(projSpend >= bud*ONTRACK){
      // SITUATIE 2, precies op koers: benoem dat 'op koers' fragiel is en bewaak het
      outlook=`Je loopt op schema.${L.fixDue<=0?` Je vaste lasten zijn deze maand al binnen, dus de ruimte die je ziet is echt.`:``} Maar eerlijk: "op koers" verlies je het makkelijkst, want het voelt veilig. Eén impulsaankoop en je kantelt. Hou vast aan je regel, geen budget, geen aankoop, dan eindig je mét marge in plaats van op de rand.`;
    } else {

      outlook=`Je houdt naar verwachting zo'n ${euro0(room)} over, en dat is geen toeval. De vraag is nu niet óf je iets leuks mag doen met dat geld, maar waar je het een bestemming geeft. Schuif het naar je spaardoel vóór het vanzelf opgaat, geld zonder bestemming verdwijnt, ook als je het goed deed.`;
    }
  }
  const lines=`<div class="cg-line">${cons}</div>${outlook?`<div class="cg-line${outWarn?' warn':''}">${outlook}</div>`:''}`;
  return `<div class="coachgreet"><div class="cg-hi">${greet}</div>${lines}</div>`+coachSandwich(m)+coachDiscipline(m);
}

// 1) STATUS op time-pacing: verwacht tempo = budget × verstreken/dim; incl. nog-te-komen vaste lasten in projEind
function coachStatus(m){
  const t=totals(m), L=monthLiquidity(), de=daysElapsed(m);
  const bud=Math.round(t.budget), spent=Math.round(t.spend);
  const dim=de.dim, elapsed=de.elapsed, left=Math.max(dim-elapsed,0);
  const expected=bud>0?Math.round(bud*elapsed/dim):0;            // lineair verwacht tempo tot nu
  const fm=(typeof forecastModel==='function')?forecastModel():null; const fVar=fm?fm.fVar:0;
  const variSpent=splitFixedVar(m).vari;
  const varRest=fVar>0?Math.max(0,Math.min(Math.round((fVar/dim)*left),Math.round(fVar-variSpent))):L.varDue;
  const projEnd=spent+L.fixDue+varRest;
  let verdict,vcol,vkey;
  if(bud<=0){ verdict='stel inkomen in'; vcol='var(--mut)'; vkey='none'; }
  else if(spent>bud||projEnd>bud){ verdict='over budget'; vcol='var(--amber)'; vkey='over'; }
  else if(spent<=expected*0.9){ verdict='ruim binnen'; vcol='var(--teal)'; vkey='room'; }
  else { verdict='op koers'; vcol='var(--teal)'; vkey='track'; }
  return {bud,spent,left,dim,elapsed,expected,projEnd,verdict,vcol,vkey,
    pct:bud>0?Math.min(spent/bud*100,100):0, pacePct:bud>0?Math.min(expected/bud*100,100):0};
}
// 3) "Wat ging goed", discretionair onder budget, anders een gedragswinst; nooit een over-budget categorie

  if(good) return `Je hield <b>${CATS[good.k].name.toLowerCase()}</b> strak onder controle (${euro0(good.a)} van ${euro0(good.b)}). Daar zat geen impuls in.`;
  // gedragswinst a) discretionaire categorie onder je eigen 3-maands gemiddelde
  const prev=months().filter(x=>x<m).slice(-3);
  if(prev.length){ let best=null;
    for(const k in act){ if(isFixedCat(k)||!CATS[k]||CATS[k].type!=='expense') continue;
      const avg=prev.reduce((s,mm)=>s+(catSpendMap(mm)[k]||0),0)/prev.length;
      if(avg>0 && act[k]<avg*0.85){ const drop=Math.round(avg-act[k]); if(!best||drop>best.drop) best={k,drop}; } }
    if(best) return `Je gaf <b>${euro0(best.drop)}</b> minder uit aan ${CATS[best.k].name.toLowerCase()} dan je gewend bent. Dat is een echte gedragswinst.`;
  }
  // gedragswinst b) totaal onder het verwachte tempo
  const st=coachStatus(m);
  if(st.bud>0 && st.spent<=st.expected*0.9) return `Je ligt <b>${euro0(st.expected-st.spent)}</b> onder je verwachte tempo voor deze maand. Goed gestuurd.`;
  return `Je kijkt naar je geld in plaats van weg. Dat is precies de gewoonte waar grip begint.`;
}

function coachForecastChart(M,accent){
  const MN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const vals=[].concat(M.doel,accent).filter(v=>v!=null);
  let lo=Math.min(0,...vals), hi=Math.max(...vals,1); const pad=(hi-lo)*0.12||100; hi+=pad; if(lo<0) lo-=pad;
  const W=330,H=150,LX=8,RX=W-8,top=12,bot=H-20;
  const X=i=>LX+i*((RX-LX)/11), Y=v=>top+(1-(v-lo)/(hi-lo||1))*(bot-top);
  const seg=a=>{ const p=[]; for(let i=0;i<12;i++){ if(a[i]==null) continue; p.push(X(i).toFixed(1)+','+Y(a[i]).toFixed(1)); } return p.join(' '); };
  const tx=X(M.cur).toFixed(1);
  const marker=`<line x1="${tx}" y1="${top}" x2="${tx}" y2="${bot}" stroke="rgba(255,255,255,.2)" stroke-width="1" stroke-dasharray="2 3"/><text x="${tx}" y="${top-3}" fill="var(--lab)" font-size="9" text-anchor="middle">nu</text>`;
  const lDoel=`<polyline points="${seg(M.doel)}" fill="none" stroke="var(--ref)" stroke-width="1.4" stroke-dasharray="4 3" opacity=".8"/>`;
  const lAcc=`<polyline points="${seg(accent)}" fill="none" stroke="var(--accent)" stroke-width="2.6"/>`;
  const labels=MN.map((mn,i)=>(i%2===0||i===11)?`<text x="${X(i).toFixed(1)}" y="${H-5}" fill="var(--lab)" font-size="8.5" text-anchor="middle">${mn}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Forecast: volle discipline vs jouw koers">${marker}${lDoel}${lAcc}${labels}</svg>`;
}
function coachPattern(){
  // 1) weekdag-concentratie van discretionaire uitgaven (laatste ~8 weken)
  try{ const lim=Date.now()-56*864e5; const days=[0,0,0,0,0,0,0]; const nm=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag']; let tot=0;
    for(const t of TX){ const c=catOf(t); if(!CATS[c]||CATS[c].type!=='expense'||isFixedCat(c)) continue; const dt=new Date(t.date); if(isNaN(dt)||dt.getTime()<lim) continue; const a=-t.amount; days[dt.getDay()]+=a; tot+=a; }   // netto per dag
    if(tot>0){ let mi=0; for(let i=1;i<7;i++) if(days[i]>days[mi]) mi=i; const share=days[mi]/tot; if(share>=0.28 && days[mi]>=40) return `je ${jrg('stuurbaar','stuurbare uitgaven')} pieken op <b>${nm[mi]}</b> (${Math.round(share*100)}%).`; }

/* ---- Temporal discounting: de parkeer-lus sluiten. Volgt MECHANISM_SPEC.temporalDiscounting ----
 * Parkeren is alleen een belofte als de app hem nakomt. Bij terugkeer presenteert de coach
 * dezelfde keuze opnieuw in koude staat: nu doen / nog even parkeren / laten gaan.
 * parkN telt hoe vaak hetzelfde item geparkeerd is; na herhaalParkeerSignaal keer wordt
 * het patroon zacht teruggespiegeld, zonder een beslissing af te dwingen. */
const PARK_RETURN_MS = 18*36e5;  // beloofde terugkeer (~na 'morgen'); gelijk aan de notificatie-drempel
const PARK_SIGNAL_N  = (MECHANISM_SPEC.temporalDiscounting.condities.herhaalParkeerSignaal)||4;
// oudste nog-openstaande geparkeerde beslissing die toe is aan terugkeer (log is nieuw→oud)
function coParkDue(){ const log=SET.coachLog||[]; const now=Date.now();
  for(let i=log.length-1;i>=0;i--){ const l=log[i];
    if(l && l.type==='beslis' && l.uitkomst==='geparkeerd' && !l.resolved
       && (now-l.ts)>=PARK_RETURN_MS && (now-l.ts)<=7*864e5) return l; }
  return null; }
// sluit een parkeer-beslissing af met een echte uitkomst (doorgezet/geannuleerd)
function coParkResolve(entry,uitkomst,intentie){ entry.resolved=true;
  coBuyLog(entry.item, +entry.bedrag||0, entry.potjeId, uitkomst, intentie||'nu'); save(); }
// koude her-keuze; geeft true terug als er iets te beslissen viel (anders draait het normale coachgesprek)
async function coParkReturn(m,keep){
  let p=coParkDue();
  if(!p && SET.demoMechanismen){ const dc=Object.keys(CATS).find(k=>CATS[k]&&CATS[k].type==='expense')||'vices'; p={__demo:true,type:'beslis',item:'koptelefoon',bedrag:120,potjeId:dc,uitkomst:'geparkeerd',intentie:'nu',parkN:1,ts:Date.now()-19*36e5}; }
  if(!p) return false;
  if(!keep) coReset();

  const cn=potName(p.potjeId), amt=+p.bedrag||0, it=String(p.item||'').trim(), n=(+p.parkN||1);
  coBub('co',`Een tijdje terug parkeerde je ${it?`<b>${esc(it)}</b> `:''}voor ${euro0(amt)} (${cn}).`,{html:true,accent:true});
  // gevolg in dagen marge, zelfde rekenwijze als de koopcheck
  try{ const _S=savingsModel(); const _pd=_S.monthlySaving>0?_S.monthlySaving/30:0;
    if(_pd>0){ const _d=Math.round(amt/_pd); await coSay(`Het kost nog steeds <span class="hl">~${_d} ${_d===1?'dag':'dagen'}</span> langer tot je buffer.`,{html:true}); }
    else { await coWait(140); } }catch(_){ }
  // herhaal-parkeer-signaal: zacht spiegelen, geen dwang
  if(n>=PARK_SIGNAL_N){ await coSay(`Je parkeert dit nu ${n} keer. Dat telkens uitstellen is ook een antwoord.`); }
  await coSay(`Doen, of laten?`);
  coChoices([

async function buyFlow(cat,amt,item){

  await coWait(180);
  const m=curMonth||months()[months().length-1]; const B=SET.budgets||{}; const has=+B[cat]>0;
  const rest=has?Math.round(+B[cat]-(catSpendMap(m)[cat]||0)):0;
  const planned=has && amt<=rest;   // geplande aankoop uit een gevuld potje = succes, geen loss-frame (MECHANISM_SPEC.lossAversion)
  // stakes (dagen tot buffer) alleen tonen als het géén schone geplande aankoop is
  if(!planned){ try{ const _S=savingsModel(); const _pd=_S.monthlySaving>0?_S.monthlySaving/30:0; if(_pd>0){ const _d=Math.round(amt/_pd); await coSay(`In doel-termen: <span class="hl">~${_d} ${_d===1?'dag':'dagen'}</span> langer tot je buffer.`,{html:true}); } }catch(_){ } }

  const fmeta=(SET.potMeta||{})[cat];
  if(fmeta && fmeta.type==='freq'){ const did=potjeKeer(m,cat); const nextN=did+1; await coSay(`Dit wordt je ${nextN}e keer ${cn} deze maand${nextN>fmeta.n?`. Je plande er ${fmeta.n}.`:` van je ${fmeta.n} geplande.`}`); }
  // 2) binaire check, groene weg, geen wrijving
  if(has && amt<=rest){
    await coSay(`Past binnen ${cn}, nog ${euro0(rest-amt)} over daarna. Ga je gang, dit hoort bij je plan.`);
    coBuyLog(item,amt,cat,'gepland','n.v.t.'); coFx('vastgelegd · gepland'); coEnd(); return;
  }
  if(!has) await coSay(`${CATS[cat].name} heeft nog geen potje. Geen budget, geen aankoop.`);
  else await coSay(`Hier is geen budget meer voor. ${CATS[cat].name} staat op ${euro0(Math.max(rest,0))}.`);
  await coSay(`Wil je dit echt, of wil je het nú?`);
  // 3) vertakking, regie bij gebruiker, nooit een verbod
  const opts=[
    {l:`Ik wil het écht`,act:async()=>{ await coSay(`Hoe regelen we het?`); coChoices([
      {l:`Plan voor volgende maand`,act:async()=>{ coBuyLog(item,amt,cat,'ingepland','echt'); coFx('vastgelegd · ingepland'); await coSay(`Staat klaar voor volgende maand. Dan koop je 't met budget.`); coEnd(); }},
      {l:`Haal uit ander potje`,act:()=>coBuyShift(item,amt,cat)},
      {l:`Toch niet`,act:async()=>{ coBuyLog(item,amt,cat,'geannuleerd','echt'); coFx('vastgelegd · geannuleerd'); await coSay(`Helder. Niks mis mee.`); coEnd(); }}
    ]); }},
    {l:`Ik wil het nú`,act:async()=>{ await coSay(`Eén ademhaling. Wat doe je?`); coChoices([
      {l:`Even wachten tot morgen`,act:async()=>{ coBuyLog(item,amt,cat,'geparkeerd','nu'); coFx('vastgelegd, geparkeerd'); await coSay(`Goed. Staat 't morgen nog, dan plannen we 't echt.`); coEnd(); }},
      {l:`Haal uit ander potje`,act:()=>coBuyShift(item,amt,cat)},
      {l:`Toch doen, ik weet wat het kost`,act:async()=>{ coBuyLog(item,amt,cat,'doorgezet','nu'); coFx('vastgelegd, doorgezet'); await coSay(`Doorgezet. Jij houdt de regie, ik leg 't vast. Geen oordeel.`); coEnd(); }}
    ]); }}
  ];

  coChoices(opts);
}

// concrete, gekwantificeerde gedragsregels per signaal, elke regel draagt z'n eigen maand-besparing (cut) voor de forecast
function coachRules(m,sig){
  const k=sig.catKey; const over=Math.round(sig.over||0); const r=(label,cut,heavy)=>({label,cut:Math.max(Math.round(cut||0),0),heavy:!!heavy});
  if(sig.scale==='week' && k){

    if(k==='vervoer'){ const s=vervoerSplit(m);
      if(s.lease>0 && s.lease>=s.fuel && s.lease>=s.park){ const L=Math.round(s.lease);
        return [ r('Lease herfinancieren (€75 p/m lager)',75),
                 r('Kleiner of korter contract (€120 p/m lager)',120),
                 r(`Lease afkopen (+${euro0(L)} p/m cashflow)`,L,true) ]; }
      if(s.park>0 && s.park>=s.fuel){ const P=Math.round(s.park);
        return [ r(`P+R in plaats van centrum (${euro0(P*0.5)} p/m lager)`,P*0.5),
                 r(`Parkeren vooraf boeken (${euro0(P*0.3)} p/m lager)`,P*0.3),
                 r(`Vaker met het OV (${euro0(P*0.4)} p/m lager)`,P*0.4) ]; }
      const F=Math.round(s.fuel); const fw=Math.max(Math.floor((F/4)/5)*5,5);
      return [ r(`Tank max ${euro0(fw)} per week (${euro0(F*0.2)} p/m lager)`,F*0.2),
               r(`Onbemand tanken (${euro0(F*0.06)} p/m lager)`,F*0.06),
               r(`Korte ritten op de fiets (${euro0(F*0.15)} p/m lager)`,F*0.15) ];
    }
    if(k==='uiteten') return [ r('Max 1× uit eten per week',over), r('Deze week thuis koken',over), r(`Max ${euro0(wk)} per week`,over) ];
    if(k==='boodschappen') return [ r('1 grote weekboodschap',over), r(`Max ${euro0(wk)} per week`,over), r('Geen losse ritjes',over) ];
    if(k==='shopping') return [ r('Eerst 24 uur wachten',over), r('Niks op afbetaling',over), r(`Max ${euro0(wk)} per week`,over) ];
    if(k==='vices') return [ r(`Max ${euro0(wk)} contant per week`,over), r('Niet pinnen',over), r('2 dagen per week overslaan',over) ];
    return [ r(`Max ${euro0(wk)} per week`,over), r('1 vaste dag per week',over), r('Geen impulsaankopen',over) ];
  }
  if(sig.scale==='maand' && sig.tone!=='good') return [ r('Een abonnement opzeggen (€15 p/m)',15), r('Automatisch €100 per maand sparen',0), r('Een vaste last verlagen (€50 p/m)',50) ];
  return [ r('Naar mijn buffer',0), r('Extra aflossen',0), r('Laten staan',0) ];
}

function coachProposal(m,sig){

  return {rules,best,baseEnd,lastName};

function coachCutEstimate(m,sig){

  if(sig.catKey==='vervoer'){ const s=vervoerSplit(m); return Math.round(Math.min(over, s.fuel+s.park+s.ov)); } // lease is niet beïnvloedbaar

function computeStreak(dagdoel){
  if(!(dagdoel>0)||!TX.length) return 0;
  const byDay={}; let first='9999-99-99';
  for(const x of TX){ if(x.date<first) first=x.date; if(isExpenseTx(x) && !isFixed(x)){ byDay[x.date]=(byDay[x.date]||0)+(-x.amount); } }   // netto per dag (terugstorting helpt de streak)
  const today=new Date(); today.setHours(0,0,0,0); let streak=0;
  for(let i=1;i<=120;i++){ const d=new Date(today); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10);
    if(ds<first) break;
    if((byDay[ds]||0)<=dagdoel) streak++; else break;
  }

const FIXED_CATS=new Set(['huur','verzekering','studie','sport','abonnement','bankkosten','persoonlijk']);
function isFixed(t){
  const ov=(SET.fixOvr||{})[t.id]; if(ov) return ov==='fixed';                   // handmatige override: deze transactie
  const ovm=(SET.fixOvrM||{})[recurKey(t)]; if(ovm) return ovm==='fixed';        // handmatige override: alle van deze winkel
  const c=CATS[catOf(t)]; if(!c || c.type!=='expense') return false;
  return recurringKeys().has(recurKey(t));   // vast = HERKENDE HERHALING (incasso OF periodieke overboeking, >=2x regelmatig); niet de categorie of betaalvorm
}

function openCompare(prev){
  const cur=curMonth;
  const cn=catSpendMap(cur), cp=catSpendMap(prev);
  const ck=[...new Set([...Object.keys(cn),...Object.keys(cp)])];
  const cds=ck.map(k=>({k,d:(cn[k]||0)-(cp[k]||0)})).filter(x=>Math.abs(x.d)>=2).sort((a,b)=>a.d-b.d);
  const mn=merchSpendMap(cur), mp=merchSpendMap(prev);
  const mk=[...new Set([...Object.keys(mn),...Object.keys(mp)])];
  const mds=mk.map(k=>({k,name:(mn[k]||mp[k]).name,d:(mn[k]?mn[k].s:0)-(mp[k]?mp[k].s:0)})).filter(x=>Math.abs(x.d)>=5);
  const saved=mds.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,6);
  const more=mds.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,6);
  const net=Object.values(cn).reduce((a,b)=>a+b,0)-Object.values(cp).reduce((a,b)=>a+b,0);
  const row=(name,icon,d,color)=>`<div class="tx" style="cursor:default"><div class="ava" style="background:${color}22">${icon}</div><div class="info"><div class="nm">${esc(name)}</div></div><div class="amt" style="color:${color};font-weight:700">${d<0?'−':'+'}${euro(Math.abs(d))}</div></div>`;
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="center" style="margin-bottom:8px"><div style="font-weight:800;font-size:var(--fs-lg)">${monthLabel(cur)} vs ${monthLabel(prev)}</div>
      <div style="font-size:var(--fs-xl);font-weight:800;margin:5px 0;color:${net<=0?'var(--green)':'var(--red)'}">${net<=0?'▼ '+euro(-net)+' minder uitgegeven':'▲ '+euro(net)+' meer uitgegeven'}</div></div>
    <div class="small muted" style="margin:10px 0 4px">Verschil per categorie (groen = bespaard)</div>
    ${cds.length?cds.map(x=>row(CATS[x.k].name,CATS[x.k].icon,x.d,x.d<0?'var(--green)':'var(--red)')).join(''):'<div class="muted small">Geen noemenswaardig verschil.</div>'}
    ${saved.length?`<div class="small muted" style="margin:16px 0 4px">${ICON('check')} Meest bespaard per winkel/leverancier</div>${saved.map(x=>row(x.name,ICON('store'),x.d,'var(--green)')).join('')}`:''}
    ${more.length?`<div class="small muted" style="margin:16px 0 4px">${ICON('trend')} Meer uitgegeven per winkel/leverancier</div>${more.map(x=>row(x.name,ICON('store'),x.d,'var(--red)')).join('')}`:''}`;
  showSheetBg();
}

// percentage → leesbare breuk voor lekentaal ("bijna de helft")
function pctWord(p){
  if(p>=46&&p<=54) return 'ongeveer de helft';
  if(p>=42&&p<46) return 'bijna de helft';
  if(p>=30&&p<=37) return 'ongeveer een derde';
  if(p>=22&&p<=28) return 'ongeveer een kwart';
  if(p>=63&&p<=70) return 'ongeveer twee derde';
  if(p>=72&&p<=78) return 'ongeveer driekwart';
  if(p>=80) return 'het grootste deel';
  return null;
}

/* ----- COACH (lichtgewicht AI-regels) ----- */

function coachTips(m){
  const t=totals(m), tips=[];
  const ms=months(), idx=ms.indexOf(m), prev=idx>0?ms[idx-1]:null;
  const pct = t.budget>0?t.spend/t.budget*100:0;
  const items = t.list.filter(x=>isExpenseTx(x));   // incl. terugstortingen: merch/weekdag netto
  const push=(pri,type,ic,msg,act)=>tips.push({pri,t:type,ic,m:msg,act:act||''});
  // inkomen-setup
  if(t.budget<=0) push(9,'info',ICON('gear'),`Geen inkomen herkend voor deze maand. Stel je <b>vast inkomen</b> in bij Instellingen voor een kloppend budget.`,"go('set')");
  // budgetstatus
  if(t.budget>0){
    const _d=new Date(), _nowYM=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0'); const isNowM=(m===_nowYM);
    const rem=t.budget-t.spend; let fixDue=0; if(isNowM){ try{ fixDue=monthLiquidity().fixDue||0; }catch(_){ fixDue=0; } }
    const realFree=rem-fixDue;
    if(pct>=100){
      push(9,'bad',ICON('alert'),`Je zit ${euro(t.spend-t.budget)} boven budget. Hou je uitgaven deze week stil.`,"go('act')");
    } else if(isNowM && fixDue>0 && realFree<0){
      push(8,'bad',ICON('alert'),`Nog ${euro(rem)} over, maar ${euro0(fixDue)} vaste lasten komt nog. Hou losse uitgaven klein.`,"openFixedDue()");
    } else if(pct<70){
      push(5,'good',ICON('party'),`Je zit ruim binnen budget${isNowM&&fixDue>0?`. ${euro0(realFree)} is echt vrij na je vaste lasten`:''}. Blijf zo doorgaan.`,(isNowM&&fixDue>0)?"openFixedDue()":'');
    } else {
      push(6,'warn',ICON('clock'),`Nog ${euro(rem)} te besteden${isNowM&&fixDue>0?`, waarvan ${euro0(realFree)} echt vrij`:''}. Hou je tempo laag.`,(isNowM&&fixDue>0)?"openFixedDue()":"go('ins')");
    }
  }
  // vaste lasten als % van inkomen
  const sv=splitFixedVar(m);
  if(t.income>0 && sv.fixed>0){ const fr=Math.round(sv.fixed/t.income*100);
    push(fr>50?7:3, fr>50?'warn':'info',ICON('lock'),`${fr>50?`Je vaste lasten (${euro0(sv.fixed)}/mnd) zijn aan de hoge kant. Zeg één ongebruikt abonnement op.`:`Je vaste lasten (${euro0(sv.fixed)}/mnd) zijn gezond. Mooi.`}`,"openFixedDue()");
  }
  // spaarresultaat deze maand
  const saved=t.income-t.spend, target=monthlySavingTarget();
  if(t.income>0 && target>0){
    if(saved>=target) push(6,'good',ICON('coins'),`Je haalde je spaardoel van ${euro0(target)}. Mooi, hou dit vast.`);
    else if(saved>0) push(7,'warn',ICON('coins'),`Je spaarde ${euro0(target-saved)} minder dan je doel. Zet vandaag wat extra opzij.`,"go('act')");
    else push(8,'bad',ICON('coins'),`Je gaf ${euro0(-saved)} meer uit dan er binnenkwam. Sla vandaag één aankoop over.`,"go('act')");
  }
  // grootste stijger vs vorige maand
  if(prev){ const pt=totals(prev); let big=null;
    for(const k in t.byCat){ if(CATS[k].type!=='expense') continue; const nw=-Math.min(t.byCat[k],0), bef=-Math.min(pt.byCat[k]||0,0);
      if(bef>5 && nw>bef*1.2 && (nw-bef)>20){ const d=nw-bef; if(!big||d>big.d) big={k,nw,bef,d,pct:Math.round((nw/bef-1)*100)}; } }
    if(big) push(6,'warn',CATS[big.k].icon,`<b>${CATS[big.k].name}</b> steeg ${big.pct}% t.o.v. ${MFULL[+prev.slice(5,7)-1]} (${euro0(big.bef)} → ${euro0(big.nw)}).`,`openVariance('${big.k}')`);
  }
  // top uitgavebestemming
  const merch=groupMerch(items)[0];
  if(merch && merch.s>50) push(4,'info',ICON('store'),`Je grootste uitgavebestemming: <b>${esc(merch.name)}</b> (${euro0(merch.s)}, ${merch.n}×).`,"go('tx')");
  // weekdag-piek (variabel)
  const varItems=items.filter(x=>!isFixed(x));
  if(varItems.length>=6){ const sum=[0,0,0,0,0,0,0]; for(const x of varItems) sum[(new Date(x.date).getDay()+6)%7]+=-x.amount;
    const peak=sum.indexOf(Math.max(...sum)); const names=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];
    if(sum[peak]>0) push(3,'info',ICON('cal'),`Je geeft je variabele geld het meest uit op <b>${names[peak]}</b> (${euro0(sum[peak])} deze maand).`,"openVarTx()");
  }
  // abonnementen
  const subs=items.filter(x=>catOf(x)==='abonnement');
  if(subs.length>=2){ const s=subs.reduce((a,b)=>a-b.amount,0); push(4,'info',ICON('repeat'),`<b>${subs.length} abonnementen</b> kosten samen ${euro0(s)} deze maand. Eén opzeggen bespaart direct.`,"openCategory('abonnement')"); }
  // buffer-ETA
  const S=savingsModel(); if(S.toGo>0 && S.monthlySaving>0 && S.cur>0) push(4,'info',ICON('target'),`Bij ${euro0(S.monthlySaving)}/mnd bereik je je buffer (${euro0(S.goal)}) over ±<b>${Math.round(S.monthsLeft)} maanden</b>.`);
  // ongecategoriseerd
  const uncat=items.filter(x=>catOf(x)==='overig'&&x.amount<0).length;
  if(uncat>=5) push(2,'info',ICON('tag'),`<b>${uncat} transacties</b> staan op "Overig". Categoriseer ze voor scherpere inzichten.`,"go('set')");
  return tips.sort((a,b)=>(b.pri||0)-(a.pri||0)).slice(0,5);
}
