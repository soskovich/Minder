      <div class="muted small">Beleggen hoort met geld dat je op korte termijn niet nodig hebt.</div></div>
    ${B.voorwaarden.map(rij).join('')}
    <div class="small muted" style="margin-top:12px;line-height:1.5">${B.volledig
      ? (B.klaar ? 'Alle drie gehaald.' : `Eerst ${esc(B.blokkade.naam)}.`)
      : 'Zolang een van de drie niet te beoordelen is, staat er geen uitkomst.'}</div>`;
  showSheetBg();
}
/* ===== De verdeelregel voor onregelmatig inkomen (v155) =====
 * Bonus, vakantiegeld, dertiende maand of een nabetaling landt zonder regel stil in vrij
 * besteedbaar. De regel wordt daarom vooraf vastgelegd, terwijl het geld er nog niet is: een vast
 * klein deel blijft vrij, de rest gaat naar de eerste voorwaarde die nog niet gehaald is.
 *
 * De volgorde hier is reserveringen, buffer, aankoopdoel. Dat is bewust een ANDERE volgorde dan
 * BELEGGEN_VOORWAARDEN, die met de buffer begint: daar is de vraag "wat blokkeert je", hier "waar
 * hoort dit geld als eerste heen". Wie ze gelijk wil trekken, moet dat op een plek doen.
 *
 * Geen enkel bedrag wordt hier gemodelleerd; ze komen alle drie uit bestaande uitkomsten. Twee
 * ervan vragen wel een omrekening, en die is zo klein mogelijk gehouden:
 *  - buffer: nergens bestaat een bedrag in euro's. bufferMaanden() is spaar/essCrisis; het bedrag
 *    om de drempel te halen is de omkering daarvan, met dezelfde twee waarden uit noodfondsModel()
 *    en de drempel uit MAAND_DREMPEL.
 *  - doel: doelTempo().gat is PER MAAND. Een tekort van 50 per maand is niet gedicht met 50
 *    eenmalig, dus het bedrag is gat maal maandenTot, beide uit diezelfde ene aanroep.
 * Zonder die twee omrekeningen zou het voorstel een bedrag noemen dat de voorwaarde niet haalt.
 *
 * KRITIEK - netto, nooit bruto. Komt het bedrag uit een herkende transactie, dan is het per
 * definitie netto. Voert de gebruiker zelf in, dan vragen we expliciet om het nettobedrag en zeggen
 * erbij wat een brutobedrag oplevert. Er wordt nergens netto uit bruto geschat.
 * KRITIEK - nooit automatisch verdelen (MECHANISM_SPEC.defaultEffect). Er beweegt geen geld, geen
 * saldo en geen doelbedrag. Vastleggen noteert de toewijzing alleen in de administratie.
 * KRITIEK - zwijgen zodra beleggenKlaar() onvolledig is: geen gedeeltelijke verdeling en geen
 * aanname voor de ontbrekende voorwaarde. */
const MEEVALLER_VOLGORDE = ['dekking', 'buffer', 'doel'];
const MEEVALLER_VRIJ_DEFAULT = 10;
function meevallerVrijPct(){
  const v = SET.meevallerVrijPct;
  if (v == null || v === '') return MEEVALLER_VRIJ_DEFAULT;
  const n = Math.round(+v);
  return (isFinite(n) && n >= 0 && n <= 100) ? n : MEEVALLER_VRIJ_DEFAULT;
}
/* Wat is er nodig om deze voorwaarde te halen, in euro's? null zodra de bron het niet weet. */
function meevallerNodig(key, rijen){
  const r = (rijen || []).find(x => x.key === key);
  if (key === 'dekking') return r ? Math.max(Math.round(r.tekortPerMaand || 0), 0) : null;
  if (key === 'buffer'){
    let M = null; try { M = noodfondsModel(); } catch(_){ return null; }
    if (!M || M.spaar == null || !(M.essCrisis > 0)) return null;
    return Math.max(Math.round(MAAND_DREMPEL.bufferKritiek * M.essCrisis - M.spaar), 0);
  }
  if (key === 'doel'){
    let d = null; try { d = maandDoel(); } catch(_){ return null; }
    if (!d || !d.T) return null;
    return Math.max(Math.round(d.T.gat * d.T.maandenTot), 0);
  }
  return null;
}
function meevallerNaam(key, rijen){
  if (key === 'dekking') return 'reserveringen';
  if (key === 'buffer') return 'buffer';
  const r = (rijen || []).find(x => x.key === key);
  return r ? (r.naam || 'aankoopdoel') : 'aankoopdoel';
}
function meevallerPlan(nettoBedrag){
  const bedrag = Math.max(Math.round(+nettoBedrag || 0), 0);
  const leeg = { vrij: 0, posten: [], rest: 0, volledig: false };
  let R = null, B = null;
  try { R = maandRegels(); B = beleggenKlaar(R); } catch(_){}
  if (!B || !B.volledig) return leeg;
  const vrij = Math.round(bedrag * meevallerVrijPct() / 100);
  let restant = Math.max(bedrag - vrij, 0);
  const posten = [];
  for (const key of MEEVALLER_VOLGORDE){
    const v = B.voorwaarden.find(x => x.key === key);
    if (!v || v.gehaald) continue;
    const nodig = meevallerNodig(key, R);
    if (nodig == null) return leeg;
    if (nodig <= 0) continue;
    const toegewezen = Math.min(nodig, restant);
    if (toegewezen > 0) posten.push({ key, naam: meevallerNaam(key, R), nodig, toegewezen, volledigGedekt: toegewezen >= nodig });
    restant -= toegewezen;
    if (restant <= 0) break;
  }
  return { vrij, posten, rest: Math.max(Math.round(restant), 0), volledig: true };
}
/* De meevaller zelf: een inkomensboeking van deze maand boven baseIncome() maal dezelfde drempel
   die de coachlaag gebruikt. Geen tweede drempel en geen eigen soort-detectie. */
function meevallerTx(){
  try {
    const base = baseIncome(); if (!(base > 0)) return null;
    const m = curMonth || months()[months().length - 1];
    const grens = base * MEEVALLER_FACTOR;
    return txOfMonth(m).filter(t => t.amount > grens && CATS[catOf(t)] && CATS[catOf(t)].type === 'income')
      .sort((a, b) => b.amount - a.amount)[0] || null;
  } catch(_){ return null; }
}
/* Wat er de vorige keer werd gekozen, uit de coachlog. Type tip, dus nooit de maandafspraak. */
function meevallerVorige(){
  try { return (SET.coachLog || []).find(l => l && l.type === 'tip' && l.meevaller) || null; } catch(_){ return null; }
}
function openMeevaller(bedrag, bron){
  const b = Math.max(Math.round(+bedrag || 0), 0);

    <input type="number" id="mvInp" value="${b > 0 ? b : ''}" placeholder="bv. 1800" style="width:100%">
    <div class="small muted" style="margin-top:6px">Vul in wat er daadwerkelijk op je rekening komt. Vul je een brutobedrag in, dan verdeelt het voorstel geld dat je niet krijgt en komt de verdeling niet uit.</div>
    <button class="btn sec" style="margin-top:8px" onclick="openMeevaller(document.getElementById('mvInp').value,'handmatig')">Bereken de verdeling</button>`;
  let body = '';

  else if (!P.volledig){

  } else {
    const rij = (naam, bedragP, noot, key) => `<div class="row" style="gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(naam)}</div>
        ${noot ? `<div class="small muted" style="line-height:1.4;margin-top:2px">${esc(noot)}</div>` : ''}</div>
      <div style="text-align:right;flex:0 0 auto"><div style="font-weight:700;white-space:nowrap">${euro0(bedragP)}</div>
        ${key ? `<div class="small" style="color:var(--teal);cursor:pointer;font-weight:600" onclick="meevallerVastleggen('${esc(key)}',${bedragP},${b})">Vastleggen</div>` : ''}</div></div>`;
    body = `${rij('Vrij besteedbaar', P.vrij, `${meevallerVrijPct()}% van ${euro0(b)}`, '')}
      ${P.posten.map(p => rij(p.naam, p.toegewezen, p.volledigGedekt ? 'dekt deze voorwaarde volledig' : `${euro0(p.toegewezen)} van de ${euro0(p.nodig)} die nodig is`, p.key)).join('')}
      ${P.rest > 0 ? rij('Blijft over', P.rest, 'je drie voorwaarden zijn gedekt', '') : ''}
      <div class="small muted" style="margin-top:10px;line-height:1.5">Dit is een voorstel. Er wordt geen geld verplaatst en geen saldo aangepast; vastleggen noteert alleen de toewijzing. De overboekingen doe je zelf bij je bank.</div>`;
  }
  $('#sheet').innerHTML = `<div class="grab"></div>
    <div class="center" style="margin-bottom:10px"><div style="font-weight:800;font-size:var(--fs-lg)">Verdeling van je meevaller</div>
      <div class="muted small">${bron === 'transactie' ? 'Uit een herkende bijschrijving, dus netto.' : 'Je eigen invoer.'}</div></div>
    ${vorige ? `<div class="small muted" style="margin-bottom:10px">Vorige keer: ${esc(vorige.text || '')}</div>` : ''}
    ${body}
    <div style="border-top:1px solid var(--line);margin:14px 0 10px"></div>
    ${invoer}
    <div class="small muted" style="margin-top:10px">Je regel: ${meevallerVrijPct()}% blijft vrij, de rest gaat naar de eerste voorwaarde die nog niet gehaald is. <span style="color:var(--teal);cursor:pointer" onclick="closeSheet();go('set')">Aanpassen ›</span></div>`;
  showSheetBg();
}
/* Vastleggen doet precies een ding: de toewijzing noteren. Geen saldo, geen doelbedrag, geen
   overboeking. Type tip, zodat de maandafspraak onaangeroerd blijft (v139/v140). */
function meevallerVastleggen(key, bedrag, totaal){
  const b = Math.max(Math.round(+bedrag || 0), 0); if (!b) return;
  let R = null; try { R = maandRegels(); } catch(_){}
  const naam = meevallerNaam(key, R);
  SET.meevallerLog = SET.meevallerLog || [];
  SET.meevallerLog.unshift({ ts: Date.now(), key, naam, bedrag: b, totaal: Math.round(+totaal || 0) });
  if (SET.meevallerLog.length > 50) SET.meevallerLog.length = 50;
  save();
  coachLogAdd({ type: 'tip', meevaller: true, text: `Van ${euro0(totaal)} ging ${euro0(b)} naar ${naam}.` });
  toast(`${ICON('check')} Toegewezen aan ${naam} genoteerd`);
  openMeevaller(totaal, 'handmatig');
}
/* Het oordeel: deterministisch, in deze volgorde. Geen vrije formulering, geen voorspelling die
   verder gaat dan de cijfers, geen aanmoediging en geen compliment. */
function maandOordeel(R){
  if(!R.length) return {zin:'Er is nog niets te beoordelen.', sub:''};
  const tekort=R.filter(r=>r.status==='tekort');
  const letop=R.filter(r=>r.status==='let op');
  const ok=R.filter(r=>r.status==='ok');
  const onb=R.filter(r=>r.status==='onbekend');
  if(R.length>=MAAND_DREMPEL.onbekendMin && onb.length/R.length>MAAND_DREMPEL.onbekendDeel)
    return {zin:'Er ontbreekt te veel om een oordeel te geven.', sub:`Onbekend: ${onb.map(r=>r.naam.toLowerCase()).join(', ')}.`};
  /* v173: onder de drempel viel een lijst met alleen onbekende regels door naar de telzin, en die
     telde er dan nul. Geen nieuwe formulering: dezelfde zin als bij een lege lijst (v167), met de
     bestaande opsomming van wat onbekend is. */
  if(!ok.length && !tekort.length && !letop.length)
    return {zin:'Er is nog niets te beoordelen.',
      sub: onb.length?`Onbekend: ${onb.map(r=>r.naam.toLowerCase()).join(', ')}.`:''};
  const metMaand=tekort.find(r=>r.maand);
  let zin;
  if(metMaand) zin=`Je systeem houdt stand tot ${resMaandLabel(metMaand.maand)}. Daarna loopt het vast op je ${metMaand.naam.toLowerCase()}.`;
  else if(tekort.length===1) zin=`Er is deze maand één ding dat een beslissing vraagt: ${tekort[0].naam.toLowerCase()}.`;
  else if(tekort.length>1) zin=`Er zijn deze maand ${tekort.length} dingen die een beslissing vragen.`;
  else if(letop.length) zin=`Er is niets dat vastloopt. ${letop.length} ${letop.length===1?'regel vraagt':'regels vragen'} aandacht.`;
  /* Het werkelijke aantal, niet vijf: welke regels er staan hangt af van wat je hebt ingesteld.
     'Alle' mag alleen als er ook niets onbekend is, anders leest de zin als een volledig oordeel
     over een onvolledige lijst. */
  else if(ok.length===1) zin='De enige regel die te toetsen is staat goed.';
  else zin = (ok.length===R.length) ? `Alle ${ok.length} regels staan goed.`
                                    : `De ${ok.length} regels die te toetsen zijn staan goed.`;
  const sub = ok.length
    ? `${ok.map(r=>r.naam.toLowerCase()).join(' en ')} ${ok.length===1?'is':'zijn'} in orde.`
    : '';
  return {zin, sub:sub.charAt(0).toUpperCase()+sub.slice(1)};
}
/* Precies twee vaste verbandregels. Niets afgeleid met een model of heuristiek. */
function maandVerband(R){
  const pat=R.find(r=>r.key==='patroon'&&r.sig&&r.sig.boven>0&&r.sig.cat);
  const gaten=R.filter(r=>r.status==='tekort'&&(r.key==='dekking'||r.key==='doel')&&r.tekortPerMaand>0)
               .sort((a,b)=>a.tekortPerMaand-b.tekortPerMaand);
  // 1) een uitgave boven normaal dekt het gat
  if(pat && gaten.length){
    const g=gaten[0];
    if(g.tekortPerMaand<=pat.sig.boven)
      return `${euro0(g.tekortPerMaand)} per maand extra naar ${esc(g.naam.toLowerCase())} sluit het gat. Dat is ongeveer wat je ${esc((CATS[pat.sig.cat]||{}).name||pat.sig.cat).toLowerCase()} boven je normaal ligt.`;
  }
  // 2) niet-toegewezen geld dekt het gat
  const aan=R.find(r=>r.key==='aansluiting');
  const doel=R.find(r=>r.key==='doel'&&r.status==='tekort'&&r.tekortPerMaand>0);
  if(aan&&aan.vrij>0&&doel){
    const n=Math.floor(aan.vrij/doel.tekortPerMaand);
    if(n>0) return `Er staat ${euro0(aan.vrij)} niet toegewezen. Dat dekt ${n} ${n===1?'maand':'maanden'} van je tekort.`;
  }
  return '';
}

  return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0;margin-top:6px"></span>`;

    ${maandDot(r.status)}

    <div style="text-align:right;flex:0 1 auto;min-width:0;max-width:42%"><div style="font-weight:700;white-space:nowrap">${esc(r.waarde)}</div>
      <div class="small" style="color:var(--mut2);font-size:var(--fs-xs);line-height:1.35">${esc(r.eenheid)}</div></div></div>`;
}
function maandGelezen(){
  const d=SET.maandGelezen; if(!d) return '';
  const dt=new Date(d); if(isNaN(dt)) return '';
  return `<div class="small" style="color:var(--mut2);text-align:center;margin-top:14px">Gelezen op ${dt.getDate()} ${MFULL[dt.getMonth()]} ${dt.getFullYear()}.</div>`;
}
function renderMaand(){
  const m=kijkMaand();
  /* v176: bij een afgesloten maand valt het hele regelblok weg. Alle vijf de regels lezen een stand
     van NU - dekking() en spaarVrij() een rekeningsaldo, bufferMaanden() je spaarsaldo, maandDoel()
     je huidige plan, en maandPatroon() leest scoreNotifs(), dat intern op ms[ms.length-1] rekent en
     dus altijd de lopende maand beschrijft. Ze met terugwerkende kracht tonen zou suggereren dat je
     buffer in juli op dat niveau stond terwijl je het saldo van vandaag ziet. Weglaten dus, niet
     labelen: onder een historische kop leest een getal als historisch, hoe je het ook bijschrijft.
     Wat wel per maand rekent is maandKpiBlok(m); dat blijft staan. Het oordeel verdwijnt mee, want
     het telt de regels die er staan en er staan er geen. */
  if(!isLopendeMaand(m)){
    $('#s-maand').innerHTML=`${afgeslotenMaandBanner(m)}
      <div class="card">
        <div class="row" style="gap:8px"><span class="hlabel" style="margin:0;flex:1">Je maand</span>${maandKiezerChip(m)}</div>
        <div class="small muted" style="margin-top:8px;line-height:1.5">Je maand-regels gaan over hoe je er nu voor staat: je buffer, je dekking, je aansluiting spaargeld en je aankoopdoel lezen allemaal een saldo van vandaag. Die zijn niet met terugwerkende kracht te bepalen, dus voor een afgesloten maand staan ze er niet.</div>
        <div class="small" style="margin-top:8px"><span style="color:var(--teal);cursor:pointer;font-weight:600" onclick="naarLopendeMaand()">Naar ${esc(monthLabel(thisYM()))} ›</span></div>
      </div>
      ${maandKpiBlok(m)}
      <div style="height:12px"></div>`;
    return;
  }
  const R=maandRegels();
  /* Geen enkele regel te toetsen: dan vat dit scherm niets samen. Bij nul transacties komt hier
     niemand meer langs - render() en go() vallen dan terug op renderEmpty() - maar een scherm dat
     zijn eigen leegte niet kent, vult hem met een claim. */
  if(!R.length){
    $('#s-maand').innerHTML=`<div class="card"><div class="small muted">Er is nog te weinig ingesteld om je maand samen te vatten. <span style="color:var(--teal);cursor:pointer" onclick="go('set')">Naar Instellingen \u203a</span></div></div>`;
    return;
  }
  /* v162: structurele signalen lopen mee in het oordeel volgens de bestaande beslisboom. Ze gaan
     bewust NIET naar maandCoachIngang() of maandVerband(): die kennen alleen de vijf regels, en een
     gesprek openen op een sleutel die coTopicMaand() niet kent zou een half pad opleveren. */
  const STR=maandStructureel();
  const RO=R.concat(STR);
  const O=maandOordeel(RO);
  /* v134: beslissing en aandacht zijn twee dingen, en de beslisboom gebruikt die woorden al zo -
     tekort vraagt een beslissing, let op vraagt aandacht. Stonden ze samen onder één kop, dan telde
     de zin (alleen de tekorten) iets anders dan wat eronder stond. Nu een kaart per betekenis; een
     lege kaart valt weg, dus in de praktijk zie je zelden drie kaarten. */
  const opVolgorde=a=>{ const i=MAAND_VOLGORDE.indexOf(a.key); return i<0?99:i; };   // v162: structurele signalen achter de vijf regels
  const beslis=RO.filter(r=>r.status==='tekort').sort((a,b)=>opVolgorde(a)-opVolgorde(b));
  /* v175: beslis filterde op RO en aandacht op R, dus een structureel signaal met status 'let op'
     landde in geen van beide kaarten en telde alleen mee in de oordeelzin. Dat is verlies, geen
     weergavefout: het scherm noemt het dan wel in de kop maar toont het nergens. Beide kaarten
     putten nu uit dezelfde lijst. 'goed' blijft op R: een structureel signaal is per definitie
     geen 'ok', en zou daar alleen ruis toevoegen. */
  const aandacht=RO.filter(r=>r.status==='let op').sort((a,b)=>opVolgorde(a)-opVolgorde(b));
  const goed=R.filter(r=>r.status==='ok');
  const verband=maandVerband(RO);
  $('#s-maand').innerHTML=`
    ${maandAfspraakLus()}
    <div class="card">
      <div class="row" style="gap:8px;margin:0 0 6px"><span class="hlabel" style="margin:0;flex:1">Je maand</span>${maandKiezerChip(m)}</div>
      <div style="font-size:var(--fs-lg);font-weight:700;line-height:1.4">${esc(O.zin)}</div>
      ${O.sub?`<div class="small muted" style="margin-top:6px">${esc(O.sub)}</div>`:''}
    </div>
    ${beslis.length?`<div class="card"><div class="hlabel" style="margin:0 0 2px">Vraagt een beslissing</div>
      ${beslis.map(r=>maandRij(r,false)).join('')}
      ${verband?`<div class="small" style="margin-top:10px;color:var(--mut2);line-height:1.5">${verband}</div>`:''}</div>`:''}
    ${aandacht.length?`<div class="card"><div class="hlabel" style="margin:0 0 2px">Vraagt aandacht</div>
      ${aandacht.map(r=>maandRij(r,false)).join('')}
      ${(!beslis.length&&verband)?`<div class="small" style="margin-top:10px;color:var(--mut2);line-height:1.5">${verband}</div>`:''}</div>`:''}
    ${goed.length?`<div class="card"><div class="hlabel" style="margin:0 0 2px">Staat goed</div>
      ${goed.map(r=>maandRij(r,true)).join('')}</div>`:''}
    ${maandKpiBlok(m)}
    ${maandBeleggenRegel(R)}
    ${maandCoachIngang(RO)}
    ${maandGelezen()}
    <div style="height:12px"></div>`;
}
/* v141: de ingang naar het maandgesprek, onder de vijf regels. Geen neutrale knop: de zin zegt
   waar het over gaat, afgeleid van de zwaarste regel, in de woorden die het scherm zelf gebruikt
   (tekort vraagt een beslissing, let op vraagt aandacht). Staat er al een afspraak voor deze maand,
   dan staat die hier in plaats van de ingang: één afspraak per maand, dus niet twee wegen naar een
   nieuwe. Alleen onbekende regels betekent geen ingang. */
function maandCoachIngang(R){
  const m=curMonth||months()[months().length-1];
  const af=(typeof coachThisMonthAfspraak==='function')?coachThisMonthAfspraak():null;
  if(af) return `<div class="card">

    <div style="line-height:1.45">${esc(af.text||'')}</div>
    <div class="small" style="margin-top:8px;color:var(--teal);cursor:pointer;font-weight:600" onclick="coStart('maand','${esc(m)}')">Aanpassen ›</div></div>`;
  const z=coMaandZwaarste(R);
  if(z) return `<div class="card" style="cursor:pointer" onclick="coStart('maand','${esc(m)}','${esc(z.key)}')">
    <div class="row" style="gap:8px"><span style="flex:1;min-width:0;line-height:1.45">${esc(z.naam)} ${z.status==='tekort'?'vraagt een beslissing':'vraagt aandacht'}. Zullen we dat doorlopen?</span>
      <span style="color:var(--teal);font-weight:700">›</span></div></div>`;
  if(R.some(r=>r.status==='ok')) return `<div class="card" style="cursor:pointer" onclick="coStart('algemeen','${esc(m)}')">
    <div class="row" style="gap:8px"><span style="flex:1;min-width:0;line-height:1.45" class="muted">Er valt deze maand niets te beslissen. Wil je toch iets doornemen?</span>
      <span style="color:var(--teal);font-weight:700">›</span></div></div>`;
  return '';
}
/* ---------- DE AFSPRAAKLUS (v142) ----------
   Een afspraak die nooit wordt teruggelezen blijft een losse opmerking. Het maandscherm opent
   daarom met de uitkomst van de afspraak van vorige maand.

   Wat toetsbaar is: alleen een afspraak met een categorie. Die ontstaat als je in het gesprek een
   besparingsregel koos (`cut_<categorie>`) of via coShowAction een potje zette of verschoof.
   Wat niet toetsbaar is: alles wat alleen een regelKey draagt. Geen van de vijf functies achter de
   maandregels is maand-gebonden - bufferMaanden(), dekking(12), spaarVrij(), maandDoel() en
   maandPatroon() beschrijven de stand van nu, niet die van een afgelopen maand. Er is dus geen
   manier om ze op de afspraakmaand te meten zonder een tweede meetmethode te bouwen, en dat zou
   het maandscherm tegenspreken. 'niet te toetsen' is daarom het hoofdpad, geen foutgeval: dan
   vraagt de app het je zelf. Er wordt nooit geraden en nooit uit de tekst afgeleid.

   De vergelijking loopt over twee AFGERONDE maanden: de maand vóór de afspraakmaand tegen de
   afspraakmaand zelf. De lopende maand is geen meetbasis (v107/v113); een volle maand tegen een
   halve zetten laat elke categorie dalen en zou stelselmatig 'gelukt' melden. */
const AFSPRAAK_MARGE = 0.02;   // een daling telt pas als daling boven 2% van de referentiemaand
function coYm(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
/* Precies één maand terug, niet verder: is er vorige maand geen afspraak gemaakt, dan valt er
   niets terug te koppelen. De log staat nieuwste eerst (coachLogAdd unshift), dus find() geeft de
   meest recente. Zelfde maandlogica als coSameMonth: Date + getFullYear/getMonth. */
function vorigeAfspraak(){
  const n=new Date(); const v=new Date(n.getFullYear(), n.getMonth()-1, 1);
  const ym=v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0');
  return (SET.coachLog||[]).find(l=>l && l.type==='afspraak' && l.ts && coYm(l.ts)===ym) || null;
}
// de zelfopgegeven uitkomst bij een afspraak, of null
function afspraakZelf(af){
  if(!af||!af.ts) return null;
  const r=(SET.coachLog||[]).find(l=>l && l.type==='reflectie' && String(l.af)===String(af.ts));
  return r?String(r.text||''):null;
}
function afspraakUitkomst(af){
  const leeg={status:'niet te toetsen', tekst:(af&&af.text)||'', toen:null, nu:null};
  if(!af||!af.ts) return leeg;
  if(!af.cat || !CATS[af.cat]) return leeg;                 // geen categorie: niets objectiefs te meten
  const nuM=coYm(af.ts);
  const d=new Date(af.ts); const p=new Date(d.getFullYear(), d.getMonth()-1, 1);
  const toenM=p.getFullYear()+'-'+String(p.getMonth()+1).padStart(2,'0');
  let ms=[]; try{ ms=months(); }catch(_){ return leeg; }
  if(!ms.includes(nuM) || !ms.includes(toenM)) return leeg;  // een van beide maanden heeft geen data
  let a=null,b=null;
  try{ a=catSpendMap(toenM)[af.cat]; b=catSpendMap(nuM)[af.cat]; }catch(_){ return leeg; }
  if(a==null||b==null) return leeg;
  a=Math.round(a); b=Math.round(b);
  if(!(a>0)) return leeg;                                    // geen basis om tegen af te zetten
  return {status: (b < a*(1-AFSPRAAK_MARGE)) ? 'gelukt' : 'niet gelukt',
    tekst: af.text||'', toen:{maand:toenM, bedrag:a}, nu:{maand:nuM, bedrag:b}};
}
/* Eén keer per maand, in dezelfde vorm als coachRecall: dezelfde afspraak, dezelfde maand, dan
   niet nog eens. De regel valt ook weg zodra je de afspraak van deze maand hebt gemaakt. */
function afspraakGezien(af){
  const G=SET.afspraakGezien; const ym=coYm(Date.now());
  return !!(G && af && String(G.ts)===String(af.ts) && G.ym===ym);
}
function afspraakSluit(){
  const af=vorigeAfspraak(); if(!af) return;
  SET.afspraakGezien={ts:af.ts, ym:coYm(Date.now())}; save(); renderMaand();
}
function afspraakZelfZet(uitkomst){
  const af=vorigeAfspraak(); if(!af) return;
  const u=(uitkomst==='gelukt')?'gelukt':'niet gelukt';
  coachLogAdd({type:'reflectie', text:u, af:af.ts});
  renderMaand();
}
/* De regel: spiegel (wat spraken we af), gevolg (wat deed het cijfer), keuze (alleen waar er iets
   te kiezen valt). Geen oordeel over de persoon, geen verwijt, geen aanmoediging, geen streak. */
function maandAfspraakLus(){
  const af=vorigeAfspraak(); if(!af) return '';
  if(afspraakGezien(af)) return '';
  try{ if(coachThisMonthAfspraak()) return ''; }catch(_){}
  const U=afspraakUitkomst(af);
  const kop=`<div class="hlabel" style="margin:0 0 6px">Je afspraak van vorige maand</div>`;
  const spiegel=`<div style="line-height:1.45">Vorige maand sprak je af: <span class="hl">${esc(U.tekst)}</span>.</div>`;
  const sluit=`<div class="small" style="margin-top:10px;color:var(--mut2);cursor:pointer" onclick="afspraakSluit()">Gezien</div>`;
  if(U.status!=='niet te toetsen'){
    const nm=CATS[af.cat]?CATS[af.cat].name:'die categorie';
    return `<div class="card">${kop}${spiegel}
      <div class="small" style="margin-top:6px;color:var(--mut2);line-height:1.45">${esc(nm)} ging van ${euro0(U.toen.bedrag)} naar ${euro0(U.nu.bedrag)}.</div>${sluit}</div>`;
  }
  const zelf=afspraakZelf(af);
  if(zelf) return `<div class="card">${kop}${spiegel}
    <div class="small" style="margin-top:6px;color:var(--mut2);line-height:1.45">Je gaf zelf aan: ${esc(zelf)}.</div>${sluit}</div>`;
  return `<div class="card">${kop}${spiegel}
    <div class="small" style="margin-top:6px;color:var(--mut2);line-height:1.45">Deze afspraak is niet uit je cijfers af te lezen. Is het gelukt?</div>
    <div class="chips" style="margin-top:9px">
      <span class="chip" style="flex:1;text-align:center" onclick="afspraakZelfZet('gelukt')">Gelukt</span>
      <span class="chip" style="flex:1;text-align:center" onclick="afspraakZelfZet('niet gelukt')">Niet gelukt</span>
    </div>${sluit}</div>`;
}
/* ---------- RESERVERINGEN EN DEKKING (v128) ----------
   De dekkingsvraag: is mijn reserveringenpot toereikend voor de kosten die de komende twaalf
   maanden aankomen maar niet maandelijks vallen? Dat is een andere vraag dan de liquiditeitsvraag
   (krijgt mijn saldo een dip), en daarom een los pad: recurringSchedule() en liquidityDaily()
   worden hier NIET aangeroepen en blijven ongewijzigd. Verplichtingen voer je zelf in; er wordt
   niets uit je transacties gedetecteerd.
   De inleg is nadrukkelijk GEEN spaardoel: benodigdPerMaand komt niet in planItems(),
   allocatePlan() of planCapacity(), anders concurreert de reservering met je spaardoelen en wordt
   hij dubbel geteld. */
function resLijst(){ return Array.isArray(SET.reserveringen)?SET.reserveringen:[]; }
function resAccId(){ const a=SET.resAcc; return (a && allAccounts().includes(a))?a:''; }
function resSaldo(){ const a=resAccId(); if(!a) return null; const b=accBalance(a); return b==null?null:Math.round(b); }
const RES_INTERVAL=[[0,'eenmalig'],[1,'maandelijks'],[3,'per kwartaal'],[6,'half jaar'],[12,'jaarlijks']];
function resIntervalLabel(iv){ const r=RES_INTERVAL.find(x=>x[0]===Math.max(Math.round(+iv||0),0)); return r?r[1]:'eenmalig'; }
function resYmPlus(o){ const n=new Date(); const d=new Date(n.getFullYear(), n.getMonth()+Math.round(+o||0), 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
/* Eerstvolgende voorkomen als offset in maanden vanaf deze maand, of null.
   Verstreken vervalmaand met een interval rolt door naar de volgende cyclus; een verstreken
   eenmalige post vervalt volledig. */
function resVolgende(v){
  const o=doelMaandenTot((v||{}).vervalmaand); if(o==null) return null;
  const iv=Math.max(Math.round(+((v||{}).intervalM)||0),0);
  if(o>=0) return o;
  if(!iv) return null;
  return o + Math.ceil(-o/iv)*iv;
}
/* Rolt de lijst uit over de horizon. Een kwartaalpost verschijnt dus vier keer in een jaar.
   Posten zonder bedrag rollen niet uit (ze zetten wel `volledig` op false in dekking()).
   `offset` staat er naast `maand` bij omdat de dekkingssom erop rekent. */
function verplichtingen(maanden){
  const H=Math.max(Math.round(+maanden||12),1); const uit=[];
  for(const v of resLijst()){
    if(!v||!v.id) continue;
    const bedrag=Math.round(+v.bedrag||0); if(!(bedrag>0)) continue;
    const iv=Math.max(Math.round(+v.intervalM||0),0);
    let o=resVolgende(v); if(o==null) continue;
    let guard=0;
    while(o<H && guard++<200){ uit.push({id:v.id, naam:v.naam||'Verplichting', bedrag, maand:resYmPlus(o), offset:o, intervalM:iv, cat:v.cat||''}); if(!iv) break; o+=iv; }
  }
  return uit.sort((a,b)=>a.offset-b.offset || String(a.naam).localeCompare(String(b.naam)));
}
/* De dekkingssom.
   benodigdPerMaand : per voorkomen bedrag / maanden tot die maand. Valt de post deze maand, dan heb
                      je hem nu in zijn geheel nodig, vandaar max(offset,1).
   benodigdeStand   : het OPGEBOUWDE deel van het eerstvolgende voorkomen per post:
                      bedrag x (interval - maanden tot vervaldag) / interval, geklemd op 0..bedrag.
                      Latere voorkomens binnen de horizon tellen niet mee - de kwartalen van volgend
                      jaar hoef je nu nog niet te hebben. Een eenmalige post draagt niets bij aan de
                      stand: een kostenpost die je vandaag invoert geeft geen achterstand die er
                      nooit was.
   gedektTot        : chronologisch aftellen vanaf de huidige stand; de laatste maand die je nog
                      volledig kunt betalen. `gat` is het eerste voorkomen dat niet meer past.
   Nooit doorrekenen op een onbekend saldo, nooit een schatting invullen (v59/v73). */
function dekking(maanden){
  const H=Math.max(Math.round(+maanden||12),1);
  const lijst=resLijst();
  const V=verplichtingen(H);
  const zonderBedrag=lijst.filter(v=>v&&!(Math.round(+v.bedrag||0)>0));
  const acc=resAccId(); const stand=resSaldo();
  const eerste={}; for(const x of V) if(eerste[x.id]==null) eerste[x.id]=x.offset;
  let benodigdPerMaand=0, benodigdeStand=0; const regels=[];
  for(const x of V){
    const perMaand=x.bedrag/Math.max(x.offset,1);
    benodigdPerMaand+=perMaand;
    let opgebouwd=0;
    if(x.intervalM>0 && eerste[x.id]===x.offset)
      opgebouwd=x.bedrag*Math.min(Math.max(x.intervalM-x.offset,0),x.intervalM)/x.intervalM;
    benodigdeStand+=opgebouwd;
    regels.push({soort:'post', id:x.id, naam:x.naam, bedrag:x.bedrag, maand:x.maand, offset:x.offset,
                 intervalM:x.intervalM, cat:x.cat, perMaand:Math.round(perMaand), opgebouwd:Math.round(opgebouwd)});
  }
  benodigdPerMaand=Math.round(benodigdPerMaand); benodigdeStand=Math.round(benodigdeStand);
  let gedektTot=null, gat=null, graad=null, tekort=0;
  if(stand!=null){
    let run=stand, vorige=null;
    for(const x of V){
      if(run-x.bedrag<0){
        // gedektPct: welk deel van DEZE post je pot nog draagt. Een eigen noemer naast graad, want
        // zonder opbouw-eis (benodigdeStand 0) is graad null en valt er niets te delen (v132).
        gat={maand:x.maand, naam:x.naam, bedrag:x.bedrag, tekort:Math.round(x.bedrag-run),
             gedektPct: x.bedrag>0?Math.max(Math.round(Math.max(run,0)/x.bedrag*100),0):null};
        break; }
      run-=x.bedrag; vorige=x.maand;
    }
    gedektTot = gat ? vorige : (V.length?V[V.length-1].maand:null);
    graad = benodigdeStand>0 ? Math.round(stand/benodigdeStand*100) : null;
    tekort = Math.max(benodigdeStand-stand,0);
    regels.push({soort:'rekening', id:acc, naam:acctNiceName(acc), bedrag:stand});
  }
  const volledig = !!acc && stand!=null && zonderBedrag.length===0;
  return {benodigdPerMaand, benodigdeStand, werkelijkeStand:stand, graad, gedektTot, gat, tekort,
          regels, volledig, zonderBedrag:zonderBedrag.map(v=>v.naam||'Verplichting'), aantal:lijst.length, horizon:H};
}
function resMaandLabel(ym){ const m=+String(ym||'').slice(5,7); return m?(MFULL[m-1]+' '+String(ym).slice(0,4)):''; }
// De zin: spiegel, gevolg, keuze. Geen oordeel, geen felicitatie.
function dekkingTekst(D){
  if(!D) return '';
  if(!D.aantal) return 'Je hebt nog geen verplichtingen ingevoerd.';
  if(!D.volledig){
    if(!resAccId()) return `Voor wat er dit jaar nog aankomt heb je ${euro0(D.benodigdPerMaand)} per maand nodig. Wijs een reserveringsrekening aan, dan zie je of je pot toereikend is.`;
    if(D.werkelijkeStand==null) return 'Het saldo van je reserveringsrekening is nog onbekend, dus de dekking is niet te berekenen.';
    return `${D.zonderBedrag.join(' en ')} ${D.zonderBedrag.length===1?'heeft':'hebben'} nog geen bedrag, dus de dekking klopt nog niet.`;
  }
  if(!D.regels.some(r=>r.soort==='post')) return 'Er komt de komende twaalf maanden niets aan uit je lijst.';
  const perM=`Voor wat er dit jaar nog aankomt heb je ${euro0(D.benodigdPerMaand)} per maand nodig.`;
  if(!D.gat) return `Je bent gedekt tot en met ${resMaandLabel(D.gedektTot)}. ${perM}`;
  const tot=D.gedektTot?`Je bent gedekt tot en met ${resMaandLabel(D.gedektTot)}.`:'Je pot dekt de eerstvolgende post nu al niet.';
  return `${tot} In ${resMaandLabel(D.gat.maand)} komt ${euro0(D.gat.bedrag)} en dan kom je ${euro0(D.gat.tekort)} tekort. ${perM}`;
}
function resDekkingCard(){

    <div class="small muted" style="margin-top:4px">Kosten die niet elke maand vallen, zoals aanslagen, premies en onderhoud.</div></div>`;

    <div class="row"><span style="flex:1;font-weight:600;font-size:var(--fs-md)">Reserveringen</span><span class="small muted">${esc(kop)} \u00b7 <span style="color:var(--teal)">bekijk \u203a</span></span></div>
    <div class="small muted" style="margin-top:5px;line-height:1.5">${esc(dekkingTekst(D))}</div>

/* Eén controlemoment op de lijst zelf: handmatige invoer drijft weg zodra een premie verandert.
   Hooguit één keer per maand, en weg te tikken zonder iets te wijzigen. */
function resCheckDue(){ return resLijst().length>0 && SET.resCheck!==thisYM(); }

}
/* ---- beheer ---- */
function openReserveringen(){ renderResSheet(); showSheetBg(); }
function renderResSheet(){
  const D=dekking(12); const acc=resAccId(); const stand=resSaldo();
  const lijst=resLijst().slice().sort((a,b)=>{ const oa=resVolgende(a), ob=resVolgende(b);

// geordende planlijst: SET.planOrder leidt, noodfonds staat standaard bovenaan,
// onbekende ids sluiten achteraan aan en verwijderde ids worden genegeerd.
function planItems(){
  const by=planMap(); const seen=new Set(); const out=[];
  for(const id of planOrderList()) if(by[id]&&!seen.has(id)){ out.push(by[id]); seen.add(id); }
  if(!seen.has(PLAN_NF)){ out.unshift(by[PLAN_NF]); seen.add(PLAN_NF); }
  for(const id in by) if(!seen.has(id)){ out.push(by[id]); seen.add(id); }
  return out;
}
// maandelijkse spaarruimte; zonder spaardoel val terug op je bezuinigingsruimte
function planCapacity(){
  let cap=Math.round(monthlySavingTarget()||0);
  if(!(cap>0)){ try{ cap=Math.round(noodfondsModel().comfortTot||0); }catch(_){} }
  return Math.max(cap,0);
}
// Waterfall in prioriteitsvolgorde, met een verdeelmodus per doel:
//   fixed → min(perMaand, wat er nog is) · pct → min(pct% van de héle capaciteit, wat er nog is)
//   auto  → neemt de rest die op dat moment overblijft
// Nooit meer dan wat het doel nog nodig heeft; wat overblijft zakt door naar het volgende item.
// Ronde 2 (v98): wat na ronde 1 nog over is blijft niet liggen maar zakt top-down door naar het
// eerstvolgende lopende doel, ook voorbij zijn vaste maandbedrag. Per item: base = ronde 1,
// extra = wat er is doorgezakt, alloc = de som (waarop status en eta gerekend worden).
function allocatePlan(){
  const cap=planCapacity(); let left=cap;
  const P=planItems().map(it=>{
    const rest=Math.max(Math.round(it.doel-it.gespaard),0);
    let alloc=0, status='';
    if(planPaused(it.id)) status='gepauzeerd';
    else if(rest<=0) status='bereikt';
    else {
      let wens;
      if(it.mode==='fixed')    wens=Math.min(it.perMaand,rest);
      else if(it.mode==='pct') wens=Math.min(Math.round(cap*it.pct/100),rest);
      else                     wens=rest;                       // auto: pakt wat er nog is
      alloc=Math.max(Math.min(wens,left),0); left-=alloc;
    }
    return Object.assign({},it,{rest,alloc,base:alloc,extra:0,status});
  });
  // ronde 2: het restant vult de lopende doelen bij, in dezelfde prioriteitsvolgorde
  for(const p of P){
    if(left<=0) break;
    if(p.status==='gepauzeerd'||p.rest<=0) continue;            // gepauzeerd en bereikt slaan we over
    const ruimte=p.rest-p.alloc; if(ruimte<=0) continue;        // dit doel heeft al wat het nodig heeft
    const bij=Math.min(ruimte,left); p.alloc+=bij; p.extra+=bij; left-=bij;
  }
  // status + eta op de definitieve toewijzing; en bij "wacht op capaciteit": wie het opmaakt
  let auto1=null;
  for(const p of P){
    if(p.status==='gepauzeerd'||p.status==='bereikt'){ p.eta=null; continue; }
    p.status=p.alloc>0?'':'wacht op capaciteit';
    p.eta=null;
    if(p.alloc>0){
      if(p.type==='aflossen'){ const mm=payoffMonths(p.rest,(p.debtPer||0)+p.alloc,p.rente); p.eta=isFinite(mm)&&mm>0?mm:null; }
      else p.eta=Math.ceil(p.rest/p.alloc);
    }
    // een auto-doel erboven pakt alles wat er nog was — dát is waarom dit item niets krijgt
    if(p.status==='wacht op capaciteit'&&auto1) p.blokkeerder={id:auto1.id,naam:auto1.naam,type:auto1.type};
    if(p.mode==='auto'&&p.alloc>0) auto1=p;
  }
  return P;
}
// wat er ná het bijvullen van alle lopende doelen nog over is (verdwijnt nergens: zie renderPlan)
function planVrij(P){
  P=P||allocatePlan();
  const used=P.reduce((a,x)=>a+(+x.alloc||0),0);
  return Math.max(planCapacity()-used,0);
}
function planMove(id,dir){
  const ids=planItems().map(x=>x.id); const i=ids.indexOf(id); const j=i+dir;
  if(i<0||j<0||j>=ids.length) return;
  ids.splice(j,0,ids.splice(i,1)[0]);
  SET.planOrder=ids; save(); render();
}

const PLAN_MODES=[['auto','Auto'],['fixed','Vast bedrag'],['pct','Percentage']];
function planModeLabel(p){

}
// "over ~8 maanden" wordt pas concreet met een datum erbij. Zelfde patroon als de oude hero:
// vandaag + het aantal maanden, als maand + jaar (bv. "rond mrt 2027").
function etaDatum(maanden){
  const n=Math.round(+maanden||0); if(n<=0) return '';
  const d=new Date(); d.setMonth(d.getMonth()+n);
  return d.toLocaleDateString('nl-NL',{month:'short',year:'numeric'}).replace('.','');
}
function planSub(p){
  // v173: geen looptijd en geen datum op een voortgang die niet is vastgesteld
  if(p.nfOnbekend) return `${euro0(p.alloc)}/mnd`;
  if(p.status==='bereikt') return `${ICON('party')} Bereikt`;
  if(p.status==='gepauzeerd') return 'Gepauzeerd · krijgt nu niets';
  if(p.status==='wacht op capaciteit') return `Wacht op capaciteit · ${planModeLabel(p)}, maar alles gaat eerst naar de doelen erboven`;
  const dat=p.eta?etaDatum(p.eta):'';
  const eta=p.eta?` · op dit tempo ~${p.eta} ${p.eta===1?'maand':'maanden'}${dat?` · rond ${dat}`:''}`:'';
  const mod=p.mode==='pct'?`${(''+p.pct).replace('.',',')}% · `:(p.mode==='fixed'?'vast · ':'');
  // maak zichtbaar dat een deel is doorgezakt uit wat er boven overbleef
  const dz=(+p.extra>0&&p.mode!=='auto')?` · waarvan ${euro0(p.extra)} doorgezakt`:'';
  return `${mod}${euro0(p.alloc)}/mnd${dz}${eta}`;
}
// Waaróm krijgt dit doel niets? Een auto-doel erboven pakt wat er overblijft; met een maandbedrag

/* Spaargeld boven je noodfonds-doel (v99).
   Het noodfonds-plan-item klemt zijn voortgang op het doel (planMap), en de voortgang van een
   spaardoel is en blijft het handmatige veld "Al gespaard". Geld dat bóven je buffer op je
   spaarrekening staat viel daardoor tussen wal en schip: het telde nergens mee. Dit maakt het
   zichtbaar en toewijsbaar; het rekent niets automatisch mee. Wat je al bij je doelen hebt
   ingevuld gaat eraf, zodat hetzelfde geld nooit twee keer als "vrij" wordt aangeboden. */
/* Wat staat er op je spaarrekening dat aan geen enkel plan-item is toegewezen? (v126, v172)
   Sinds elk item een toegewezen bedrag draagt is dit één aftrekking over alle items, zonder
   uitzondering voor het noodfonds. Dit is vanaf nu ook het enige mechanisme dat je handmatige
   toewijzingen bijstuurt, dus de regel mag niet wegvallen in de ruis. */
function spaarVrij(){
  let doel=0; try{ doel=Math.round(noodfondsModel().doel||0); }catch(_){}
  let S={cur:0,missing:true}; try{ S=spaarSaldo(); }catch(_){}
  if(S.missing) return {vrij:0,saved:0,doel,toegewezen:0};
  const saved=Math.round(S.cur||0);
  const nf=Math.max(Math.round(+SET.nfToegewezen||0),0);
  const toegewezen=(SET.goals||[]).reduce((a,g)=>a+Math.max(Math.round(+g.gespaard||0),0),0)
    + (doel>0?Math.min(nf,doel):nf);
  return {vrij:Math.max(saved-toegewezen,0), saved, doel, toegewezen};
}
/* Bestemming: het bovenste lopende item dat een toegewezen bedrag draagt. Sinds v172 is dat ook
   het noodfonds. Een aflos-item niet: dat leidt zijn voortgang af uit de restschuld en mag je niet
   zomaar ophogen (v100). */
function spaarVrijDoel(P){
  return (P||allocatePlan()).find(x=>(x.type==='goal'||x.type==='noodfonds')
    &&x.status!=='bereikt'&&x.status!=='gepauzeerd')||null;
}
/* v172: hier stonden spaarStil(), spaarOver(), spaarOverDoelen(), spaarOverLine() en
   spaarOverAf(). Ze bestonden alleen om het verschil te melden dat ontstond doordat het noodfonds
   zijn voortgang uit je saldo herrekende terwijl een spaardoel dat niet deed: samen konden ze meer
   claimen dan er stond, zonder dat jij iets fout deed. Sinds elke voortgang in het plan een
   toewijzing is kan die som het saldo alleen nog overschrijden als je zelf te veel toewijst, en dat
   houdt spaarVrijToe() al tegen. De oorzaak is weg, dus de melding ook. */
/* v126: deze twee regels hingen aan het noodfonds-plan-item, want ze werden binnen de plan-rij
   gerenderd en begonnen met een type-guard. Zonder noodfondsitem, of zodra het gepauzeerd, bereikt
   of uit het plan was, verdween de controle geruisloos - precies wanneer je buffer op peil is en
   alles naar je doelen gaat. Ze staan nu op planniveau, naast de andere plan-brede regels. */
/* v172: sinds elke voortgang in het plan een toewijzing is, is dit het enige mechanisme dat die
   handmatige cijfers bijstuurt. Een gemuteerde regel tussen de andere regels verdwijnt in de ruis,
   dus hij staat als eigen blok met dezelfde linkerrand die de verse-start-kaart al gebruikt. Geen
   amber: er is niets mis, er valt alleen iets toe te wijzen (v78/v93). */
function spaarVrijLine(P){
  /* v172: zonder bekend spaarsaldo valt er niets te vergelijken, maar dan hoort de reden er wel te
     staan - die stond eerder in de plan-rij van het noodfonds (v168) en die rij toont nu een
     toewijzing. Zelfde vorm, zelfde volgende stap. */
  let S=null; try{ S=spaarSaldo(); }catch(_){}
  if(S && S.missing) return `<div class="card spaar-vrij" style="border-left:3px solid var(--teal);border-radius:0 16px 16px 0;padding:12px 14px;margin:0 0 9px">
    <div class="small" style="line-height:1.5">We weten niet wat er op je spaarrekening staat, dus we kunnen je toewijzingen er niet tegen afzetten.</div>
    <div class="small" style="margin-top:6px"><span style="color:var(--teal);font-weight:600;cursor:pointer" onclick="event.stopPropagation();openSpaarrekening()">wijs je spaarrekening aan ›</span></div></div>`;
  const V=spaarVrij(); if(!(V.vrij>0)) return '';
  const t=spaarVrijDoel(P); const kort=isMode('rustig');
  const txt=kort
    ? `${euro0(V.vrij)} is nog niet toegewezen.`
    : `Er staat ${euro0(V.vrij)} op je spaarrekening dat aan geen enkel item in je plan is toegewezen.`;
  const cta=t
    ? `<span style="color:var(--teal);font-weight:600;cursor:pointer" onclick="event.stopPropagation();spaarVrijToe('${t.id}')">toewijzen aan ${esc(t.naam)} ›</span>`
    : `<span style="color:var(--teal);font-weight:600;cursor:pointer" onclick="event.stopPropagation();openGoal()">voeg een doel toe ›</span>`;
  return `<div class="card spaar-vrij" style="border-left:3px solid var(--teal);border-radius:0 16px 16px 0;padding:12px 14px;margin:0 0 9px">
    <div class="small" style="line-height:1.5">${txt}</div>
    <div class="small" style="margin-top:6px">${cta}</div></div>`;
}
// telt het vrije spaargeld op bij "Al gespaard" van dat doel — nooit meer dan het doel nog nodig
// heeft; de rest blijft staan voor een volgend doel. Omkeerbaar: het veld blijft bewerkbaar.
function spaarVrijToe(id){
  const V=spaarVrij(); if(!(V.vrij>0)) return;
  if(id===PLAN_NF){
    const nu=Math.max(Math.round(+SET.nfToegewezen||0),0);
    const rest=Math.max(V.doel-nu,0); if(rest<=0) return;

function duurSchuldNudge(){

  const spaarRente=(+SET.spaarRente||0)/100;
  const verschil=(+d.rente)/100-spaarRente;
  if(verschil<(C.minRenteVerschil||0.05)) return null;              // alleen dúre schuld; studieschuld/hypotheek vallen af
  if(planOrderList().includes(planDebtKey(d.id))) return null;      // staat al in je plan
  const n=SET.debtNudge;                                           // niet zeuren: zelfde schuld pas na 3 maanden opnieuw
  if(n && String(n.debtId)===String(d.id) && !((+d.rente)>(+n.rente||0)+0.01)){
    if((Date.now()-(+n.ts||0))/(1000*60*60*24*30.44) < 3) return null;
  }
  return {d, verschil, pct:Math.round(verschil*1000)/10};
}

function payoffMonths(rest, per, jr){ if(per<=0||rest<=0) return 0; const r=(+jr||0)/100/12; if(r<=0) return Math.ceil(rest/per); if(per<=rest*r+0.001) return Infinity; return Math.ceil(-Math.log(1-rest*r/per)/Math.log(1+r)); }

// Detecteert of de maandaflossing van een schuld terugkomt in je transacties, en of die in je uitgaven zit
// (isExpenseTx → telt in je restsaldo) of erbuiten loopt (intern / anders). On-the-fly, geen opslag.
function debtInExpenses(d){
  const per=+((d&&d.perMaand)||0); if(per<=0) return {status:'geen'};
  const tol=Math.max(per*0.12,15);
  const win=new Set(months().slice(-6));
  const groups={};
  for(const t of TX){ if(t.pending||!(t.amount<0)) continue;
    if(!win.has(t.date.slice(0,7))) continue;
    const key=recurKey(t); if(!key) continue;
    const g=(groups[key]=groups[key]||{amts:[],yms:new Set(),expense:0,intern:0,other:0,isLease:false});
    g.amts.push(Math.abs(t.amount)); g.yms.add(t.date.slice(0,7));
    if(isExpenseTx(t)) g.expense++; else if(catOf(t)==='intern') g.intern++; else g.other++;
    // op naam+desc, niet op de afgekapte recurKey: "LEASE" kan voorbij de eerste 20 tekens staan
    if(!g.isLease && LEASE_RX.test((t.name||'')+' '+(t.desc||''))) g.isLease=true;
  }
  const dn=recurKey({name:(d&&d.naam)||''});
  const med=a=>{ const s=[...a].sort((x,y)=>x-y),n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0; };
  // Alleen-op-bedrag matchen pakt soms de verkeerde groep: binnen de tolerantie kan een interne
  // overboeking van toevallig hetzelfde bedrag staan, en bij een gelijke stand won de eerst gevonden.
  // Twee voorkeuren maken de keuze betrouwbaar, zonder een status af te dwingen:
  const leaseDebt=!!(d && d.type==='financiallease');
  let best=null;
  for(const k in groups){ const g=groups[k]; if(g.yms.size<2) continue;   // ≥2 maanden = terugkerend
    const m=med(g.amts), amtMatch=Math.abs(m-per)<=tol, nameMatch=!!(dn&&k&&(k.indexOf(dn)>=0||dn.indexOf(k)>=0));
    if(!amtMatch&&!nameMatch) continue;
    const cls=(g.expense>=g.intern&&g.expense>=g.other)?'expense':(g.intern>=g.other?'intern':'other');
    let score=(nameMatch?2:0)+(amtMatch?1:0);
    if(leaseDebt && g.isLease) score+=2;      // (a) een herkende lease-termijn hoort bij een financial-lease-schuld
    if(cls==='expense') score+=0.5;           // (b) een aflossing is eerder een echte betaling dan een interne overboeking
    if(!best||score>best.score) best={cls,score,amtMatch,nameMatch,m};
  }
  if(!best) return {status:'niet-gevonden'};
  const conf=best.nameMatch&&best.amtMatch?'hoog':(best.amtMatch?'waarschijnlijk':'mogelijk');
  const status=best.cls==='expense'?'in-uitgaven':(best.cls==='intern'?'intern':'buiten-uitgaven');
  return {status,conf,bedrag:Math.round(best.m)};
}
/* ----- Terugkerende auto-lease: aanbod om te koppelen aan een financial-lease-schuld -----
 * Puur detectie + aanbod. Categorisering, netWorth en debtInExpenses blijven ongemoeid: zonder
 * koppeling blijft de lease gewoon een vervoer-uitgave. Na koppeling doet het bestaande
 * financial-lease-mechanisme (aflossing + auto als bezitting) zijn werk. */
const LEASE_RX=/HILTERMANN|LEASECONTRACT|PRIVATE ?LEASE|\bLEASE/i;
function leaseLinkOffer(t){
  if(!t || !(t.amount<0) || t.pending) return null;
  if(!LEASE_RX.test((t.name||'')+' '+(t.desc||''))) return null;
  if(!isFixed(t)) return null;                                   // alleen een herkende, terugkerende betaling
  const key=recurKey(t); if(!key) return null;
  if((SET.leaseLinkOff||{})[key]) return null;                   // afgewezen: niet blijven vragen
  for(const d of (SET.debts||[])){                               // al gekoppeld? dan zwijgen we
    if(d.type!=='financiallease') continue;
    const dn=recurKey({name:d.naam||''});
    if(dn && (dn.indexOf(key)>=0 || key.indexOf(dn)>=0)) return null;
    const per=+d.perMaand||0;
    if(per>0 && Math.abs(per-Math.abs(t.amount))<=Math.max(per*0.12,15)) return null;
  }
  let per=Math.round(Math.abs(t.amount));                        // maandbedrag uit het schema, niet deze ene termijn
  try{ const s=recurringSchedule().find(x=>x.key===key && x.type==='fixed'); if(s&&s.amount>0) per=Math.round(s.amount); }catch(_){}
  return {key, txId:t.id, naam:titleCase(cleanMerch(t.name)||t.name||'Lease'), per};
}
function leaseLinkStart(txId){
  const t=TX.find(x=>x.id===txId); const o=t?leaseLinkOffer(t):null; if(!o) return;
  openDebt(null,{naam:o.naam, perMaand:o.per, type:'financiallease'});   // bestaande invoer, voorgevuld
}
function leaseLinkDismiss(txId){
  const t=TX.find(x=>x.id===txId); const o=t?leaseLinkOffer(t):null; if(!o) return;
  SET.leaseLinkOff=SET.leaseLinkOff||{}; SET.leaseLinkOff[o.key]=1; save();
  openSheet(txId);                                               // aanbod weg, de rest van de sheet blijft staan
}
function renderDebts(){
  const ds=SET.debts||[];
  const _now=new Date();
  const svDatum=n=>{ const d=new Date(_now.getFullYear(), _now.getMonth()+n, 1); return MNAMES[d.getMonth()]+' '+d.getFullYear(); };   // vandaag + n maanden → "mnd jaar"
  let laatsteN=0, alleEindig=true; const nSchuld=ds.filter(d=>Math.max(+d.rest||0,0)>0).length;
  const rows=ds.map(d=>{ const start=+d.start||0, rest=Math.max(+d.rest||0,0), per=+d.perMaand||0, jr=+d.rente||0;
    const mnd=payoffMonths(rest,per,jr); const rentePerMnd=Math.round(rest*(jr/100/12));
    let sub, fwd='', warn=false;
    if(rest<=0){ sub='Afgelost'; }
    else {
      const prog=(start>rest)?`${euro0(start-rest)} van ${euro0(start)} afgelost`:'';   // voortgang op eigen invoer (start − rest)
      if(per<=0){ sub=[prog,'nog geen maandaflossing ingevuld'].filter(Boolean).join(' · '); alleEindig=false; }
      else if(mnd===Infinity){ warn=true; alleEindig=false;   // aflossing ≤ maandrente: schuld daalt niet
        sub = (per>=rentePerMnd)
          ? `Je aflossing dekt precies de rente. De schuld blijft op ${euro0(rest)} staan.`
          : `Je lost ${euro0(per)} per maand af, maar er komt ${euro0(rentePerMnd)} rente bij. Zo daalt ${esc(d.naam||'deze schuld')} niet, hij groeit met ±${euro0(rentePerMnd-per)} per maand.`;
      } else {
        const p=[]; if(prog) p.push(prog); p.push(`~${mnd} mnd op ${euro0(per)}/mnd`); if(jr>0) p.push(`${jr}% rente`); sub=p.join(' · ');
        fwd=`Op dit tempo schuldenvrij rond <b>${svDatum(mnd)}</b>${jr>0?'':' (zonder rente gerekend)'}.`;
        if(mnd>laatsteN) laatsteN=mnd;
      }
    }
    const coupled=(d.type==='financiallease'&&d.autoBezit&&(+d.dagwaarde||0)>0);
    if(coupled && rest>0){ sub+=(sub?' · ':'')+`eigen deel ${euro0((+d.dagwaarde||0)-rest)}`; }
    const nmLabel=coupled?' <span style="color:var(--mut2);font-size:10.5px">· gekoppeld aan bezitting</span>':'';
    // Detectie: zit de MAANDBETALING in je uitgaven? (v100) Die groene regel zei "aflossing …",
    // wat las alsof de schuldstand was bijgewerkt. Dat gebeurt nergens: `rest` is en blijft je
    // eigen invoer. Daarom expliciet "maandbetaling", plus de hint dat je de stand zelf bijwerkt.
    let inExpTxt='',inExpCol='var(--mut2)';
    if(rest>0){ const det=debtInExpenses(d);
      if(det.status==='in-uitgaven'){ inExpTxt=(det.conf==='hoog'?'maandbetaling herkend in je uitgaven':'maandbetaling lijkt in je uitgaven te zitten'); inExpCol='var(--green)'; }
      else if(det.status==='intern'){ inExpTxt='maandbetaling loopt als interne overboeking · niet in je uitgaven'; inExpCol='var(--amber)'; }
      else if(det.status==='buiten-uitgaven'){ inExpTxt='maandbetaling valt buiten je uitgaven'; inExpCol='var(--amber)'; }
      else if(det.status==='niet-gevonden'){ inExpTxt='maandbetaling niet teruggevonden in je uitgaven'; inExpCol='var(--mut2)'; }
    }
    const zelfHint=rest>0?`<span class="debt-zelf" style="color:var(--mut2);cursor:pointer" onclick="event.stopPropagation();openDebtUpdate('${d.id}')">${inExpTxt?' · ':''}restschuld werk je zelf bij</span>`:'';

/* ===== Geld opzij bij een partij die niet bij je bezittingen staat (v157) =====
 * Boek je inleg naar een beleggingspartij als 'sparen', dan telt hij terecht niet meer als uitgave
 * (v77) - maar daarmee weet de app nog steeds niet wat die belegging waard IS. Bezittingen zijn
 * handmatige invoer (SET.assets); er is geen koppeling en er valt niets af te leiden.
 *
 * Deze laag STELT ALLEEN VAST dat er zo'n partij is en verzint geen bedrag. Uit de stromen valt de
 * waarde ook niet te reconstrueren: opnames kunnen een positie afromen die is opgebouwd voor je
 * data begint, en marktbeweging komt nooit langs je bankrekening. In de praktijkdata liep het netto
 * zelfs negatief (4.918 in, 8.245 uit), en een saldo kan niet negatief zijn. Een geschat bedrag
 * hier zou dus stellig en fout zijn.
 *
 * Wat er buiten valt: een overboeking naar je eigen rekening (tegenrekening in OWN), een partij die
 * de naam van een eigen rekening draagt, en een partij die al als bezitting bestaat.
 * Bekende grens, dezelfde als v128: OWN wordt uit TX afgeleid (v122), dus een eigen rekening die
 * zelf geen boekingen in je data heeft is niet als eigen te herkennen. Zo'n overboeking kan hier
 * dus als externe partij opduiken; de melding stelt alleen vast en wijzigt niets, dus dat kost
 * hooguit een tik om hem weg te zetten. */
const BEZIT_MIN_POSTEN = 3;      // minder dan dit is geen patroon maar een incident
function beleggingZonderBezitting(){
  let eigen, eigenNamen;
  try {
    eigen = new Set(OWN);
    eigenNamen = new Set(OWN.map(a => String(acctNiceName(a) || '').toLowerCase()).filter(Boolean));
  } catch(_) { return []; }
  const assets = ((SET.assets || []).map(a => String(a.naam || '').trim().toLowerCase()).filter(Boolean));
  const per = new Map();
  for (const t of TX) {
    if (!(t.amount < 0)) continue;
    let c = ''; try { c = catOf(t); } catch(_) { continue; }
    if (c !== 'sparen') continue;
    if ((t.refNums || []).some(n => eigen.has(n))) continue;          // naar je eigen rekening
    const naam = String((typeof cleanMerch === 'function' ? cleanMerch(t.name) : t.name) || t.name || '').trim();
    if (!naam) continue;
    const k = naam.toLowerCase();
    if (eigenNamen.has(k)) continue;                                  // je eigen potje onder eigen naam
    const r = per.get(k) || { naam, n: 0, som: 0, eerste: '', laatste: '' };
    r.n++; r.som += -t.amount;
    if (!r.eerste || t.date < r.eerste) r.eerste = t.date;
    if (t.date > r.laatste) r.laatste = t.date;
    per.set(k, r);
  }
  return [...per.values()]
    .filter(r => r.n >= BEZIT_MIN_POSTEN)
    .filter(r => !assets.some(a => a.includes(r.naam.toLowerCase()) || r.naam.toLowerCase().includes(a)))
    .map(r => ({ ...r, som: Math.round(r.som) }))
    .sort((a, b) => b.som - a.som);
}

function saveAsset(id){

  if(grow){ a.rend=+v('aRend')||0; a.infl=+v('aInfl')||0; a.horizon=+v('aHor')||0; a.eenmalig=Math.round(+v('aEen')||0); a.per=Math.round(+v('aPer')||0); }

function netWorthSeries(){
  const ms=months(); if(ms.length<2) return [];
  const cur=totalBalance().sum; const flow={}; ms.forEach(m=>flow[m]=0);
  for(const t of TX){ const m=t.date.slice(0,7); if(flow[m]!==undefined) flow[m]+=t.amount; }
  const balEnd={}; let runs=cur;
  for(let i=ms.length-1;i>=0;i--){ balEnd[ms[i]]=runs; runs-=flow[ms[i]]; }
  const overig=(SET.assets||[]).reduce((s,a)=>s+(+a.waarde||0),0)+leaseAutoTotal();
  const sch=(SET.debts||[]).reduce((s,d)=>s+Math.max(+d.rest||0,0),0);
  return ms.map(m=>({m,nw:Math.round(balEnd[m]+overig-sch)}));
}

function fireInputs(){

  let autoAnnualExp=0;

    let rec=months().filter(mm=>mm<nowYM).slice(-3); if(!rec.length) rec=months().slice(-3);
    if(rec.length){ let s=0; for(const mm of rec){ const sf=splitFixedVar(mm); s+=(+sf.fixed||0)+(+sf.vari||0); } autoAnnualExp=Math.round(s/rec.length*12); }
  }catch(_){}

  if(!nfCur){ try{ nfCur=Math.round(savingsModel().cur||0); }catch(_){} }
  const emergencyGoal=nfDoel;   // FIRE-mijlpaal = restsaldo-waterval = Noodfonds-kaart
  let monthlySaving=0; try{ monthlySaving=Math.round(monthlySavingTarget()||0); }catch(_){}   // beoogde maandelijkse spaarinleg — het tempo waarop het noodfonds vult (zelfde bron als Vooruitblik)
  let missBal=false; try{ missBal=((totalBalance().missing||0)>0); }catch(_){}   // eerlijk over onbekende input (C2-noot)
  const debtsEnriched=(SET.debts||[]).map(d=>Object.assign({},d,{inExp:debtInExpenses(d)}));   // detectie: zit de aflossing in je uitgaven?

  const _grow=(SET.assets||[]).filter(a=>a.grow), _flatA=(SET.assets||[]).filter(a=>!a.grow);

  const flatItems=_flatA.map(a=>({naam:a.naam||'Bezitting', waarde:Math.max(+a.waarde||0,0)}));
  const leaseItems=(SET.debts||[]).filter(d=>d.type==='financiallease'&&d.autoBezit&&(+d.dagwaarde||0)>0).map(d=>({naam:d.naam||'Auto', dagwaarde:+d.dagwaarde||0, afschr:(+d.afschr||0)>0?+d.afschr:18}));   // afschrijving %/jr (declining balance, default 18)

  $('#s-fire').innerHTML=html; return html;

/* Eén ingang, vanaf het FIRE-scherm: vul een bedrag in en zie het gevolg in maanden.
   Spiegel (wat je weghaalt), gevolg (waar je horizon heen schuift), keuze (die is aan jou).
   Geen waarschuwing, geen advies, geen ontrading. */
function openOnttrekking(){
  window._onttrBedrag=window._onttrBedrag||'';
  renderOnttrekkingSheet(); showSheetBg();
  setTimeout(()=>{ const el=document.getElementById('onttrInp'); if(el){ el.focus(); el.select(); } },60);
}
function onttrekkingReken(){
  const el=document.getElementById('onttrInp');
  window._onttrBedrag=String((el&&el.value)||'').trim();
  renderOnttrekkingSheet();
  setTimeout(()=>{ const e2=document.getElementById('onttrInp'); if(e2) e2.focus(); },30);
}
function onttrekkingUitkomst(K){
  if(!K) return '';
  const n=K.maandenLater;
  const jr=(K.jaarNa===K.jaarNu)
    ? `Je FIRE-jaar blijft ${K.jaarNu}`
    : `Je FIRE-jaar verschuift van ${K.jaarNu} naar ${K.jaarNa}`;
  const staart=(n>0)
    ? `, ongeveer ${n} ${n===1?'maand':'maanden'} later.`
    : (n<0 ? `, ongeveer ${-n} ${n===-1?'maand':'maanden'} eerder.` : '. Op deze schaal verschuift er niets.');
  return `<div class="small" style="margin-top:12px;color:var(--txt);line-height:1.6">${euro0(K.bedrag)} uit je belegde laag. ${jr}${staart} Wat je hiermee doet is aan jou.</div>`;
}
function renderOnttrekkingSheet(){
  const ruw=window._onttrBedrag||'';
  const b=Math.round(+ruw||0);
  const K=b>0?onttrekkingKosten(b):null;
  const geen=(b>0&&!K)?`<div class="small muted" style="margin-top:12px;line-height:1.6">Hier valt nog niets over te zeggen. Vul je saldi en bezittingen aan en zet een FIRE-getal, dan rekent dit terug.</div>`:'';
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div style="font-weight:800;font-size:var(--fs-lg);margin-bottom:2px" id="onttrHead">Wat kost een onttrekking?</div>
    <div class="small muted" style="margin-bottom:12px">Geld uit je belegde laag komt niet terug in euro's maar in tijd: het rendement dat je erover misloopt.</div>
    <label class="fld">Bedrag (€)</label>
    <input id="onttrInp" type="number" inputmode="numeric" min="0" step="100" value="${esc(ruw)}" placeholder="bv. 4000" style="width:100%">
    <button class="btn" style="margin-top:12px;width:100%" onclick="onttrekkingReken()">${ICON('trend')} Reken door</button>
    ${onttrekkingUitkomst(K)}${geen}
    <div style="font-size:var(--fs-xs);color:var(--mut2);margin-top:14px;padding:8px 10px;background:rgba(159,176,199,.07);border-radius:8px">Rekenvoorbeeld met je eigen aannames uit de vermogensreis. Je uitgaven en maandinleg blijven hierbij gelijk. Geen advies of belofte.</div>`;
}
function renderVermogen(){
  if(!TX.length){ $('#s-vermogen').innerHTML='<div class="card"><div class="small muted">Nog geen data. Importeer of koppel je bank.</div></div>'; return; }
  const w=netWorth(); const series=netWorthSeries();
  const ib='background:none;border:none;color:var(--teal);font-size:24px;cursor:pointer;padding:0 8px 0 0;line-height:1';
  const head=`<div class="row" style="align-items:center;margin:2px 2px 14px;gap:6px"><button onclick="go('dash')" title="Terug" style="${ib}">‹</button><b style="font-size:var(--fs-lg);flex:1">Vermogen</b><span class="small" style="color:var(--teal);cursor:pointer;font-weight:600" onclick="go('dash')">Klaar</span></div>`;
  // moderne netto-vermogen-kaart: compositiebalk (eigen deel vs schuld) i.p.v. saldo-verloop
  const _nwUnder=w.netto<0, _nwBez=w.bez, _nwSch=Math.max(w.sch,0);
  const _nwEig=_nwBez>0?Math.max(0,Math.min(Math.round(w.netto/_nwBez*100),100)):(w.netto>0?100:0);
  const _nwSchP=_nwBez>0?Math.max(0,Math.min(Math.round(_nwSch/_nwBez*100),100)):(_nwSch>0?100:0);
  const _nwChip=_nwSch<=0?`<span style="font-weight:700;color:var(--green);font-size:12px">schuldenvrij</span>`:(_nwUnder?`<span style="font-weight:700;color:var(--red);font-size:12px">onder water</span>`:`<span style="font-weight:700;color:var(--teal);font-size:12px">${_nwEig}% is van jou</span>`);
  const _dot=c=>`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:5px"></span>`;
  const _nwBar=(_nwBez<=0&&_nwSch<=0)?'' : (_nwUnder
    ? `<div style="height:16px;border-radius:9px;overflow:hidden;margin:12px 0 8px;background:var(--red)"></div><div class="small muted">${_dot('var(--red)')}Je schuld ${euro0(_nwSch)} is groter dan je bezit ${euro0(_nwBez)}. Aflossen brengt dit weer boven nul.</div>`
    : `<div style="height:16px;border-radius:9px;overflow:hidden;display:flex;margin:12px 0 8px;background:var(--card2)"><div style="width:${_nwEig}%;background:var(--teal)"></div><div style="width:${_nwSchP}%;background:var(--amber)"></div></div><div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px"><span>${_dot('var(--teal)')}Eigen deel <b>${euro0(w.netto)}</b>${_nwBez>0?' · '+_nwEig+'%':''}</span>${_nwSch>0?`<span>${_dot('var(--amber)')}Schuld <b>${euro0(_nwSch)}</b> · ${_nwSchP}%</span>`:''}</div>`);
  // vermogensopbouw-verloop (optie 2): cumulatief overschto (inkomen − uitgaven), verankerd op huidig netto vermogen
  let _nwTrend='', _tDelta=null, _tMnd=0;
  try{ const _win=months().slice(-12);
    if(_win.length>=3){
      let _acc=0; const _ser=_win.map(mm=>{ const t=totals(mm); _acc+=((t.income||0)-(t.spend||0)); return _acc; });
      const _off=w.netto-_ser[_ser.length-1]; for(let i=0;i<_ser.length;i++) _ser[i]+=_off;
      const _delta=Math.round(_ser[_ser.length-1]-_ser[0]); _tDelta=_delta; _tMnd=_win.length;
      const _W=320,_H=64,_x0=2,_x1=_W-2,_yT=8,_yB=_H-4; const _mn=Math.min(..._ser),_mx=Math.max(..._ser),_rng=(_mx-_mn)||1;
      const _X=i=>_x0+(i/(_ser.length-1))*(_x1-_x0), _Y=v=>_yB-((v-_mn)/_rng)*(_yB-_yT);
      const _P=_ser.map((v,i)=>_X(i).toFixed(1)+','+_Y(v).toFixed(1)).join(' ');
      const _col=_delta>=0?'var(--accent)':'#f87171';
      _nwTrend=`<div style="margin-top:13px;padding-top:11px;border-top:1px solid var(--line)"><div class="row" style="margin-bottom:4px"><span class="small" style="font-weight:700">Opbouw · ${_win.length} mnd</span><span class="small" style="font-weight:700;color:${_col}">${_delta>=0?'+':''}${euro0(_delta)}</span></div><svg viewBox="0 0 ${_W} ${_H}" width="100%" height="${_H}"><defs><linearGradient id="nwg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${_delta>=0?'color-mix(in srgb,var(--accent) 28%,transparent)':'rgba(248,113,113,.28)'}"/><stop offset="1" stop-color="color-mix(in srgb,var(--accent) 0%,transparent)"/></linearGradient></defs><polygon points="${_X(0).toFixed(1)},${_yB} ${_P} ${_X(_ser.length-1).toFixed(1)},${_yB}" fill="url(#nwg)"/><polyline points="${_P}" fill="none" stroke="${_col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${_X(_ser.length-1).toFixed(1)}" cy="${_Y(_ser[_ser.length-1]).toFixed(1)}" r="3" fill="${_col}"/></svg><div class="small" style="font-weight:600;margin-top:6px;color:${_col}">${_delta>=0?'Wat je minder uitgeeft, blijft hier staan als vermogen.':'De laatste maanden ging er meer uit dan er binnenkwam, dus je vermogen daalde.'}</div><div class="small mut2" style="font-size:10.5px;margin-top:2px">o.b.v. inkomen − uitgaven · koersen van beleggingen niet meegerekend</div></div>`;
    }
  }catch(_){}
  // Gewone taal bovenaan: dezelfde getallen als de kaart eronder, in één zin. Geen nieuw model —
  // netto vermogen uit netWorth() en de opbouw uit precies de reeks die de grafiek al tekent.
  const samenvatting=(()=>{
    const kort=isMode('rustig'); const bd=v=>`<b style="color:var(--txt)">${v}</b>`;
    let tb=null; try{ tb=totalBalance(); }catch(_){}
    const onbekend = tb && tb.known===0 && !(SET.assets||[]).length && !(SET.debts||[]).length;
    if(onbekend) return `<div class="small muted" id="vermSam" style="margin:0 2px 12px;line-height:1.5">Je saldo staat er nog niet bij, dus je netto vermogen kennen we nog niet. <span style="color:var(--teal);cursor:pointer;font-weight:600" onclick="openSaldoInvoer()">Saldo invullen ›</span></div>`;
    let z=`Je netto vermogen is ${bd(euro0(w.netto))}.`;
    if(!kort && _tDelta!=null && _tMnd>0){
      const perMnd=Math.round(Math.abs(_tDelta)/_tMnd);
      z += _tDelta>=0
        ? ` De laatste ${_tMnd} maanden kwam daar ${bd(euro0(_tDelta))} bij, gemiddeld zo'n ${bd(euro0(perMnd))} per maand.`
        : ` De laatste ${_tMnd} maanden ging daar ${bd(euro0(Math.abs(_tDelta)))} vanaf, gemiddeld zo'n ${bd(euro0(perMnd))} per maand.`;
    } else if(!kort){
      z += ` Na een paar maanden zie je hier ook of het groeit.`;
    }
    return `<div class="small muted" id="vermSam" style="margin:0 2px 12px;line-height:1.5">${z}</div>`;
  })();
  const nwCard=`<div class="card" style="background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 6%,transparent),transparent)">
    <div class="row" style="justify-content:space-between"><span class="small muted">Netto vermogen</span>${_nwChip}</div>
    <div style="font-size:30px;font-weight:800;letter-spacing:-.5px;color:${_nwUnder?'var(--red)':'var(--teal)'};margin:2px 0 0">${euro0(w.netto)}</div>
    ${(_nwBez>0)?`<div class="small muted" style="margin-top:2px">van ${euro0(_nwBez)} aan bezittingen</div>`:''}
    ${_nwBar}
    ${_nwTrend}
  </div>`;
  $('#s-vermogen').innerHTML = head + samenvatting + nwCard + `<div class="card" style="cursor:pointer" onclick="go('fire')"><div class="row"><span style="flex:1;font-weight:700;font-size:var(--fs-md)">${ICON('trend')} Vermogensreis</span><span class="small" style="color:var(--teal);font-weight:600">bekijk ›</span></div></div>` + renderAssets() + renderDebts();   // FIRE-sectie is nu een eigen scherm (#s-fire); entree-knop altijd zichtbaar
}
// ===== Coach-gedreven 'Sneller bij je doel?' =====
// concrete, op patronen gebaseerde manieren HOE je mindert (geen generiek 'geef minder uit')
// Effect van EEN losse tip op je doel: zelfde rekenwijze als saveFasterTip,
// alleen nu per tip. Niet kwantificeerbaar (geen doel, geen tempo) -> null, dan zwijgen we erover.
function tipEffect(save){
  let S=null; try{ S=savingsModel(); }catch(_){}
  if(!S||!(S.goal>0)||!(S.monthlySaving>0)||!(+save>0)) return null;
  const toGo=Math.max(S.goal-S.cur,0); if(toGo<=0) return null;
  const base=Math.ceil(toGo/S.monthlySaving), nw=Math.ceil(toGo/(S.monthlySaving+ +save));
  const eerder=Math.max(base-nw,0);

function coachItems(){

  const done=months().filter(m=>m<nowYM).slice(-6);
  const base=baseIncome(), target=Math.round(monthlySavingTarget());
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
  // 1) spaar-Rules als uitgave (1-tik fix)
  const savRx=/monthly rule|weekly rule/i; let savMis=0,savN=0;
  for(const m of done.concat([curMonth])){ for(const t of txOfMonth(m)){ if(t.amount<0&&CATS[catOf(t)].type==='expense'&&savRx.test(t.name||'')){savMis+=-t.amount;savN++;} } }

    const rows=done.map(m=>{const t=totals(m);return{inc:t.income,sp:t.spend,savedEur:t.income-t.spend,over:t.spend>t.budget};});
    const normal=rows.filter(r=>r.inc<=base*MEEVALLER_FACTOR), windfall=rows.filter(r=>r.inc>base*MEEVALLER_FACTOR);
    const savNormal=Math.round(avg(normal.map(r=>r.savedEur)));

      items.push({t:'warn',insight:'Meer binnen, meer uitgegeven',context:`Zet je extraatje meteen opzij, vóór je het uitgeeft.`,label:'Zet je extraatje opzij',fn:"go('ins')"});

    let streak=0; for(let i=rows.length-1;i>=0;i--){ if(rows[i].over) streak++; else break; }

  }

  if(topVar) items.push({t:'info',insight:`${CATS[topVar.k].name} is je grootste knop`,context:`Iets minder hier scheelt ${euro0(Math.round(topVar.avg*0.15))}/mnd. Kies een goedkoper alternatief.`,label:`Bekijk ${CATS[topVar.k].name}`,fn:`openCategory('${topVar.k}')`});

  return items;

// 1) STATUS op time-pacing: verwacht tempo = budget × verstreken/dim; incl. nog-te-komen vaste lasten in projEind
function coachStatus(m){
  const t=totals(m), L=monthLiquidity(), de=daysElapsed(m);
  const bud=Math.round(t.budget), spent=Math.round(t.spend);
  const dim=de.dim, elapsed=de.elapsed, left=Math.max(dim-elapsed,0);
  /* v177: expected was bud*elapsed/dim en werd tegen je hele uitgave gezet, dus de huur van dag 2
     maakte je in de eerste week per definitie "over budget". Het tempo-oordeel gaat nu over het
     variabele deel; de vaste lasten die al zijn afgeschreven tellen als waarneming mee, zodat
     expected nog steeds leest als "wat je nu ongeveer kwijt zou zijn". */
  const P=tempoProjectie(m);
  const vb=varBudget();
  const variVerwacht=vb>0?Math.round(vb*elapsed/dim):0;
  const expected=P.vast+variVerwacht;
  // v169: hier stond een derde formule voor hetzelfde bedrag (historisch gemiddelde, met terugval
  // op het tempo). Zelfde bron als Home en Inzichten: je plan.
  const varRest=(function(){ try{ return varPlanRemaining(m); }catch(_){ return 0; } })();
  const projEnd=spent+L.fixDue+varRest;
  let verdict,vcol,vkey;
  if(bud<=0){ verdict='stel inkomen in'; vcol='var(--mut)'; vkey='none'; }
  else if(spent>bud||projEnd>bud){ verdict='over budget'; vcol='var(--amber)'; vkey='over'; }
  else if(P.variTot<=variVerwacht*0.9){ verdict='ruim binnen'; vcol='var(--teal)'; vkey='room'; }
  else { verdict='op koers'; vcol='var(--teal)'; vkey='track'; }
  return {bud,spent,left,dim,elapsed,expected,projEnd,verdict,vcol,vkey,
    pct:bud>0?Math.min(spent/bud*100,100):0, pacePct:bud>0?Math.min(expected/bud*100,100):0};
}

/* ---------- AI-coach (hybride): motor rekent, taalmodel verwoordt. Standaard UIT. Via je Worker /coach. ---------- */
const COACH_SPEC=`Je bent de coach in Minder, een Nederlandstalige personal-finance app. Je bent een EERLIJKE SPIEGEL, geen cheerleader, geen adviesbot. Je praat weinig, je-vorm, kort en rustig, één gedachte per bericht. Confronteer met een patroon, nooit met een mislukking. Druk afwijkingen uit als stakes (weken vertraging van het doel), nooit als schuld. Eigenaarschap bij de gebruiker. Geen emoji, geen uitroeptekens, geen gedachtestreepjes, geen lijstjes met tips. Kernprincipe: geen budget, geen aankoop. OPDRACHT: herschrijf de gegeven 'draft' in deze toon. Behoud ALLE bedragen en getallen exact zoals in de draft; verzin geen nieuwe getallen. Eén of twee korte zinnen. Antwoord met alleen de herschreven zin, niets anders.`;
/* ---------- Toon-profielen: de coach-wissel kiest hoe je coach KLINKT, niet alleen hoe hij eruitziet.
   Alle drie blijven eerlijk: toon verandert de verwoording, nooit de inhoud of de cijfers. De guards
   van MECHANISM_SPEC (wanneer, hoe vaak, buffer heilig, geen dwang) gelden onverkort. ---------- */
function coachTone(){ const t=SET.coachTone; return (t==='zacht'||t==='zakelijk')?t:'direct'; }
function coachVoice(tone){
  if(tone==='zacht') return COACH_SPEC
    .replace('Je bent een EERLIJKE SPIEGEL, geen cheerleader, geen adviesbot.','Je bent een EERLIJKE SPIEGEL die warm en geruststellend klinkt, geen cheerleader en geen adviesbot: je verzacht nooit de cijfers, wel de toon.')
    .replace('Confronteer met een patroon, nooit met een mislukking.','Confronteer met een patroon, nooit met een mislukking. Erken eerst dat het begrijpelijk is, benoem daarna wat je ziet, en laat merken dat het oplosbaar is.');
  if(tone==='zakelijk') return COACH_SPEC
    .replace('Je praat weinig, je-vorm, kort en rustig, één gedachte per bericht.','Je praat minimaal, je-vorm, cijfers eerst, geen omhaal, één gedachte per bericht en zo kort mogelijk.')
    .replace('Eigenaarschap bij de gebruiker.','Eigenaarschap bij de gebruiker. Geen geruststelling, geen inleiding, geen afsluitende beleefdheden.');
  return COACH_SPEC;
}
