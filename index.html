// Welke maanden vallen in de gekozen periode? 'month' volgt curMonth (de maand die je elders koos).
function txMonthsForPeriod(){
  const ms=months(); if(!ms.length) return [];
  const cm=(curMonth&&ms.includes(curMonth))?curMonth:ms[ms.length-1];
  // een gekozen maand die na een import niet meer bestaat valt netjes terug op deze maand
  if(/^\d{4}-\d{2}$/.test(txPeriod)){ if(ms.includes(txPeriod)) return [txPeriod]; txPeriod='month'; }
  if(txPeriod==='all') return ms.slice();
  if(txPeriod==='ytd') return ms.filter(m=>m.slice(0,4)===cm.slice(0,4)&&m<=cm);
  if(txPeriod==='3m'){ const i=ms.indexOf(cm); return ms.slice(Math.max(0,i-2),i+1); }
  return [cm];
}
function txForPeriod(){ const set=new Set(txMonthsForPeriod()); return TX.filter(t=>set.has(t.date.slice(0,7))); }
function txPeriodLabel(){
  if(/^\d{4}-\d{2}$/.test(txPeriod)) return monthLabel(txPeriod);
  if(txPeriod==='all') return 'Alles';
  if(txPeriod==='ytd') return 'Dit jaar';
  if(txPeriod==='3m') return '3 maanden';
  const ms=txMonthsForPeriod(), n=new Date(), nowYM=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  return (!ms.length||ms[0]===nowYM)?'Deze maand':monthLabel(ms[0]);
}
// De filters die nu aan staan, als losse chips (elk met een eigen x).
function txActiveFilters(){
  const out=[];
  if(txPeriod!=='month') out.push({k:'period', lab:txPeriodLabel()});
  if(txType!=='all') out.push({k:'type', lab:txType==='exp'?'Uitgaven':'Inkomsten'});
  [...txCats].forEach(k=>{ if(CATS[k]) out.push({k:'cat:'+k, lab:CATS[k].name}); });

  if(txSearch) out.push({k:'zoek', lab:'“'+esc(txSearch)+'”'});
  return out;
}
function removeTxFilter(k){
  if(k==='period') txPeriod='month';
  else if(k.slice(0,4)==='cat:') txCats.delete(k.slice(4));

// De getoonde set: periode -> rekening -> type -> categorie -> bedrag -> zoek.
function txFiltered(){
  let list=txForPeriod().slice().sort((a,b)=>b.date.localeCompare(a.date)||0);
  if(accFilter!=='all') list=list.filter(t=>t.acc===accFilter);
  if(txType==='exp') list=list.filter(t=>t.amount<0);
  if(txType==='inc') list=list.filter(t=>t.amount>0);

  if(txMin!=null) list=list.filter(t=>Math.abs(t.amount)>=txMin);
  if(txMax!=null) list=list.filter(t=>Math.abs(t.amount)<=txMax);

function dayHeader(ds,withMonth){
  const d=new Date(ds); d.setHours(0,0,0,0);
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((today-d)/86400000);
  // bij een meer-maands-periode draagt de maandband erboven het jaartal; de dagkop houdt de maand
  const lang=`${['Zo','Ma','Di','Wo','Do','Vr','Za'][d.getDay()]} ${d.getDate()} ${MFULL[d.getMonth()]}`;
  if(diff===0) return withMonth?`Vandaag · ${lang}`:'Vandaag';
  if(diff===1) return withMonth?`Gisteren · ${lang}`:'Gisteren';
  return lang;
}

/* Eigen historie per winkel (laatste 12 maanden), op dezelfde sleutel als de terugkerend-detectie
   (recurKey), zodat elke lease-/huurtermijn als één winkel telt. Licht gememoïseerd op _dataGen. */
let _merchStats=null,_merchStatsGen=-1;
function merchHistory(){
  if(_merchStatsGen===_dataGen && _merchStats) return _merchStats;
  const win=new Set(months().slice(-12)); const by={};
  for(const t of TX){ if(t.pending||!(t.amount<0)) continue;
    if(!win.has(t.date.slice(0,7))) continue;
    const k=catOf(t); if(!CATS[k]||CATS[k].type!=='expense') continue;
    const mk=recurKey(t); if(!mk) continue;
    (by[mk]=by[mk]||[]).push(-t.amount);
  }
  const out={};
  for(const mk in by){ const s=by[mk].sort((a,b)=>a-b), n=s.length; out[mk]={n, med:n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2}; }
  _merchStats=out; _merchStatsGen=_dataGen; return out;
}
/* "Ongewoon" = afwijkend van wat jij normaal doet. Twee temperingen op de oude categorie-toets:
   een herkende vaste last is per definitie niet ongewoon, en wie eigen historie bij dezelfde winkel
   heeft wordt daartegen gemeten — een maandelijkse lease valt dan niet meer op tussen kleine ritjes. */
function txOutlier(t,catAvg){
  const c=CATS[catOf(t)]; if(!(t.amount<0&&c.type==='expense')) return false;
  const bedrag=-t.amount; if(bedrag<40) return false;
  if(isFixed(t)) return false;                                    // herkende herhaling (incasso/periodieke overboeking)
  const m=merchHistory()[recurKey(t)];
  if(m && m.n>=3 && m.med>0) return bedrag>Math.max(m.med*1.8,60);  // eigen mediaan van deze winkel
  const a=catAvg[catOf(t)];                                        // te weinig eigen historie: categorie-toets zoals voorheen
  return !!a && bedrag>Math.max(a*2.2,60);
}

  const n=txFiltered().length;

    ${periode}${type}${cats}${acc}${bedrag}${zoek}
    <button class="btn sec" style="margin-top:16px" onclick="clearTxFilter();closeSheet()">Filters wissen</button>`;
  showSheetBg();

// ONE-FOCUS: kies de éne boodschap + actie voor het Inzichten-hoofdscherm
function insFocus(m){
  const L=monthLiquidity(); const sv=monthlySavingTarget(); const free=Math.round(L.projected-sv);
  if(free>=0){
    return {type:'ok', context:`Je bent op koers, dit kun je extra sparen.`, ctaLabel:'Bekijk je vooruitblik', ctaAct:"go('vooruit')"};
  }
  const actual=catSpendMap(m), EB=effectiveBudgets(m).out; let worst=null;
  for(const k in EB){ if(+EB[k]>0){ const act=actual[k]||0; if(act>+EB[k]){ const band=budgetBand(+EB[k],act); if(band==='action'||band==='monitor'){ const over=act-(+EB[k]); if(!worst||over>worst.over) worst={k,over}; } } } }
  if(worst){ const nm=CATS[worst.k].name.toLowerCase();
    return {type:'bad', context:`Vooral ${nm} loopt uit de pas.`, ctaLabel:`Bekijk ${nm}`, ctaAct:`openVariance('${worst.k}')`}; }
  return {type:'bad', context:`Je geeft meer uit dan je norm deze maand.`, ctaLabel:'Bekijk je vooruitblik', ctaAct:"go('vooruit')"};
}
// statische inline-insight (budget vs werkelijk + status), geen navigatie
function steerSpendUpTo(m, day){ // stuurbare (variabele) uitgaven per categorie in maand m t/m dag 'day' (99 = hele maand)
  const by={};
  for(const t of txOfMonth(m)){ const c=catOf(t); if(!CATS[c]||CATS[c].type!=='expense'||isFixedCat(c)) continue; const d=+t.date.slice(8,10); if(d>day) continue; by[c]=(by[c]||0)+(-t.amount); }   // positieven netto meegerekend: terugstorting verlaagt de categorie
  return by;
}
function monthVsPrevInner(m){
  const ms=months(); const idx=ms.indexOf(m); if(idx<1) return {has:false,drivers:new Set(),html:''};
  const prev=ms[idx-1];
  const now=new Date(); const todayYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const partial=(m===todayYM);
  const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const day=partial?Math.min(now.getDate(),dim):99;
  const sum=o=>Math.round(Object.values(o).reduce((s,v)=>s+v,0));
  const a=steerSpendUpTo(m,day), b=steerSpendUpTo(prev,day);
  const tThis=sum(a), tPrev=sum(b);
  if(tPrev<=0 && tThis<=0) return {has:false,drivers:new Set(),html:''};
  const delta=tThis-tPrev, minder=delta<0;
  const pct=tPrev>0?Math.round(Math.abs(delta)/tPrev*100):0;
  const keys=new Set([...Object.keys(a),...Object.keys(b)]);
  const diffs=[...keys].map(k=>({k,d:Math.round((a[k]||0)-(b[k]||0))})).filter(x=>Math.abs(x.d)>=5 && CATS[x.k]);
  const downs=diffs.filter(x=>x.d<0).sort((x,y)=>x.d-y.d).slice(0,3);
  const ups=diffs.filter(x=>x.d>0).sort((x,y)=>y.d-x.d).slice(0,2);
  const drivers=new Set([...downs,...ups].map(x=>x.k));
  // streak op volledige maanden (hele maand vs hele maand), exclusief een lopende maand
  let streak=0; const lastFull=partial?idx-1:idx;

function _catSpendOf(mm){ return catSpendMap(mm); }   // netto per categorie (terugstorting verrekend); gelijk aan catSpendMap, geen duplicaat-logica meer
function insSignals(m,exclude){

  const out=[]; const cur=_catSpendOf(m); const curTot=Object.values(cur).reduce((a,b)=>a+b,0);
  const dn=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];

      const a=_catSpendOf(ms[idx-2])[k]||0, b=_catSpendOf(ms[idx-1])[k]||0, c=cur[k]||0;

      hyp:`${CATS[best.k].name} loopt al drie maanden op.`, imp:`Kijk of dit blijvend is; zo ja, zet er een grens op.`});
  }

  if(idx>=1 && curTot>0){

      for(const mm of hist){ const sp=_catSpendOf(mm); const tot=Object.values(sp).reduce((a,b)=>a+b,0); if(tot>0){ hs+=(sp[k]||0)/tot; hc++; } if((sp[k]||0)>0){ as+=sp[k]; ac++; } }

    }

      out.push({pri:7,tone:'warn',act:`openCategory('${best.k}')`,
        kpiLabel:CATS[best.k].name, kpiVal:euro0(best.amt), kpiSub:best.avgAmt>0?`jouw gemiddelde ${euro0(best.avgAmt)}`:'bovengemiddeld',
        chip:{text:mult>=1.4?(mult.toFixed(1).replace('.',',')+'\u00d7 normaal'):'bovengemiddeld',type:'up'},
        hyp:`Aan ${CATS[best.k].name.toLowerCase()} ben je dit keer veel meer kwijt dan je gewend bent.`, imp:`Check of het eenmalig was; anders een grens op ${CATS[best.k].name.toLowerCase()}.`}); }

      hyp:`${pctWord(share)?pctWord(share).charAt(0).toUpperCase()+pctWord(share).slice(1):('Ongeveer '+share+'%')} van je losse geld gaat op ${dn[peak]}.`, imp:`Zo'n vaste piek is gewoonte; \u00e9\u00e9n bewuste ${dn[peak]} levert de meeste winst.`});
  }

  if(vis.length>=5){
    const byM={}; for(const x of visAll){ const nm=cleanMerch(x.name)||x.name||'onbekend'; byM[nm]=(byM[nm]||0)+(-x.amount); }

function weekBoundsFromAnchor(anchor, weeksBack){

function weekVarTx(start,end){ return TX.filter(t=>{ const c=catOf(t); if(!CATS[c]||CATS[c].type!=='expense'||isFixed(t))return false; const dt=new Date(t.date); return dt>=start&&dt<=end; }); }   // incl. terugstortingen: sommen (−amount) worden netto; tellingen filteren zelf op afschrijving
function weekCompareData(){
  if(!TX.length) return null;
  const latest=TX.reduce((a,b)=>a.date>b.date?a:b).date;
  const tw=weekBoundsFromAnchor(latest,0), lw=weekBoundsFromAnchor(latest,1);
  const thisTx=weekVarTx(tw.start,tw.end), lastTx=weekVarTx(lw.start,lw.end);

  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="small muted" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase">Deze week vs vorige week \u00b7 ${range}</div>

      <div style="font-size:28px;font-weight:800;letter-spacing:-.5px;color:${heroCol}">${heroTxt}<span style="font-size:var(--fs-sm);color:var(--mut);font-weight:500"> deze week</span></div>${deltaChip}</div>
    <div class="wvo-tiles" style="grid-template-columns:1fr 1fr;margin-top:14px">

      <div class="wvo-tile"><div class="wvo-tl">Vorige week</div><div class="wvo-tv" style="color:var(--mut)">${euro0(lastSum)}</div><div class="wvo-ts">${normAvg>0?`normaal ~${euro0(normAvg)}`:'vorige week'}</div></div>

    <div style="height:18px"></div>
    ${movers.length?`<div class="hlabel" style="margin:12px 2px 6px">Grootste verschuivingen</div>${moverRows}`:''}

// budget-tempo van deze maand als moderne ring + details (de koers-op-doel staat al op Vooruitblik)

  const ring=`<div style="position:relative;width:112px;height:112px;flex-shrink:0">

      <circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--card2)" stroke-width="10"/>

// mini-sparkline: verloop van één categorie over de laatste maanden (voor de drill-down)
// Eén sparkline-implementatie voor de hele app: een waarden-array in, staafjes eruit.
// null = onbekende maand (geen staaf); opts.colorAt geeft per maand een kleur (bv. binnen/buiten je band).
function miniSpark(values, opts){
  opts=opts||{};
  const vals=(values||[]).map(v=>(v==null||isNaN(v))?null:+v);
  if(vals.filter(v=>v!=null).length<2) return '';
  const max=Math.max(...vals.map(v=>Math.max(v||0,0)),1);
  const hi=opts.highlight!=null?opts.highlight:vals.length-1;
  const bars=vals.map((v,i)=>{
    if(v==null) return `<div class="b" style="height:3%;background:var(--card2)"></div>`;
    const h=Math.max(Math.max(v,0)/max*100,3);
    const col=opts.colorAt?opts.colorAt(v,i):(i===hi?'var(--teal)':'var(--bar)');
    return `<div class="b" style="height:${h}%;background:${col}${i===hi&&opts.dashLast?';opacity:.55':''}">`
      +`${opts.showVals?`<span class="val">${opts.fmt?opts.fmt(v):v}</span>`:''}`
      +`${opts.labels?`<span class="lab">${opts.labels[i]||''}</span>`:''}</div>`;
  }).join('');
  return `<div class="spark" style="height:${opts.height||30}px;gap:${opts.gap||6}px;margin:${opts.margin||'6px 0 0'}">${bars}</div>`;
}
function catSparkline(k){
  const ms=months(); const last=ms.slice(-6); if(last.length<2) return '';
  const vals=last.map(mm=>{ let s=0; for(const t of txOfMonth(mm)){ if(catOf(t)===k) s+=-t.amount; } return Math.max(s,0); });   // netto per maand; terugstorting verlaagt
  if(Math.max(...vals)<=0) return '';
  const curM=(curMonth&&last.includes(curMonth))?curMonth:last[last.length-1];
  return `<div class="small muted" style="margin:2px 0 2px">Verloop laatste ${last.length} maanden</div>`
    + miniSpark(vals,{height:90,margin:'8px 0 18px',showVals:true,fmt:v=>v>0?euro0(v):'',
        labels:last.map(mm=>MNAMES[+mm.slice(5,7)-1]), highlight:last.indexOf(curM)});
}

/* ============================================================
   REFERENTIE-VERDELING · waartegen meet je je verdeling?
   50/30/20 is een ijkpunt, geen wet. Je kiest zelf het kader, neemt een voorstel uit je
   eigen historie over, of zet je eigen percentages. Alle banden (kerncijfers restsaldo-quote/
   vaste-lasten-druk en "Hoe gezond is jouw verdeling?") wijzen naar splitTarget().
   De rekenbronnen (healthSplit/splitFixedVar/totals/monthAgg) blijven onaangeroerd —
   alleen de norm waar tegenaan gemeten wordt, is nu van jou.
   ============================================================ */
const SPLIT_FRAMES={
  '503020':   {naam:'50/30/20',              sub:'De algemene vuistregel · een goede start',   t:{fixed:50,vari:30,save:20}},
  '60':       {naam:'60%-oplossing',         sub:'Vaste verplichtingen als één blok sturen',   t:{fixed:60,vari:25,save:15}},
  'payfirst': {naam:'Pay-yourself-first',    sub:'Sparen eerst · vast blijft je werkelijke',   t:null},
  'fire':     {naam:'Aggressief · FIRE',     sub:'Hoog spaardoel, ver vooruit',                t:{fixed:50,vari:20,save:30}},
  'ophistorie':{naam:'Op maat · uit jouw data', sub:'Eén haalbare stap vanaf waar je nu staat', t:null},
  'custom':   {naam:'Zelf instellen',        sub:'Je eigen percentages',                       t:null}
};
// Een norm telt altijd tot 100%: wat je intikt wordt geschaald, niet afgekeurd.
function splitNorm(o){
  let f=Math.max(+((o||{}).fixed)||0,0), v=Math.max(+((o||{}).vari)||0,0), s=Math.max(+((o||{}).save)||0,0);
  const som=f+v+s;
  if(!(som>0)) return {fixed:50,vari:30,save:20};
  if(Math.round(som)!==100){ f=f/som*100; v=v/som*100; s=s/som*100; }
  f=Math.round(f); s=Math.round(s);
  return {fixed:f, vari:Math.max(100-f-s,0), save:s};
}
function splitMode(){ return SPLIT_FRAMES[SET.splitMode]?SET.splitMode:'503020'; }
// Pay-yourself-first: sparen staat vast (20%), je vaste lasten zijn wat ze zijn, de rest is vrij.
function payfirstTarget(){
  const save=20; let fix=50;
  try{ const A=splitActual(6); if(A&&A.inc>0) fix=Math.min(Math.max(A.fixP,0),100-save); }catch(_){}
  return {fixed:fix, vari:Math.max(100-fix-save,0), save};
}
function frameTarget(k){
  if(k==='payfirst') return payfirstTarget();
  if(k==='ophistorie'){ const V=splitVoorstel(); return V?V.target:(SET.splitMode==='ophistorie'?splitNorm(SET.splitTarget):null); }
  if(k==='custom') return splitNorm(SET.splitTarget);
  return splitNorm((SPLIT_FRAMES[k]||SPLIT_FRAMES['503020']).t);
}
let _stCache=null,_stKey='';
function splitTarget(){
  const mode=splitMode();
  const key=_dataGen+'|'+mode+'|'+JSON.stringify(SET.splitTarget||null);
  if(_stCache && _stKey===key) return _stCache;
  const F=SPLIT_FRAMES[mode];
  const t=(mode==='ophistorie'||mode==='custom')?splitNorm(SET.splitTarget):frameTarget(mode);
  _stCache=Object.assign(t,{mode, naam:F.naam, label:`${t.fixed}/${t.vari}/${t.save}`}); _stKey=key;
  return _stCache;
}
// De werkelijke verdeling over een reeks maanden. Dezelfde bronnen als healthSplit (monthAgg +
// savedThisMonth); alleen het venster verschilt, zodat de norm-laag niets herrekent.
function healthSplitOver(ms){
  let inc=0,fixed=0,vari=0,naarSpaar=0;
  const hasSav=(typeof n26SavingsAccounts==='function') && n26SavingsAccounts().length>0;
  for(const m of ms){ const a=monthAgg(m); inc+=a.income; fixed+=a.fixed; vari+=a.vari;
    if(hasSav){ naarSpaar+=savedThisMonth(m); }                                                 // sparen = instroom op je spaarrekening (zelfde bron als 'veilig te besteden')
    else { for(const t of txOfMonth(m)){ if(t.amount<0 && catOf(t)==='sparen') naarSpaar+=-t.amount; } } }  // geen spaarrekening gemarkeerd: val terug op de categorie
  return {inc,fixed,vari,naarSpaar};
}
// Je werkelijke verdeling over de laatste n AFGERONDE maanden: de lopende maand is per definitie
// half en zou zowel je uitgaven als je spaarquote vertekenen.
function splitActual(n){
  const ym=nowYMstr();
  const ms=months().filter(m=>m<ym).slice(-(n||6));
  if(!ms.length) return null;
  const H=healthSplitOver(ms);
  if(!(H.inc>0)) return {ms, n:ms.length, inc:0};
  const ns=Math.max(H.naarSpaar,0);
  return {ms, n:ms.length, inc:H.inc, fixed:H.fixed, vari:H.vari, naarSpaar:ns, incM:H.inc/ms.length,
          fixP:Math.round(H.fixed/H.inc*100), varP:Math.round(H.vari/H.inc*100), savP:Math.round(ns/H.inc*100)};
}
/* Op maat: één haalbare stap vanaf waar je nu staat, geen ideaalplaatje.
   - vaste lasten laten we staan (kort termijn stuur je daar weinig aan; wel een zachte vlag boven 55%)
   - de hefboom is vrij -> sparen, met een stap uit je aantoonbare bezuinigingsruimte (2-5 procentpunt)
   - nooit lager dan wat je nu al spaart, en begrensd op 20% (25% als je daar al boven zit) */
function splitVoorstel(){
  const A=splitActual(6);
  if(!A || A.n<3 || !(A.inc>0)) return null;               // <3 afgeronde maanden: nog niet voorstellen
  const incM=A.incM;
  let ruimtePct=0; try{ const c=noodfondsModel().comfortTot||0; if(incM>0) ruimtePct=c/incM*100; }catch(_){}
  const stap=Math.max(2,Math.min(5,Math.round(ruimtePct/4)));   // een kwart van je bezuinigingsruimte, begrensd
  const cap=A.savP>=20?25:20;
  const ruimteVrij=Math.max(100-A.fixP-A.savP,0);               // meer dan er 'vrij' is, kan niet
  const save=Math.max(A.savP, Math.min(A.savP+stap, cap, A.savP+ruimteVrij));
  const fixed=A.fixP, vari=Math.max(100-fixed-save,0);
  const deltaP=Math.max(save-A.savP,0);
  const extra=Math.round(incM*deltaP/100);
  const varShift=A.varP>0?Math.round(deltaP/A.varP*100):0;      // ~x% van je vrije uitgaven verschuiven
  let effect=null; try{ if(extra>0) effect=tipEffect(extra); }catch(_){}
  return {nu:{fixed:A.fixP,vari:A.varP,save:A.savP}, target:{fixed,vari,save}, n:A.n,
          incM:Math.round(incM), extra, deltaP, varShift, stap, effect,
          hoogVast:A.fixP>55, boven100:(A.fixP+A.varP)>100, geenRuimte:deltaP<=0};
}

/* ---- Norm-keuze (Instellingen ▸ Referentie-verdeling, en vanuit de Kerncijfers) ---- */
function splitBar(t,h){
  const w=v=>Math.max(Math.min(+v||0,100),0);

    <div style="width:${w(t.fixed)}%;background:var(--blue)"></div><div style="width:${w(t.vari)}%;background:var(--amber)"></div><div style="width:${w(t.save)}%;background:var(--teal)"></div></div>`;
}
const splitLabel=t=>`vast ${t.fixed}% · vrij ${t.vari}% · sparen ${t.save}%`;
// je werkelijke verdeling telt vaak niet tot 100: wat je niet uitgeeft en niet overmaakt naar je
// spaarrekening blijft gewoon staan. Dat benoemen we, anders lijkt de norm-balk iets te beloven.
const splitRest=a=>Math.max(100-a.fixed-a.vari-a.save,0);
const splitNuLabel=a=>`${splitLabel(a)}${splitRest(a)>=1?` · rest ${splitRest(a)}% blijft staan`:''}`;

}

/* Het op-maat-voorstel: meet-me-where-you-are. Vaste lasten blijven staan, de stap zit in

      <span class="small" style="color:var(--accent);font-weight:700">actief</span></div>
    <div style="display:flex;gap:8px;margin-top:9px">${veld('fixed','Vast %')}${veld('vari','Vrij %')}${veld('save','Sparen %')}</div>

// "Hoe gezond is jouw verdeling?", jouw werkelijke verdeling afgezet tegen je gekozen norm (meten is weten).
function healthSplit(){
  const H=healthSplitOver(periodMonths());
  let inc=H.inc;
  if(inc<=0 && SET.autoIncome) inc=baseIncome();   // lopende maand zonder salaris: val terug op je basisinkomen
  return {inc,fixed:H.fixed,vari:H.vari,net:inc-H.fixed-H.vari,naarSpaar:H.naarSpaar};
}

function toggle503020(){ SET.show503020=!SET.show503020; save(); renderIns(); }

/* ============================================================
   INZICHTEN · KERNCIJFERS + UITGAVEN VS BUDGET
   Alles komt uit bestaande helpers (totals/splitFixedVar/insSignals); geen nieuwe databron,
   geen rekenlogica elders geraakt. Vier afgeleide cijfers + een verloopgrafiek.
   ============================================================ */

// Kleur is een spiegel, geen rapportcijfer: in Rustig geen alarmrood en een gedempt midden.
function kpiCol(state){
  const r=isMode('rustig');
  if(state==='good') return 'var(--teal)';
  if(state==='bad')  return r?'var(--amber)':'var(--red)';
  if(state==='mid')  return r?'var(--mut)':'var(--amber)';
  return 'var(--txt)';
}
const _pct0=n=>Math.round(n)+'%';
const _sign=n=>(n<0?'−':'+')+euro0(Math.abs(n));   // echte min-tekens, zoals elders in de app

// Wat elke KPI betekent en waartegen hij zich meet. Een kaal getal zonder band zegt niets,
// dus band + oordeel + uitleg horen bij de definitie, niet bij de opmaak.
const KPI_META={
  // v108: heette "Bespaarquote", maar meet je restsaldo — wat je overhoudt, niet wat je opzij
  // zette. Geld dat op je betaalrekening blijft staan telt hier volledig mee. De naam suggereerde
  // het tegendeel en botste met de referentie-verdeling, die "sparen" wél als instroom op je
  // spaarrekening leest (healthSplitOver). Eén term per begrip (v91): dit is het restsaldo.
  spaar: {label:'Restsaldo-quote',    bandTxt:'doel 20% of meer', band:20,  dir:'up',   sign:-1, base:100,
    uitleg:'Welk deel van je inkomen je overhoudt: (inkomen − uitgaven) ÷ inkomen. Dat is niet hetzelfde als wat je opzij zette — geld dat op je betaalrekening blijft staan telt hier gewoon mee. Je spaarinleg komt hieruit. Dit is geen apart doel: houd je je aan je referentie-verdeling voor vaste en variabele lasten, dan volgt deze ruimte vanzelf. Het spaardoel zelf hangt aan je spaarquote.'},
  inleg: {label:'Spaarquote',         bandTxt:'doel 20% of meer', band:20,  dir:'up',   sign:1,  base:0,
    uitleg:'Welk deel van je inkomen er écht naar je spaarrekening ging: gestort ÷ inkomen. Anders dan je restsaldo-quote telt geld dat op je betaalrekening blijft staan hier niet mee. Zonder gemarkeerde spaarrekening valt dit terug op je spaar-categorie.'},
  budget:{label:'Budgetnaleving',     bandTxt:'doel 100% of minder', band:100, dir:'down', sign:1, base:0,
    uitleg:'Welk deel van je maandbudget je hebt uitgegeven: uitgaven ÷ budget. Je budget is de som van je potjes; heb je die niet, dan je inkomen-limiet.'},
  vari:  {label:'Variabele-lasten-druk', bandTxt:'doel onder 30%', band:30, dir:'down', sign:1, base:0,
    uitleg:'Welk deel van je inkomen naar variabele (niet-vaste) uitgaven gaat: variabele uitgaven ÷ inkomen. Het richtpunt komt uit je referentie-verdeling.'},
  vast:  {label:'Vaste-lasten-druk',  bandTxt:'doel onder 50%', band:50, dir:'down', sign:1, base:0,
    uitleg:'Welk deel van je inkomen naar herkende terugkerende lasten gaat: vaste lasten ÷ inkomen. Het richtpunt komt uit je referentie-verdeling.'}
};
// Drie van de vier banden volgen je gekozen referentie-verdeling (default 50/30/20 → precies de
// oude 20%, 30% en 50%), zodat vast/variabel/sparen samen het hele ijkpunt spiegelen.
// Alleen budgetnaleving meet tegen je eigen potjes.
function kpiBand(key){
  if(key==='inleg') return splitTarget().save;                    // de norm-post zelf
  if(key==='spaar'){ const T=splitTarget(); return Math.max(100-T.fixed-T.vari,0); }   // afgeleid: wat vast en variabel overlaten
  if(key==='vast')  return splitTarget().fixed;
  if(key==='vari')  return splitTarget().vari;
  return KPI_META[key].band;
}
function kpiBandTxt(key){
  if(key==='spaar'){ const T=splitTarget(); return `ruimte ${Math.max(100-T.fixed-T.vari,0)}% · wat ${T.fixed}/${T.vari} overlaat`; }
  if(key==='inleg') return `doel ${splitTarget().save}% of meer opzij`;
  if(key==='vast')  return `doel onder ${splitTarget().fixed}%`;
  if(key==='vari')  return `doel onder ${splitTarget().vari}%`;
  return KPI_META[key].bandTxt;
}
const KPI_WOORD={good:'goed',mid:'krap',bad:'let op'};
/* Hoe ver sta je van je doel? (v103) De tegel toonde het cijfer en de band als losse teksten,
   dus de vergelijking moest je zelf maken. Dit zet ze in verhouding: het verschil in procent-
   punten én vertaald naar euro's, want daar denk je in. Bewust GEEN eigen sommen: `t` en `sf`
   zijn dezelfde totals(m)/splitFixedVar(m) waar het percentage uit komt, zodat bedrag en
   percentage nooit uit elkaar kunnen lopen. null = we weten het niet (v59/v73). */
function kpiAfstand(key,v,t,sf){
  if(v==null) return null;
  const B=kpiBand(key); if(!(B>0)) return null;
  const dir=(KPI_META[key]||{}).dir||'down';
  const pt=(dir==='up')?(v-B):(B-v);                      // >0 = aan de goede kant van je doel
  const basis=(key==='budget')?(+t.budget||0):(+t.income||0);   // budgetnaleving meet tegen je potjes
  const bedrag=basis>0?Math.round(Math.abs(pt)/100*basis):null;
  return {pt:Math.round(pt*10)/10, bedrag, basis, goed:pt>=0};
}
// Eén formulering per kerncijfer; "meer" is bij sparen goed en bij een druk-metriek juist niet,
// dus de woorden volgen de betekenis, niet het teken.
function kpiAfstandTxt(key,A,kort){
  if(!A||A.bedrag==null) return '';
  const e=euro0(A.bedrag);
  if(Math.abs(A.pt)<0.05) return kort?'op je doel':'precies op je doel';
  if(key==='spaar')  return A.goed?`${e} meer dan je doel`:`${e} minder dan je doel`;
  if(key==='inleg')  return A.goed?`${e} meer opzij dan je doel`:`${e} minder opzij dan je doel`;
  if(key==='budget') return A.goed?`${e} onder je budget`:`${e} over je budget`;
  return A.goed?`${e} onder je doel`:`${e} boven je doel`;
}
function kpiState(key,v,ref){
  if(v==null) return 'n';
  if(key==='spaar'||key==='inleg'){ const B=kpiBand(key); return v>=B?'good':(v>=B*0.5?'mid':'bad'); }
  if(key==='budget') return v<=100?'good':(v<=110?'mid':'bad');
  if(key==='vast'){  const B=kpiBand('vast');  return v<B?'good':(v<=B*1.3?'mid':'bad'); }
  if(key==='vari'){  const B=kpiBand('vari');  return v<B?'good':(v<=B*1.3?'mid':'bad'); }   // drukmetriek: lager is gezonder
  return 'n';
}
// reeksen per maand, in één pass over months(); n=0 -> volledige historie
function insKpiSeries(n){
  const all=months(); const ms=(n===0)?all:all.slice(-(n||12));
  const S={ms,spaar:[],inleg:[],budget:[],vari:[],vast:[]};
  for(const mm of ms){
    const t=totals(mm), sf=splitFixedVar(mm);
    S.spaar.push(t.income>0?(t.income-t.spend)/t.income*100:null);
    const _sn=savedNet(mm); S.inleg.push((t.income>0&&_sn!=null)?_sn/t.income*100:null);
    S.budget.push(t.budget>0?t.spend/t.budget*100:null);
    S.vari.push(t.income>0?sf.vari/t.income*100:null);
    S.vast.push(t.income>0?sf.fixed/t.income*100:null);
  }
  return S;
}
// Vier KPI's voor maand m, elk met waarde, band, oordeel én historische reeks.
// Onbekend = '—' i.p.v. een verzonnen getal; een lopende maand krijgt geen oordeel:
// een halve maand is per definitie "zuinig" en dat is geen verdienste.
function insKpis(m,n){
  const t=totals(m), S=insKpiSeries(n);
  const now=new Date(); const nowYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const partial=(m===nowYM);
  const i=S.ms.indexOf(m); const upto=a=>i>=0?a.slice(0,i+1):a.slice();
  const labels=upto(S.ms).map(x=>MNAMES[+x.slice(5,7)-1]);
  const maanden=upto(S.ms);
  const sf=splitFixedVar(m);
  const waarde={
    spaar:  t.income>0?(t.income-t.spend)/t.income*100:null,
    inleg:  (t.income>0&&savedNet(m)!=null)?savedNet(m)/t.income*100:null,
    budget: t.budget>0?t.spend/t.budget*100:null,
    vari:   t.income>0?sf.vari/t.income*100:null,
    vast:   t.income>0?sf.fixed/t.income*100:null
  };
  const mk=key=>{
    const M=KPI_META[key], v=waarde[key], ref=null;
    const fmt=_pct0;
    const st=kpiState(key,v,ref);
    let band=kpiBandTxt(key);
    if(key==='budget') band=`${kpiBandTxt(key)} · ${t.potTotal>0?'je potjes':'je inkomen-limiet'}`;
    if(v==null) band=(key==='budget')?'nog geen budget':(key==='inleg'&&t.income>0)?'geen spaarrekening bekend':'inkomen onbekend';
    const afst=kpiAfstand(key,v,t,sf);
    return {key, label:M.label, raw:v, ref, val:v==null?'—':fmt(v), band, uitleg:M.uitleg, fmt, partial, afst,
            oordeel: v==null?'':(partial?'loopt nog':(KPI_WOORD[st]||'')),
            state: (v==null||partial)?'n':st,      // kleur van het cijfer
            trendState: st,                         // oordeel los van de lopende maand
            src: key==='budget'?(t.potTotal>0?'potjes':'limiet'):undefined,
            budgetBedrag: key==='budget'?Math.round(t.budget):undefined,
            series: upto(S[key]), labels, maanden};
  };
  // spaar en inleg naast elkaar: overhouden tegenover opzij zetten, precies het verschil dat
  // v108 blootlegde. Daarna vari en vast naast elkaar, samen het hele ijkpunt.
  const items=['spaar','inleg','budget','vari','vast'].map(mk);
  const by={}; for(const k of items) by[k.key]=k;
  return Object.assign({m,partial,items},by);
}

// staafkleur per maand = binnen of buiten je band; zo draagt de trend zelf het oordeel
function kpiBarColor(k){ return (v,idx)=>{
  if(k.partial&&idx===k.series.length-1) return 'var(--teal)';        // de lopende maand is de highlight
  const st=kpiState(k.key,v,k.ref);
  return st==='bad'?kpiCol('bad'):'var(--bar)';                       // alleen écht buiten de band kleurt; amber blijft spaarzaam
}; }

/* Richting A: één rustige datataal in de Kerncijfer-tegels. Eén lijn in de neutrale datakleur,
   de lopende maand als open teal punt, en waar er een doel is een hele zachte gestreepte lijn.
   De status staat in het label ernaast, nooit in de kleur van de lijn. */
function miniSparkLine(values, opts){
  opts=opts||{};
  const vals=(values||[]).map(v=>(v==null||isNaN(v))?null:+v);
  const pts=vals.map((v,i)=>({v,i})).filter(p=>p.v!=null);
  if(pts.length<2) return '';
  // breedte ~ de echte tegelbreedte op mobiel, zodat het eindpunt rond blijft i.p.v. uitgerekt
  const W=150, H=26, P=3;
  let doel=(opts.target!=null && isFinite(opts.target))?+opts.target:null;
  // Een doel ver buiten je eigen bereik drukt de lijn plat. Eerder lieten we de referentie dan
  // weg, maar juist wie ver van zijn doel staat verloor 'm zo uit beeld (v103). Nu blijft de
  // schaal van je eigen cijfers en tekenen we de doellijn op de rand: de trend blijft leesbaar
  // en je ziet aan welke kant je doel ligt.
  let doelBuiten=false;
  if(doel!=null){
    const dl=Math.min(...pts.map(p=>p.v)), dh=Math.max(...pts.map(p=>p.v)), dr=(dh-dl)||Math.abs(dh)||1;
    if(doel<dl-1.2*dr || doel>dh+1.2*dr) doelBuiten=true;
  }
  const alles=pts.map(p=>p.v).concat((doel!=null&&!doelBuiten)?[doel]:[]);
  const lo=Math.min(...alles), hi=Math.max(...alles), span=(hi-lo)||1;
  const x=i=>P+(W-2*P)*(vals.length<2?0:i/(vals.length-1));
  const y=v=>H-P-((v-lo)/span)*(H-2*P);
  const pad=pts.map((p,k)=>`${k?'L':'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const laatste=pts[pts.length-1];
  const dy=doel!=null?Math.min(Math.max(y(doel),P),H-P):null;   // buiten bereik -> op de rand
  const lijn=doel!=null?`<line x1="${P}" x2="${W-P}" y1="${dy.toFixed(1)}" y2="${dy.toFixed(1)}" stroke="var(--mut2)" stroke-width="1" stroke-dasharray="${doelBuiten?'2 4':'3 3'}" opacity="${doelBuiten?'.32':'.45'}" vector-effect="non-scaling-stroke"/>`:'';
  const px=(x(laatste.i)/W*100).toFixed(2), py=(y(laatste.v)/H*100).toFixed(2);
  const punt=`<i class="${opts.running?'spk-nu':'spk-eind'}" style="left:${px}%;top:${py}%"></i>`;
  return `<div class="spk-in"><svg class="spk" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;overflow:visible">

/* ---- Gedeelde bouwstenen voor de staafgrafieken: as met waarden, labels boven de staven
       en een tik-uitlezing. Puur weergave; de reeksen zelf blijven zoals ze zijn. ---- */
const CHART_GEO={W:320,H:172,L:34,R:6,TOP:16,BASE:126,XLAB:142};   // L = gutter voor de y-labels
const chartK=v=>euroK(v);   // één compacte notatie in de hele app (euroK)
// welke staven een vast label krijgen: bij weinig maanden alle, anders eerste/laatste/hoogste/laagste
function chartLabelIdx(vals){
  const idx=vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0);
  if(!idx.length) return new Set();
  if(idx.length<=6) return new Set(idx);
  let hi=idx[0], lo=idx[0];
  for(const i of idx){ if(vals[i]>vals[hi]) hi=i; if(vals[i]<vals[lo]) lo=i; }
  return new Set([idx[0], idx[idx.length-1], hi, lo]);
}
function chartYAxis(niceTop, fmt){
  const G=CHART_GEO; const out=[];
  for(const f of [1,0.5]){
    const v=niceTop*f, yy=G.BASE-f*(G.BASE-G.TOP);
    out.push(`<text x="${G.L-5}" y="${(yy+3).toFixed(1)}" font-size="8.5" fill="var(--lab)" text-anchor="end">${fmt(v)}</text>`);
  }
  out.push(`<text x="${G.L-5}" y="${G.BASE+3}" font-size="8.5" fill="var(--lab)" text-anchor="end">0</text>`);
  return out.join('');
}
// tik-uitlezing: vult een regel onder de grafiek, zonder re-render
function chartRead(id,txt){ const el=document.getElementById(id); if(el) el.innerHTML=txt; }
// label voor een referentielijn, rechts uitgelijnd, met een dekkend plaatje eronder zodat het
// leesbaar blijft als er staven achter langs lopen
function chartTagRight(xr,yy,txt,col){
  const w=txt.length*4.7+8;
  return `<rect x="${(xr-w).toFixed(1)}" y="${(yy-8.5).toFixed(1)}" width="${w.toFixed(1)}" height="11.5" rx="3" fill="var(--card2)" fill-opacity=".95"/>`
    +`<text x="${(xr-4).toFixed(1)}" y="${yy.toFixed(1)}" font-size="8.5" font-weight="700" fill="${col}" text-anchor="end">${txt}</text>`;
}

// volledige historie van één KPI: staven met waarde, maandlabels, y-as en je band als gelabelde lijn
function kpiHistChart(k){
  const vals=k.series, labs=k.labels, ms=k.maanden;
  if(vals.filter(v=>v!=null).length<2) return `<div class="small muted" style="margin:14px 0 4px">Na twee maanden zie je hier je verloop.</div>`;
  const band=kpiBand(k.key)!=null?kpiBand(k.key):(k.ref||0);
  const G=CHART_GEO, {W,R,L,TOP,BASE,XLAB,H}=G;
  const ruw=Math.max(...vals.map(v=>Math.max(v||0,0)),band||0,1);
  const niceTop=Math.max(Math.ceil(ruw*1.08/10)*10,10);
  const slot=(W-L-R)/vals.length, bw=Math.min(slot*0.62,34);
  const y=v=>BASE-Math.max(v,0)/niceTop*(BASE-TOP);
  const col=kpiBarColor(k);
  const every=Math.ceil(vals.length/12);
  const toon=chartLabelIdx(vals);
  const kort=v=>k.fmt(v);
  const bars=vals.map((v,i)=>{
    const cx=L+slot*i+slot/2, x=cx-bw/2, nu=(k.partial&&i===vals.length-1);
    if(v==null) return `<text x="${cx.toFixed(1)}" y="${XLAB}" font-size="9" fill="var(--lab)" text-anchor="middle">${labs[i]}</text>`;
    const yy=y(v);
    const bar=`<rect class="cbar" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(BASE-yy,1.5).toFixed(1)}" rx="3" fill="${col(v,i)}"${nu?' fill-opacity=".45" stroke="'+col(v,i)+'" stroke-width="1" stroke-dasharray="3 2"':''}/>`;
    const val=toon.has(i)?`<text x="${cx.toFixed(1)}" y="${Math.max(yy-4,TOP-4).toFixed(1)}" font-size="8.5" font-weight="700" fill="var(--txt)" text-anchor="middle">${kort(v)}</text>`:'';
    const lab=(i%every===0||i===vals.length-1)?`<text x="${cx.toFixed(1)}" y="${XLAB}" font-size="9" fill="var(--lab)" text-anchor="middle">${labs[i]}${nu?'*':''}</text>`:'';
    const hit=`<rect x="${(L+slot*i).toFixed(1)}" y="${TOP}" width="${slot.toFixed(1)}" height="${(BASE-TOP+18).toFixed(1)}" fill="transparent" style="cursor:pointer" onclick="chartRead('kpiRead','&lt;b&gt;${esc(monthLabel(ms[i]))}&lt;/b&gt; · ${k.fmt(v)}${nu?' · tot nu toe':''}')"><title>${labs[i]} · ${k.fmt(v)}</title></rect>`;
    return bar+val+lab+hit;
  }).join('');
  const bandTxt=kpiBandTxt(k.key);
  const bandLine=band>0&&band<=niceTop?`<line x1="${L}" x2="${W-R}" y1="${y(band).toFixed(1)}" y2="${y(band).toFixed(1)}" stroke="var(--ref)" stroke-width="1.4" stroke-dasharray="4 3"/>`
    +chartTagRight(W-R, y(band)-4, bandTxt, 'var(--ref)'):'';
  return `<svg id="kpiHist" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block;margin-top:12px">
      ${chartYAxis(niceTop, kort)}
      <line x1="${L}" x2="${W-R}" y1="${BASE}" y2="${BASE}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      ${bars}${bandLine}
    </svg>
    <div id="kpiRead" class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:2px;min-height:15px">Tik een staaf voor de exacte waarde.${k.partial?' De maand met * loopt nog.':''}</div>
    <div class="gc-leg"><span><i class="d"></i>${kpiBandTxt(k.key)}</span><span><i style="background:var(--bar)"></i>binnen</span><span><i style="background:${kpiCol('bad')}"></i>erbuiten</span></div>`;
}
/* Welke transacties maken dit kerncijfer? (v104) Elk cijfer heeft een scherp afgebakende
   verzameling, en die gebruiken we hier letterlijk: dezelfde predicaten als totals() en
   splitFixedVar(). Zo telt de lijst per definitie op tot het getal erboven. Een lijst die iets
   anders zegt dan het cijfer zou een nieuw vertrouwensprobleem zijn in plaats van een opgelost. */
function kpiTx(key,m){
  const list=txOfMonth(m);
  if(key==='vast')   return list.filter(x=>isExpenseTx(x)&&isFixed(x));
  if(key==='vari')   return list.filter(x=>isExpenseTx(x)&&!isFixed(x));
  if(key==='budget') return list.filter(isExpenseTx);
  if(key==='spaar')  return list.filter(isExpenseTx);      // het inkomen staat apart, zie hieronder
  if(key==='inleg')  return savedTx(m);                    // bij- of afschrijvingen op je spaarrekening
  return [];
}
/* Het inkomen in de restsaldo-quote komt uit totals() en dat is lang niet altijd de som van je
   inkomsten-transacties: met autoIncome uit is het je eigen instelling (index.html:1441).
   Doen alsof de transacties dat getal maken zou onwaar zijn, dus we noemen de bron. */
const KPI_INCBRON={handmatig:'zelf ingesteld', gedetecteerd:'herkend uit je transacties', basisnorm:'je basisnorm uit eerdere maanden', onbekend:'onbekend'};
/* Wat heeft één transactie aan dit cijfer gedaan? (v105) Dezelfde noemer als het cijfer zelf
   (kpiAfstand().basis: je potjes bij budgetnaleving, anders je inkomen), zodat de bijdragen
   optellen tot het getal erboven. Het teken volgt de betekenis: bij sparen dúwt een uitgave het
   cijfer omlaag, bij een drukmetriek juist omhoog. Een terugstorting draait dat vanzelf om. */
function kpiBijdrage(key,t,basis){
  if(!(basis>0)) return null;
  const sign=(KPI_META[key]||{}).sign||1;
  return sign*kpiTxWaarde(key,t)/basis*100;
}
const kpiPt=v=>{ const a=Math.abs(v); if(a<0.05) return '0 pt';
  return (v<0?'−':'+')+String(Math.round(a*10)/10).replace('.',',')+' pt'; };
/* De teller van een kerncijfer. Uitgaven tellen netto als -amount (netSpend); de spaarquote
   telt de instroom op je spaarrekening, dus juist +amount. Eén plek, zodat de lijst, de delta en
   de bijdrage per transactie dezelfde som gebruiken. */
function kpiTxWaarde(key,t){
  if(key==='inleg') return n26SavingsAccounts().length?t.amount:-t.amount;   // terugval telt afschrijvingen
  return -t.amount;                                                          // uitgave: netto, terugstorting verlaagt
}
function kpiSom(key,items){ return items.reduce((s,t)=>s+kpiTxWaarde(key,t),0); }
function kpiTxLijst(key,m){
  const t=totals(m);
  const K=insKpis(m), basis=(K[key]&&K[key].afst)?K[key].afst.basis:0;
  // v105: op gewicht, niet op datum. De vraag is welke transactie dit cijfer maakt, en dan is
  // "de zwaarste eerst" het antwoord; de datum staat er per regel toch bij.
  const items=kpiTx(key,m).slice().map(x=>({t:x,pt:kpiBijdrage(key,x,basis)}))
    .sort((a,b)=>(Math.abs(b.pt||0)-Math.abs(a.pt||0))||b.t.date.localeCompare(a.t.date));
  const uit=kpiSom(key,items.map(x=>x.t));
  const kop=(key==='inleg')
    ? `${euro0(uit)} naar je spaarrekening, van ${euro0(t.income)} inkomen`
    : (key==='spaar')
    ? `${euro0(t.income)} inkomen − ${euro0(uit)} uitgaven = ${euro0(t.income-uit)} overgehouden`
    : (key==='budget')
    ? `${euro0(uit)} uitgegeven van ${euro0(t.budget)} budget`
    : `${euro0(uit)} aan ${key==='vast'?'vaste lasten':'variabele uitgaven'}`;
  const incRegel=(key==='spaar')
    ? `<div class="row" style="justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
         <span class="small">Inkomen · <span style="color:var(--mut2)">${KPI_INCBRON[t.incomeBasis]||t.incomeBasis}</span></span>
         <span class="small" style="font-weight:700">${euro0(t.income)}</span></div>`
    : '';
  const rijen=items.length?items.map(({t:t2,pt})=>{const c=CATS[catOf(t2)];
    return `<div class="tx" style="cursor:default"><div class="ava" style="background:var(--card2)">${c.icon}</div>
      <div class="info"><div class="nm">${esc(t2.name)}</div><div class="cat">${new Date(t2.date).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} · ${c.name}</div></div>
      <div style="text-align:right"><div class="amt ${t2.amount>0?'pos':'neg'}">${t2.amount>0?'+':''}${euro(t2.amount)}</div>
        ${pt!=null?`<div class="kpi-pt small" style="color:var(--mut2);font-size:var(--fs-xs)">${kpiPt(pt)}</div>`:''}</div></div>`;}).join('')
    : `<div class="small muted" style="padding:12px 0">Geen transacties in deze maand.</div>`;
  // de uitleg hoort bij de eenheid, niet bij elke regel: één zin boven de lijst
  const ptUitleg=(basis>0&&items.length)
    ? `<div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin:2px 0 6px">Achter elk bedrag staat wat die transactie aan dit cijfer deed, in ${jrg('procentpunt','procentpunten')}. ${key==='spaar'?'Een uitgave duwt je restsaldo-quote omlaag.':'Een uitgave duwt dit cijfer omhoog.'}</div>`
    : '';
  return `<details class="kpi-tx" style="margin-top:14px">
    <summary class="small" style="color:var(--teal);cursor:pointer">Welke transacties zitten hierin? · ${items.length}</summary>
    <div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin:8px 0 2px">${kop}</div>
    ${ptUitleg}${incRegel}${rijen}</details>`;
}
/* Wat veranderde er sinds vorige maand, en wat verklaart dat? (v106)
   Elk kerncijfer is teken × X/B: X is wat je uitgaf, B je inkomen (of je potjes bij
   budgetnaleving). De verschuiving splitst dan exact in twee delen:
     teller-effect  (X1 − X0)/B1        — wat je anders uitgaf
     noemer-effect  X0·(1/B1 − 1/B0)    — wat je inkomen of budget deed
   Samen zijn ze de hele verandering, en alleen het teller-effect splitst per categorie. Zonder
   die tweedeling zou een gedaald inkomen als "je gaf meer uit" lezen, en dat is niet waar. */
function kpiXB(key,m){
  const t=totals(m);
  return {X:kpiSom(key,kpiTx(key,m)), B:(key==='budget')?(+t.budget||0):(+t.income||0)};
}
function kpiCatSom(key,m){                     // niet clampen: een netto-negatieve categorie telt gewoon mee
  const by={};
  if(key==='inleg'){ const sav=new Set(n26SavingsAccounts());
    // alle spaarboekingen dragen dezelfde categorie, dus groeperen we op rekening
    for(const t of kpiTx(key,m)){ const k='acc:'+t.acc; by[k]=(by[k]||0)+(sav.size?t.amount:-t.amount); }
    return by; }
  for(const t of kpiTx(key,m)){ const c=catOf(t); by[c]=(by[c]||0)+(-t.amount); } return by;
}
// label van een driver: een categorie, of bij de spaarquote een rekening
function kpiDriverNaam(k){
  if(String(k).slice(0,4)==='acc:'){ const a=String(k).slice(4); return 'Naar '+(accShort(a)||'je spaarrekening'); }
  return CATS[k]?CATS[k].name:k;
}
function kpiDelta(key,m){
  const ms=months(), i=ms.indexOf(m); if(i<1) return null;
  const vorige=ms[i-1];
  const a=kpiXB(key,m), b=kpiXB(key,vorige);
  if(!(a.B>0)||!(b.B>0)) return null;                     // zonder basis geen vergelijking (v59/v73)
  const teken=(KPI_META[key]||{}).sign||1;
  const nu=teken*a.X/a.B*100, was=teken*b.X/b.B*100;
  const tel=teken*(a.X-b.X)/a.B*100;
  const noem=teken*b.X*(1/a.B-1/b.B)*100;
  const c1=kpiCatSom(key,m), c0=kpiCatSom(key,vorige);
  const cats=[...new Set([...Object.keys(c1),...Object.keys(c0)])]
    .map(c=>({cat:c, euro:(c1[c]||0)-(c0[c]||0), pt:teken*((c1[c]||0)-(c0[c]||0))/a.B*100}))
    .filter(x=>Math.abs(x.pt)>=0.05).sort((x,y)=>Math.abs(y.pt)-Math.abs(x.pt));
  return {vorige, was, nu, dpt:nu-was, tel, noem, cats, basisVan:b.B, basisNaar:a.B};
}
function kpiDeltaBlok(key,m,partial){
  // Een halve maand tegen een hele leggen zegt niets; dat wachten we af (zie ook de tegel in v103).
  if(partial) return `<div class="kpi-delta small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:13px">De vergelijking met vorige maand volgt zodra deze maand rond is.</div>`;
  const D=kpiDelta(key,m); if(!D) return '';
  if(Math.abs(D.dpt)<0.05) return `<div class="kpi-delta small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:13px">Vrijwel gelijk aan ${esc(monthLabel(D.vorige))}.</div>`;
  const TOP=4, top=D.cats.slice(0,TOP), rest=D.cats.slice(TOP);
  const restPt=rest.reduce((s,x)=>s+x.pt,0);
  const rij=(nm,pt,eu)=>`<div class="row" style="justify-content:space-between;gap:10px;padding:4px 0">
    <span class="small">${nm}</span><span class="small" style="color:var(--mut2);white-space:nowrap">${eu!=null?`${euro0(Math.abs(eu))} ${eu>0?'meer':'minder'} · `:''}${kpiPt(pt)}</span></div>`;
  const noemRij=Math.abs(D.noem)>=0.05
    ? rij(`Je ${key==='budget'?'budget':'inkomen'} ging van ${euro0(D.basisVan)} naar ${euro0(D.basisNaar)}`, D.noem, null)
    : '';
  return `<div class="kpi-delta" style="margin-top:14px;border-top:1px solid var(--line);padding-top:11px">
    <div class="row" style="justify-content:space-between;gap:10px">
      <span class="small" style="font-weight:600">Ten opzichte van ${esc(monthLabel(D.vorige))}</span>
      <span class="small" style="font-weight:700">${_pct0(D.was)} → ${_pct0(D.nu)} · ${kpiPt(D.dpt)}</span></div>
    <div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin:6px 0 2px">Wat die verschuiving verklaart:</div>
    ${top.map(x=>rij(kpiDriverNaam(x.cat), x.pt, x.euro)).join('')}
    ${rest.length?rij(`Overige ${rest.length}`,restPt,null):''}
    ${noemRij}</div>`;
}
/* De stand tegen het doel in één beeld (v103). Neutrale datakleur; amber alleen als je er echt
   buiten valt (v93), en niet in een lopende maand — een halve maand is geen eindoordeel.
   De markering staat in een wrapper omdat .bar-track overflow:hidden heeft. */
/* De twee spaarcijfers horen bij elkaar (v109): je restsaldo is wat je overhield, je spaarquote
   wat je daarvan echt opzij zette. In beide sheets dezelfde zin, zodat het verschil niet ergens
   half blijft hangen. Stortte je meer dan je overhield, dan kwam dat uit eerder spaargeld — dat
   zeggen we dan gewoon, zonder oordeel. */
function kpiSpaarBrug(key,m){
  if(key!=='spaar'&&key!=='inleg') return '';
  const K=insKpis(m), rest=K.spaar?K.spaar.raw:null, inleg=K.inleg?K.inleg.raw:null;
  if(rest==null||inleg==null) return '';
  const t=totals(m), over=Math.round(t.income-t.spend), gestort=savedNet(m);
  if(gestort==null) return '';
  const staart=(gestort>over)
    ? ` Dat is meer dan je overhield, dus een deel kwam uit eerder spaargeld.`
    : (gestort<0 ? ` Je nam deze maand netto op.` : ` Het verschil bleef op je betaalrekening staan.`);
  return `<div class="kpi-brug small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:11px;line-height:1.5">
    Je hield ${_pct0(rest)} over (${euro0(over)}) en zette ${_pct0(inleg)} opzij (${euro0(gestort)}).${staart}</div>`;
}
function kpiDoelBalk(k){
  const A=k.afst; if(!A) return '';
  const B=kpiBand(k.key), v=k.raw; if(!(B>0)||v==null) return '';
  const top=Math.max(v,B)*1.25||1;
  const pv=Math.max(Math.min(v/top*100,100),0), pd=Math.max(Math.min(B/top*100,100),0);
  const col=(k.state==='bad')?'var(--amber)':'var(--bar)';
  const pt=Math.abs(A.pt), ptTxt=pt>=0.05?`${String(pt).replace('.',',')} pt · `:'';
  return `<div class="kpi-doel" style="margin-top:13px">

// Kolomgrafiek uitgaven per maand met je maandbudget als gestreepte referentie.
// viewBox + width:100% => schaalt mee, kapt nooit af op smalle schermen.
function spendVsBudgetChart(){
  const ms=months();
  // In Rustig start deze twaalf-maands grafiek ingeklapt: één tik en hij staat er, maar hij
  // overvalt je niet. Een eigen keuze (open of dicht) wint altijd van die default.
  const open=collapOpen('openSpendChart');
  const head=`<div class="row" style="margin-bottom:${open?'8px':'0'};cursor:pointer" onclick="toggleCollap('openSpendChart')"><span class="hlabel" style="margin:0;flex:1">${ICON('trend')} Uitgaven vs budget</span><span class="muted" style="font-size:var(--fs-lg);width:14px;text-align:center">${open?'▲':'›'}</span></div>`;
  if(ms.length<2) return `<div class="card">${head}${open?'<div class="small muted">Na twee maanden zie je hier je verloop.</div>':''}</div>`;
  if(!open) return `<div class="card" id="insSpendCard">${head}<div class="small" style="color:var(--mut2);margin-top:6px">Je uitgaven per maand naast je budget · tik om te bekijken</div></div>`;
  const last=ms.slice(-12);
  const now=new Date(); const nowYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const rows=last.map(mm=>{ const t=totals(mm); return {m:mm, spend:Math.max(t.spend,0), budget:Math.max(t.budget,0), now:mm===nowYM}; });
  const G=CHART_GEO, {W,H,L,R,TOP,BASE,XLAB}=G;
  const niceTop=reisNiceCeil(Math.max(...rows.map(r=>Math.max(r.spend,r.budget)),1)*1.08);
  const slot=(W-L-R)/rows.length, bw=Math.min(slot*0.62,34);
  const y=v=>BASE-Math.max(v,0)/niceTop*(BASE-TOP);
  // alleen de uitschieter draagt een label; de rest lees je via de tooltip of de uitlezing
  const piek=rows.reduce((b,r,i)=>(r.spend>rows[b].spend?i:b),0);
  const toon=new Set([piek]);
  const yBudLab=rows[rows.length-1].budget>0?y(rows[rows.length-1].budget)-4:-99;
  if(piek===rows.length-1 && Math.abs(Math.max(y(rows[piek].spend)-4,TOP-4)-yBudLab)<11) toon.delete(piek);
  const bars=rows.map((r,i)=>{
    const cx=L+slot*i+slot/2, x=cx-bw/2, yy=y(r.spend), h=Math.max(BASE-yy,1.5);
    // één datakleur: neutraal, met de lopende maand als accent. Boven of onder budget lees je
    // aan de gestreepte budgetlijn — geen tweede kleur nodig.
    const col=r.now?'var(--teal)':'var(--bar)';
    const bar=`<rect class="cbar" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}"${r.now?' fill-opacity=".42" stroke="'+col+'" stroke-width="1" stroke-dasharray="3 2"':''}/>`;
    const bud=r.budget>0?`<line x1="${(L+slot*i+1).toFixed(1)}" x2="${(L+slot*(i+1)-1).toFixed(1)}" y1="${y(r.budget).toFixed(1)}" y2="${y(r.budget).toFixed(1)}" stroke="var(--ref)" stroke-width="1.4" stroke-dasharray="4 3"/>`:'';
    const val=toon.has(i)?`<text x="${cx.toFixed(1)}" y="${Math.max(yy-4,TOP-4).toFixed(1)}" font-size="8.5" font-weight="700" fill="var(--txt)" text-anchor="middle">${chartK(r.spend)}</text>`:'';
    const lab=`<text x="${cx.toFixed(1)}" y="${XLAB}" font-size="9" fill="var(--lab)" text-anchor="middle">${MNAMES[+r.m.slice(5,7)-1]}${r.now?'*':''}</text>`;
    // let op: geen aanhalingstekens in deze string — hij zit in een onclick-attribuut
    const uit=`&lt;b&gt;${esc(monthLabel(r.m))}&lt;/b&gt; · ${euro0(r.spend)}${r.budget>0?` van ${euro0(r.budget)}`:''}${r.now?' · tot nu toe':''} · bekijk maand ›`;
    const hit=`<rect x="${(L+slot*i).toFixed(1)}" y="${TOP}" width="${slot.toFixed(1)}" height="${(BASE-TOP+18).toFixed(1)}" fill="transparent" style="cursor:pointer" onclick="chartRead('spendRead','${uit}');window._spendPick='${r.m}'"><title>${MFULL[+r.m.slice(5,7)-1]} ${r.m.slice(0,4)} · ${euro0(r.spend)}</title></rect>`;
    return bud+bar+val+lab+hit;
  }).join('');
  const hasNow=rows.some(r=>r.now);
  const budNu=rows[rows.length-1].budget;
  return `<div class="card">${head}
    <svg id="insSpendChart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block">
      ${chartYAxis(niceTop, chartK)}
      <line x1="${L}" x2="${W-R}" y1="${BASE}" y2="${BASE}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      ${bars}
      ${budNu>0?chartTagRight(W-R, y(budNu)-4, 'budget '+chartK(budNu), 'var(--ref)'):''}
    </svg>
    <div id="spendRead" class="small" style="color:var(--teal);font-size:var(--fs-xs);margin-top:2px;min-height:15px;cursor:pointer" onclick="if(window._spendPick)openBudgetCompare(window._spendPick)"><span style="color:var(--mut2)">Tik een maand voor het bedrag.${hasNow?' De maand met * loopt nog.':''}</span></div>
    <div class="gc-leg"><span><i style="background:var(--bar)"></i>per maand</span><span><i style="background:var(--teal)"></i>deze maand</span><span><i class="d"></i>maandbudget</span></div>
  </div>`;
}

function renderBehavior(m){
  const rows=[]; const actual=catSpendMap(m), EB=effectiveBudgets(m).out; let worst=null;
  for(const k in EB){ if(+EB[k]>0){ const act=actual[k]||0; if(act>+EB[k]){ const band=budgetBand(+EB[k],act); if(band==='action'||band==='monitor'){ const over=act-(+EB[k]); if(!worst||over>worst.over) worst={k,over}; } } } }
  if(worst) rows.push({tone:'warn',txt:`${CATS[worst.k].name} loopt uit de pas`,k:worst.k});
  for(const i of (coachItems()||[])){ if(i.t==='good'||rows.length>=4) continue;
    if(worst && i.insight && i.insight.toLowerCase().includes(CATS[worst.k].name.toLowerCase())) continue;
    rows.push({tone:i.t,txt:i.insight}); }
  if(!rows.length) return '';
  const dotc=t=>t==='bad'?'var(--red)':t==='warn'?'var(--amber)':'var(--teal)';
  const body=rows.slice(0,4).map(r=>`<div class="beh-row"><span class="beh-dot" style="background:${dotc(r.tone)}"></span><span class="beh-t">${esc(r.txt)}</span></div>`).join('');
  return `<div class="card"><div class="hlabel" style="margin:0 0 4px">Gedrag</div>${body}</div>`;
}

/* ============================================================
   DOORSTROOMPOSTEN — uitgeleend / geleend / borg
   Niet elke afschrijving is een uitgave. Een gemarkeerde transactie krijgt een internal-categorie
   (dus buiten spend/income) en komt als vordering of schuld in je netto vermogen. Een latere
   terugbetaling verlaagt de openstaande post; het is nooit inkomen.
   Grootboek: SET.loans = [{id,txId,naam,richting:'uit'|'in',soort:'lening'|'borg',bedrag,open,datum,terug}]
   ============================================================ */
const LOAN_CAT={uit:'uitgeleend', in:'geleend'};
function loans(){ return Array.isArray(SET.loans)?SET.loans:[]; }
function loanFor(txId){ return loans().find(l=>l.txId===txId)||null; }
function loanTotals(){
  let uit=0, inn=0;
  for(const l of loans()){ const o=Math.max(+l.open||0,0); if(l.richting==='in') inn+=o; else uit+=o; }
  return {uit:Math.round(uit), in:Math.round(inn)};
}
// markeren: categorie omzetten én een post in het grootboek. Eén tik is genoeg; de rest is optioneel.
function markLoan(txId, richting, soort){
  const t=TX.find(x=>x.id===txId); if(!t) return;
  const bedrag=Math.round(Math.abs(+t.amount||0)); if(!(bedrag>0)) return;
  SET.loans=loans().filter(l=>l.txId!==txId);
  SET.loans.push({id:'l'+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36),
    txId, naam:(cleanMerch(t.name)||t.name||'onbekend').slice(0,40), richting:(richting==='in'?'in':'uit'),
    soort:(soort==='borg'?'borg':'lening'), bedrag, open:bedrag, datum:t.date, terug:''});
  OVR[txId]=LOAN_CAT[richting==='in'?'in':'uit'];
  save(); closeSheet(); render();
  toast(`${ICON('check')} ${richting==='in'?'Geleend':(soort==='borg'?'Borg':'Uitgeleend')} · ${euro0(bedrag)}`);
}
function unmarkLoan(txId){ if(!loanFor(txId)) return false; SET.loans=loans().filter(l=>l.txId!==txId); return true; }
function setLoanField(id,veld,val){
  const l=loans().find(x=>x.id===id); if(!l) return;
  if(veld==='naam') l.naam=String(val||'').slice(0,40);
  else if(veld==='terug') l.terug=String(val||'').slice(0,10);
  else if(veld==='waarvoor') l.waarvoor=String(val||'').slice(0,60);          // voor het betaalverzoek-bericht
  else if(veld==='link') l.link=String(val||'').trim().slice(0,200);          // eigen Tikkie-/betaallink, optioneel
  else if(veld==='open'){ const v=Math.max(Math.round(+val||0),0); l.open=Math.min(v,Math.max(+l.bedrag||0,v)); }
  save(); render(); openLoan(id);
}
/* Betaalverzoek: de app verstuurt niets zelf (serverloze PWA, niets draait op de achtergrond).
   We zetten een kant-en-klaar bericht klaar en laten het toestel delen; de gebruiker kiest zelf
   Tikkie/WhatsApp/mail en verstuurt. Ontbrekende velden vallen netjes weg, nooit "€undefined". */
function loanDatumKort(iso){ const d=iso?new Date(iso):null; return (d&&!isNaN(d))?d.toLocaleDateString('nl-NL',{day:'numeric',month:'long'}):''; }
function loanShareText(l){
  if(!l) return '';
  const naam=String(l.naam||'').trim(), open=Math.max(Math.round(+l.open||0),0), waarvoor=String(l.waarvoor||'').trim();
  let s=naam?`Hoi ${naam}, `:'Hoi, ';
  s+= open>0 ? `wil je me ${euro0(open)} terugbetalen` : 'wil je me het geleende bedrag terugbetalen';
  if(waarvoor) s+=` voor ${waarvoor}`;
  const dat=loanDatumKort(l.terug); if(dat) s+=` (graag vóór ${dat})`;
  s+='? Dank je!';
  const link=String(l.link||'').trim(); if(link) s+=' '+link;
  return s;
}
async function loanShare(id){
  const l=loans().find(x=>x.id===id); if(!l) return;
  const text=loanShareText(l);
  try{
    if(navigator.share){ await navigator.share({title:'Betaalverzoek', text}); toast(`${ICON('check')} Betaalverzoek gedeeld`); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }        // zelf geannuleerd: geen ruis, geen fallback
  try{ await navigator.clipboard.writeText(text); toast(`${ICON('check')} Betaalverzoek gekopieerd — plak het in Tikkie of WhatsApp`); }
  catch(_){ toast('Kopiëren lukt niet op dit toestel'); }
}
/* Herinnering een paar dagen vóór de afgesproken datum. Alleen wat JIJ terugkrijgt (een
   betaalverzoek slaat nergens op bij geleend geld), alleen met een datum, alleen als er nog
   iets openstaat. Al gepasseerd = "was vóór X", geen alarm. */
const LOAN_REMIND_DAYS=3;
function loanDueList(){
  const t0=new Date(); t0.setHours(0,0,0,0); const out=[];
  for(const l of loans()){
    if((l.richting==='in')||!(+l.open>0)||!l.terug) continue;
    const d=new Date(l.terug); if(isNaN(d)) continue; d.setHours(0,0,0,0);
    const dagen=Math.round((d.getTime()-t0.getTime())/86400000);
    if(dagen>LOAN_REMIND_DAYS) continue;                     // nog ver weg: nog even niets
    out.push({l, dagen, laat:dagen<0});
  }
  return out.sort((a,b)=>a.dagen-b.dagen);
}
function loanRepaidFromNotif(id){
  const l=loans().find(x=>x.id===id); if(!l) return;
  loanRepay(id, Math.max(+l.open||0,0));
}
// terugbetaling: verlaagt de openstaande post. Geen inkomen; het geld kwam alleen terug.
function loanRepay(id, bedrag, txId){
  const l=loans().find(x=>x.id===id); if(!l) return;
  const b=Math.max(Math.round(+bedrag||0),0);
  l.open=Math.max(Math.round((+l.open||0)-b),0);
  if(txId){ OVR[txId]=LOAN_CAT[l.richting]; l.terugTx=(l.terugTx||[]).concat([txId]); }
  save(); closeSheet(); render();
  toast(l.open>0?`${ICON('check')} Nog ${euro0(l.open)} open`:`${ICON('check')} Volledig terugbetaald`);
}
// kwijtschelden: de post sluit én de oorspronkelijke transactie wordt alsnog een échte uitgave,
// op dít moment. Dat is eerlijk: pas nu is het geld echt weg.
function loanWriteOff(id, cat){
  const l=loans().find(x=>x.id===id); if(!l) return;
  if(l.txId){ OVR[l.txId]=cat||'persoonlijk'; }
  SET.loans=loans().filter(x=>x.id!==id);
  save(); closeSheet(); render(); toast(`${ICON('check')} Als uitgave geboekt`);
}
function loanDelete(id){
  const l=loans().find(x=>x.id===id); if(!l) return;
  if(l.txId && OVR[l.txId] && (OVR[l.txId]==='uitgeleend'||OVR[l.txId]==='geleend')) delete OVR[l.txId];
  SET.loans=loans().filter(x=>x.id!==id);
  save(); closeSheet(); render();
}
// Stap 3: een binnenkomende betaling die bij een open post past. Suggestie, nooit automatisch.
function loanMatch(t){
  if(!t || !(+t.amount>0)) return null;
  const nm=(cleanMerch(t.name)||'').toUpperCase();
  const bedrag=Math.round(+t.amount);
  const kand=loans().filter(l=>(+l.open||0)>0 && (l.richting==='uit') && l.datum<=t.date);
  if(!kand.length) return null;
  const score=l=>{
    const zelfde=nm && (l.naam||'').toUpperCase().slice(0,8)===nm.slice(0,8);
    const dicht=Math.abs((+l.open||0)-bedrag);
    return (zelfde?0:1000)+dicht;                      // zelfde tegenpartij eerst, dan dichtst bij het bedrag
  };
  const beste=kand.slice().sort((a,b)=>score(a)-score(b))[0];
  const zelfde=nm && (beste.naam||'').toUpperCase().slice(0,8)===nm.slice(0,8);
  if(!zelfde && Math.abs((+beste.open||0)-bedrag)>Math.max((+beste.open||0)*0.1,5)) return null;
  return {loan:beste, bedrag:Math.min(bedrag,+beste.open||0), deels:bedrag<(+beste.open||0)};
}

}

function setCat(id,k){
  const t=TX.find(x=>x.id===id); if(!t) return;
  if(k!=='uitgeleend' && k!=='geleend' && unmarkLoan(id)) save();   // terug naar uitgave: post opruimen
  const mk=document.getElementById('mkrule');
  if(mk&&mk.checked){   // maak een blijvende regel van deze winkel
    const kw=((cleanMerch(t.name)||t.name)||'').toUpperCase().trim().slice(0,28);
    if(kw){ SET.rules=(SET.rules||[]).filter(r=>r.kw!==kw); SET.rules.unshift({kw,cat:k}); delete OVR[id];
      save(); TX.forEach(categorize); applyOwnAccounts(); buildAccMeta(); closeSheet(); render(); toast('Regel: '+kw+' → '+CATS[k].name); return; }
  }
  if(t.autoCat===k) delete OVR[id]; else OVR[id]=k; save(); closeSheet(); render();
}

const THEMES={

  prive:{naam:'Privé', sub:'Licht & editorial — ivoor, serif, diep groen', bg:'#f6f2e9', card:'#fffdf9', accent:'#1f5c46', txt:'#1c2b26', serif:true},
  aurora:{naam:'Neo-Dark Aurora', sub:'Donker & glas — gloed, mint en violet', bg:'#0a0e17', card:'rgba(255,255,255,.06)', accent:'#34e0c4', txt:'#eaf0fb', serif:false, glow:true}
};
function themeKey(){ const k=SET.theme; return THEMES[k]?k:'standaard'; }
function applyTheme(){
  const k=themeKey();
  if(k==='standaard') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=k;
}
function setTheme(k){
  if(!THEMES[k]) return;
  SET.theme=k; save(); applyTheme(); render();
  if(window._setSheet==='look') renderSetSheet();
  toast(`${ICON('check')} Thema: ${THEMES[k].naam}`);
}
// mini-voorbeeld per thema: dezelfde bouwstenen als de app (kaart, hero-bedrag, staafje, pill)

/* ============================================================================
   BRIEFING-EXPORT: financiële signalen naar de dagelijkse briefing.
   Schrijft minder-signalen.json in het blokformaat van briefing-spec.md naar
   je CommandCenter-map. Geporteerd uit minderBriefingExport.js (de spec/referentie)
   en aangesloten op de echte app-functies. Zie minder-signalen-export.md.
   ========================================================================== */

// Vermogensreis op koers? Spiegel van je eigen cijfers, geen advies.
// true = FIRE-getal wordt gehaald op of vóór je streefjaar, false = niet/te laat,
// undefined = geen oordeel (geen FIRE-getal ingesteld of saldo onvolledig).
function fireOpKoers(){
  let M; try{ M=reisModel(); }catch(_){ return undefined; }
  if(!M || !(M.FIRE>0)) return undefined;
  if(M.missing) return undefined;
  const fire=(M.ms||[]).find(m=>m.key==='fire');
  if(!fire) return undefined;
  if(fire.yr==null) return false;
  return fire.yr <= M.targetYear;
}

// Adapter: echte Minder-data → het platte blokformaat dat de signalen verwachten.
function minderBriefingState(){
  const now=new Date(); const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const num=fn=>{ try{ const v=fn(); return (typeof v==='number'&&isFinite(v))?v:NaN; }catch(_){ return NaN; } };
  let verpl=[];
  try{ const today=new Date(); today.setHours(0,0,0,0);
    verpl=(liquidityDaily(10).events||[])
      .filter(e=>e.type==='fixed' && e.amt<0)
      .map(e=>({naam:e.name, bedrag:-e.amt, dagenTotVervaldag:Math.round((e.date-today)/86400000)}))
      .filter(v=>v.dagenTotVervaldag>=0);
  }catch(_){}
  return {
    safeToSpend: num(()=>safeToSpend().safe),
    safeToSpendBuffer: +SET.stsBuffer||0,
    netSpendPeriode: num(()=>{ const de=daysElapsed(ym); if(!de.elapsed||de.elapsed<7) return NaN; return netSpend(txOfMonth(ym))*de.dim/de.elapsed; }),  // tempo-gecorrigeerd: lopende uitgave -> verwachte volledige maand (pas vanaf dag 7)
    netSpendPatroon: num(()=>baselineSpend()),
    verplichtingen: verpl,
    fireOpKoers: fireOpKoers()
  };
}

function _signaalSafeToSpend(state){
  const rest=state.safeToSpend, buffer=state.safeToSpendBuffer??0;
  if(!isFinite(rest)) return null;
  if(rest>buffer) return null;
  return { sectie:'financien', prioriteit:rest<0?'hoog':'midden',
    samenvatting:rest<0?`Je zit deze periode ${Math.abs(Math.round(rest))} euro over je safe-to-spend.`:`Je safe-to-spend is nog ${Math.round(rest)} euro, dat begint te knellen.`,
    actie:'Houd de rest van de periode kort.', detail:null };
}
function _signaalAfwijkendeUitgave(state){
  const nu=state.netSpendPeriode, patroon=state.netSpendPatroon;
  if(!isFinite(nu)||!isFinite(patroon)||patroon<=0) return null;
  const ratio=nu/patroon; if(ratio<1.15) return null;
  const procent=Math.round((ratio-1)*100);
  return { sectie:'financien', prioriteit:ratio>=1.4?'hoog':'midden',
    samenvatting:`In dit tempo kom je deze maand ${procent} procent boven je patroon uit.`,
    actie:'Bekijk of dit bewust is.', detail:`verwachte maanduitgave ${Math.round(nu)} versus patroon ${Math.round(patroon)}` };
}
function _signaalVerplichting(state){
  const dagen=5;
  const komende=(state.verplichtingen||[]).filter(v=>v.dagenTotVervaldag<=dagen).sort((a,b)=>a.dagenTotVervaldag-b.dagenTotVervaldag);
  if(!komende.length) return null;
  const e=komende[0];
  return { sectie:'financien', prioriteit:'midden',
    samenvatting:`${e.naam} van ${Math.round(e.bedrag)} euro vervalt over ${e.dagenTotVervaldag} dagen.`,
    actie:'Zorg dat er dekking is.', detail:komende.length>1?`${komende.length} verplichtingen in de komende ${dagen} dagen`:null };
}
function _signaalVermogensreis(state){
  const opKoers=state.fireOpKoers; if(opKoers===undefined) return null;
  if(opKoers) return { sectie:'financien', prioriteit:'laag', samenvatting:'Je Vermogensreis ligt op koers.', actie:null, detail:null };
  return { sectie:'financien', prioriteit:'midden', samenvatting:'Je Vermogensreis raakt uit koers ten opzichte van je plan.', actie:'Kijk of dit tijdelijk is of om bijsturen vraagt.', detail:null };
}
function bouwMinderBriefingPayload(){
  const state=minderBriefingState();
  const blokken=[_signaalSafeToSpend(state),_signaalAfwijkendeUitgave(state),_signaalVerplichting(state),_signaalVermogensreis(state)].filter(Boolean);
  return { bron:'minder', versie:1, gegenereerd_op:new Date().toISOString(), blokken };
}

// Schrijf de actuele signalen weg. silent=true bij automatische export (geen toasts, geen permissieprompt).
async function exporteerMinderSignalen(silent){
  try{
    const h=await idbGet('briefingDir');
    if(!h){ if(!silent) toast('Kies eerst een exportmap'); return; }
    let p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted'){ if(silent) return; p=await h.requestPermission({mode:'readwrite'}); }
    if(p!=='granted'){ if(!silent) toast('Geen schrijftoegang tot de map'); return; }
    const payload=bouwMinderBriefingPayload();
    const fh=await h.getFileHandle('minder-signalen.json',{create:true});
    const w=await fh.createWritable(); await w.write(JSON.stringify(payload,null,2)); await w.close();
    if(!silent) toast(`${ICON('check')} ${payload.blokken.length} ${payload.blokken.length===1?'signaal':'signalen'} geëxporteerd`);
  }catch(e){ if(!silent) toast('Export mislukt'); }

function accLabel(a){ const r=ACCMETA[a]; if(r&&r.label) return r.label; const pm=(SET.psd2Accounts||{})[a]; if(pm) return (pm.bank?pm.bank+' · ':'')+(pm.label||a); return (a||'').replace(/^N26 /,'N26 ')||'Rekening'; }

function accShort(a){ return (a||'').startsWith('N26 ') ? a.replace(/^N26 /,'') : '··'+(a||'').slice(-4); }
// nette, korte rekeningnaam (zonder persoonsnaam), N26-Spaces zoals in de N26-app, ABN als betaalrekening
const ACCT_NAMES={'6222':'Main','1123':'Buffer rust','4323':'Spaarpot','4840':'Zakgeld'};
function acctLast4(a){ const pm=(SET.psd2Accounts||{})[a]; const iban=((pm&&pm.iban)||'').replace(/\D/g,''); const id=(a||'').replace(/\D/g,''); return (iban||id).slice(-4); }
function acctNiceName(a){
  const bank=(ACCMETA[a]&&ACCMETA[a].bank)||(((SET.psd2Accounts||{})[a])||{}).bank||'';
  const last4=acctLast4(a);
  const ov=(SET.acctNames||{})[last4]; if(ov) return ov;
  if(/n26/i.test(bank)) return ACCT_NAMES[last4]||('Space ··'+last4);

  return last4?('··'+last4):(accLabel(a)||'Rekening');
}

function ingest(items){
  let added=0;
  const existing=new Set(TX.map(t=>t.id));
  for(const {name,text} of items){
    const isCSV = /\.csv$/i.test(name) || /booking date|partner name|account name/i.test(text.slice(0,200));
    let res; try{ res = isCSV ? parseCSV(text) : parseMT940(text); }catch(e){ continue; }
    for(const t of res.txns){ if(!existing.has(t.id)){ TX.push(t); existing.add(t.id); added++; } }
    for(const a in res.balances){ ACCMETA[a]=Object.assign(ACCMETA[a]||{},res.balances[a]); }
  }
  TX.sort((a,b)=>a.date.localeCompare(b.date));
  applyOwnAccounts(); buildAccMeta(); save();
  return added;
}

/* ---------- PSD2 live koppeling (Enable Banking via eigen backend) ---------- */

function psd2Cfg(){ return { url:(SET.psd2Url||'').replace(/\/+$/,''), token:SET.psd2Token||'' }; }

function psd2Ready(){ const c=psd2Cfg(); return !!(c.url && c.token); }

async function psd2Api(path, opts){
  opts=opts||{}; const c=psd2Cfg(); if(!c.url) throw new Error('Geen backend-URL ingesteld');
  const r=await fetch(c.url+path, Object.assign({}, opts, {
    headers: Object.assign({ 'Authorization':'Bearer '+c.token, 'Content-Type':'application/json' }, opts.headers||{})
  }));
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((data&&(data.error||data.detail))||('HTTP '+r.status));
  return data||{};
}
// iban → numeriek rekeningdeel (zelfde vorm als MT940 :25:, voor intern-detectie)

function ibanNum(iban){ const s=(iban||'').replace(/\s/g,''); if(s.length<8) return ''; const d=(s.slice(4).match(/\d+/g)||[]).join(''); return d.replace(/^0+/,''); }
// 1) bank kiezen → consent starten

async function psd2Refresh(silent){
  const meta=SET.psd2Accounts||{}; const keys=Object.keys(meta);
  if(!keys.length){ if(!silent) psd2Connect(); return; }
  if(!psd2Ready()){ if(!silent){ toast('Stel eerst de backend-URL en token in'); go('set'); } return; }
  if(!silent) toast('Verversen…');
  const from=new Date(); from.setMonth(from.getMonth()-2); const fromStr=from.toISOString().slice(0,10);
  const allTx=[]; const balances={}; let authFail=false, anyOk=false;
  for(const accId of keys){ const uid=meta[accId].uid; if(!uid) continue;
    let cont=null, guard=0;
    do{
      const qs='?date_from='+fromStr+(cont?'&continuation_key='+encodeURIComponent(cont):'');
      let d; try{ d=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/transactions'+qs); anyOk=true; }
      catch(e){ if(/40[13]|verlop|expired|consent|session|unauth/i.test(e.message||'')) authFail=true; break; }
      for(const raw of (d.transactions||[])){ const t=mapPsd2Tx(raw, accId); if(t) allTx.push(t); }
      cont=d.continuation_key||null; guard++;
    } while(cont && guard<40);
    try{ const b=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/balances'); const bal=pickBalance(b); if(bal!=null) balances[accId]={balance:bal,date:new Date().toISOString().slice(0,10)}; }catch(e){}
  }
  if(authFail && !anyOk){ if(!silent){ toast('Koppeling verlopen, log opnieuw in'); psd2Connect(); } return; }
  SET.psd2LastSync=Date.now(); save();
  const added=commitTx(allTx, balances);
  if(SET.psd2Pending!==false){ const pend=[];
    for(const accId of keys){ const uid=meta[accId].uid; if(!uid) continue;
      try{ const dp=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/transactions?date_from='+fromStr+'&transaction_status=PDNG');
        for(const raw of (dp.transactions||[])){ const t=mapPsd2Tx(raw, accId, true); if(t) pend.push(t); }
      }catch(e){}
    }
    applyPending(pend);
  }
  curMonth=null; render();
  if(added) try{ pushTopNotif(); updateNotifBadge(); }catch(_){}
  if(!silent) toast(added? `${ICON('check')} ${added} nieuwe transacties` : 'Bijgewerkt, geen nieuwe (van vandaag soms nog niet geboekt)');
}
