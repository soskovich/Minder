  const piek=rows.reduce((b,r,i)=>(r.spend>rows[b].spend?i:b),0);
  const toon=new Set([piek]);
  const yBudLab=rows[rows.length-1].budget>0?y(rows[rows.length-1].budget)-4:-99;
  if(piek===rows.length-1 && Math.abs(Math.max(y(rows[piek].spend)-4,TOP-4)-yBudLab)<11) toon.delete(piek);
  const bars=rows.map((r,i)=>{
    const cx=L+slot*i+slot/2, x=cx-bw/2, yy=y(r.spend), h=Math.max(BASE-yy,1.5);
    // één datakleur: neutraal, met de lopende maand als accent. Boven of onder budget lees je
    // aan de gestreepte budgetlijn — geen tweede kleur nodig.
    const col=r.now?'var(--teal)':'var(--bar)';
    const bar=`<rect class="cbar" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}"${r.now?' fill-opacity=".42" stroke="'+col+'" stroke-width="1" stroke-dasharray="3 2"':''}/>`;
    const bud=r.budget>0?`<line x1="${(L+slot*i+1).toFixed(1)}" x2="${(L+slot*(i+1)-1).toFixed(1)}" y1="${y(r.budget).toFixed(1)}" y2="${y(r.budget).toFixed(1)}" stroke="var(--ref)" stroke-width="1.4" stroke-dasharray="4 3"/>`:'';
    const val=toon.has(i)?`<text x="${cx.toFixed(1)}" y="${Math.max(yy-4,TOP-4).toFixed(1)}" font-size="8.5" font-weight="700" fill="var(--txt)" text-anchor="middle">${chartK(r.spend)}</text>`:'';
    const lab=`<text x="${cx.toFixed(1)}" y="${XLAB}" font-size="9" fill="var(--lab)" text-anchor="middle">${MNAMES[+r.m.slice(5,7)-1]}${r.now?'*':''}</text>`;
    // let op: geen aanhalingstekens in deze string — hij zit in een onclick-attribuut
    const uit=`&lt;b&gt;${esc(monthLabel(r.m))}&lt;/b&gt; · ${euro0(r.spend)}${r.budget>0?` van ${euro0(r.budget)}`:''}${r.now?' · tot nu toe':''} · bekijk maand ›`;
    const hit=`<rect x="${(L+slot*i).toFixed(1)}" y="${TOP}" width="${slot.toFixed(1)}" height="${(BASE-TOP+18).toFixed(1)}" fill="transparent" style="cursor:pointer" onclick="chartRead('spendRead','${uit}');window._spendPick='${r.m}'"><title>${MFULL[+r.m.slice(5,7)-1]} ${r.m.slice(0,4)} · ${euro0(r.spend)}</title></rect>`;
    return bud+bar+val+lab+hit;
  }).join('');
  const hasNow=rows.some(r=>r.now);
  const budNu=rows[rows.length-1].budget;
  return `<div class="card">${head}
    <svg id="insSpendChart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block">
      ${chartYAxis(niceTop, chartK)}
      <line x1="${L}" x2="${W-R}" y1="${BASE}" y2="${BASE}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
      ${bars}
      ${budNu>0?chartTagRight(W-R, y(budNu)-4, 'budget '+chartK(budNu), 'var(--ref)'):''}
    </svg>
    <div id="spendRead" class="small" style="color:var(--teal);font-size:var(--fs-xs);margin-top:2px;min-height:15px;cursor:pointer" onclick="if(window._spendPick)openBudgetCompare(window._spendPick)"><span style="color:var(--mut2)">Tik een maand voor het bedrag.${hasNow?' De maand met * loopt nog.':''}</span></div>
    <div class="gc-leg"><span><i style="background:var(--bar)"></i>per maand</span><span><i style="background:var(--teal)"></i>deze maand</span><span><i class="d"></i>maandbudget</span></div>
  </div>`;
}

// Compacte één-regel-versie van "Wat valt op": alleen het topsignaal, met dezelfde tik-actie.
function whatStandsOutLine(m){
  const mv=monthVsPrevInner(m);
  const exclude=new Set([...mv.drivers, ...budgetFlaggedCats(m)]);
  let sig; try{ sig=insSignals(m,exclude); }catch(_){ sig=[]; }
  sig.sort((a,b)=>b.pri-a.pri);
  const top=sig[0]; if(!top) return '';
  const act=top.act||'';
  /* v174: de regel toonde alleen de spiegel. De duiding en het dus-wat lagen al geschreven klaar in
     insSignals() en werden nooit getoond, terwijl dat precies het gevolg is dat hier ontbrak. Een
     signaal zonder tik krijgt er geen verzonnen: dan zegt de regel dat het een observatie is. */
  const gevolg=[top.hyp,top.imp].filter(Boolean).join(' ');
  return `<div class="card" id="wvoLine" style="padding:12px 14px${act?';cursor:pointer':''}"${act?` onclick="${act}"`:''}>
    <div class="row" style="gap:8px">
      <span style="flex:1;min-width:0;font-size:13px">${ICON('bulb')} <span class="muted">Valt op:</span> <b>${esc(top.kpiLabel)}</b> · ${top.kpiVal}${top.kpiSub?` <span class="muted">(${esc(top.kpiSub)})</span>`:''}</span>
      ${act?'<span style="color:var(--teal);font-weight:700">›</span>':''}
    </div>
    ${gevolg?`<div class="small muted" style="margin-top:6px;line-height:1.5">${esc(gevolg)}</div>`:''}
    ${(!act&&top.spiegel)?`<div class="small" style="color:var(--mut2);font-size:var(--fs-xs);margin-top:4px">Alleen een observatie: hier hoort geen stap bij.</div>`:''}
  </div>`;
}

/* Herokaart op Inzichten (v135): budgetstand en "Nog deze maand" beantwoorden dezelfde vraag -
   hoe sta ik er halverwege de maand voor - dus staan ze in één kaart. Bewust twee blokken die elk
   los kunnen ontbreken, niet één blok met optionele stukken: zo kan de kaart nooit half leeg of
   misleidend renderen. Er wordt hier niets uitgerekend; alle getallen komen uit totals(),
   daysElapsed() en de body van nogDezeMaandCard. De status-chip uit monthStatusCard staat er
   bewust NIET bij: die logica woont daar en zou hier een tweede bron worden. */
function insBudgetBlok(m){
  let t=null; try{ t=totals(m); }catch(_){ return ''; }
  const bud=Math.round(t.budget), sp=Math.round(t.spend);
  if(!(bud>0)) return '';
  const d=daysElapsed(m);
  /* v173: nul uitgaven en geen data zijn niet hetzelfde. Ligt de laatste boeking vóór de maand
     waarover dit cijfer gaat, dan is er niets gemeten en is "€0 uitgegeven, 0%" een bewering.
     Zelfde vorm als de onbekend-hero op Home: het woord onbekend, de reden, en de tik die de
     herinnering op Home ook gebruikt (importCta) - geen tweede detectie en geen tweede CTA. */
  const L=laatsteImport();
  if(L && L.datum < m+'-01'){
    const {act,lab}=importCta();
    return `<div>
      <div class="row" style="gap:8px">${maandKiezerKop(m)}</div>
      <div class="row" style="align-items:baseline;gap:8px;margin-top:8px">
        <span style="font-size:var(--fs-xl);font-weight:800;color:var(--mut)">onbekend</span>
        <span class="small muted" style="flex:1;min-width:0">uitgegeven</span></div>
      <div class="small" style="color:var(--mut);margin-top:6px;line-height:1.5">Je laatste boeking is van ${new Date(L.datum).toLocaleDateString('nl-NL',{day:'numeric',month:'long'})}, dus over deze maand is nog niets binnengekomen. Nul uitgaven en geen data zijn niet hetzelfde.</div>
      <div class="small" style="margin-top:6px"><span style="color:var(--teal);font-weight:600;cursor:pointer" onclick="${act}">${esc(lab)} ›</span></div></div>`;
  }
  const usedPct=Math.round(sp/bud*100), dayPct=Math.round(d.elapsed/d.dim*100);
  const over=sp>bud;
  /* Drie ingangen, elk op zijn eigen woorden - de ring en de titel van monthStatusCard vielen weg
     op de lopende maand, dus de kop en de twee bedragen nemen die rol over (v135). */
  const spiegel=(t.budget>t.limit&&t.limit>0)
    ? `<div class="row" style="justify-content:space-between;margin-top:6px;font-size:var(--fs-xs);color:var(--mut2)"><span>boven inkomen-limiet</span><span style="font-weight:700">${euro0(t.budget-t.limit)} (${SET.limit}%)</span></div>`
    : '';
  return `<div>
    <div class="row" style="gap:8px">${maandKiezerKop(m)}<span class="small muted" style="cursor:pointer" onclick="openBudgetCompare('${m}')">${isLopendeMaand(m)?`dag ${d.elapsed} van ${d.dim}`:'hele maand'} ›</span></div>
    <div class="row" style="align-items:baseline;gap:8px;margin-top:8px">
      <span style="cursor:pointer" onclick="openMonthSpend('${m}')"><span style="font-size:var(--fs-xl);font-weight:800">${euro0(sp)}</span> <span class="small muted">uitgegeven</span></span>
      <span class="small muted" style="flex:1;min-width:0;cursor:pointer" onclick="openPotjesVerdeling('${m}')">van ${euro0(bud)} ${t.potTotal>0?'maandbudget':'je inkomen-limiet'} ›</span>
      <span style="font-weight:700;white-space:nowrap;color:${over?'var(--red)':'var(--txt)'}">${usedPct}%</span></div>
    ${(()=>{ const tb=totalBudget(), pb=plannedTotalBudget();   // v115-ingang naar de volgende-maand-lijst
      return (tb>0 && pb!==tb) ? `<div class="row" style="justify-content:space-between;padding:4px 0 0;font-size:var(--fs-xs);color:var(--mut2);cursor:pointer" onclick="openPotjesVerdeling('${m}','next')"><span style="margin-left:2px">↳ vanaf volgende maand</span><span style="font-weight:700;color:var(--teal)">${euro0(pb)}</span></div>` : ''; })()}
    <div class="bar-track" style="margin:8px 0 0"><div class="bar-fill" style="width:${Math.min(Math.max(usedPct,0),100)}%;background:${over?'var(--red)':'var(--accent)'}"></div></div>
    <div class="small" style="color:var(--mut2);margin-top:5px">de maand is ${dayPct}% voorbij</div>${spiegel}</div>`;
}
/* v139: de eerste ingang naar het coachgesprek buiten het coachscherm. Hij haakt aan op de
   bevinding erboven en stelt er een vraag over in plaats van neutraal naar de coach te wijzen.
   Alleen zichtbaar als er echt een lek is: geen lek, geen regel, en geen uitleg waarom er niets
   staat. De woorden en de getallen komen uit coachLeak(); hier wordt niets gerekend. */
function insLekVraag(m){
  let R=null; try{ R=coachWeekRisk(m); }catch(_){ return ''; }
  if(!R || R.tone!=='warn') return '';
  let L=null; try{ L=coachLeak(m); }catch(_){}
  if(!L) return '';
  const wat=L.name?esc(L.name):(CATS[L.cat]?esc(CATS[L.cat].name):'');
  if(!wat) return '';
  return `<div class="card" id="insLekVraag" style="padding:12px 14px;cursor:pointer" onclick="coStart('lek','${m}')">
    <div class="row" style="gap:8px">
      <span style="flex:1;min-width:0;font-size:13px"><b>${wat}</b> (${euro0(L.amount)}) viel op. Wil je kijken wat je daaraan kunt doen?</span>
      <span style="color:var(--teal);font-weight:700">›</span>
    </div></div>`;
}
function insHeroKaart(m){
  const A=insBudgetBlok(m);
  if(!A) return '';   // geen budget: de beller toont de budget-prompt met de losse kaart eronder
  let B=''; try{ B=nogDezeMaandBody(); }catch(_){ B=''; }
  if(!B) return `<div class="card">${A}</div>`;   // niets meer open: geen scheidingslijn, geen lege tegels
  return `<div class="card">${A}
    <div style="border-top:1px solid var(--line);margin:14px 0 12px"></div>
    <div class="hlabel" style="margin:0 0 12px">Nog deze maand</div>${B}</div>`;
}
/* Eén inklap-omhulsel voor kaarten die er zelf geen hebben. Ingeklapt: kop met samenvatting.
   Uitgeklapt: de kaart zelf, met een rustige regel om weer dicht te klappen. */
function insVouw(flag, titel, icoon, samenvatting, inhoud){
  if(!inhoud) return '';
  if(collapOpen(flag)) return inhoud +
    `<div class="small muted" style="margin:-2px 2px 10px;text-align:center;cursor:pointer" onclick="toggleCollap('${flag}')">${esc(titel)} inklappen \u25b2</div>`;
  return `<div class="card" style="cursor:pointer" onclick="toggleCollap('${flag}')">
    <div class="row" style="gap:10px"><span class="hlabel" style="margin:0;flex:0 0 auto;white-space:nowrap">${icoon} ${esc(titel)}</span>
      ${samenvatting?`<span class="small muted" style="flex:1;min-width:0;text-align:right">${esc(samenvatting)}</span>`:'<span style="flex:1"></span>'}
      <span class="muted" style="font-size:var(--fs-lg);width:14px;text-align:center">\u203a</span></div></div>`;
}
// samenvatting van de kerncijfers, uit dezelfde bron die de strip vult
function insKpiSamenvatting(m){
  try{ const K=insKpis(m);
    return ['inleg','budget'].map(k=>K[k]&&K[k].raw!=null?`${K[k].label.toLowerCase()} ${K[k].val}`:'').filter(Boolean).join(' \u00b7 ');
  }catch(_){ return ''; }
}
function insSection(t){ return `<div class="inssec">${t}</div>`; }

/* ===== Maandkiezer (v176) =====
 * Eén bron voor "welke maand kijk ik": curMonth. Die bestaat al, elk drill-down leest hem, en het
 * is module-state - dus hij verdwijnt bij een herstart en bij een import (die zet curMonth=null).
 * Bewust GEEN tweede keuze in SET ernaast: dan zou de keuze een instelling worden die over sessies
 * blijft hangen, en dan zit je over drie weken nog in juli zonder het te merken.
 * Bereik: uitsluitend months(), dus geen toekomst en niets vóór je eerste boeking. */
function kijkMaand(){
  const ms=months(); if(!ms.length) return thisYM();
  return (curMonth && ms.includes(curMonth)) ? curMonth : ms[ms.length-1];
}
function isLopendeMaand(m){ return (m||kijkMaand())===thisYM(); }
function zetKijkMaand(m){
  const ms=months(); if(!ms.includes(m)) return;    // nooit navigeren naar een maand zonder data
  curMonth=m; closeSheet(); render();
}
function naarLopendeMaand(){ curMonth=null; closeSheet(); render(); }
// de kop is de kiezer: dezelfde hlabel als eerst, met een pijl erbij
// zelfde kiezer, als chip naast een kop die zijn eigen titel houdt (het maandscherm)
function maandKiezerChip(m){
  return `<span class="small" style="color:var(--teal);font-weight:600;cursor:pointer;white-space:nowrap" onclick="event.stopPropagation();openMaandKiezer()">${esc(monthLabel(m))} ▾</span>`;
}
function maandKiezerKop(m){
  return `<span class="hlabel" style="margin:0;flex:1;cursor:pointer" onclick="event.stopPropagation();openMaandKiezer()">${esc(monthLabel(m))} \u25be</span>`;
}
/* Onmiskenbaar dat je niet naar de lopende maand kijkt. Bewust dezelfde signal-warn-vorm als de
   herinnering over verouderde data: dat is de bestaande manier om te zeggen "wat je ziet is niet
   het heden", en dit is precies dezelfde soort waarschuwing. Geen nieuwe kleur. */
function afgeslotenMaandBanner(m){
  if(isLopendeMaand(m)) return '';
  return `<div class="signal warn" style="margin-bottom:2px"><div class="si">${ICON('clock')}</div>
    <div class="st"><b>Je kijkt naar ${esc(monthLabel(m))}, een afgesloten maand.</b> De cijfers hieronder gaan over die maand, niet over nu.
    <span style="color:var(--teal);cursor:pointer;font-weight:600;white-space:nowrap" onclick="naarLopendeMaand()">Terug naar ${esc(monthLabel(thisYM()))} ›</span></div></div>`;
}
function openMaandKiezer(){
  const ms=months().slice().reverse(); const nu=kijkMaand();
  window._setSheet=null;
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="center" style="margin-bottom:10px"><div style="font-weight:800;font-size:var(--fs-lg)">Welke maand?</div>
      <div class="muted small">Alleen maanden waarvan je boekingen hebt.</div></div>
    <div class="chips wrap" style="margin-top:6px">${ms.map(x=>`<span class="chip ${x===nu?'on':''}" onclick="zetKijkMaand('${x}')">${esc(monthLabel(x))}${x===thisYM()?' \u00b7 nu':''}</span>`).join('')}</div>
    <button class="btn sec" style="margin-top:14px" onclick="closeSheet()">Klaar</button>`;
  showSheetBg();
}
function renderIns(){
  const m=kijkMaand(); const nu=isLopendeMaand(m);
  // gecombineerde status-kaart (koers + budget); m is altijd de lopende maand, want months()
  // voegt die altijd toe en curMonth is altijd het laatste element.
  const statusBlock = monthStatusCard(m);
  // v66: "Hoe gezond is jouw verdeling?" (gedekt door de Kerncijfers) en de standalone sectie
  // "Waar gaat je geld heen" (verhuisd naar de maand-drill-down) zijn hier weg. Daarmee had de
  // "Bekijk meer"-zone geen inhoud meer, dus die is met de periode-chips mee vervallen;
  // periodMonths() valt terug op de getoonde maand, waar de drill-downs al mee rekenen.
  /* v135: budgetstand en "Nog deze maand" samen in één herokaart, daaronder één regel met wat
     opviel, en de rest ingeklapt onder Verdieping. Terugval: geen lopende maand -> de bestaande
     hero zonder nog-deze-maand; geen budget -> de budget-prompt van monthStatusCard met de
     nog-deze-maand-kaart er los onder. */
  /* v176: bij een afgesloten maand valt alles weg wat over het nu gaat. "Nog deze maand" leest
     monthLiquidity() en safeToSpend(), en die kennen alleen vandaag; onder een historische kop zou
     dat lezen als de stand van die maand. insBudgetBlok(m) rekent wel gewoon door. */
  const H=nu?insHeroKaart(m):insBudgetBlok(m);
  const hero = H ? (nu?H:`<div class="card">${H}</div>`) : (statusBlock + (nu?nogDezeMaandCard():''));
  /* renderBehavior mengt twee bronnen: de over-budget-rij is per maand, maar de rijen uit
     coachItems() rekenen op nowYM. Onder een historische kop zou dat de indruk wekken dat die
     observaties over die maand gaan. */
  let beh=''; try{ beh=nu?renderBehavior(m):''; }catch(_){}
  const behN=(beh.match(/beh-row/g)||[]).length;
  /* v136: geen Categorieen-kaart meer op de pagina zelf. Diezelfde verdeling staat al achter
     "Uitgegeven" (openMonthSpend, eerste chip), en dat is de plek waar de vraag "waar ging mijn
     geld heen" hoort (v114/v115). Twee weergaven van hetzelfde is geen keuze maar ruis. */
  const verdieping = insVouw('openKpiCard','Kerncijfers',ICON('chart'),insKpiSamenvatting(m),insKpiStrip(m))
    + spendVsBudgetChart()
    + insVouw('openBehavior','Gedrag',ICON('bulb'),behN?`${behN} ${behN===1?'observatie':'observaties'}`:'',beh)
    + (nu?subsCard():'');   // abonnementen gaan over wat er nu loopt
  /* De lek-vraag opent een coachgesprek over een stap die je nu kunt zetten; op een afgesloten
     maand nodigt dat uit tot een keuze over iets wat voorbij is (v139: alleen kijken). */
  $('#s-ins').innerHTML = afgeslotenMaandBanner(m) + insSection(nu?'Deze maand':'Terugblik')
    + hero + whatStandsOutLine(m) + (nu?insLekVraag(m):'')
    + (verdieping?insSection('Verdieping')+verdieping:'');
}


/* ----- per categorie (over een transactielijst) ----- */

function renderBehavior(m){
  const rows=[]; const actual=catSpendMap(m), EB=effectiveBudgets(m).out; let worst=null;
  for(const k in EB){ if(+EB[k]>0){ const act=actual[k]||0; if(act>+EB[k]){ const band=budgetBand(+EB[k],act); if(band==='action'||band==='monitor'){ const over=act-(+EB[k]); if(!worst||over>worst.over) worst={k,over}; } } } }
  if(worst) rows.push({tone:'warn',txt:`${CATS[worst.k].name} loopt uit de pas`,k:worst.k});
  for(const i of (coachItems()||[])){ if(i.t==='good'||rows.length>=4) continue;
    if(worst && i.insight && i.insight.toLowerCase().includes(CATS[worst.k].name.toLowerCase())) continue;
    rows.push({tone:i.t,txt:i.insight}); }
  if(!rows.length) return '';
  const dotc=t=>t==='bad'?'var(--red)':t==='warn'?'var(--amber)':'var(--teal)';
  const body=rows.slice(0,4).map(r=>`<div class="beh-row"><span class="beh-dot" style="background:${dotc(r.tone)}"></span><span class="beh-t">${esc(r.txt)}</span></div>`).join('');
  return `<div class="card"><div class="hlabel" style="margin:0 0 4px">Gedrag</div>${body}</div>`;
}
function renderCatBreak(list){
  const by={}; for(const t of list){ if(CATS[catOf(t)].type==='expense') by[catOf(t)]=(by[catOf(t)]||0)+(-t.amount); }   // netto: terugstorting verlaagt de categorie
  const ex=Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]); if(!ex.length) return '';
  const max=ex[0][1], total=ex.reduce((s,e)=>s+e[1],0);
  /* v136: de kaart woont alleen nog in de Uitgegeven-drill, waar de chip hem al opent. Een
     inklap-kop zou daar een dode knop zijn die wel SET schrijft maar niets meer stuurt. */
  const head=`<div class="row" style="gap:10px"><span class="hlabel" style="margin:0;flex:1">Categorieën</span><span class="small muted"><b style="color:var(--txt);font-size:15px">${euro0(total)}</b> totaal</span></div>`;
  const exp=!!SET.expandCat; const shown=exp?ex:ex.slice(0,3);
  const toggle=ex.length>3?`<button class="snz" onclick="toggleExpand('expandCat')">${exp?'minder ▲':'toon alle '+ex.length+' categorieën ▼'}</button>`:'';
  return `<div class="card">${head}
    <div class="small muted" style="margin:8px 0 10px;font-size:var(--fs-xs)">Totaal uitgegeven deze periode · % = aandeel per categorie</div>
    ${shown.map(([k,v])=>{const c=CATS[k];const cnt=list.filter(x=>catOf(x)===k&&x.amount<0).length;return `
      <div class="cat-row" style="cursor:pointer" onclick="openCategory('${k}')"><div class="ava" style="background:var(--card2)">${c.icon}</div>
        <div class="g"><div class="t"><span>${c.name} <span class="c">· ${cnt}×</span></span><span>${euro(v)} <span class="muted small">${Math.round(v/total*100)}%</span> ›</span></div>
          <div class="bar-track" style="margin:0"><div class="bar-fill" style="width:${v/max*100}%;background:var(--teal)"></div></div></div>
      </div>`;}).join('')}${toggle}</div>`;
}

/* ----- INZICHTEN (periode-gestuurd) ----- */
// ===== INZICHTEN (N26-stijl): 1 hoofdinzicht + max 3 signalen (tikbaar) + alles achter 'Verdieping' =====









/* ============================================================
   DOORSTROOMPOSTEN — uitgeleend / geleend / borg
   Niet elke afschrijving is een uitgave. Een gemarkeerde transactie krijgt een internal-categorie
   (dus buiten spend/income) en komt als vordering of schuld in je netto vermogen. Een latere
   terugbetaling verlaagt de openstaande post; het is nooit inkomen.
   Grootboek: SET.loans = [{id,txId,naam,richting:'uit'|'in',soort:'lening'|'borg',bedrag,open,datum,terug}]
   ============================================================ */
const LOAN_CAT={uit:'uitgeleend', in:'geleend'};
function loans(){ return Array.isArray(SET.loans)?SET.loans:[]; }
function loanFor(txId){ return loans().find(l=>l.txId===txId)||null; }
function loanTotals(){
  let uit=0, inn=0;
  for(const l of loans()){ const o=Math.max(+l.open||0,0); if(l.richting==='in') inn+=o; else uit+=o; }
  return {uit:Math.round(uit), in:Math.round(inn)};
}
// markeren: categorie omzetten én een post in het grootboek. Eén tik is genoeg; de rest is optioneel.
function markLoan(txId, richting, soort){
  const t=TX.find(x=>x.id===txId); if(!t) return;
  const bedrag=Math.round(Math.abs(+t.amount||0)); if(!(bedrag>0)) return;
  SET.loans=loans().filter(l=>l.txId!==txId);
  SET.loans.push({id:'l'+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36),
    txId, naam:(cleanMerch(t.name)||t.name||'onbekend').slice(0,40), richting:(richting==='in'?'in':'uit'),
    soort:(soort==='borg'?'borg':'lening'), bedrag, open:bedrag, datum:t.date, terug:''});
  OVR[txId]=LOAN_CAT[richting==='in'?'in':'uit'];
  save(); closeSheet(); render();
  toast(`${ICON('check')} ${richting==='in'?'Geleend':(soort==='borg'?'Borg':'Uitgeleend')} · ${euro0(bedrag)}`);
}
function unmarkLoan(txId){ if(!loanFor(txId)) return false; SET.loans=loans().filter(l=>l.txId!==txId); return true; }
function setLoanField(id,veld,val){
  const l=loans().find(x=>x.id===id); if(!l) return;
  if(veld==='naam') l.naam=String(val||'').slice(0,40);
  else if(veld==='terug') l.terug=String(val||'').slice(0,10);
  else if(veld==='waarvoor') l.waarvoor=String(val||'').slice(0,60);          // voor het betaalverzoek-bericht
  else if(veld==='link') l.link=String(val||'').trim().slice(0,200);          // eigen Tikkie-/betaallink, optioneel
  else if(veld==='open'){ const v=Math.max(Math.round(+val||0),0); l.open=Math.min(v,Math.max(+l.bedrag||0,v)); }
  save(); render(); openLoan(id);
}
/* Betaalverzoek: de app verstuurt niets zelf (serverloze PWA, niets draait op de achtergrond).
   We zetten een kant-en-klaar bericht klaar en laten het toestel delen; de gebruiker kiest zelf
   Tikkie/WhatsApp/mail en verstuurt. Ontbrekende velden vallen netjes weg, nooit "€undefined". */
function loanDatumKort(iso){ const d=iso?new Date(iso):null; return (d&&!isNaN(d))?d.toLocaleDateString('nl-NL',{day:'numeric',month:'long'}):''; }
function loanShareText(l){
  if(!l) return '';
  const naam=String(l.naam||'').trim(), open=Math.max(Math.round(+l.open||0),0), waarvoor=String(l.waarvoor||'').trim();
  let s=naam?`Hoi ${naam}, `:'Hoi, ';
  s+= open>0 ? `wil je me ${euro0(open)} terugbetalen` : 'wil je me het geleende bedrag terugbetalen';
  if(waarvoor) s+=` voor ${waarvoor}`;
  const dat=loanDatumKort(l.terug); if(dat) s+=` (graag vóór ${dat})`;
  s+='? Dank je!';
  const link=String(l.link||'').trim(); if(link) s+=' '+link;
  return s;
}
async function loanShare(id){
  const l=loans().find(x=>x.id===id); if(!l) return;
  const text=loanShareText(l);
  try{
    if(navigator.share){ await navigator.share({title:'Betaalverzoek', text}); toast(`${ICON('check')} Betaalverzoek gedeeld`); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }        // zelf geannuleerd: geen ruis, geen fallback
  try{ await navigator.clipboard.writeText(text); toast(`${ICON('check')} Betaalverzoek gekopieerd — plak het in Tikkie of WhatsApp`); }
  catch(_){ toast('Kopiëren lukt niet op dit toestel'); }
}
/* Herinnering een paar dagen vóór de afgesproken datum. Alleen wat JIJ terugkrijgt (een
   betaalverzoek slaat nergens op bij geleend geld), alleen met een datum, alleen als er nog
   iets openstaat. Al gepasseerd = "was vóór X", geen alarm. */
const LOAN_REMIND_DAYS=3;
function loanDueList(){
  const t0=new Date(); t0.setHours(0,0,0,0); const out=[];
  for(const l of loans()){
    if((l.richting==='in')||!(+l.open>0)||!l.terug) continue;
    const d=new Date(l.terug); if(isNaN(d)) continue; d.setHours(0,0,0,0);
    const dagen=Math.round((d.getTime()-t0.getTime())/86400000);
    if(dagen>LOAN_REMIND_DAYS) continue;                     // nog ver weg: nog even niets
    out.push({l, dagen, laat:dagen<0});
  }
  return out.sort((a,b)=>a.dagen-b.dagen);
}
function loanRepaidFromNotif(id){
  const l=loans().find(x=>x.id===id); if(!l) return;
  loanRepay(id, Math.max(+l.open||0,0));
}
// terugbetaling: verlaagt de openstaande post. Geen inkomen; het geld kwam alleen terug.
function loanRepay(id, bedrag, txId){
  const l=loans().find(x=>x.id===id); if(!l) return;
  const b=Math.max(Math.round(+bedrag||0),0);
  l.open=Math.max(Math.round((+l.open||0)-b),0);
  if(txId){ OVR[txId]=LOAN_CAT[l.richting]; l.terugTx=(l.terugTx||[]).concat([txId]); }
  save(); closeSheet(); render();
  toast(l.open>0?`${ICON('check')} Nog ${euro0(l.open)} open`:`${ICON('check')} Volledig terugbetaald`);
}
// kwijtschelden: de post sluit én de oorspronkelijke transactie wordt alsnog een échte uitgave,
// op dít moment. Dat is eerlijk: pas nu is het geld echt weg.
function loanWriteOff(id, cat){
  const l=loans().find(x=>x.id===id); if(!l) return;
  if(l.txId){ OVR[l.txId]=cat||'persoonlijk'; }
  SET.loans=loans().filter(x=>x.id!==id);
  save(); closeSheet(); render(); toast(`${ICON('check')} Als uitgave geboekt`);
}
function loanDelete(id){
  const l=loans().find(x=>x.id===id); if(!l) return;
  if(l.txId && OVR[l.txId] && (OVR[l.txId]==='uitgeleend'||OVR[l.txId]==='geleend')) delete OVR[l.txId];
  SET.loans=loans().filter(x=>x.id!==id);
  save(); closeSheet(); render();
}
// Stap 3: een binnenkomende betaling die bij een open post past. Suggestie, nooit automatisch.
function loanMatch(t){
  if(!t || !(+t.amount>0)) return null;
  const nm=(cleanMerch(t.name)||'').toUpperCase();
  const bedrag=Math.round(+t.amount);
  const kand=loans().filter(l=>(+l.open||0)>0 && (l.richting==='uit') && l.datum<=t.date);
  if(!kand.length) return null;
  const score=l=>{
    const zelfde=nm && (l.naam||'').toUpperCase().slice(0,8)===nm.slice(0,8);
    const dicht=Math.abs((+l.open||0)-bedrag);
    return (zelfde?0:1000)+dicht;                      // zelfde tegenpartij eerst, dan dichtst bij het bedrag
  };
  const beste=kand.slice().sort((a,b)=>score(a)-score(b))[0];
  const zelfde=nm && (beste.naam||'').toUpperCase().slice(0,8)===nm.slice(0,8);
  if(!zelfde && Math.abs((+beste.open||0)-bedrag)>Math.max((+beste.open||0)*0.1,5)) return null;
  return {loan:beste, bedrag:Math.min(bedrag,+beste.open||0), deels:bedrag<(+beste.open||0)};
}

function setCat(id,k){
  const t=TX.find(x=>x.id===id); if(!t) return;
  if(k!=='uitgeleend' && k!=='geleend' && unmarkLoan(id)) save();   // terug naar uitgave: post opruimen
  const mk=document.getElementById('mkrule');
  if(mk&&mk.checked){   // maak een blijvende regel van deze winkel
    const kw=((cleanMerch(t.name)||t.name)||'').toUpperCase().trim().slice(0,28);
    if(kw){ SET.rules=(SET.rules||[]).filter(r=>r.kw!==kw); SET.rules.unshift({kw,cat:k}); delete OVR[id];
      save(); TX.forEach(categorize); applyOwnAccounts(); buildAccMeta(); closeSheet(); render(); toast('Regel: '+kw+' → '+CATS[k].name); return; }
  }
  if(t.autoCat===k) delete OVR[id]; else OVR[id]=k; save(); closeSheet(); render();
}

    ['coach',ICON('robot'),'Coach & categorieën',`Je coach staat ${SET.coachOff?'uit':'aan'}`,setCoach,''],
    ['coachlook',ICON('user'),'Coach-avatar & toon',coachSamenvatting(),null,'','openCoachAvatar()'],
    ['privacy',ICON('lock'),'Privacy & gegevens','Alles blijft op dit toestel',setPrivacy,''],
  ];

/* ---------- Uiterlijk: thema's ----------
   Alles loopt via de tokens, dus één attribuut op <html> verandert de hele app:
   pagina's, kaarten, sheets, grafieken en de onderbalk. Geen herladen nodig. */
const THEMES={
  standaard:{naam:'Standaard', sub:'De donkere look van Minder', bg:'#0a0f1a', card:'#141b2b', accent:'#3bb3a4', txt:'#eaf0fb', serif:false},
  prive:{naam:'Privé', sub:'Licht & editorial — ivoor, serif, diep groen', bg:'#f6f2e9', card:'#fffdf9', accent:'#1f5c46', txt:'#1c2b26', serif:true},
  aurora:{naam:'Neo-Dark Aurora', sub:'Donker & glas — gloed, mint en violet', bg:'#0a0e17', card:'rgba(255,255,255,.06)', accent:'#34e0c4', txt:'#eaf0fb', serif:false, glow:true}
};
function themeKey(){ const k=SET.theme; return THEMES[k]?k:'standaard'; }
function applyTheme(){
  const k=themeKey();
  if(k==='standaard') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=k;
}
function setTheme(k){
  if(!THEMES[k]) return;
  SET.theme=k; save(); applyTheme(); render();
  if(window._setSheet==='look') renderSetSheet();
  toast(`${ICON('check')} Thema: ${THEMES[k].naam}`);
}
// mini-voorbeeld per thema: dezelfde bouwstenen als de app (kaart, hero-bedrag, staafje, pill)
function themePreview(k){
  const t=THEMES[k];
  const heroKleur=k==='aurora'?'background:linear-gradient(90deg,#34e0c4,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent':`color:${t.accent}`;
  return `<div style="background:${t.bg};border-radius:10px;padding:10px 11px;border:1px solid rgba(128,128,128,.18);overflow:hidden">
    ${t.glow?`<div style="height:0;position:relative"><div style="position:absolute;left:-20%;top:-24px;width:90%;height:56px;background:radial-gradient(60% 100% at 30% 0%,rgba(52,224,196,.30),transparent 70%);filter:blur(2px)"></div></div>`:''}
    <div style="font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:${t.accent};font-weight:700;position:relative">Minder</div>
    <div style="font-size:19px;font-weight:800;letter-spacing:-.6px;margin:3px 0 5px;position:relative;${heroKleur};${t.serif?"font-family:Georgia,'Times New Roman',serif":''}">€1.240</div>
    <div style="background:${t.card};border:1px solid rgba(128,128,128,.16);border-radius:7px;padding:6px 7px;display:flex;align-items:flex-end;gap:3px;height:30px">
      ${[10,16,12,20,14].map((h,i)=>`<div style="flex:1;height:${h}px;border-radius:2px;background:${i===4?t.accent:(t.serif?'#cdd6cf':'#37455f')}"></div>`).join('')}
    </div>
    <div style="margin-top:6px;display:flex;gap:4px">
      <span style="font-size:8px;padding:2px 7px;border-radius:999px;background:${t.accent};color:${t.serif?'#fffdf9':'#05221c'};font-weight:700">Home</span>
      <span style="font-size:8px;padding:2px 7px;border-radius:999px;color:${t.txt};opacity:.55">Inzichten</span>
    </div>
  </div>`;
}
function setLook(){
  const cur=themeKey();

    return `<div onclick="setTheme('${k}')" data-theme-card="${k}" style="cursor:pointer;border:1.5px solid ${on?'var(--accent)':'var(--line)'};border-radius:var(--r-inner);padding:10px;margin-bottom:10px;background:${on?'color-mix(in srgb,var(--accent) 7%,transparent)':'transparent'}">

  return `<div class="small muted" style="margin-bottom:10px">Kies hoe Minder eruitziet. De hele app verandert meteen mee · je cijfers blijven precies hetzelfde.</div>

function openBudgetEditor(m){
  window._setSheet=null; window._nfSheet=null;

/* v146: rekeningen zonder bekend saldo staan standaard niet in Instellingen. Het zijn in de praktijk
   rekeningen die je niet meer gebruikt, en ze vulden allebei de lijsten met regels waar niets aan te
   doen valt. Bewust verbergen en niet verwijderen: een rekening bestaat zolang er boekingen met die
   id zijn (v122), dus wegnemen zou transacties moeten wissen en dat is een heel andere ingreep.
   Eén tik zet ze terug (defaultEffect), en er verandert niets aan enige berekening - totalBalance(),
   accBalance() en de onbekend-staten (v59/v73) lezen onverkort OWN.
   Guard: is er geen enkel bekend saldo, dan valt er niets te verbergen zonder de lijst leeg te
   maken, en juist daar moet je je eerste saldo kunnen invullen. Dan tonen we alles. */
function rekMetSaldo(){ return OWN.filter(a=>accBalance(a)!=null); }
function rekZonderSaldo(){ return OWN.filter(a=>accBalance(a)==null); }
function toonAlleRek(){ return !!SET.toonLegeRek || !rekMetSaldo().length; }
function zichtbareRek(){ return toonAlleRek()?OWN.slice():rekMetSaldo(); }
function toggleLegeRek(){ SET.toonLegeRek=!SET.toonLegeRek; save(); renderSet(); try{renderSetSheet();}catch(_){} }
function legeRekRegel(){
  const n=rekZonderSaldo().length; if(!n || !rekMetSaldo().length) return '';
  return `<div class="small muted" style="margin-top:9px;cursor:pointer" onclick="toggleLegeRek()">${SET.toonLegeRek
    ? `▲ ${n} rekening${n===1?'':'en'} zonder saldo verbergen`
    : `› ${n} rekening${n===1?'':'en'} zonder saldo tonen`}</div>`;
}
/* ===== Twee ids, dezelfde boekingen (v149) =====
 * Gemeld werd: twee rekeningen in Instellingen met hetzelfde saldo en hetzelfde aantal transacties.
 * Dat is het patroon van het bekende gat uit v122 - de CSV-import bouwt een id als 'N26 <Account
 * Name>', de koppeling uit de IBAN-cijfers, dus hetzelfde potje kan als twee rekeningen bestaan.
 * De soft-dedup in commitTx() (v51) vangt dat alleen als beide bronnen elkaar overlappen op de dag;
 * gebeurt dat niet, dan staan de boekingen er twee keer en telt totalBalance() het saldo dubbel.
 * Dit is dus een correctheidsvraag, geen cosmetica.
 *
 * rekeningOverlap() vergelijkt de boekingen zelf met _softKey (datum|bedrag|letters), dezelfde
 * sleutel als de dedup. Drempel: minstens 3 gedeelde boekingen EN minstens 60% van de kleinste van
 * de twee - anders zou een handvol toevallig gelijke bedragen twee losse rekeningen al koppelen.
 * De regel verschijnt alleen bij een vondst: geen overlap, geen regel, geen lege staat. */
function rekeningOverlap(){
  const keys=new Map(); for(const a of OWN) keys.set(a,new Set());
  for(const t of TX){ const s=keys.get(t.acc); if(s) s.add(_softKey(t)); }
  const list=[...keys.keys()], uit=[];
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const A=keys.get(list[i]), B=keys.get(list[j]); if(!A.size||!B.size) continue;
    let n=0; for(const k of A) if(B.has(k)) n++;
    const klein=Math.min(A.size,B.size);
    if(n>=3 && n>=klein*0.6) uit.push({a:list[i], b:list[j], gedeeld:n, aN:A.size, bN:B.size});
  }
  return uit.sort((x,y)=>y.gedeeld-x.gedeeld);
}
/* v152: een rekening die je bank wel deelt maar waarop nog geen boekingen staan, bestaat nergens
   in beeld - OWN wordt uit TX afgeleid (v122), dus zo'n rekening valt overal buiten, ook uit deze
   sheet. Juist die is de verdachte als je een rekening mist. allAccounts() telt psd2Accounts mee. */
function rekZonderBoekingen(){
  try{ return allAccounts().filter(a=>!OWN.includes(a)); }catch(_){ return []; }
}
function rekOverlapRegel(){
  let ov=[], leeg=[];
  try{ ov=rekeningOverlap(); leeg=rekZonderBoekingen(); }catch(_){ return ''; }
  if(ov.length){ const n=ov.length;
    return `<div class="small" style="margin-top:9px;color:var(--amber);cursor:pointer" onclick="openRekOverlap()">${ICON('warn')} ${n===1?'Twee rekeningen bevatten dezelfde boekingen':n+' paren rekeningen bevatten dezelfde boekingen'} ›</div>`; }
  if(leeg.length){ const n=leeg.length;
    return `<div class="small muted" style="margin-top:9px;cursor:pointer" onclick="openRekOverlap()">${n===1?'1 gekoppelde rekening zonder boekingen':n+' gekoppelde rekeningen zonder boekingen'} ›</div>`; }
  return '';
}
/* Wat de app per rekening weet, in woorden. Eén bron voor de sheet en voor de kopieertekst, zodat
   wat je leest en wat je plakt niet uiteen kunnen lopen. */
function rekFeiten(a){
  const pm=(SET.psd2Accounts||{})[a]||null, meta=ACCMETA[a]||{};
  const L=TX.filter(t=>t.acc===a), d=L.map(t=>t.date).sort();
  /* uid en de vervaldatum van de consent horen erbij (v150): twee rekeningen zonder IBAN krijgen hun
     id uit de uid ('psd2_'+uid.slice(0,8)), en een uid is per sessie. Autoriseer je opnieuw, dan
     krijgt dezelfde Space een nieuwe uid en dus een tweede id - met dezelfde boekingen, want de
     soft-dedup laat twee PSD2-rekeningen bewust met rust (v51). Verschillende uid met dezelfde
     vervaldatum betekent twee echte rekeningen uit één consent; verschillende vervaldata betekent
     twee consents, en dan is dezelfde rekening twee keer ingelezen het waarschijnlijkst. */
  return { a, naam:acctNiceName(a), vanBank:pm?(pm.label||'(geen naam van de bank)'):'(niet via de koppeling)',
    l4:pm&&pm.iban?pm.iban.slice(-4):'', bank:meta.bank||'', saldo:accBalance(a), tx:L.length,
    van:d[0]||'', tot:d[d.length-1]||'', bron:[...new Set(L.map(t=>t.src||'mt940'))].join(' + '),
    uid:pm?String(pm.uid||''):'', exp:pm&&pm.exp?String(pm.exp).slice(0,10):'',
    eigenIban:!!(pm&&pm.iban) };
}
function rekOverlapTekst(){
  const ov=rekeningOverlap();
  const regel=f=>`${f.naam} | id ${f.a} | van de bank: ${f.vanBank} | IBAN ${f.l4?'··'+f.l4:'geen eigen IBAN'} | ${f.bank||'?'} | saldo ${f.saldo!=null?f.saldo:'onbekend'} | ${f.tx} tx | ${f.van||'-'} t/m ${f.tot||'-'} | ${f.bron||'-'} | uid ${f.uid||'-'} | consent tot ${f.exp||'-'}`;
  return [...ov.map(o=>`OVERLAP: ${o.gedeeld} gedeelde boekingen (van ${o.aN} en ${o.bN})
  ${regel(rekFeiten(o.a))}
  ${regel(rekFeiten(o.b))}`),
    '', 'ALLE REKENINGEN:', ...allAccounts().map(a=>'  '+regel(rekFeiten(a))+(OWN.includes(a)?'':'  <-- gekoppeld, geen boekingen'))].join('\n');
}
async function rekOverlapCopy(){
  try{ await navigator.clipboard.writeText(rekOverlapTekst()); toast(`${ICON('check')} Gekopieerd`); }
  catch(e){ toast('Kopieren lukte niet'); }
}
/* Samenvoegen (v151). Twee ids die dezelfde rekening blijken te zijn: de boekingen van de ene
   verhuizen naar de andere, en wat er dubbel staat valt weg op _softKey - dezelfde sleutel als de
   dedup, nooit een tweede definitie. Wat verdwijnt is een id, niet je geschiedenis: een boeking die
   alleen op de opgeheven rekening stond gaat gewoon mee.
   Onomkeerbaar, dus uitsluitend na een bevestiging die per stuk noemt wat er gebeurt, en nooit
   automatisch - welke van de twee de echte is weet alleen de gebruiker. De doelrekening is die met
   de nieuwste machtiging; staat die er niet, dan die met de meeste boekingen. */
function rekSamenvoegPlan(van, naar){
  const houd=new Set(TX.filter(t=>t.acc===naar).map(_softKey));
  const mee=TX.filter(t=>t.acc===van && !houd.has(_softKey(t)));
  const weg=TX.filter(t=>t.acc===van && houd.has(_softKey(t)));
  return {van, naar, mee:mee.length, weg:weg.length, saldoVan:accBalance(van), saldoNaar:accBalance(naar)};
}
function rekSamenvoeg(van, naar){
  if(!van||!naar||van===naar) return;
  const houd=new Set(TX.filter(t=>t.acc===naar).map(_softKey));
  TX=TX.filter(t=>!(t.acc===van && houd.has(_softKey(t))));      // dubbel: weg
  for(const t of TX) if(t.acc===van) t.acc=naar;                 // de rest verhuist
  const ps=SET.psd2Accounts||{}; delete ps[van]; SET.psd2Accounts=ps;
  if(SET.manualBal) delete SET.manualBal[van];
  if(SET.acctName) delete SET.acctName[van];
  if(SET.savingsAcc) delete SET.savingsAcc[van];
  delete ACCMETA[van];
  TX.sort((a,b)=>a.date.localeCompare(b.date));
  applyOwnAccounts(); buildAccMeta(); save();
  curMonth=null; closeSheet(); render();
  toast(`${ICON('check')} Samengevoegd tot één rekening`);
}
function rekSamenvoegVraag(a, b){
  const fa=rekFeiten(a), fb=rekFeiten(b);
  // doel = de nieuwste machtiging, anders de meeste boekingen
  const naarA=(fa.exp&&fb.exp&&fa.exp!==fb.exp) ? (fa.exp>fb.exp) : (fa.tx>=fb.tx);
  const naar=naarA?a:b, van=naarA?b:a;

      <div class="small muted">${V.tx} boekingen · ${V.saldo!=null?euro(V.saldo):'saldo onbekend'}${V.exp?' · machtiging tot '+esc(V.exp):''}</div>
    </div>
    <div class="small muted" style="margin:10px 2px">
      · ${P.weg} dubbele boeking${P.weg===1?'':'en'} ${P.weg===1?'valt':'vallen'} weg<br>
      · ${P.mee} boeking${P.mee===1?'':'en'} ${P.mee===1?'verhuist':'verhuizen'} mee, je geschiedenis blijft compleet<br>
      · het saldo telt daarna nog één keer mee${P.saldoVan!=null?' ('+euro(P.saldoVan)+' minder in je totaal)':''}<br>
      · de naam en instellingen van de vervallen rekening verdwijnen
    </div>
    <button class="btn" onclick="rekSamenvoeg('${esc(String(van).replace(/'/g,"\'"))}','${esc(String(naar).replace(/'/g,"\'"))}')">${ICON('check')} Samenvoegen</button>
    <button class="btn sec" style="margin-top:8px" onclick="openRekOverlap()">Annuleren</button>`;

async function requestPersist(){ try{ if(navigator.storage && navigator.storage.persist){ if(!(await navigator.storage.persisted())) return await navigator.storage.persist(); return true; } }catch(_){} return false; }

/* ============================================================================
   BRIEFING-EXPORT: financiële signalen naar de dagelijkse briefing.
   Schrijft minder-signalen.json in het blokformaat van briefing-spec.md naar
   je CommandCenter-map. Geporteerd uit minderBriefingExport.js (de spec/referentie)
   en aangesloten op de echte app-functies. Zie minder-signalen-export.md.
   ========================================================================== */

// Vermogensreis op koers? Spiegel van je eigen cijfers, geen advies.
// true = FIRE-getal wordt gehaald op of vóór je streefjaar, false = niet/te laat,
// undefined = geen oordeel (geen FIRE-getal ingesteld of saldo onvolledig).
function fireOpKoers(){
  let M; try{ M=reisModel(); }catch(_){ return undefined; }
  if(!M || !(M.FIRE>0)) return undefined;
  if(M.missing) return undefined;
  const fire=(M.ms||[]).find(m=>m.key==='fire');
  if(!fire) return undefined;
  if(fire.yr==null) return false;
  return fire.yr <= M.targetYear;
}

// Adapter: echte Minder-data → het platte blokformaat dat de signalen verwachten.
function minderBriefingState(){
  const now=new Date(); const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const num=fn=>{ try{ const v=fn(); return (typeof v==='number'&&isFinite(v))?v:NaN; }catch(_){ return NaN; } };
  let verpl=[];
  try{ const today=new Date(); today.setHours(0,0,0,0);
    verpl=(liquidityDaily(10).events||[])
      .filter(e=>e.type==='fixed' && e.amt<0)
      .map(e=>({naam:e.name, bedrag:-e.amt, dagenTotVervaldag:Math.round((e.date-today)/86400000)}))
      .filter(v=>v.dagenTotVervaldag>=0);
  }catch(_){}
  return {
    safeToSpend: num(()=>safeToSpend().safe),
    safeToSpendBuffer: +SET.stsBuffer||0,
    // v177: dit extrapoleerde je hele maanduitgave, dus met de vaste lasten erin
    netSpendPeriode: num(()=>{ const de=daysElapsed(ym); if(!de.elapsed||de.elapsed<7) return NaN; return tempoProjectie(ym).proj; }),   // lopende uitgave -> verwachte volledige maand (pas vanaf dag 7)
    netSpendPatroon: num(()=>baselineSpend()),
    verplichtingen: verpl,
    fireOpKoers: fireOpKoers()
  };
}

function _signaalSafeToSpend(state){
  const rest=state.safeToSpend, buffer=state.safeToSpendBuffer??0;
  if(!isFinite(rest)) return null;
  if(rest>buffer) return null;
  return { sectie:'financien', prioriteit:rest<0?'hoog':'midden',
    samenvatting:rest<0?`Je zit deze periode ${Math.abs(Math.round(rest))} euro over je safe-to-spend.`:`Je safe-to-spend is nog ${Math.round(rest)} euro, dat begint te knellen.`,
    actie:'Houd de rest van de periode kort.', detail:null };
}
function _signaalAfwijkendeUitgave(state){
  const nu=state.netSpendPeriode, patroon=state.netSpendPatroon;
  if(!isFinite(nu)||!isFinite(patroon)||patroon<=0) return null;
  const ratio=nu/patroon; if(ratio<1.15) return null;
  const procent=Math.round((ratio-1)*100);
  return { sectie:'financien', prioriteit:ratio>=1.4?'hoog':'midden',
    samenvatting:`In dit tempo kom je deze maand ${procent} procent boven je patroon uit.`,
    actie:'Bekijk of dit bewust is.', detail:`verwachte maanduitgave ${Math.round(nu)} versus patroon ${Math.round(patroon)}` };
}
function _signaalVerplichting(state){
  const dagen=5;
  const komende=(state.verplichtingen||[]).filter(v=>v.dagenTotVervaldag<=dagen).sort((a,b)=>a.dagenTotVervaldag-b.dagenTotVervaldag);
  if(!komende.length) return null;
  const e=komende[0];
  return { sectie:'financien', prioriteit:'midden',
    samenvatting:`${e.naam} van ${Math.round(e.bedrag)} euro vervalt over ${e.dagenTotVervaldag} dagen.`,
    actie:'Zorg dat er dekking is.', detail:komende.length>1?`${komende.length} verplichtingen in de komende ${dagen} dagen`:null };
}
function _signaalVermogensreis(state){
  const opKoers=state.fireOpKoers; if(opKoers===undefined) return null;
  if(opKoers) return { sectie:'financien', prioriteit:'laag', samenvatting:'Je Vermogensreis ligt op koers.', actie:null, detail:null };
  return { sectie:'financien', prioriteit:'midden', samenvatting:'Je Vermogensreis raakt uit koers ten opzichte van je plan.', actie:'Kijk of dit tijdelijk is of om bijsturen vraagt.', detail:null };
}
function bouwMinderBriefingPayload(){
  const state=minderBriefingState();
  const blokken=[_signaalSafeToSpend(state),_signaalAfwijkendeUitgave(state),_signaalVerplichting(state),_signaalVermogensreis(state)].filter(Boolean);
  return { bron:'minder', versie:1, gegenereerd_op:new Date().toISOString(), blokken };
}

// Schrijf de actuele signalen weg. silent=true bij automatische export (geen toasts, geen permissieprompt).
async function exporteerMinderSignalen(silent){
  try{
    const h=await idbGet('briefingDir');
    if(!h){ if(!silent) toast('Kies eerst een exportmap'); return; }
    let p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted'){ if(silent) return; p=await h.requestPermission({mode:'readwrite'}); }
    if(p!=='granted'){ if(!silent) toast('Geen schrijftoegang tot de map'); return; }
    const payload=bouwMinderBriefingPayload();
    const fh=await h.getFileHandle('minder-signalen.json',{create:true});
    const w=await fh.createWritable(); await w.write(JSON.stringify(payload,null,2)); await w.close();
    if(!silent) toast(`${ICON('check')} ${payload.blokken.length} ${payload.blokken.length===1?'signaal':'signalen'} geëxporteerd`);
  }catch(e){ if(!silent) toast('Export mislukt'); }
}

/* ----- per categorie (over een transactielijst) ----- */

function accLabel(a){ const eig=(SET.acctName||{})[a]; if(eig) return eig;   // v121: je eigen naam wint ook hier
  const r=ACCMETA[a]; if(r&&r.label) return r.label; const pm=(SET.psd2Accounts||{})[a]; if(pm) return (pm.bank?pm.bank+' · ':'')+(pm.label||a); return (a||'').replace(/^N26 /,'N26 ')||'Rekening'; }

function accShort(a){ return (a||'').startsWith('N26 ') ? a.replace(/^N26 /,'') : '··'+(a||'').slice(-4); }
// nette, korte rekeningnaam (zonder persoonsnaam), N26-Spaces zoals in de N26-app, ABN als betaalrekening
const ACCT_NAMES={'6222':'Main','1123':'Buffer rust','4323':'Spaarpot','4840':'Zakgeld'};
function acctLast4(a){ const pm=(SET.psd2Accounts||{})[a]; const iban=((pm&&pm.iban)||'').replace(/\D/g,''); const id=(a||'').replace(/\D/g,''); return (iban||id).slice(-4); }
/* v118: dezelfde naamkeuze als altijd, maar nu met de gekozen bron erbij. Het diagnose-blokje in
   Instellingen leest die bron, zodat het niet zijn eigen kopie van deze regels hoeft te hebben -
   een tweede kopie zou vroeg of laat iets anders beweren dan het scherm. acctNiceName() is
   ongewijzigd van gedrag: het is exact acctNaam().naam. */
function acctNaam(a){
  const bank=(ACCMETA[a]&&ACCMETA[a].bank)||(((SET.psd2Accounts||{})[a])||{}).bank||'';
  const last4=acctLast4(a);
  const eig=(SET.acctName||{})[a]; if(eig) return {naam:eig, bron:'eigen naam'};
  const ov=(SET.acctNames||{})[last4]; if(ov) return {naam:ov, bron:'eigen naam'};   // oude sleutel, blijft leesbaar
  // v120: een N26-potje uit een bestandsimport draagt zijn naam in de id ('N26 Buffer Rust'),
  // precies zoals in de N26-app. Die werd weggegooid ten gunste van 'Space ··'+acctLast4(), en dat
  // is voor elk CSV-potje '26' (uit "N26") - vier potjes met dezelfde naam dus. De naam die we
  // hebben gaat voor op cijfers die we verzinnen. accShort() knipte 'N26 ' er al net zo af.
  if(/^N26 /.test(a||'')){ const n=String(a).slice(4).trim(); if(n) return {naam:n, bron:'naam uit je bestandsimport'}; }
  if(/n26/i.test(bank)) return ACCT_NAMES[last4]
    ? {naam:ACCT_NAMES[last4], bron:'vaste tabel in de app'}
    : {naam:'Space ··'+last4, bron: last4?'terugval op de laatste cijfers':'geen naam beschikbaar'};
  if(/abn/i.test(bank)) return {naam:'Betaalrekening', bron:'vaste regel voor ABN'};
  return last4?{naam:'··'+last4, bron:'laatste cijfers'}:{naam:(accLabel(a)||'Rekening'), bron:'label van de koppeling'};
}
function acctNiceName(a){ return acctNaam(a).naam; }



/* Een rekening zelf een naam geven (v121). Tot nu toe stond `SET.acctNames` alleen in de leeskant
   van acctNaam(): er was geen enkele plek die hem schreef, terwijl de rekeningenlijst wel naar het
   saldo-overzicht verwees om "de naam aan te passen". Nu op **account-id**, niet op last4: die
   laatste is bij een rekening zonder IBAN voor elk N26-CSV-potje '26', dus je zou met één naam
   vier potjes tegelijk hernoemen. Leeg laten zet hem terug op automatisch; nietsdoen verandert

function acctRenameSave(wis){

/* Eenmalig: bestaande namen op last4 verhuizen naar de account-id. SET.acctNames had geen schrijver,
   dus dit raakt in de praktijk niemand - maar een handmatig gezette waarde mag niet stil vervallen. */
function migrateAcctNames(){
  if(SET.acctNameMigrated) return;
  const oud=SET.acctNames||{};
  if(Object.keys(oud).length){ const m=SET.acctName||{};
    for(const a of allAccounts()){ const v=oud[acctLast4(a)]; if(v && !m[a]) m[a]=v; }
    SET.acctName=m;
  }

function ingest(items){
  let added=0;
  const existing=new Set(TX.map(t=>t.id));
  for(const {name,text} of items){
    const isCSV = /\.csv$/i.test(name) || /booking date|partner name|account name/i.test(text.slice(0,200));
    let res; try{ res = isCSV ? parseCSV(text) : parseMT940(text); }catch(e){ continue; }
    for(const t of res.txns){ if(!existing.has(t.id)){ TX.push(t); existing.add(t.id); added++; } }
    for(const a in res.balances){ ACCMETA[a]=Object.assign(ACCMETA[a]||{},res.balances[a]); }
  }
  TX.sort((a,b)=>a.date.localeCompare(b.date));
  applyOwnAccounts(); buildAccMeta(); save();
  return added;
}

/* ---------- PSD2 live koppeling (Enable Banking via eigen backend) ---------- */

function psd2Cfg(){ return { url:(SET.psd2Url||'').replace(/\/+$/,''), token:SET.psd2Token||'' }; }

function psd2Ready(){ const c=psd2Cfg(); return !!(c.url && c.token); }

async function psd2Api(path, opts){
  opts=opts||{}; const c=psd2Cfg(); if(!c.url) throw new Error('Geen backend-URL ingesteld');
  const r=await fetch(c.url+path, Object.assign({}, opts, {
    headers: Object.assign({ 'Authorization':'Bearer '+c.token, 'Content-Type':'application/json' }, opts.headers||{})
  }));
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((data&&(data.error||data.detail))||('HTTP '+r.status));
  return data||{};
}

function ibanNum(iban){ const s=(iban||'').replace(/\s/g,''); if(s.length<8) return ''; const d=(s.slice(4).match(/\d+/g)||[]).join(''); return d.replace(/^0+/,''); }

async function psd2Refresh(silent){
  const meta=SET.psd2Accounts||{}; const keys=Object.keys(meta);
  if(!keys.length){ if(!silent) psd2Connect(); return; }
  if(!psd2Ready()){ if(!silent){ toast('Stel eerst de backend-URL en token in'); go('set'); } return; }
  if(!silent) toast('Verversen…');
  const from=new Date(); from.setMonth(from.getMonth()-2); const fromStr=from.toISOString().slice(0,10);
  const allTx=[]; const balances={}; let authFail=false, anyOk=false;
  for(const accId of keys){ const uid=meta[accId].uid; if(!uid) continue;
    let cont=null, guard=0;
    do{
      const qs='?date_from='+fromStr+(cont?'&continuation_key='+encodeURIComponent(cont):'');
      let d; try{ d=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/transactions'+qs); anyOk=true; }
      catch(e){ if(/40[13]|verlop|expired|consent|session|unauth/i.test(e.message||'')) authFail=true; break; }
      for(const raw of (d.transactions||[])){ const t=mapPsd2Tx(raw, accId); if(t) allTx.push(t); }
      cont=d.continuation_key||null; guard++;
    } while(cont && guard<40);
    try{ const b=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/balances'); const bal=pickBalance(b); if(bal!=null) balances[accId]={balance:bal,date:new Date().toISOString().slice(0,10)}; }catch(e){}
  }
  if(authFail && !anyOk){ if(!silent){ toast('Koppeling verlopen, log opnieuw in'); psd2Connect(); } return; }
  SET.psd2LastSync=Date.now(); save();
  const added=commitTx(allTx, balances);
  if(SET.psd2Pending!==false){ const pend=[];
    for(const accId of keys){ const uid=meta[accId].uid; if(!uid) continue;
      try{ const dp=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/transactions?date_from='+fromStr+'&transaction_status=PDNG');
        for(const raw of (dp.transactions||[])){ const t=mapPsd2Tx(raw, accId, true); if(t) pend.push(t); }
      }catch(e){}
    }
    applyPending(pend);
  }
  curMonth=null; render();
  if(added) try{ pushTopNotif(); updateNotifBadge(); }catch(_){}
  if(!silent) toast(added? `${ICON('check')} ${added} nieuwe transacties` : 'Bijgewerkt, geen nieuwe (van vandaag soms nog niet geboekt)');
}

// accounts uit de sessie → transacties + saldo ophalen en opslaan

async function psd2IngestSession(s){
  const accounts = s.accounts || [];
  if(!accounts.length){ toast('Geen rekeningen ontvangen'); return; }
  const meta=SET.psd2Accounts||{};
  const aspspName=(s.aspsp&&s.aspsp.name)||'Bank';
  const allTx=[]; const balances={}; const pend=[];
  const from=new Date(); from.setMonth(from.getMonth()-24); const fromStr=from.toISOString().slice(0,10);
  for(const a of accounts){
    const uid = a.uid || a;
    const iban = (a.account_id&&a.account_id.iban) || a.iban || '';
    /* v151: de id van een rekening zonder IBAN hing aan de uid, en die is per sessie - de API zegt
       het met zoveel woorden: "valid only until the session ... is in the AUTHORIZED status".
       Elke nieuwe machtiging gaf zo'n rekening dus een nieuwe id en daarmee een tweede exemplaar,
       met dezelfde boekingen en een dubbel geteld saldo. identification_hash is precies daarvoor
       bedoeld: "can be used for matching accounts between multiple sessions". Volgorde: IBAN (het
       stabielst en al in gebruik), dan de hash, dan pas de uid als er niets anders is. */
    const hash = a.identification_hash || (Array.isArray(a.identification_hashes)?a.identification_hashes[0]:'') || '';
    // een rekening die we al kennen aan zijn hash houdt zijn bestaande id, ook als die nog uit de
    // uid-tijd komt; anders zou juist deze fix een derde exemplaar maken
    let bekend='';
    if(hash) for(const k in meta){ if(meta[k] && meta[k].hash===hash){ bekend=k; break; } }
    const accId = bekend || ibanNum(iban) || (hash?'psd2h_'+String(hash).slice(0,16):'psd2_'+String(uid).slice(0,8));
    const label = (a.name||a.product||'Rekening')+(iban?' ··'+iban.slice(-4):'');
    meta[accId]={ uid, iban, hash, label, bank:aspspName, exp:(s.access&&s.access.valid_until)||'' };
    let cont=null, guard=0;
    do{
      const qs='?date_from='+fromStr+(cont?'&continuation_key='+encodeURIComponent(cont):'');
      let d; try{ d=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/transactions'+qs); }
      catch(e){ toast('Transacties ophalen mislukt: '+e.message); break; }
      for(const raw of (d.transactions||[])){ const t=mapPsd2Tx(raw, accId); if(t) allTx.push(t); }
      cont=d.continuation_key||null; guard++;
    } while(cont && guard<40);
    try{ const b=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/balances'); const bal=pickBalance(b); if(bal!=null) balances[accId]={balance:bal,date:new Date().toISOString().slice(0,10)}; }catch(e){}
    if(SET.psd2Pending!==false){ try{ const fp=new Date(); fp.setMonth(fp.getMonth()-1); const dp=await psd2Api('/accounts/'+encodeURIComponent(uid)+'/transactions?date_from='+fp.toISOString().slice(0,10)+'&transaction_status=PDNG');
      for(const raw of (dp.transactions||[])){ const t=mapPsd2Tx(raw, accId, true); if(t) pend.push(t); } }catch(e){} }
  }
  SET.psd2Accounts=meta; SET.psd2LastSync=Date.now();
  const added=commitTx(allTx, balances);
  applyPending(pend);
  curMonth=null; render();
  toast(added? `${ICON('check')} ${added} transacties gekoppeld van ${aspspName}` : `Koppeling met ${aspspName} ververst (geen nieuwe)`);
}
// Enable Banking transactie → intern TX-object (zelfde schema als MT940/CSV)

function mapPsd2Tx(raw, accId, pending){
  const amtObj = raw.transaction_amount || raw.amount || {};
  const val = parseFloat(amtObj.amount); if(isNaN(val)) return null;
  const cdi = (raw.credit_debit_indicator||'').toUpperCase();
  const amount = cdi==='DBIT' ? -Math.abs(val) : (cdi==='CRDT'? Math.abs(val) : val);
  const date = (raw.booking_date || raw.value_date || raw.transaction_date || '').slice(0,10);
  if(!date) return null;
  const remit = Array.isArray(raw.remittance_information)? raw.remittance_information.join(' ') : (raw.remittance_information||'');
  const cp = amount<0 ? (raw.creditor||{}) : (raw.debtor||{});
  const cpAcc = amount<0 ? (raw.creditor_account||{}) : (raw.debtor_account||{});
  const name = ((cp.name||'').trim() || remit.slice(0,42).trim() || 'Transactie');
  const desc = [name, remit, (raw.bank_transaction_code&&raw.bank_transaction_code.description)||''].filter(Boolean).join(' ');
  const t={ date, amount, acc:accId, src:'psd2', desc, name:name.replace(/\s+/g,' ').slice(0,44),
    refNums: cpAcc.iban? [ibanNum(cpAcc.iban)].filter(Boolean) : [] };
  categorize(t);
  if(pending){ t.pending=true; t.id+='_p'; }
  return t;
}

function pickBalance(b){
  const arr = (b&&(b.balances||b))||[]; if(!Array.isArray(arr)||!arr.length) return null;
  const pref = arr.find(x=>/CLBD|ITAV|XPCD|PRCD/i.test(x.balance_type||x.type||'')) || arr[0];
  const v = pref&&(pref.balance_amount||pref.amount); if(!v) return null;
  const n=parseFloat(v.amount); if(isNaN(n)) return null;
  return (pref.credit_debit_indicator||'').toUpperCase()==='DBIT' ? -Math.abs(n) : n;
}
// gedeelde commit voor kant-en-klare TX-objecten (zelfde dedup als ingest)

function applyPending(list){
  TX=TX.filter(t=>!t.pending);            // wis vorige pending-snapshot
  const booked=TX.slice();                // dedup alleen tegen geboekte/geïmporteerde tx
  let add=0;
  for(const t of (list||[])){ if(!t) continue;
    const dup=booked.some(b=>b.acc===t.acc && Math.abs(b.amount-t.amount)<0.01 && Math.abs((new Date(b.date)-new Date(t.date))/86400000)<=6);
    if(dup) continue;
    TX.push(t); add++;
  }
  TX.sort((a,b)=>a.date.localeCompare(b.date));
  applyOwnAccounts(); buildAccMeta(); save();
  return add;
}
function _softKey(t){ const n=((t.name||t.desc||'').toUpperCase().match(/[A-Z]/g)||[]).join('').slice(0,8); return t.date+'|'+(+t.amount).toFixed(2)+'|'+n; }
// onderscheidende referentie uit de omschrijving (Tikkie-ID / Kenmerk / mandaat): een cijferreeks ≥6 telt als uniek kenmerk
function _refTokens(t){ const m=((t.desc||t.name||'').match(/\d{6,}/g)||[]); return [...new Set(m)].sort().join(','); }
// dedup-vingerafdruk voor de opschoontool: primair een stabiel bank-id (descriptor-drift = zelfde tx);
// anders datum|bedrag|naam-begin + de referentie-set, zodat losse betalingen met een eigen referentie (bv. 4× Tikkie €15) niet samensmelten,
// maar een pinopname met alleen een gedrifte automaatnaam (Geldmaat "Zwanebloem 9" ↔ "GM Zwanebloe", geen referentie) wél als dubbel telt.
function _dupSig(t){
  if(t.bankRef) return 'B|'+(t.acc||'')+'|'+t.bankRef;
  const n=((t.name||t.desc||'').toUpperCase().match(/[A-Z]/g)||[]).join('').slice(0,8);
  return 'H|'+t.date+'|'+(+t.amount).toFixed(2)+'|'+n+'|'+_refTokens(t);
}
function commitTx(newTxns, balances){
  let added=0; const existing=new Set(TX.map(t=>t.id));
  const soft=new Map(); for(const t of TX){ soft.set(_softKey(t), {acc:t.acc, src:t.src}); }
  for(const t of newTxns){ if(!t) continue; if(existing.has(t.id)) continue;
    const sk=_softKey(t), ex=soft.get(sk);
    if(ex && ex.acc!==t.acc && ex.src!==t.src) continue;   // dedup alleen over verschillende bronnen (bv. CSV↔PSD2); twee PSD2-rekeningen (Main/Zakgeld) worden niet meer tegen elkaar weggegooid
    TX.push(t); existing.add(t.id); soft.set(sk,{acc:t.acc,src:t.src}); added++; }
  if(balances) for(const a in balances){ ACCMETA[a]=Object.assign(ACCMETA[a]||{}, balances[a]); }
  TX.sort((a,b)=>a.date.localeCompare(b.date));
  applyOwnAccounts(); buildAccMeta(); save();
  if(added) try{ pushTopNotif(); updateNotifBadge(); }catch(_){}
  return added;
}
function findDuplicateIds(){
  // dubbel = zelfde datum, bedrag en winkel — ongeacht rekening-id, bron of pending-status,
  // maar met dezelfde onderscheidende referentie (anders zijn het losse betalingen, bv. meerdere Tikkies van eenzelfde bedrag op één dag).
  // we houden het 'beste' exemplaar: geboekt vóór pending, live (psd2) vóór import.
  const order=TX.slice().sort((a,b)=> (a.pending?1:0)-(b.pending?1:0) || (b.src==='psd2'?1:0)-(a.src==='psd2'?1:0) );
  const seen=new Set(), remove=new Set();
  for(const t of order){ const sk=_dupSig(t); if(seen.has(sk)) remove.add(t.id); else seen.add(sk); }
  return remove;
}
/* ===== Peaks-audit (v156, deel A: alleen rapporteren) =====
 * Peaks rondde uitgaven af en belegde het wisselgeld. De maandelijkse pakketprijs is een echte
 * bankkost; elk ander bedrag is inleg en dus vermogensopbouw, en hoort niet als uitgave te tellen.
 * Staat dat verkeerd, dan staat je uitgavenniveau te hoog, je spaarquote te laag en is
 * baselineSpend() opgeblazen, wat doorwerkt in monthBudget() en safeToSpend().
 *
 * Deze laag STELT ALLEEN VAST. Ze wijzigt geen categorie, geen bedrag, geen datum en geen enkele
 * transactie; de doorrekening draait op een kopie van OVR en zet die daarna terug.
 *
 * Het herkenningspatroon wordt uit je eigen transacties afgeleid, niet aangenomen: peaksHerkenning()
 * laat zien welk veld matchte en op hoeveel posten. Bij twijfel gaat een post naar 'onduidelijk',
 * nooit naar 'inleg' - een verkeerd omgeboekte transactie valt later niet meer op. */
const PEAKS_PAKKET = 2.99;
const PEAKS_KLEIN = 10;          // grens waaronder een terugkerend vast bedrag op een abonnement lijkt
const PEAKS_MAANDEN = 3;         // in zoveel maanden moet dat bedrag terugkomen om verdacht te zijn

function peaksMatchTekst(t){
  const s = ((t.desc || '') + ' ' + (t.name || '')).toUpperCase();
  return s.includes('PEAKS') || s.replace(/\s/g, '').includes('PEAKS');
}
/* Het patroon uit de data zelf. Naast de tekst kijken we of er een tegenrekening is die bij die
   posten hoort: die vangt boekingen op waar 'Peaks' niet in de omschrijving staat. Zo'n post telt
   bewust NIET automatisch mee als inleg; hij gaat naar 'onduidelijk'. */
function peaksHerkenning(){
  const opTekst = TX.filter(peaksMatchTekst);
  const refTel = {};
  for (const t of opTekst) for (const n of (t.refNums || [])) { if (n) refTel[n] = (refTel[n] || 0) + 1; }
  const refs = Object.keys(refTel).filter(n => refTel[n] >= 2);
  const opRef = refs.length ? TX.filter(t => !peaksMatchTekst(t) && (t.refNums || []).some(n => refs.includes(n))) : [];
  const namen = [...new Set(opTekst.map(t => (t.name || '').trim()).filter(Boolean))].slice(0, 6);
  return {
    velden: { tekst: opTekst.length, tegenrekening: opRef.length },
    refs, namen,
    posten: opTekst.concat(opRef),
    zwak: new Set(opRef.map(t => t.id)),
    treffers: opTekst.length + opRef.length,
  };
}
function peaksAudit(){
  const H = peaksHerkenning();
  const pakket = [], inleg = [], onduidelijk = [], opnames = [];
  // hoe vaak komt een exact bedrag terug, en in hoeveel verschillende maanden?
  const perBedrag = {}, perBedragTel = {};
  for (const t of H.posten) {
    const k = t.amount.toFixed(2);
    (perBedrag[k] = perBedrag[k] || new Set()).add(t.date.slice(0, 7));
    perBedragTel[k] = (perBedragTel[k] || 0) + 1;
  }
  for (const t of H.posten) {
    const reden = (r) => onduidelijk.push({ t, reden: r });
    if (H.zwak.has(t.id)) { reden('alleen herkend aan de tegenrekening, niet aan de omschrijving'); continue; }
    /* v156 deel B: een bijschrijving vanaf Peaks is een opname uit je belegging. Hij hoort niet
       bij 'inleg', maar hij is ook niet onduidelijk: staat hij in een uitgavecategorie, dan valt
       hij daar netto weg tegen je uitgaven (v18-v28) en levert dat onmogelijke maandtotalen op. */
    if (t.amount > 0) { opnames.push(t); continue; }
    if (Math.abs(t.amount + PEAKS_PAKKET) < 0.005) { pakket.push(t); continue; }
    /* Een pakketprijs komt hooguit EEN keer per maand. Een bedrag dat vaker terugkomt dan het
       aantal maanden waarin het voorkomt heeft een week- of dagritme en is dus inleg. Zonder die
       tweede eis viel een wekelijkse automatische inleg ten onrechte in 'onduidelijk'. */
    const kb = t.amount.toFixed(2);
    const maanden = (perBedrag[kb] || new Set()).size, keer = perBedragTel[kb] || 0;
    if (Math.abs(t.amount) <= PEAKS_KLEIN && maanden >= PEAKS_MAANDEN && keer === maanden) {
      reden(`vast bedrag, een keer per maand in ${maanden} maanden, lijkt een pakketprijs maar is geen ${euro(PEAKS_PAKKET)}`);
      continue;
    }
    inleg.push(t);
  }
  const maandKey = t => t.date.slice(0, 7);
  const perMaand = {};
  const tel = (groep, t) => {
    const m = maandKey(t);
    const r = perMaand[m] = perMaand[m] || { pakket: 0, pakketEur: 0, inleg: 0, inlegEur: 0, opnames: 0, opnamesEur: 0, onduidelijk: 0 };
    r[groep]++; if (groep !== 'onduidelijk') r[groep + 'Eur'] += Math.abs(t.amount);
  };
  pakket.forEach(t => tel('pakket', t));
  inleg.forEach(t => tel('inleg', t));
  opnames.forEach(t => tel('opnames', t));
  onduidelijk.forEach(x => tel('onduidelijk', x.t));
  const huidigeCats = {};
  let viaOvr = 0;
  for (const t of H.posten) { const c = catOf(t); huidigeCats[c] = (huidigeCats[c] || 0) + 1; if (OVR[t.id]) viaOvr++; }
  /* Waar komt de huidige boeking vandaan? Een eigen regel in SET.rules wint van de ingebouwde
     keyword-regels (categorize stap 1), en de ingebouwde tabel kent PEAKS al als 'sparen'. Staat
     alles op bankkosten, dan komt dat dus vrijwel zeker uit zo'n regel en niet uit losse
     overrides - die hangen aan t.id, en categorize() herschrijft die id bij elke boot. */
  const regels = ((typeof SET !== 'undefined' && SET.rules) || [])
    .filter(r => r && r.kw && /PEAKS/i.test(r.kw))
    .map(r => ({ kw: r.kw, cat: r.cat }));
  return { pakket, inleg, opnames, onduidelijk, perMaand, totaalInleg: Math.round(inleg.reduce((a, t) => a + -t.amount, 0)),
    totaalOpnames: Math.round(opnames.reduce((a, t) => a + t.amount, 0)),
    huidigeCats, bron: { regels, viaOvr }, herkenning: H };
}
/* De doorrekening. Draait de bestaande functies met een gewijzigde kopie van OVR en zet die daarna
   terug, zodat het exact dezelfde netSpend(), baselineSpend() en savedNet() zijn die het scherm
   gebruikt. Er wordt niets opgeslagen; de noodfonds-memo wordt voor de zekerheid ongeldig gemaakt,
   want die hangt aan _dataGen en dat verandert hier niet. */
function peaksImpact(){
  const A = peaksAudit();
  if (!A.pakket.length && !A.inleg.length && !A.opnames.length) return null;
  const meet = () => {
    const ms = months();
    const perM = {};
    for (const m of ms) {
      let inc = 0; try { inc = Math.round(totals(m).income); } catch(_){}
      perM[m] = { spend: Math.round(netSpend(txOfMonth(m))), spaar: savedNet(m), inkomen: inc };
    }
    return { perM, baseline: baselineSpend() };
  };
  const voor = meet();
  const origOVR = OVR;
  let na = null;
  try {
    const kopie = Object.assign({}, OVR);
    for (const t of A.pakket) kopie[t.id] = 'bankkosten';
    for (const t of A.inleg) kopie[t.id] = 'sparen';
    for (const t of A.opnames) kopie[t.id] = 'sparen';
    OVR = kopie;
    na = meet();
  } finally {
    OVR = origOVR;
    try { _nfGen = -1; } catch(_){}
  }
  return { voor, na, limitMode: SET.limitMode || 'pct',
    baselineTelt: (SET.limitMode || 'pct') === 'baseline',
    spaarBron: (typeof n26SavingsAccounts === 'function' && n26SavingsAccounts().length) ? 'spaarrekening' : 'categorie' };
}

  const rm=findDuplicateIds();

function confirmCleanupDuplicates(){

  const n=rm.size; TX=TX.filter(t=>!rm.has(t.id)); applyOwnAccounts(); buildAccMeta(); save(); curMonth=null; closeSheet(); render();

/* ---------- map/bestanden slepen (werkt ook zonder File System Access API) ---------- */


/* ----- ABONNEMENTEN / VASTE LASTEN CHECK ----- */
function isIncasso(t){ const U=((t.desc||'')+' '+(t.name||'')).toUpperCase();
  if(/\bBEA\b|BEA,|\bGEA\b|GEA,|ECOM|BETAALPAS|APPLE PAY|GOOGLE PAY|\bIDEAL\b|TIKKIE|CONTACTLOOS/.test(U)) return false;   // kaart/pin/online betaling = geen incasso
  if(t.src==='csv' && /(direct ?debit|incasso)/i.test(t.typ||'')) return true;                                            // N26 CSV: Type-veld
  return /INCASSO|DOORLOPENDE MACHTIGING|MACHTIGING|SEPA DD|DIRECT DEBIT/.test(U);
}
// Periodieke overboeking (standing order): óók een herkende terugkerende betaling, andere betaalvorm dan incasso (D3).
function isPeriodicTransfer(t){ const U=((t.desc||'')+' '+(t.name||'')).toUpperCase();
  if(/\bBEA\b|BEA,|\bGEA\b|GEA,|ECOM|BETAALPAS|APPLE PAY|GOOGLE PAY|\bIDEAL\b|TIKKIE|CONTACTLOOS/.test(U)) return false;   // kaart/pin = geen periodieke overboeking
  if(t.src==='csv' && /(standing ?order|periodic)/i.test(t.typ||'')) return true;                                          // N26 CSV: Type-veld
  return /PERIODIEKE OVERB|PERIODIEKE OVERSCHR|DOORLOPENDE OPDRACHT|STANDING ORDER|PERIODIEKE SEPA/.test(U);
}
function subscriptionsList(){
  // alleen ECHTE, opzegbare abonnementen via AUTOMATISCHE INCASSO (geen losse betalingen, geen vaste lasten als verzekering/huur)
  const recent3=months().slice(-3); const r3=new Set(recent3);
  const map={};
  for(const t of TX){ if(t.amount>=0) continue; const c=catOf(t); if(!CATS[c]||CATS[c].type!=='expense') continue;
    if(!isIncasso(t)) continue;                                                 // alleen automatische incasso's
    const ym=t.date.slice(0,7); if(!r3.has(ym)) continue;                       // alleen laatste 3 maanden
    const key=(t.name||'').toUpperCase().replace(/[0-9]/g,'').replace(/\s+/g,' ').slice(0,20).trim(); if(!key) continue;
    const m=(map[key]=map[key]||{name:t.name,cat:c,byM:{},last:''}); m.byM[ym]=(m.byM[ym]||0)+(-t.amount); if(t.date>m.last)m.last=t.date; m.cat=c; }
  const subCats=new Set(['abonnement','sport','goededoel']);                    // opzegbaar
  const med=a=>{const z=a.slice().sort((x,y)=>x-y);return z.length?(z.length%2?z[(z.length-1)/2]:(z[z.length/2-1]+z[z.length/2])/2):0;};
  const out=[];
  for(const k in map){ const r=map[k];
    const vals=recent3.map(m=>r.byM[m]||0).filter(v=>v>0);
    if(vals.length<2) continue;                                                 // terugkerend: in >=2 van de laatste 3 maanden
    const mean=vals.reduce((a,b)=>a+b,0)/vals.length; const sd=Math.sqrt(vals.reduce((s,a)=>s+(a-mean)**2,0)/vals.length); const cv=mean>0?sd/mean:1;
    if(!(subCats.has(r.cat) || (r.cat==='overig' && cv<0.12))) continue;        // opzegbare categorie, of uncategorized maar stabiel
    out.push({key:k,name:r.name,cat:r.cat,monthly:Math.round(med(vals)),months:vals.length,last:r.last}); }   // bedrag = mediaan laatste 3 mnd
  return out.sort((a,b)=>b.monthly-a.monthly);
}
function subsCard(){ const list=subscriptionsList(); if(!list.length) return ''; const total=list.reduce((s,x)=>s+x.monthly,0);
  return `<div class="card" style="cursor:pointer" onclick="openSubs()"><div class="row"><span style="font-weight:600">${ICON('repeat')} Abonnementen</span><span class="small" style="color:var(--teal);font-weight:600">${euro0(total)}/mnd ›</span></div><div class="small muted" style="margin-top:4px">${list.length} ${list.length===1?'abonnement':'abonnementen'} · check wat je nog gebruikt</div></div>`; }
function toggleCancel(k){ SET.cancelFlags=SET.cancelFlags||{}; if(SET.cancelFlags[k]) delete SET.cancelFlags[k]; else SET.cancelFlags[k]=true; save(); openSubs(); }
function openSubs(){
  const list=subscriptionsList(); const flags=SET.cancelFlags||{};
  const total=list.reduce((s,x)=>s+x.monthly,0); const saving=list.filter(x=>flags[x.key]).reduce((s,x)=>s+x.monthly,0);
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="row" style="margin-bottom:4px"><div style="font-weight:800;font-size:var(--fs-lg)">${ICON('repeat')} Abonnementen</div><span class="small" style="color:var(--teal);cursor:pointer;font-weight:600" onclick="closeSheet()">Klaar</span></div>
    <div class="small muted" style="margin-bottom:10px">${list.length} ${list.length===1?'abonnement':'abonnementen'} · samen ${euro0(total)}/mnd. Markeer wat je niet meer gebruikt. <span style="display:block;margin-top:4px">Alleen automatische incasso&#39;s &middot; bedrag = mediaan van de laatste 3 maanden.</span></div>
    ${list.map(x=>{const on=!!flags[x.key]; return `<div class="row" style="padding:9px 0;border-top:1px solid var(--line);${on?'opacity:.55':''}">
      <div style="min-width:0;flex:1"><div style="font-weight:600;font-size:var(--fs-md)">${CATS[x.cat].icon||''} ${esc(x.name)}</div><div class="small muted">${euro0(x.monthly)}/mnd · ${x.months} mnd gezien</div></div>
      <button class="chip ${on?'on':''}" style="flex-shrink:0" onclick="toggleCancel('${x.key}')">${on?'opzeggen':'opzeggen?'}</button></div>`;}).join('')||'<div class="small muted">Nog geen abonnementen herkend.</div>'}
    ${saving>0?`<div style="margin-top:12px;background:color-mix(in srgb,var(--green) 10%,transparent);border:1px solid color-mix(in srgb,var(--green) 35%,transparent);border-radius:10px;padding:12px 14px;font-size:var(--fs-md)">Door deze op te zeggen bespaar je <b style="color:var(--green)">${euro0(saving)}/mnd</b> (${euro0(saving*12)}/jaar).</div>`:''}
    <div style="height:8px"></div>`;
  showSheetBg();
}

/* ----- INSTELLINGEN ----- */

function toggleSet(id){ SET.setOpen = SET.setOpen===id?'':id; save(); renderSet(); }

async function readEntry(entry,items){
  if(!entry) return;
  if(entry.isFile){ await new Promise(res=>entry.file(async f=>{ if(FILE_RX.test(f.name)) items.push({name:f.name,text:await f.text()}); res(); },res)); }
  else if(entry.isDirectory){ const rd=entry.createReader();
    while(true){ const ents=await new Promise((res,rej)=>rd.readEntries(res,rej)); if(!ents.length) break; for(const e of ents) await readEntry(e,items); } }
}
document.addEventListener('dragover',e=>{e.preventDefault();});
document.addEventListener('drop',async e=>{
  e.preventDefault();
  const items=[];
  const ents=[...(e.dataTransfer.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(ents.length){ for(const en of ents) await readEntry(en,items); }
  else { for(const f of e.dataTransfer.files){ if(FILE_RX.test(f.name)) items.push({name:f.name,text:await f.text()}); } }
  if(items.length){ const added=ingest(items); curMonth=null; render(); if(added) try{ pushTopNotif(); updateNotifBadge(); }catch(_){} toast(added? `${ICON('check')} ${added} transacties ingelezen · alles blijft op dit toestel` : 'Geen nieuwe transacties'); }
});

load(); try{applyTheme();}catch(_){} try{requestPersist();}catch(_){} rolloverBudgets(); if(TX.length){ TX.forEach(categorize); applyOwnAccounts(); buildAccMeta(); } try{migrateSavingsAcc();}catch(_){} try{migrateAcctNames();}catch(_){} try{migrateNfToegewezen();}catch(_){} render(); // hercategoriseer met actuele regels
// blijf na een refresh op de actieve pagina (niet terug naar Home), behalve bij terugkeer van de bank-consent
try{ const _v=localStorage.getItem('minder_view'); if(_v && TX.length && document.getElementById('s-'+_v) && !new URLSearchParams(location.search).get('code')) go(_v); }catch(_){}
try{ if(TX.length) pushTopNotif(); updateNotifBadge(); }catch(_){}
try{ if(Object.keys(SET.psd2Accounts||{}).length && (Date.now()-(SET.psd2LastSync||0))>4*3600000) psd2Refresh(true); }catch(_){}
if(new URLSearchParams(location.search).get('code')) psd2HandleCallback(); // terug van bank (PSD2-consent)
// snelkoppeling koopcheck (PWA-shortcut / bookmark ./index.html?action=buy): open direct de check; lege app opent gewoon normaal
try{ if(TX.length && new URLSearchParams(location.search).get('action')==='buy'){ openBuy(); history.replaceState(null,'',location.pathname); } }catch(_){}
(async()=>{ // auto-sync bij openen als de map al gekoppeld is en toegang al verleend is
  if(!FSA || !SET.autoSync) return;
  try{ dirHandle=await idbGet('dir');
    if(dirHandle && await dirHandle.queryPermission({mode:'read'})==='granted'){ await syncFolder(false); }
    else { render(); }
  }catch(e){}
})();

/* ---------- PWA: service worker + installeren ---------- */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{ try{reg.update();}catch(e){} }).catch(()=>{}));
  let _reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_reloading)return; _reloading=true; location.reload(); });
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(TX.length) renderSet(); });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; if(TX.length) renderSet(); });
async function installApp(){
  if(!deferredPrompt){ alert('Installeren kan via het browsermenu: ⋮ → “App installeren” (Chrome/Edge) of Deel → “Zet op beginscherm” (iPhone). Mogelijk is de app al geïnstalleerd.'); return; }
  deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; renderSet();
}
