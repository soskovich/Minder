<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minder">
<title>Minder · slimme uitgaventracker</title>
<style>
:root{
  /* Design-systeem (v75). Alles cascadeert vanaf hier: kleur, diepte, ritme, radius. */
  --bg:#0a0f1a; --card:#141b2b; --card2:#1b2336; --line:rgba(255,255,255,.07); --ln2:rgba(255,255,255,.12);
  /* tekst: --mut is leesbaar secundair, --mut2 alleen écht tertiair */
  --txt:#eaf0fb; --mut:#a6b2c6; --mut2:#7f8ba1;
  /* teal is gereserveerd: actieve tab, primaire knop, hero-bedrag, één accent per kaart */
  --accent:#3bb3a4; --accent-d:#0f766e; --on-accent:#06231c;
  --teal:var(--accent); --teal-d:var(--accent-d);      /* oude namen blijven werken */
  --green:#34d399; --amber:#f5b544; --red:#e2685f; --blue:#60a5fa; --violet:#a78bfa;
  --bar:#39445e;                       /* neutrale datakleur: staven zonder alarm */
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 6px 20px rgba(0,0,0,.22);
  --s1:8px; --s2:16px; --s3:24px; --s4:32px;
  /* type-schaal: de vijf maten die de app het vaakst gebruikt, nu via één set tokens.
     Overige (10,5 / 11,5 / 13 / 13,5 …) blijven staan waar ze bewust afwijken. */
  --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:17px; --fs-xl:22px;
  --r-card:16px; --r-inner:12px; --r-pill:999px;
  /* thema-haken: standaard = de huidige donkere look, thema's overschrijven ze hieronder */
  --ref:#56627d;                       /* referentie-/doellijnen in grafieken */
  --lab:#8a97ab;                       /* as- en maandlabels in grafieken */
  --nav-bg:rgba(13,20,34,.72);
  --surface:var(--card);               /* dekkend oppervlak voor sheets en popovers */
  --font-head:inherit;                 /* koppen + hero; Privé zet hier een serif */
  --hero-gradient:none;                /* Aurora zet hier een verloop voor het hero-bedrag */
  --card-blur:none;                    /* Aurora zet hier de glas-blur */
  --aurora:none;                       /* Aurora zet hier de gloed-overlay */
}
/* ---------- Thema 1: Privé — licht & editorial ---------- */
[data-theme="prive"]{
  --bg:#f6f2e9; --card:#fffdf9; --card2:#f0ebe0;
  --line:rgba(0,0,0,.06); --ln2:rgba(0,0,0,.10);
  /* contrast nagerekend op --bg (#f6f2e9): tekst-tokens halen AA (>=4.5:1), zie tests/themas */
  --txt:#1c2b26; --mut:#5b685f; --mut2:#676e68;
  --accent:#1f5c46; --accent-d:#16452f; --on-accent:#fffdf9;
  --green:#2e7958; --amber:#91651d; --red:#a8402f; --blue:#2c5d86; --violet:#5d4b96;
  --bar:#cdd6cf; --ref:#666e69; --lab:#5b685f;
  --nav-bg:rgba(255,253,249,.86); --surface:#fffdf9;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  --font-head:Georgia,'Iowan Old Style','Times New Roman',serif;
  color-scheme:light;
}
/* ---------- Thema 2: Neo-Dark Aurora — donker & glas ---------- */
[data-theme="aurora"]{
  --bg:#0a0e17; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.08); --ln2:rgba(255,255,255,.14);
  --txt:#eaf0fb; --mut:#9aa6bd; --mut2:#7e8ba4;
  --accent:#34e0c4; --accent-d:#0e8f7c; --on-accent:#05221c;
  --bar:#37455f; --ref:#5b6a86; --lab:#93a2ba;
  --nav-bg:rgba(10,14,23,.66); --surface:#121826;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.32);
  --hero-gradient:linear-gradient(90deg,#34e0c4,var(--violet));
  --card-blur:blur(14px);
  --aurora:radial-gradient(120% 55% at 12% -8%, rgba(52,224,196,.13), transparent 62%),
           radial-gradient(100% 45% at 92% -2%, rgba(167,139,250,.12), transparent 60%);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
/* de aurora-gloed is een overlay achter de app; in de andere thema's staat hij op none */
body::before{content:'';position:fixed;inset:0;background:var(--aurora);pointer-events:none;z-index:-1}
body{
  /* de basiskleur staat op <html>, zodat de aurora-overlay (body::before) er niet onder verdwijnt */
  background:transparent; color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:var(--fs-md); line-height:1.45; padding-bottom:78px; max-width:520px; margin:0 auto;
  min-height:100vh; position:relative;
  font-variant-numeric:tabular-nums; font-feature-settings:'tnum';   /* cijfers lijnen overal uit */
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  letter-spacing:-.01em;
}
svg{display:inline-block}
h1,h2,h3{margin:0}
.app-head{padding:18px 18px 6px;display:flex;align-items:center;justify-content:space-between}
.app-head .logo{font-weight:800;font-size:var(--fs-xl);letter-spacing:-.4px}
.app-head .logo span{color:var(--teal)}
.head-gear{background:none;border:0;color:var(--mut);cursor:pointer;padding:5px;display:flex;align-items:center;border-radius:50%}
.head-gear.on,.head-gear:active{color:var(--teal)}
.head-ic{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px;display:flex;align-items:center;position:relative;border-radius:50%}
.head-ic:active{color:var(--teal)}
.head-ic .badge{position:absolute;top:-1px;right:-1px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--red);color:#fff;font-size:var(--fs-xs);font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.month-pick{display:flex;align-items:center;gap:1px;background:none;border:0;border-radius:0;padding:0}
.month-pick button{background:none;border:none;color:var(--mut);font-size:var(--fs-lg);width:22px;height:22px;border-radius:50%;cursor:pointer}
.month-pick button:active{background:var(--card2)}
.month-pick .m{font-weight:600;min-width:72px;text-align:center;font-size:var(--fs-sm)}
.screen{display:none;padding:8px 16px 16px;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s2);margin-bottom:var(--s2);box-shadow:var(--shadow);backdrop-filter:var(--card-blur);-webkit-backdrop-filter:var(--card-blur)}
/* koppen en grote bedragen volgen het thema-lettertype (Privé = serif) */
h1,h2,h3,.hlabel,.inssec,.homehero .hh-big,.hero2 .hbig,.gc-bighead,.hdj-kn,.gr-ctr .p,.wvo-tv{font-family:var(--font-head)}
/* Aurora geeft het hero-bedrag een verloop; alleen als het niet zijn eigen (alarm)kleur draagt */
.hh-big.grad{color:var(--accent)}
[data-theme="aurora"] .homehero .hh-big.grad{background:var(--hero-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--mut)}
/* ===== v10 systeem, home pilot: geen dozen, ruimte + typografie ===== */
.hsec{margin-top:30px}
.hlabel{font-size:var(--fs-sm);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.hero2{padding:4px 2px 0}
.hero2 .hlbl{font-size:var(--fs-sm);color:var(--mut)}
.hero2 .hbig{font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1.04;font-variant-numeric:tabular-nums;margin:7px 0 3px}
.hero2 .hsub{font-size:var(--fs-sm);color:var(--mut)}
.hero2 .hstat{font-size:var(--fs-sm);font-weight:600;margin-top:12px;display:flex;align-items:center;gap:6px}
.homehero{padding:20px 2px 4px;cursor:pointer}
.homehero .hh-lbl{font-size:13px;color:var(--mut)}
.homehero .hh-big{font-size:40px;font-weight:600;letter-spacing:-1.2px;line-height:1.05;font-variant-numeric:tabular-nums;margin:7px 0 11px}
.homehero .hh-warn{font-size:16px;color:var(--amber);vertical-align:middle}
.homehero .hh-sub{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.homehero .hh-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.homelist{margin-top:28px}
.homelist .hl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.homelist .hl-head>span:first-child{font-size:13px;color:var(--mut)}
.homelist .hl-all{font-size:13px;color:var(--teal);cursor:pointer}
.insfocus{padding:16px 2px 4px}
.insfocus .if-ctx{font-size:14.5px;color:var(--txt);line-height:1.5;margin-bottom:16px;max-width:320px}
.if-cta{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:var(--on-accent);border:0;border-radius:13px;padding:11px 18px;font-size:var(--fs-md);font-weight:600;cursor:pointer}
.vooruit{padding:24px 2px 4px}
.vooruit .vh-lbl{font-size:13px;color:var(--mut)}
.vooruit .vh-big{font-size:44px;font-weight:600;letter-spacing:-1.4px;line-height:1.04;font-variant-numeric:tabular-nums;margin:7px 0 12px}
.vooruit .vh-status{font-size:15px;color:var(--txt);margin-bottom:18px}
.vooruit .vh-bar{position:relative;height:6px;border-radius:6px;background:var(--card2);max-width:320px}
.vooruit .vh-fill{height:100%;border-radius:6px}
.vooruit .vh-mark{position:absolute;top:-4px;height:14px;width:2px;border-radius:1px;background:var(--txt);opacity:.5;transform:translateX(-1px)}
.vooruit .vh-sub{font-size:var(--fs-sm);color:var(--mut);margin-top:-8px;margin-bottom:4px}
.vh-hef{margin-top:16px;max-width:340px}
.vh-hef .vh-hef-h{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:8px}
.vh-chip{display:inline-block;background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--teal);border-radius:18px;padding:6px 11px;margin:0 6px 6px 0;font-size:var(--fs-sm);font-weight:500;cursor:pointer}
.vh-chip.on{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.vh-eff{font-size:var(--fs-sm);color:var(--txt);line-height:1.5;margin-top:4px}
.vh-eff b{font-weight:600;color:var(--teal)}
.fc-diff{font-size:13px;font-weight:700;margin-top:12px}
.fc-mo{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fc-mo:first-of-type{border-top:none}
.fc-mo-n{font-size:15px;font-weight:600}
.fc-mo-tag{font-size:11.5px;color:var(--amber);margin-top:2px}
.fc-mo-bal{font-size:15px;font-weight:800;text-align:right}
.fc-mo-net{font-size:12px;font-weight:600;text-align:right;margin-top:2px}
.fc-savings{font-size:var(--fs-sm);color:var(--mut);margin-bottom:10px}
.vc-leg{display:flex;gap:16px;font-size:var(--fs-xs);color:var(--mut);margin-top:4px}
.vc-leg i{width:14px;height:2px;background:var(--teal);display:inline-block;vertical-align:middle;margin-right:5px}
.vc-leg i.dash{background:transparent;border-top:2px dashed var(--mut);height:0}
.vc-card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 6%,transparent);border:1px solid color-mix(in srgb,var(--accent) 16%,transparent);border-radius:12px;padding:11px 13px;margin-top:10px}
.vc-mon{font-size:var(--fs-xs);color:var(--mut);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.vc-plan{font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.vc-bal{font-size:20px;font-weight:800;letter-spacing:-.4px;flex-shrink:0}
.sc-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-xs);color:var(--mut);margin-top:8px}
.sc-leg span{display:inline-flex;align-items:center}
.sc-leg i{width:15px;height:0;border-top:2px solid var(--teal);display:inline-block;vertical-align:middle;margin-right:5px}
.sc-leg i.d{border-top-style:dashed}
.sc-cap{font-size:var(--fs-sm);color:var(--txt);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);line-height:1.5}
.sc-cap b{font-weight:600}
.sc-cap .mut{color:var(--mut)}
.fc-chips{display:flex;flex-wrap:wrap;gap:8px}
.fc-chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.fc-chip.on{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.fc-one{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding:7px 0}
.fc-one .x{color:var(--mut);cursor:pointer;padding:0 6px;font-size:var(--fs-md)}
.fc-input{display:flex;flex-direction:column;gap:9px}
.fc-input select,.fc-input input{width:100%;box-sizing:border-box;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit}
.fc-input-row{display:flex;gap:9px}
.fc-input-row input{flex:1;min-width:0}
.fc-add{background:var(--teal);color:var(--on-accent);border:none;border-radius:12px;padding:0 20px;height:48px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap}
.ov-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ov-row:last-child{border-bottom:0}
.beh-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.beh-row:last-child{border-bottom:0}
.beh-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.beh-t{flex:1}
.beh-go{color:var(--mut)}
.insinline{display:flex;align-items:center;gap:9px;padding:14px 2px 2px;font-size:14.5px;color:var(--txt);cursor:pointer}
.insinline .ii-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.insinline .ii-go{margin-left:auto;color:var(--mut);flex-shrink:0;font-size:var(--fs-lg)}
.bc-sum{display:flex;gap:9px;margin:2px 0 12px}
.bc-sum>div{flex:1;background:var(--card2);border-radius:13px;padding:12px 11px}
.bc-k{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.bc-v{font-size:15px;font-weight:800;line-height:1.2}
.bc-row{padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.bc-row:first-of-type{border-top:none}
.bc-rt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bc-name{font-size:14.5px;font-weight:600}
.bc-amt{font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--mut)}
.bc-amt b{color:var(--txt)}
.bc-var{font-size:var(--fs-sm);font-weight:700;margin-top:6px}
.bc-hypo{font-size:13px;color:var(--mut);line-height:1.5;padding:10px 0;border-top:1px solid var(--line)}
.bc-hypo:first-of-type{border-top:none}
.bc-hd{color:var(--txt);font-weight:600}
.bc-status{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.bc-statsub{font-size:13px;color:var(--mut);margin-top:4px}
.bc-steer{font-size:13.5px;color:var(--mut);margin-top:16px;line-height:1.5}
.bc-why{font-size:var(--fs-sm);color:var(--mut);line-height:1.45;margin-top:6px}
.bc-tip{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:13px;padding:12px 13px;margin-top:18px;font-size:13.5px;line-height:1.45}
.bc-tip .bc-tip-l{color:var(--teal);font-weight:700;flex-shrink:0}
.actfocus{padding:26px 2px 4px}
.actfocus .af-ic{font-size:26px;margin-bottom:14px}
.actfocus .af-ctx{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:22px;max-width:320px}
.actfocus .af-tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.actfocus .af-obs{font-size:var(--fs-md);color:var(--mut);margin-bottom:6px}
.actfocus .af-action{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:22px;max-width:320px}
.actfocus .af-steps{font-size:13px;color:var(--teal);cursor:pointer;margin-top:14px}
.actfocus .af-undo{font-size:13px;color:var(--mut);cursor:pointer;margin-top:12px}
.actfocus .af-open{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:8px;max-width:320px}
.actfocus .af-mean{font-size:var(--fs-md);color:var(--mut);line-height:1.5;margin:0 0 20px;max-width:320px}
.actfocus .af-q{font-size:var(--fs-lg);font-weight:600;line-height:1.4;margin-bottom:15px;max-width:320px}
.actfocus .af-fwd{font-size:13px;color:var(--teal);margin:-12px 0 20px;max-width:320px}
.actfocus .af-impact{font-size:13.5px;color:var(--txt);background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:12px;padding:11px 13px;margin:0 0 18px;line-height:1.45;max-width:320px}
.coachchips{display:flex;flex-wrap:wrap;gap:9px}
.coachchip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:21px;padding:10px 16px;font-size:var(--fs-md);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.coachchip:active{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.coachchip.rec{border-color:var(--teal);color:var(--teal)}
.actfocus .coachcard{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:0 13px 13px 0;padding:13px 14px;margin:2px 0 16px;max-width:340px}
.actfocus .coachcard .cc-obs{font-size:15.5px;font-weight:600;line-height:1.4}
.actfocus .coachcard .cc-cause{font-size:var(--fs-sm);color:var(--mut);line-height:1.5;margin-top:6px}
.coachgreet{margin:2px 0 18px;max-width:340px}
.coachgreet .cg-hi{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.3px;margin-bottom:10px}
.coachgreet .cg-line{font-size:14.5px;color:var(--txt);line-height:1.55;margin-bottom:8px}
.coachgreet .cg-line.warn{color:var(--amber)}
.cg-sand{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:0 0 18px;max-width:340px}
.cg-sand .cs-row{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.cg-sand .cs-row:last-child{border-bottom:0}
.cg-sand .cs-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px}
.cg-sand .cs-t{font-size:13.5px;line-height:1.5}
.cg-sand .cs-t b{font-weight:600}
.cg-sand .cs-t .cs-lbl{display:block;font-size:var(--fs-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.cg-disc{border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:14px;padding:13px 14px;margin:0 0 20px;max-width:340px}
.cg-disc .cd-h{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:7px}
.cg-disc .cd-rule{font-size:13.5px;color:var(--txt);line-height:1.55;margin-bottom:5px;padding-left:16px;position:relative}
.cg-disc .cd-rule:before{content:"·";position:absolute;left:4px;color:var(--teal);font-weight:700}
.cg-disc .cd-rule:last-child{margin-bottom:0}
/* ===== Coach-scherm: 4 zones (unified card-systeem) ===== */
.cz-status{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.czs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.czs-amt .czs-lbl{font-size:var(--fs-xs);color:var(--mut);margin-bottom:3px}

.cz-eyebrow{font-size:var(--fs-xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.cz-end{font-size:34px;font-weight:700;letter-spacing:-.9px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.cz-delta{display:inline-block;font-size:var(--fs-sm);font-weight:600;padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--teal)}

.cz-rule{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 13px;font-size:13.5px;font-weight:500;cursor:pointer;margin-top:8px}

.cz-mine{margin-top:26px;opacity:.9}
.cz-mine .czr-head{font-size:13px;color:var(--mut);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cz-pot{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.cz-pot:last-child{border-bottom:0}
.cz-pot .cp-info{flex:1;min-width:0}
.cz-pot .cp-nm{font-size:var(--fs-md);font-weight:600}

.cz-pot .cp-btn{flex-shrink:0;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;font-size:var(--fs-sm);font-weight:600;cursor:pointer}
.cz-pot .cp-btn.make{border-color:var(--teal);color:var(--teal)}
.plan-mv{width:34px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:var(--fs-xs);line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.plan-mv.off{opacity:.22}
.plan-1{display:inline-block;background:var(--teal);color:var(--on-accent);font-weight:800;font-size:10px;border-radius:5px;padding:1px 6px;vertical-align:1px}
.cp-add{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--ln2);color:var(--txt);border-radius:var(--r-inner);padding:11px 13px;margin:var(--s1) 0 4px;font-size:13px;font-weight:600;cursor:pointer}
.cz-note{font-size:12px;color:var(--mut);line-height:1.5;margin:9px 4px 0}
.cz-effect{font-size:var(--fs-md);color:var(--txt);line-height:1.5;margin-bottom:4px}
.cz-link{font-size:13px;color:var(--teal);cursor:pointer;font-weight:600;margin-top:14px}
.cothr{display:flex;flex-direction:column}
.cbub{max-width:86%;padding:9px 12px;border-radius:14px;font-size:var(--fs-md);line-height:1.5;margin:5px 0;white-space:pre-wrap}
.cbub.co{background:var(--card2);border-bottom-left-radius:4px;align-self:flex-start}
.cbub.me{background:var(--teal);color:var(--on-accent);border-bottom-right-radius:4px;align-self:flex-end;font-weight:500}
.cfx{align-self:flex-start;font-size:12px;color:var(--teal);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:20px;padding:4px 11px;margin:4px 0 6px}
.cdots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mut);margin:0 2px;animation:cobl 1s infinite}
.cdots span:nth-child(2){animation-delay:.2s}.cdots span:nth-child(3){animation-delay:.4s}
@keyframes cobl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.cch{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);color:var(--teal);border-radius:12px;padding:11px 13px;margin-top:7px;font-size:13.5px;font-weight:500;cursor:pointer}
.cch:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.cch .cchv{opacity:.7;flex-shrink:0}
.corow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:92%;margin:5px 0}
.corow .coav{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--card2)}
.corow .cbub.co{margin:0}
.coachhead{display:flex;align-items:center;gap:9px;margin:26px 2px 11px;cursor:pointer}
.coachhead .av{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--card2)}
.coachhead .nm{font-size:var(--fs-xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.coachhead .sw{font-size:var(--fs-xs);color:var(--teal);margin-left:auto}
.cobuy{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--teal);color:var(--teal);border-radius:12px;padding:12px 13px;margin-top:18px;font-size:13.5px;font-weight:600;cursor:pointer}
.coinput{width:100%;margin-top:8px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:var(--fs-md);box-sizing:border-box}
.coconf{display:flex;gap:8px;margin-top:10px}
.coconf-ok{flex:1;background:var(--teal);color:var(--on-accent);border:0;border-radius:11px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer}
.coconf-adj{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:13.5px;cursor:pointer}
.cbub.co.acc{border-left:2px solid var(--teal);border-top-left-radius:5px;border-bottom-left-radius:5px}
.cbub .hl{color:var(--teal);font-weight:600}
.cbub .warn{color:#e8c372;font-weight:600}
.cbub .cbsub{color:var(--mut);font-size:var(--fs-sm);line-height:1.45;margin-top:6px}
.cbub .ca-eye{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.cbub .ca-ctx{font-size:var(--fs-sm);color:var(--mut);line-height:1.5;margin-bottom:8px}
.cbub .ca-act{font-size:var(--fs-md);color:var(--txt);line-height:1.5}
.coachproj{background:color-mix(in srgb,var(--accent) 6%,transparent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:14px;padding:14px;margin:0 0 16px;max-width:340px}
.coachproj .cp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.coachproj .cp-lbl{font-size:var(--fs-xs);color:var(--mut);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.coachproj .cp-pill{font-size:12px;font-weight:600;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--teal);padding:3px 9px;border-radius:20px}
.coachproj .cp-big{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.coachproj .cp-sub{font-size:12px;color:var(--mut);margin-top:1px}
.coachproj .cp-leg{display:flex;gap:16px;font-size:var(--fs-xs);color:var(--mut);margin-top:6px}
.coachproj .cp-leg i{width:14px;height:2px;background:var(--teal);display:inline-block;vertical-align:middle;margin-right:5px}
.coachproj .cp-leg i.dash{background:transparent;border-top:2px dashed var(--mut);height:0}
.actfocus .af-base{font-size:13px;color:var(--mut);margin:2px 0 12px;max-width:320px}
.actfocus .af-prop{font-size:14.5px;color:var(--mut);margin:0 0 14px;max-width:320px}
.actfocus .af-eval{font-size:13px;color:var(--mut);line-height:1.5;margin:0 0 16px;max-width:320px}
.coachdots{display:flex;gap:6px;margin-bottom:18px}
.coachdots i{width:6px;height:6px;border-radius:50%;background:var(--card2);display:inline-block}
.coachdots i.on{background:var(--teal)}
.bar-thin{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin:14px 0 2px}
.bar-thin>div{height:100%;border-radius:4px;transition:width .5s}
.kpis{display:flex;gap:30px;padding:2px}
.kpi .kl{font-size:var(--fs-sm);color:var(--mut)}
.kpi .kv{font-size:var(--fs-lg);font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;display:flex;align-items:center;gap:4px}
.signal{display:flex;gap:12px;align-items:flex-start;padding:3px 0 3px 15px;position:relative}
.signal:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--mut)}
.signal.good:before{background:var(--green)}
.signal.warn:before{background:var(--amber)}
.signal.bad:before{background:var(--red)}
.signal.info:before{background:var(--blue)}
.signal .si{flex-shrink:0;margin-top:1px;color:var(--mut)}
.signal.good .si{color:var(--green)}
.signal.warn .si{color:var(--amber)}
.signal.bad .si{color:var(--red)}
.signal.info .si{color:var(--blue)}
.signal .st{font-size:var(--fs-md);line-height:1.5;flex:1;min-width:0;overflow-wrap:break-word;word-break:normal}
.txl{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.txl:last-child{border-bottom:0}
.txl .ava{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txl .info{flex:1;min-width:0}
.txl .nm{font-weight:600;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txl .cat{font-size:var(--fs-sm);color:var(--mut)}
.txl .amt{font-weight:700;font-size:var(--fs-md);white-space:nowrap;font-variant-numeric:tabular-nums}
.small{font-size:var(--fs-sm)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.center{text-align:center}

/* budget ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid .pct{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.ring .mid .lab{font-size:var(--fs-sm);color:var(--mut);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.kpi{background:var(--card2);border-radius:14px;padding:11px 8px;text-align:center}
.kpi .v{font-weight:700;font-size:var(--fs-md)}
.kpi .l{font-size:var(--fs-xs);color:var(--mut);margin-top:2px}
.bar-track{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar-fill{height:100%;border-radius:6px;transition:width .5s}

/* coach */
.coach{display:flex;gap:11px;align-items:flex-start;padding:3px 0 3px 15px;border-radius:0;margin-bottom:14px;border:0;border-left:3px solid var(--line)}
.coach .ic{font-size:var(--fs-xl);line-height:1.1;flex-shrink:0}
.coach.good .ic{color:var(--green)}
.coach.warn .ic{color:var(--amber)}
.coach.bad .ic{color:var(--red)}
.coach.info .ic{color:var(--blue)}
.coach .tx{display:block;font-size:var(--fs-md);flex:1;min-width:0;overflow-wrap:break-word;word-break:normal}
.coach.good{border-left-color:var(--green)}
.coach.warn{border-left-color:var(--amber)}
.coach.bad{border-left-color:var(--red)}
.coach.info{border-left-color:var(--blue)}

/* actieplan */
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.coachfocus{padding:18px 16px}
.cf-tag{font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.coachfocus.good .cf-tag{color:var(--green)}
.coachfocus.warn .cf-tag{color:var(--amber)}
.coachfocus.bad .cf-tag{color:var(--red)}
.coachfocus.info .cf-tag{color:var(--blue)}
.cf-insight{font-size:var(--fs-lg);font-weight:700;line-height:1.32;margin:7px 0 6px}
.cf-context{font-size:var(--fs-sm);color:var(--mut);line-height:1.55;margin-bottom:15px}
.cf-links{display:flex;justify-content:space-between;margin-top:13px}
.cf-links span{font-size:var(--fs-sm);color:var(--teal);cursor:pointer;font-weight:600}
.plan-head .pot{background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--teal);border-radius:999px;padding:4px 11px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.action{border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0;margin-bottom:0;background:transparent}
.action .ah{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px}
.action .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);flex-shrink:0}
.action .at{font-weight:700;font-size:var(--fs-md)}
.action .asub{font-size:var(--fs-sm);color:var(--mut);margin-top:1px}
.action .save{margin-left:auto;font-size:var(--fs-xs);font-weight:700;color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent);border-radius:999px;padding:3px 9px;white-space:nowrap;flex-shrink:0}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:5px 0 5px 24px;font-size:var(--fs-sm);line-height:1.45}
.steps li:before{content:"→";position:absolute;left:4px;top:5px;color:var(--teal);font-weight:700}
.steps li b{color:var(--txt)}
.act-btns{display:flex;gap:8px;margin-top:11px}
.mini{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:9px;font-size:var(--fs-sm);font-weight:600;cursor:pointer}
.mini:active{filter:brightness(1.15)}
.mini.go{background:color-mix(in srgb,var(--green) 14%,transparent);border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}
.action.done{opacity:.72}
.action.done .at{text-decoration:line-through;color:var(--mut)}
.action.done .ico{background:color-mix(in srgb,var(--green) 16%,transparent)!important}
.goal-wrap{margin:2px 0 4px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-sm);margin-bottom:6px}
.goal-row .big{font-size:var(--fs-xl);font-weight:800;color:var(--teal)}
.snz{display:block;width:100%;text-align:center;background:none;border:none;color:var(--mut);font-size:var(--fs-sm);padding:8px;cursor:pointer;text-decoration:underline}
.scr-foot{text-align:center;color:var(--mut2);font-size:var(--fs-xs);letter-spacing:.02em;padding:var(--s3) 0 var(--s2);opacity:.85}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);max-width:90%;background:var(--teal-d);color:#fff;padding:11px 16px;border-radius:12px;font-size:var(--fs-md);font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.note{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.22);border-radius:10px;padding:8px 10px;margin-top:9px;font-size:var(--fs-sm);color:var(--txt);white-space:pre-wrap;word-break:break-word}
.mini.note-btn{flex:0 0 44px}
/* gestapelde balk vast/variabel */
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:10px 0 12px;background:var(--card2)}
.stack > div{height:100%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:700;color:var(--on-accent);white-space:nowrap;min-width:0}
.fv-row{display:flex;align-items:center;gap:9px;margin:7px 0}
.fv-row .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.fv-row .nm{flex:1;font-size:var(--fs-md)}
.fv-row .amt{font-weight:700;font-size:var(--fs-md)}
.fv-row .pc{font-size:var(--fs-xs);color:var(--mut);width:54px;text-align:right}
/* dagelijkse variabele-uitgaven grafiek */
.daily{position:relative;height:84px;display:flex;align-items:flex-end;gap:2px;margin:14px 0 4px}
.daily .d{flex:1;background:var(--teal-d);border-radius:2px 2px 0 0;min-height:2px}
.daily .d.over{background:var(--red)}
.daily .d.today{outline:2px solid var(--txt);outline-offset:1px}
.daily .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--amber);pointer-events:none}
/* variantieanalyse P/H/K */
.phq{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;background:var(--card2)}
.phq .ph-t{font-weight:700;font-size:var(--fs-md);margin-bottom:7px}
.phq .ph-l{font-size:var(--fs-sm);line-height:1.5;margin:6px 0;padding-left:22px;position:relative}
.phq .ph-l .k{position:absolute;left:0;top:1px;font-weight:800;font-size:var(--fs-xs);width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);color:#fff}
.bud-line{font-size:var(--fs-sm);margin-top:3px;font-weight:600}
/* actieplan-hefbomen + SMART */
.lever{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;cursor:pointer;background:var(--card)}
.lever.on{border-color:var(--teal);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.lever .chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:#fff}
.lever.on .chk{background:var(--teal-d);border-color:var(--teal)}
.lever .lv{flex:1;min-width:0}
.lever .lv .lt{font-weight:600;font-size:var(--fs-md)}
.lever .lv .ld{font-size:var(--fs-xs);color:var(--mut)}
.lever .ef{font-size:var(--fs-sm);font-weight:700;color:var(--green);white-space:nowrap}
.smart{border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:12px;padding:12px;margin-top:10px}
.smart .st{font-weight:700;font-size:var(--fs-md);margin-bottom:6px}
.smart .sl{font-size:var(--fs-sm);line-height:1.5;margin:5px 0;padding-left:26px;position:relative}
.smart .sl .b{position:absolute;left:0;top:1px;font-weight:800;font-size:var(--fs-xs);width:20px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--teal-d);color:#fff;letter-spacing:.3px}

/* lists */
.tx-day{font-size:var(--fs-sm);color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 6px;font-weight:600}
.tx-mhead{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:800;margin:20px 4px 2px}
.txbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 2px 8px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--r-pill);background:var(--card2);border:1px solid var(--line);color:var(--mut);cursor:pointer;white-space:nowrap}
.fchip.on{border-color:var(--teal);color:var(--teal);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.fchip .x{display:inline-flex;opacity:.7}.fchip .x svg{width:12px;height:12px}
.tx-clear{font-size:12px;color:var(--teal);font-weight:600;cursor:pointer;padding:5px 4px}
.fsec{font-size:var(--fs-sm);color:var(--mut);font-weight:600;margin:14px 0 6px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer}
.tx:active{background:var(--card2)}
.tx .ava{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);flex-shrink:0}
.tx .info{flex:1;min-width:0}
.tx .nm{font-weight:600;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .cat{font-size:var(--fs-xs);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;font-size:var(--fs-md);white-space:nowrap}
.amt.pos{color:var(--green)} .amt.neg{color:var(--txt)}
.cat-row{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.cat-row .ava{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);flex-shrink:0}
.cat-row .g{flex:1;min-width:0}
.cat-row .t{display:flex;justify-content:space-between;font-size:var(--fs-md);font-weight:600;margin-bottom:5px}
.cat-row .t .c{color:var(--mut);font-weight:600;font-size:var(--fs-sm)}

/* controls */
input[type=search],input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 13px;font-size:var(--fs-md);outline:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* modifier: rij breekt af i.p.v. horizontaal scrollen. Voor rijen waar alles zichtbaar moet zijn
   (maand-pillen), want de scrollbar is verborgen en afgekapte chips lezen als "dit is alles". */
.chips.wrap{flex-wrap:wrap;overflow-x:visible}
.chip{flex-shrink:0;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:var(--r-pill);padding:6px 13px;font-size:var(--fs-sm);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--teal-d);border-color:var(--teal);color:#fff}
.btn{display:block;width:100%;background:var(--teal);color:var(--on-accent);border:none;border-radius:var(--r-inner);padding:13px;font-size:var(--fs-md);font-weight:700;cursor:pointer;text-align:center}
.btn:active{filter:brightness(1.1)}
.btn.sec{background:transparent;border:1px solid var(--ln2);color:var(--txt);font-weight:600}
.btn.danger{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.4);color:var(--red)}
.slider{width:100%;accent-color:var(--teal)}
label.fld{display:block;font-size:var(--fs-sm);color:var(--mut);margin:14px 0 6px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.sw{position:relative;width:46px;height:27px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw .sl{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:999px;transition:.2s}
.sw .sl:before{content:"";position:absolute;width:21px;height:21px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + .sl{background:var(--teal-d);border-color:var(--teal)}
.sw input:checked + .sl:before{transform:translateX(19px)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--nav-bg);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-top:1px solid var(--ln2);box-shadow:0 -6px 24px rgba(0,0,0,.28);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
.nav a{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:10px;letter-spacing:.02em;font-weight:500;padding:4px 0;cursor:pointer;opacity:.7;transition:opacity .15s ease,color .15s ease}
.nav a .i{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 16px;margin-bottom:3px;border-radius:15px;line-height:1;transition:background .18s ease}
.nav a.on{color:var(--teal);opacity:1;font-weight:600;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:var(--r-pill)}
.nav a.on .i{background:transparent}

/* empty / upload */
.empty{text-align:center;padding:50px 24px}
.empty .big{font-size:44px;margin-bottom:12px}
.empty h2{font-size:var(--fs-lg);margin-bottom:8px}
.empty p{color:var(--mut);font-size:var(--fs-md);margin-bottom:22px}
.fab{position:fixed;right:max(16px,calc(50% - 260px + 16px));bottom:92px;width:56px;height:56px;border-radius:50%;background:var(--teal-d);border:1px solid var(--teal);color:#fff;font-size:var(--fs-xl);box-shadow:var(--shadow);cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}   /* boven de toast (80): een open sheet mag nooit afgedekt worden */
.sheet-bg.show{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.grab{width:40px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.catpick{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-size:var(--fs-sm)}
.catpick.on{border-color:var(--teal)}
.tag{display:inline-block;font-size:var(--fs-xs);padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mut);margin-left:6px}
/* micro-uitleg: onderstippelde vakterm + mini-popover (nooit een browserdialoog, die breekt de flow) */
.jrg{border-bottom:1px dotted currentColor;cursor:help}
.jrg::after{content:"\00a0\24D8";font-size:.9em;opacity:.75}
.jrg:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
#tipPop{position:fixed;background:var(--surface);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.45;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:120;display:none}
#tipPop.show{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-xs);color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.spark .b{flex:1;background:var(--teal-d);border-radius:5px 5px 0 0;position:relative;min-height:3px;transition:height .4s}
.spark .b .lab{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:var(--fs-xs);color:var(--mut)}
.spark .b .val{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:var(--fs-xs);color:var(--mut)}
.bchip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}.bchip.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}.bchip.hi{background:rgba(251,191,36,.16);color:var(--amber)}.bchip.lo{background:rgba(248,113,113,.14);color:var(--red)}.inssec{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:800;margin:20px 4px 9px}.inssec:first-child{margin-top:4px}.home-hook{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:11px 13px;margin-bottom:11px;cursor:pointer}.home-hook .hh-ic{color:var(--teal);display:flex}.home-hook .hh-tx{flex:1;font-size:13px}.home-hook .hh-tx b{color:var(--txt)}.home-hook .hh-go{color:var(--teal);font-weight:700}.gc-coach{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:9px;padding:9px 11px;font-size:var(--fs-sm);color:var(--mut);margin-bottom:10px}.gc-coach b{color:var(--txt)}.gc-coach svg{color:var(--teal);flex-shrink:0;margin-top:1px}.gc-out{font-size:13px;font-weight:600;margin-bottom:10px}.gc-tip{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer}.gc-tip.on{border-color:var(--teal);background:color-mix(in srgb,var(--accent) 6%,transparent)}.gc-tip .gc-ic{font-size:16px;flex-shrink:0}.gc-bd{flex:1}.gc-how{font-size:var(--fs-sm);color:var(--mut);line-height:1.45}.gc-how b{color:var(--txt)}.gc-act{font-size:var(--fs-sm);color:var(--txt);font-weight:600;margin-top:5px;line-height:1.45}.gc-save{font-size:12px;color:var(--teal);font-weight:700;margin-top:4px}.gc-eff{color:var(--mut);font-weight:500}.gc-verg{font-size:11.5px;color:var(--mut2);margin-top:3px;line-height:1.45}.gc-tip .gc-sw{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:900;font-size:13px}.gc-tip.on .gc-sw{background:var(--teal);border-color:var(--teal)}.gc-commit{width:100%;margin:4px 0 2px;background:var(--teal);color:var(--on-accent);border:0;border-radius:9px;padding:11px;font-weight:800;font-size:13px;cursor:pointer}.gc-commit.done{background:var(--green)}.wvo-tiles{display:grid;gap:var(--s2);margin-top:14px}.wvo-tile{background:transparent;border:0;border-radius:var(--r-inner);padding:0;display:flex;flex-direction:column}.spk-in{position:relative;line-height:0}.spk-in i{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}.spk-nu{width:4px;height:4px;border:1.6px solid var(--teal);background:var(--card)}.spk-eind{width:4.5px;height:4.5px;background:var(--bar)}.spk-wrap,.spk-na{margin-top:9px}.wvo-tile .spk-wrap,.wvo-tile .spk-na{margin-top:auto;padding-top:9px}.wvo-tl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);font-weight:700;line-height:1.3}.wvo-tv{font-size:18px;font-weight:800;margin-top:5px;letter-spacing:-.3px}.wvo-ts{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.5}.wvo-chip{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;margin-top:7px}.wvo-chip.up{background:rgba(248,113,113,.16);color:var(--red)}.wvo-chip.dn{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}.wvo-chip.n{background:rgba(96,165,250,.14);color:var(--blue)}.wvo-chip.hi{background:rgba(251,191,36,.16);color:var(--amber)}.wvo-insight{background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px;color:var(--mut)}.wvo-insight b{color:var(--txt)}.wvo-insight .h{color:var(--teal);font-weight:800;font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}.wk-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.wk-row:last-of-type{border-bottom:0}.wk-row .ic{width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center}.wk-row .nm{flex:1;font-size:13.5px}.hdj{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--ln2);border-radius:13px;padding:13px 14px;cursor:pointer}.hdj-top{display:flex;align-items:center;gap:8px}.hdj-lab{flex:1;font-size:13.5px;font-weight:600}.hdj-go{color:var(--teal);font-weight:700}.hdj-kn{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-top:8px}.hdj-kn .u{font-size:12px;color:var(--mut);font-weight:500}.hdj-bar{height:7px;border-radius:6px;background:var(--card2);margin-top:9px;position:relative;overflow:hidden}.hdj-bar .f{height:100%;border-radius:6px}.hdj-bar .now{position:absolute;top:-2px;width:2px;height:11px;background:#fff;opacity:.65}.hdj-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut2);margin-top:6px}.goalring{display:flex;align-items:center;gap:18px;margin-top:12px}.gr-ring{position:relative;width:108px;height:108px;flex-shrink:0}.gr-ring svg{display:block}.gr-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.gr-ctr .p{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--teal)}.gr-ctr .l{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);font-weight:700;margin-top:1px}.gr-info{min-width:0}.gr-a{font-size:18px;font-weight:800;letter-spacing:-.3px}.gr-a .u{font-size:13px;color:var(--mut);font-weight:500}.gr-e{font-size:13.5px;color:var(--teal);font-weight:600;margin-top:7px}.gr-p{font-size:12px;color:var(--mut);margin-top:3px}.gr-f{font-size:10.5px;color:var(--mut2);margin-top:8px}.ndm-net{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px;font-weight:700}.gc-bighead{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:4px}.gc-chipd{display:inline-block;font-size:var(--fs-xs);font-weight:800;color:var(--teal);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}.gc-dual{margin-top:12px}.gc-dual svg{display:block}.gc-leg{display:flex;gap:14px;margin-top:4px;font-size:10.5px;color:var(--mut)}.gc-leg span{display:flex;align-items:center;gap:5px}.gc-leg i{width:16px;height:3px;border-radius:2px;display:inline-block}.gc-leg i.d{height:0;border-top:2px dashed var(--ref);background:none}</style>

<div class="app-head">
  <div class="logo">Min<span>der</span></div>
  <div class="head-right" style="display:flex;align-items:center;gap:5px">
    <button class="head-ic" onclick="headerSearch()" aria-label="Zoeken"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button class="head-ic" onclick="openNotifs()" aria-label="Meldingen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.8 5.8 1.8 5.8H4.2S6 13.5 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="notifBadge" style="display:none">0</span></button>

  </div>

<script>
/* ============================================================
   MINDER, lokale, privacyvriendelijke MT940 uitgaventracker
   Alle verwerking gebeurt in je browser. Niets wordt verstuurd.
   ============================================================ */
const $=s=>document.querySelector(s);
// het minteken staat vóór het euroteken (-€128,00), zoals gebruikelijk in het Nederlands
const euro=n=>{ const a=Math.abs(+n||0); const teken=(+n<0&&Math.round(a*100)>0)?'-':'';
  return teken+'€'+a.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2}); };
// v75: het minteken bleef eerder achter Math.abs hangen, waardoor een negatief bedrag als positief las.
const euro0=n=>{ const v=Math.round(Math.abs(+n||0)); return ((+n<0&&v>0)?'-':'')+'€'+v.toLocaleString('nl-NL'); };
// compacte notatie voor grafiek-labels; één stijl in de hele app: Nederlandse komma, hoofdletter K
const euroK=n=>{ const a=Math.abs(+n||0); const s=(+n<0&&Math.round(a)>0)?'-':'';
  if(a<1000) return euro0(n);
  const k=Math.round(a/100)/10; return s+'€'+(k>=100?Math.round(k):(''+k).replace('.',','))+'K'; };
const MNAMES=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MFULL=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

/* ---------- categorie-definities ---------- */
// type: expense | income | internal  (income & internal tellen niet als uitgave)
// monochrome line-icon-set (1 stijl, currentColor), schaalt mee met font-size van de container
function ICON(n){const P={

/* ---------- maand-gebonden potjes (licht) ----------
 * SET.budgets      = het vastgezette plan voor de LOPENDE kalendermaand (alle lezers gebruiken dit).
 * SET.budgetsNext  = wijzigingen die klaarstaan voor de VOLGENDE maand (idem SET.potMetaNext voor de aanname).
 * SET.budgetMonth  = de 'YYYY-MM' waar SET.budgets op geankerd staat.
 * Bij maandwissel promoveert rolloverBudgets() de 'next'-laag naar actief. Niets gewijzigd = carry-forward. */
function thisYM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
/* v177: welke dag is het hier? new Date().toISOString() geeft de UTC-dag, en tussen middernacht en
   02:00 zomertijd is dat gisteren. "Gelezen op" toonde daardoor de dag ervoor, en een boeking van
   vandaag matchte niet. Datums in TX zijn lokale kalenderdagen, dus dit hoort dat ook te zijn.
   De PSD2-aanroepen houden bewust hun ISO-datum: dat is een API-parameter, geen dag van jou. */
function vandaagYMD(){ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nextYM(ym){ let [y,mo]=String(ym).split('-').map(Number); mo++; if(mo>12){mo=1;y++;} return y+'-'+String(mo).padStart(2,'0'); }
function ymFull(ym){ const mo=+String(ym).split('-')[1]; return MFULL[mo-1]||''; }
function rolloverBudgets(){
  const ym=thisYM();
  if(!SET.budgetMonth){ SET.budgetMonth=ym; save(); return; }
  if(SET.budgetMonth===ym) return;
  const N=SET.budgetsNext||{}, NM=SET.potMetaNext||{};
  if(Object.keys(N).length){ SET.budgets=SET.budgets||{};
    for(const k in N){ const v=+N[k]; if(v>0) SET.budgets[k]=v; else delete SET.budgets[k]; } }
  if(Object.keys(NM).length){ SET.potMeta=SET.potMeta||{};
    for(const k in NM){ if(NM[k]) SET.potMeta[k]=NM[k]; else delete SET.potMeta[k]; } }
  SET.budgetsNext={}; SET.potMetaNext={}; SET.budgetMonth=ym; save();
}

// Overboekingen tussen eigen rekeningen → 'intern' (tellen niet als inkomen/uitgave).
// Salaris/inkomen blijft inkomen, ook al staat het op een eigen rekening.
function applyOwnAccounts(){
  OWN=[...new Set(TX.map(t=>t.acc).filter(Boolean))];
  // namen van eigen N26-potjes (uit Account Name) + vaste aliassen voor onderlinge overboekingen
  const ownNames=new Set([...TX.filter(t=>t.src==='csv').map(t=>(t.accName||'').toLowerCase()),
    'main','main account','zakgeld','buffer comfort','buffer rust','instant savings','income sorter',
    've sumter','vincent sumter','vincent ernst sumter'].filter(Boolean));
  // N26-interne potje-/spaarbewegingen (PSD2 levert geen tegenpartij-IBAN voor Spaces)
  const N26INT=/\b(income sorter|moved|round[\s-]?up)\b|\b(from|to|naar|van)\s+(main|zakgeld|spaces?|spaarpot|buffer)/i;
  const cands=[];   // terugstortingen bij een niet-herkende tegenpartij (fix 2): later koppelen aan een eerdere afschrijving
  for(const t of TX){
    if(OVR[t.id]) continue;                 // handmatige keuze respecteren
    const rc=t.ruleCat||t.autoCat;
    if(rc==='inkomen'){ t.autoCat='inkomen'; continue; }
    let intern = (t.refNums||[]).some(n=>OWN.includes(n));               // MT940/PSD2: eigen IBAN als tegenpartij
    if(!intern && t.src==='csv' && /transfer/i.test(t.typ||'') && ownNames.has((t.partner||'').toLowerCase())) intern=true; // N26 CSV: potje↔potje
    if(!intern && t.src==='psd2'){ const nm=(t.name||'').toLowerCase().trim(); if(ownNames.has(nm) || N26INT.test(t.name||'')) intern=true; } // N26 PSD2: Spaces/eigen naam
    t.autoCat = intern ? 'intern' : rc;
    if(!intern && rc==='intern' && t.amount>0) cands.push(t);   // positief + alleen 'intern' door de onbekende-bijschrijving-heuristiek
  }
  // Fix 2: een terugstorting (bv. een tank-reservering die deels terugkomt) erft de uitgavencategorie van
  // de meest recente afschrijving bij dezelfde tegenpartij, i.p.v. als 'intern' te blijven staan.
  if(cands.length){
    const norm=s=>(s||'').toUpperCase().replace(/[0-9]/g,'').replace(/\s+/g,' ').trim().slice(0,20);
    const debits={};
    for(const d of TX){ if(d.amount<0){ const c=catOf(d); if(CATS[c]&&CATS[c].type==='expense'){ const k=norm(d.name); if(k.length>=3) (debits[k]||(debits[k]=[])).push(d); } } }
    for(const t of cands){
      const arr=debits[norm(t.name)]; if(!arr) continue;
      let best=null;
      for(const d of arr){ if(d.date<=t.date){ if(!best||d.date>best.date) best=d; } }   // meest recente afschrijving op/vóór de retourdatum
      if(!best) for(const d of arr){ if(!best||d.date<best.date) best=d; }                 // anders: de dichtstbijzijnde latere (bank boekt de retour soms eerder)
      if(best && Math.abs(new Date(t.date)-new Date(best.date))/86400000<=100) t.autoCat=catOf(best);
    }
  }
}

/* ---------- MT940 parser (ABN AMRO, beide :86:-formaten) ---------- */
function parseMT940(text){
  const lines=text.replace(/\r/g,'').split('\n');
  const out=[]; let cur=null, acc=null; const bal={};
  const num=s=>parseFloat((s||'').replace(/\./g,'').replace(',','.').replace(/\.$/,''))||0;
  const push=()=>{ if(cur){ cur.desc=cur.raw.join(' ').replace(/\s+/g,' ').trim(); finalize(cur); out.push(cur); cur=null; } };
  for(const ln of lines){
    if(ln.startsWith(':25:')){ acc=ln.slice(4).trim().replace(/[^0-9]/g,''); }
    else if(ln.startsWith(':62F:')){
      push();
      const m=ln.match(/^:62F:([CD])(\d{6})EUR([\d,\.]+)/);
      if(m && acc){ const v=num(m[3])*(m[1]==='C'?1:-1); const d='20'+m[2].slice(0,2)+'-'+m[2].slice(2,4)+'-'+m[2].slice(4,6);
        if(!bal[acc]||d>=bal[acc].date) bal[acc]={balance:v,date:d}; }
    }
    else if(ln.startsWith(':61:')){
      push();
      const m=ln.match(/^:61:(\d{6})(\d{4})?(RC|RD|C|D)([\d,\.]+)N(\w{3})/);
      if(m){
        const yy=m[1].slice(0,2),mm=m[1].slice(2,4),dd=m[1].slice(4,6);
        const sign=(m[3]==='C'||m[3]==='RC')?1:-1;
        cur={date:`20${yy}-${mm}-${dd}`, amount:sign*num(m[4]), code:m[5], acc:acc, raw:[]};
      }
    } else if(ln.startsWith(':86:')){
      if(cur) cur.raw.push(ln.slice(4).trim());
    } else if(ln.startsWith(':60F:')||ln.startsWith(':20:')||ln==='-'){
      push();
    } else if(cur && cur.raw.length){ // doorlopende beschrijvingsregel
      cur.raw.push(ln.trim());
    }
  }
  push();
  return {txns:out, balances:bal};
}

/* counterparty + categorie afleiden */
function finalize(t){
  const U=t.desc.toUpperCase();
  // naam
  let name='';
  let tm=t.desc.match(/\/NAME\/([^\/]+)/i);            // /TRTP/ formaat
  if(tm) name=tm[1].trim();
  if(!name){ tm=t.desc.match(/NAAM:\s*([^]*?)(?:MACHTIGING:|OMSCHRIJVING:|IBAN:|KENMERK:|BIC:|$)/i); if(tm) name=tm[1].trim(); }
  if(!name){ // BEA pin: ":86:BEA, APPLE PAY   MERCHANT"
    tm=t.desc.match(/^(?:BEA|GEA|ECOM)[^A-Z0-9]*[A-Z ]*?(?:PAY|PAS)\s{2,}([^]+?)(?:NR:|KAARTNUMMER|$)/i);
    if(tm) name=tm[1].trim();
  }
  if(!name){ tm=t.desc.match(/\/REMI\/([^\/]+)/i); if(tm) name=tm[1].trim(); }
  if(!name) name=t.desc.slice(0,42)||'Transactie';
  name=name.replace(/\s+/g,' ').replace(/\s+\d{6,}.*$/,'').trim().slice(0,44);
  t.name=name||'Transactie';
  t.src='mt940';
  // rekeningnummers uit IBAN's in de omschrijving, voor eigen-rekening detectie
  t.refNums=[...t.desc.replace(/\s/g,'').matchAll(/[A-Z]{2}\d{2}[A-Z]{4}(\d{9,10})/g)].map(x=>x[1].replace(/^0+/,''));
  categorize(t);
}
// id + keyword-categorie (gedeeld door MT940 en CSV)
function categorize(t){
  const U=t.desc.toUpperCase();
  const Z=U.replace(/\s/g,'');   // spatieloos: vangt MT940-regelafbrekingen op (SAXO B ANK → SAXOBANK)
  t.id=hash((t.acc||'')+t.date+t.amount.toFixed(2)+t.desc)+'_'+Math.round(Math.abs(t.amount)*100);
  const match=w=>{ const wu=(w||'').toUpperCase(); if(!wu) return false; const wz=wu.replace(/\s/g,''); return U.includes(wu) || (wz.length>=4 && Z.includes(wz)); };
  let cat='overig';
  // 1) eigen regels winnen van de ingebouwde categorisatie
  for(const r of (typeof SET!=='undefined'&&SET.rules)||[]){ if(CATS[r.cat] && match(r.kw)){ cat=r.cat; break; } }
  // 2) ingebouwde keyword-regels
  if(cat==='overig'){ for(const [k,kws] of RULES){ if(kws.some(match)){ cat=k; break; } } }
  if(cat==='overig' && t.amount>0) cat='intern'; // onbekende bijschrijving = meestal eigen overboeking
  t.ruleCat=cat;
  t.autoCat=cat;   // wordt evt. overschreven door applyOwnAccounts()
}

/* ---------- CSV parser (N26-export: Booking Date,Partner Name,Type,Account Name,Amount (EUR)…) ---------- */
function splitCSVLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===',') {out.push(cur);cur='';} else cur+=c; }
  }
  out.push(cur); return out;
}
function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length) return {txns:[],balances:{}};
  const head=splitCSVLine(lines[0]).map(h=>h.trim().toLowerCase());
  const col=n=>head.findIndex(h=>h===n);
  const ci={date:col('booking date'),partner:col('partner name'),iban:col('partner iban'),type:col('type'),ref:col('payment reference'),acc:col('account name'),amt:col('amount (eur)')};
  const out=[];
  for(let i=1;i<lines.length;i++){
    const f=splitCSVLine(lines[i]); if(f.length<3) continue;
    const amt=parseFloat((f[ci.amt]||'').replace(',','.')); if(isNaN(amt)) continue;
    const accName=(ci.acc>=0?f[ci.acc]:'').trim()||'N26';
    const partner=(ci.partner>=0?f[ci.partner]:'').trim();
    const typ=(ci.type>=0?f[ci.type]:'').trim();
    const ref=(ci.ref>=0?f[ci.ref]:'').trim();
    const t={date:(f[ci.date]||'').slice(0,10), amount:amt, acc:'N26 '+accName, accName, partner, typ, ref,
             desc:[partner,typ,ref,accName].filter(Boolean).join(' '), src:'csv', refNums:[]};
    t.name=partner||typ||'Transactie';
    categorize(t);
    out.push(t);
  }
  return {txns:out, balances:{}};
}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h).toString(36);}
function catOf(t){ return OVR[t.id]||t.autoCat; }
// === centrale netto-uitgave-definitie (terugstorting binnen een uitgavencategorie verrekend) ===
// isExpenseTx: hoort deze transactie tot een uitgavencategorie? netSpend: netto uitgave over een lijst
// (positief bedrag = terugstorting, verlaagt de som). Nog nergens aangeroepen; puur additief.
function isExpenseTx(t){ const c=CATS[catOf(t)]; return !!c && c.type==='expense'; }
function netSpend(txns){ let s=0; for(const t of txns){ if(isExpenseTx(t)) s+=-t.amount; } return s; }

/* ---------- maand-helpers ---------- */
function months(){ const base=[...new Set(TX.map(t=>t.date.slice(0,7)))]; if(!base.length) return []; const s=new Set(base); const n=new Date(); s.add(n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')); return [...s].sort(); }
function txOfMonth(m){ return TX.filter(t=>t.date.slice(0,7)===m); }
function monthLabel(m){ const [y,mo]=m.split('-'); return MFULL[+mo-1]+' '+y; }

/* ---------- periode-helpers (Inzichten: maand / 3 mnd / YTD / alles) ---------- */
function periodMonths(){
  const ms=months(); if(!ms.length) return [];
  // SET.insMonths en SET.insYear werden nergens geschreven, dus dit viel altijd terug op de
  // getoonde maand. Dat is wat er overblijft.
  const cm=(curMonth&&ms.includes(curMonth))?curMonth:ms[ms.length-1];
  return [cm];
}
function periodTx(){ const set=new Set(periodMonths()); return TX.filter(t=>set.has(t.date.slice(0,7))); }
function periodLabel(){ const pm=periodMonths(); if(!pm.length) return '';
  if(pm.length===1) return monthLabel(pm[0]);
  const ms=months(); const yr=pm[0].slice(0,4); const inYr=ms.filter(m=>m.slice(0,4)===yr);
  if(pm.length===inYr.length) return yr;
  return `${pm.length} maanden · ${yr}`;
}



/* ----- BUDGET vs WERKELIJK + variantieanalyse ----- */
function totalBudget(){ const B=SET.budgets||{}; return Object.keys(B).reduce((s,k)=>s+(+B[k]||0),0); }
// geplande potjes = huidige budgets met de 'volgende maand'-laag erbovenop (= wat je aan het plannen bent)
function plannedBudgets(){ const B=Object.assign({}, SET.budgets||{}); const N=SET.budgetsNext||{}; for(const k in N){ const v=+N[k]; if(v>0) B[k]=v; else delete B[k]; } return B; }
function plannedTotalBudget(){ const B=plannedBudgets(); return Object.keys(B).reduce((s,k)=>s+(+B[k]||0),0); }
// 70%-budget (o.b.v. inkomen) + geschatte vaste lasten (mediaan over je maanden) → basis voor 'nog vrij voor potjes'
function potRoomBase(){
  const inc = SET.autoIncome ? baseIncome() : (+SET.income||0);
  const budget = monthBudget(inc);
  const ms=months(); const med=a=>{const s=a.filter(x=>x>0).sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0;};
  let fixed=0;
  for(const k of Object.keys(CATS)){ if(CATS[k].type!=='expense'||k==='overig') continue;
    fixed+=med(ms.map(m=>{let f=0;for(const t of txOfMonth(m)){ if(catOf(t)===k && isFixed(t)) f+=-t.amount; } return f;})); }   // netto
  return {budget:Math.round(budget), fixed:Math.round(fixed)};
}
// één regel: som van je potjes + hoeveel er nog vrij is binnen je grens (na vaste lasten)
function potRoomLineHTML(potTotal, planned){ const b=potRoomBase();
  // potTotal = nu-actieve potjes-som (leidend maandbudget). planned (optioneel) = met de 'volgende maand'-laag;
  // wijkt die af, dan een gelabelde noot zodat het geen tegenstrijdig getal wordt (DRY: hier i.p.v. per call-site).
  const nxt = (planned!=null && Math.round(planned)!==Math.round(potTotal)) ? ` · <span style="color:var(--teal)">${euro0(planned)} vanaf volgende maand</span>` : '';
  if(b.budget<=0) return `Samen al je potjes: <b>${euro0(potTotal)}</b> per maand · dit is je maandbudget${nxt}`;
  const over=Math.round(potTotal-b.budget);
  if(over>0) return `<span style="color:var(--mut)">Samen zijn je potjes <b>${euro0(potTotal)}</b> — dat is je maandbudget, en <b>${euro0(over)}</b> boven je inkomen-limiet (${euro0(b.budget)}, ${SET.limit}%). Dat mag: je plant meer dan je limiet, wat ten koste kan gaan van sparen. Verlaag een potje, of pas je limiet aan.</span>${nxt}`;
  const free=Math.round(b.budget-potTotal);
  return `Samen al je potjes: <b>${euro0(potTotal)}</b>/mnd · dit is je maandbudget, <b style="color:var(--teal)">${euro0(free)}</b> onder je inkomen-limiet${nxt}`;
}
// is een categorie grotendeels een vaste last? (budget schaalt dan niet mee met inkomen)
function isFixedCat(k){ return FIXED_CATS.has(k)||k==='vervoer'||k==='zorg'; }
// per-categorie budget = je RAUWE potje (potjes leidend). Sinds het maandtotaal de potjes-som is,
// verviel de oude neerwaartse scaling naar de inkomens-ruimte; effectief budget = precies wat je instelde.
// varRoom = som van je variabele potjes (basis voor het dag-/weektempo).
function effectiveBudgets(m){
  const B=SET.budgets||{};
  let fixedB=0, varB=0; const out={};
  const _rc=recurringCats();
  for(const k in B){ if(+B[k]<=0) continue; out[k]=+B[k]; if(_rc.has(k)) fixedB+=+B[k]; else varB+=+B[k]; }   // D1: vast = herkende-recurring categorie (loopt via fixDue); rest variabel; dag-/weektempo op de variabele potjes
  return {out, room:fixedB+varB, fixedB:Math.round(fixedB), varRoom:Math.round(varB), scaleV:1};
}
function setCatBudget(k,val){ // bestaand potje wijzigen = vanaf volgende maand; nieuw potje = meteen actief
  const exists = +(SET.budgets||{})[k] > 0;
  const v = (val===''||+val<=0) ? 0 : +val;
  if(exists){ SET.budgetsNext=SET.budgetsNext||{}; if(v===(+(SET.budgets||{})[k]||0)) delete SET.budgetsNext[k]; else SET.budgetsNext[k]=v; }
  else { SET.budgets=SET.budgets||{}; if(v>0) SET.budgets[k]=v; else delete SET.budgets[k]; }
  save(); const g=document.getElementById('potGridTotal'); if(g) g.innerHTML=potRoomLineHTML(totalBudget(), plannedTotalBudget()); renderIns(); } // settings niet herrenderen (focus)
// budgetvoorstel met VASTE LASTEN als vertrekpunt:
// - vaste lasten op historisch niveau (committed, niet schalen)
// - resterende bestedingsruimte verdeeld over variabele lasten (die je zelf beïnvloedt)
function suggestBudgets(){
  /* v113: alleen AFGERONDE maanden in de mediaan, zoals `noodfondsModel()` (v107). `months()` telt
     de lopende maand altijd mee en die is niet af: een categorie waaraan je deze maand pas de helft
     uitgaf trok het voorstel omlaag, en dat liep binnen de maand vanzelf weer op. Is er nog géén
     afgeronde maand, dan blijft de lopende de enige bron (`msLopend`) - anders levert een verse
     import helemaal geen voorstel op, en dan zeggen we er ook bij dat het nog verschuift. */
  const _af=months().filter(m=>m<nowYMstr());
  const msLopend=_af.length===0;
  const ms=msLopend?months():_af;
  const med=a=>{const s=a.filter(x=>x>0).sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0;};
  const inc = SET.autoIncome ? baseIncome() : (+SET.income||0);
  const room = monthBudget(inc);
  const histF={}, histV={};
  for(const k of Object.keys(CATS)){ if(CATS[k].type!=='expense'||k==='overig') continue;
    const fArr=[], vArr=[];
    for(const m of ms){ let f=0,v=0; for(const t of txOfMonth(m)){ if(catOf(t)===k){ if(isFixed(t)) f+=-t.amount; else v+=-t.amount; } } fArr.push(f); vArr.push(v); }   // netto
    histF[k]=med(fArr); histV[k]=med(vArr);
  }
  const totalFixed=Object.values(histF).reduce((a,b)=>a+b,0);
  const totalVar=Object.values(histV).reduce((a,b)=>a+b,0);
  const remaining=Math.max(room-totalFixed,0);
  const scaleV = totalVar>0 ? Math.min(remaining/totalVar,1) : 0;   // variabel ≤ historisch, past binnen ruimte
  // het voorstel is een wijziging als elke andere: een bestaand potje verschuift naar de
  // 'volgende maand'-laag, de lopende maand ligt vast. Alleen een nieuw potje start meteen.
  const voorstel={};
  for(const k of Object.keys(CATS)){ if(CATS[k].type!=='expense'||k==='overig') continue;
    const b=(histF[k]||0)+(histV[k]||0)*scaleV; voorstel[k]= b>=1 ? Math.max(Math.round(b/5)*5,5) : 0;
  }
  SET.budgets=SET.budgets||{}; SET.budgetsNext=SET.budgetsNext||{};
  for(const k of Object.keys(SET.budgets)) if(!(k in voorstel)) voorstel[k]=0;   // potjes buiten het voorstel vervallen ook pas volgende maand
  let nieuw=0, gepland=0;
  for(const k in voorstel){
    const v=voorstel[k], nu=+SET.budgets[k]||0;
    if(nu>0){ if(v===nu) delete SET.budgetsNext[k]; else { SET.budgetsNext[k]=v; gepland++; } }
    else if(v>0){ SET.budgets[k]=v; nieuw++; }
  }
  save(); render();
  const vanaf=ymFull(nextYM(SET.budgetMonth||thisYM()));
  const wanneer = gepland
    ? `${gepland} bestaand${gepland===1?' potje gaat':'e potjes gaan'} mee vanaf ${vanaf}; de lopende maand blijft zoals hij stond.${nieuw?` ${nieuw} nieuw potje${nieuw===1?'':'s'} staat meteen aan.`:''}`
    : (nieuw ? `${nieuw} nieuw potje${nieuw===1?'':'s'} staat meteen aan; aan je lopende maand verandert verder niets.` : 'Je potjes stonden al op het voorstel, er verandert niets.');
  const bron = msLopend ? ' Let op: je hebt nog geen afgeronde maand, dus dit voorstel leunt op de lopende maand en verschuift nog.' : '';
  if(totalFixed>room){
    alert(`Let op: je vaste lasten (${euro0(totalFixed)}) zijn al hoger dan je bestedingsruimte (${euro0(room)}). Variabele budgetten staan op het minimum. Je vaste lasten verlagen of je inkomen verhogen is nodig om binnen je ${SET.limit}%-norm te blijven.

${wanneer}${bron}`);
  } else {
    alert(`Voorstel klaar. Vaste lasten ≈ ${euro0(totalFixed)} (vast), resterende ruimte voor variabele uitgaven ≈ ${euro0(remaining)}. Pas de variabele categorieën gerust handmatig aan.

${wanneer}${bron}`);
  }
}
// richtlijn-band o.b.v. % over budget: ≤3% geen actie (marge) · 4–5% monitoren · >5% actie
function budgetBand(bud,act){
  if(!bud) return 'none';
  if(act<=bud) return 'under';
  const o=(act-bud)/bud*100;
  return o<=3?'margin':o<=5?'monitor':'action';
}
// drill-down: variantieanalyse (P/H/K) + transacties voor één categorie
function openVariance(k){
  const m=curMonth, c=CATS[k];
  const bud=+effectiveBudgets(m).out[k]||0;
  const items=txOfMonth(m).filter(x=>catOf(x)===k).sort((a,b)=>b.date.localeCompare(a.date));   // incl. terugstortingen: netto
  const act=items.reduce((s,t)=>s-t.amount,0);
  const band=budgetBand(bud,act); const over=band==='action'||band==='monitor';
  const overEur=act-bud;
  const status = over?(band==='action'?'Over budget':'Let op'):(bud?'Binnen budget':'');
  const stCol = over?(band==='action'?'var(--red)':'var(--amber)'):'var(--green)';
  const insight = !bud ? `${euro(act)} uitgegeven. Je hebt voor deze categorie nog geen budget ingesteld.`
    : over ? `Je gaf ${euro0(overEur)} meer uit dan je ${euro0(bud)}-budget deze maand.`
    : band==='margin' ? `${euro0(act-bud)} over, binnen je 3%-marge. Geen actie nodig.`
    : `${euro0(bud-act)} onder je ${euro0(bud)}-budget. Goed bezig.`;
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="center" style="margin-bottom:4px"><div style="font-size:var(--fs-xl)">${c.icon}</div>
      <div style="font-weight:800;font-size:var(--fs-lg)">${c.name}</div>
      ${status?`<div class="small" style="color:${stCol};font-weight:700;margin-top:3px">${status}${over?` · ${euro0(overEur)} over`:''}</div>`:''}
      <div style="font-size:var(--fs-xl);font-weight:800;margin:7px 0 2px">${euro(act)}${bud?` <span class="muted" style="font-size:var(--fs-sm)">/ ${euro0(bud)}</span>`:''}</div>
      <div class="small muted">${monthLabel(m)} · ${items.length} transacties</div></div>
    <div class="cf-context" style="text-align:center;margin:12px 6px 14px">${insight}</div>
    ${bud&&over?`<button class="btn sec" style="margin-bottom:16px" onclick="closeSheet();go('set')">Budget bijstellen ›</button>`:''}
    <div class="hlabel" style="margin:4px 2px 8px">Transacties</div>
    ${items.map(t=>`<div class="tx" style="cursor:default"><div class="ava" style="background:var(--card2)">${c.icon}</div>
      <div class="info"><div class="nm">${esc(t.name)}</div><div class="cat">${new Date(t.date).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}${OWN.length>1?' · '+esc(accShort(t.acc)):''}</div></div>
      <div class="amt ${t.amount>0?'pos':'neg'}">${t.amount>0?'+':''}${euro(t.amount)}</div></div>`).join('')}`;
  showSheetBg();
}
// voorzichtige, data-gedreven hypothese voor één over-budget categorie (geen aannames als feit)
function catHypo(m,k){
  const d=catDriver(m,k);
  const cat=CATS[k]?CATS[k].name.toLowerCase():'deze categorie';
  const mnaam=d.merch?esc(d.merch.name):'';
  // 1) één winkel is netto het grootste deel (Optie A: netto per winkel, geen losse transactie)
  if(d.merch && d.sum>0 && d.merch.s/d.sum>=0.45)
    return `Dit komt vooral door ${mnaam}: ${euro0(d.merch.s)} in ${d.merch.n} keer.`;
  // 2) wat vaker iets gekocht in deze categorie
  if(d.priorN>=1 && d.n>=Math.round(d.priorN*1.3))
    return `Je kocht wat vaker iets voor ${cat} dan normaal. ${d.n} keer, meestal is dat rond ${Math.round(d.priorN)}.`;
  // 3) bedragen per keer iets hoger
  if(d.priorAvg>0 && d.avg>=d.priorAvg*1.2)
    return `De bedragen voor ${cat} lagen wat hoger dan je gewend bent, zo'n ${euro0(d.avg)} per keer.`;
  // 4) specifiek opgebouwd, met grootste winkel benoemd
  if(d.merch && d.n>1)
    return `Het ging om ${d.n} uitgaven voor ${cat}. De grootste was ${mnaam} (${euro0(d.merch.s)}).`;
